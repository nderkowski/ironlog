<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="A friction-free lifting logbook. Your split, carried forward, with progression and deload calls made for you.">
<meta name="theme-color" content="#EEEFF1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111417" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Iron Log">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Iron Log</title>
</head>
<body>
<!--ARTIFACT-START-->
<style>
/* ============================================================
   Iron Log — tokens
   ============================================================ */
:root{
  --bg:#EEEFF1;
  --panel:#FFFFFF;
  --panel-2:#E4E6EA;
  --ink:#14171B;
  --ink-2:#5A6169;
  --ink-3:#878F98;
  --line:#D3D7DD;
  --accent:#C98A0E;
  --on-accent:#14171B;
  --accent-soft:rgba(201,138,14,.14);
  --good:#2E7D57;
  --good-soft:rgba(46,125,87,.13);
  --bad:#B03A32;
  --bad-soft:rgba(176,58,50,.12);
  --shadow:0 1px 2px rgba(20,23,27,.06), 0 6px 18px rgba(20,23,27,.05);

  --mono:ui-monospace,SFMono-Regular,"SF Mono","Roboto Mono","DejaVu Sans Mono",Menlo,Consolas,monospace;
  --ui:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;

  --r:12px;
  --pad:14px;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#111417;
    --panel:#191D21;
    --panel-2:#242A30;
    --ink:#EDEFF2;
    --ink-2:#98A1AA;
    --ink-3:#6E777F;
    --line:#2C3238;
    --accent:#E8AC2B;
    --on-accent:#14171B;
    --accent-soft:rgba(232,172,43,.16);
    --good:#4FBE85;
    --good-soft:rgba(79,190,133,.15);
    --bad:#E0645A;
    --bad-soft:rgba(224,100,90,.15);
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 6px 18px rgba(0,0,0,.28);
  }
}
:root[data-theme="dark"]{
  --bg:#111417; --panel:#191D21; --panel-2:#242A30;
  --ink:#EDEFF2; --ink-2:#98A1AA; --ink-3:#6E777F; --line:#2C3238;
  --accent:#E8AC2B; --on-accent:#14171B; --accent-soft:rgba(232,172,43,.16);
  --good:#4FBE85; --good-soft:rgba(79,190,133,.15);
  --bad:#E0645A; --bad-soft:rgba(224,100,90,.15);
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 6px 18px rgba(0,0,0,.28);
}
:root[data-theme="light"]{
  --bg:#EEEFF1; --panel:#FFFFFF; --panel-2:#E4E6EA;
  --ink:#14171B; --ink-2:#5A6169; --ink-3:#878F98; --line:#D3D7DD;
  --accent:#C98A0E; --on-accent:#14171B; --accent-soft:rgba(201,138,14,.14);
  --good:#2E7D57; --good-soft:rgba(46,125,87,.13);
  --bad:#B03A32; --bad-soft:rgba(176,58,50,.12);
  --shadow:0 1px 2px rgba(20,23,27,.06), 0 6px 18px rgba(20,23,27,.05);
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:var(--ui); font-size:15px; line-height:1.45;
  overscroll-behavior-y:contain;
  touch-action:manipulation;
  -webkit-tap-highlight-color:transparent;
}
button,input,select,textarea{font:inherit;color:inherit;touch-action:manipulation}
button{cursor:pointer;background:none;border:none;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}

/* ---------- shell ---------- */
.wrap{max-width:560px;margin:0 auto;padding:0 12px 96px}

header.top{
  position:sticky;top:0;z-index:40;
  max-width:560px;margin:0 auto;
  background:var(--bg);
  display:flex;align-items:center;gap:8px;
  padding:10px 12px 8px;
  border-bottom:1px solid transparent;
}
header.top.stuck{border-bottom-color:var(--line)}
.brand{
  font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;
  color:var(--ink-3);
}
.brand b{color:var(--ink)}
.top .spacer{flex:1}

.chip{
  display:inline-flex;align-items:center;gap:6px;
  padding:4px 9px;border-radius:999px;
  font-size:12px;font-weight:600;
  background:var(--panel-2);color:var(--ink-2);
  border:1px solid transparent;white-space:nowrap;
}
.chip.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.chip.good{background:var(--good-soft);color:var(--good)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip.accent{background:var(--accent-soft);color:var(--accent)}
.chip.tag{padding:1px 7px;font-size:10px}

button.rest{
  font-family:var(--mono);font-variant-numeric:tabular-nums;
  background:var(--accent);color:var(--on-accent);
  padding:5px 11px;border-radius:999px;font-size:13px;font-weight:700;
  display:inline-flex;align-items:center;gap:7px;
}
button.rest.over{background:var(--good);color:#fff}

/* ---------- typography ---------- */
h1,h2,h3{margin:0;text-wrap:balance}
.eyebrow{
  font-size:11px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;
  color:var(--ink-3);
}
.view-title{font-size:22px;font-weight:700;letter-spacing:-.015em;margin:2px 0 12px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--ink-2)}
.tiny{font-size:12px}

/* ---------- cards ---------- */
.card{
  background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
  box-shadow:var(--shadow);
  padding:var(--pad);
}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;align-items:center;gap:10px}

/* ---------- buttons ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  padding:10px 14px;border-radius:10px;
  background:var(--panel-2);color:var(--ink);
  font-weight:600;font-size:14px;
  border:1px solid transparent;
  min-height:42px;
}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--accent);color:var(--on-accent)}
.btn.ghost{background:transparent;border-color:var(--line);color:var(--ink-2)}
.btn.danger{background:var(--bad-soft);color:var(--bad)}
.btn.block{width:100%}
.btn.big{min-height:54px;font-size:16px;border-radius:12px}
.btn.sm{min-height:34px;padding:6px 10px;font-size:13px;border-radius:8px}
.btn[disabled]{opacity:.45;pointer-events:none}

/* ---------- next-up hero ---------- */
.hero{display:flex;gap:14px;align-items:stretch}
.daymark{
  flex:0 0 auto;width:64px;border-radius:10px;
  background:var(--accent-soft);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  border:1px solid var(--accent-soft);
}
.daymark .letter{
  font-family:var(--mono);font-size:30px;font-weight:700;line-height:1;
  color:var(--accent);letter-spacing:-.02em;
}
.daymark .sub{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);opacity:.8;margin-top:3px}
.hero .body{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px;justify-content:center}
.hero h2{font-size:19px;font-weight:700;letter-spacing:-.01em}
.exlist{font-size:13px;color:var(--ink-2);overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}

.daypicks{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.daypick{
  padding:7px 12px;border-radius:9px;border:1px solid var(--line);
  background:transparent;font-size:13px;font-weight:600;color:var(--ink-2);
  display:inline-flex;gap:7px;align-items:center;
}
.daypick .k{font-family:var(--mono);color:var(--ink);font-weight:700}

/* ---------- exercise card ---------- */
.ex{padding:0;overflow:hidden}
.ex-head{
  display:flex;align-items:flex-start;gap:8px;
  padding:12px var(--pad) 10px;
}
.ex-head .t{flex:1;min-width:0}
.ex-name{font-size:16px;font-weight:700;letter-spacing:-.01em;word-break:break-word}
.ex-meta{font-size:12px;color:var(--ink-3);margin-top:1px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.kebab{
  width:34px;height:34px;border-radius:8px;color:var(--ink-3);
  display:flex;align-items:center;justify-content:center;font-size:18px;line-height:1;
  flex:0 0 auto;
}

/* the "what to do today, and why" block */
.callout{
  margin:0 var(--pad) 10px;border-radius:9px;overflow:hidden;
  background:var(--panel-2);
}
.callout .lastrow{
  display:flex;align-items:center;gap:8px;flex-wrap:wrap;
  padding:7px 10px;font-size:12px;color:var(--ink-2);
}
.callout .lastrow .num{color:var(--ink)}
.callout .revert{
  margin-left:auto;font-size:12px;font-weight:700;
  padding:3px 8px;border-radius:7px;background:var(--panel);color:var(--ink-2);
  border:1px solid var(--line);white-space:nowrap;
}
.callout .why{
  display:flex;align-items:center;gap:7px;
  padding:7px 10px;font-size:12.5px;font-weight:600;
  border-top:1px solid var(--line);
}
.callout .why .mark{font-family:var(--mono);font-weight:700;flex:0 0 auto}
.why.up{background:var(--accent-soft);color:var(--accent)}
.why.reps{background:var(--good-soft);color:var(--good)}
.why.deload{background:var(--bad-soft);color:var(--bad)}
.why.hold{color:var(--ink-2)}

.sets{display:flex;flex-direction:column}
.set{
  display:grid;
  grid-template-columns:20px 1fr 10px 1fr 44px;
  align-items:center;gap:5px;
  padding:7px var(--pad);
  border-top:1px solid var(--line);
  position:relative;
}
.set::before{
  content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:transparent;
}
.set.done::before{background:var(--accent)}
.set.done{background:var(--panel-2)}
.set.pr::before{background:var(--good)}
.set.warm::before{background:transparent}
.set.warm.done::before{background:var(--line)}
.set.warm .grp input{color:var(--ink-2)}
.idx{
  font-family:var(--mono);font-size:12px;color:var(--ink-3);
  height:38px;width:100%;display:flex;align-items:center;justify-content:center;
  border-radius:6px;
}
.idx:active{background:var(--panel-2)}
.set.done .idx{color:var(--ink-2)}
.set.warm .idx{color:var(--ink-3);font-weight:700;font-size:11px}
.grp{display:flex;align-items:center;gap:2px;min-width:0}
.grp button{
  flex:0 0 auto;width:28px;height:38px;border-radius:8px;
  color:var(--ink-2);font-size:17px;font-weight:600;line-height:1;
  display:flex;align-items:center;justify-content:center;
}
.grp button:active{background:var(--panel-2)}
.grp input{
  flex:1;min-width:0;width:100%;
  height:38px;border:1px solid var(--line);border-radius:8px;
  background:var(--bg);
  font-family:var(--mono);font-variant-numeric:tabular-nums;
  font-size:16px;font-weight:600;text-align:center;
  padding:0 1px;
  -moz-appearance:textfield;
}
.set.done .grp input{background:transparent;border-color:transparent}
.grp input::-webkit-outer-spin-button,.grp input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.times{text-align:center;color:var(--ink-3);font-size:13px}
.tick{
  width:44px;height:40px;border-radius:9px;
  border:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;
  color:var(--ink-3);
}
.tick svg{width:20px;height:20px;display:block}
.set.done .tick{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.set.done.warm .tick{background:var(--ink-3);border-color:var(--ink-3);color:var(--bg)}
.set.done.pr .tick{background:var(--good);border-color:var(--good);color:#fff}
.prtag{
  position:absolute;right:58px;top:50%;transform:translateY(-50%);
  font-size:10px;font-weight:800;letter-spacing:.08em;color:var(--good);
  pointer-events:none;
}
/* Plate hint. Spans the whole row so it drops onto an implicit second grid
   row, and it is pointer-events:none so it can never eat a tap. */
.plates{
  grid-column:1/-1;
  display:flex;align-items:center;gap:8px;
  font-family:var(--mono);font-variant-numeric:tabular-nums;
  font-size:11px;color:var(--ink-3);
  padding-left:25px;margin-top:-3px;
  pointer-events:none;
}
.plates:empty{display:none}
.plates .ptext{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* display:inline-flex is load-bearing, not decoration. A plain <button> here
   measured 112px wide no matter what text it held — its width was not content
   driven at all, in Chrome, as either a float or a flex item. inline-flex
   makes it shrink-wrap its label like every other chip in the app. */
.plates .rpe{
  display:inline-flex;align-items:center;
  flex:0 0 auto;pointer-events:auto;
  font-size:11px;font-weight:700;letter-spacing:.02em;
  color:var(--ink-3);padding:6px 11px;border-radius:999px;
  border:1px solid var(--line);
}
.plates .rpe.set{color:var(--accent);border-color:var(--accent-soft);background:var(--accent-soft)}
.gtag{
  display:inline-block;font-family:var(--mono);font-size:11px;font-weight:700;
  color:var(--accent);background:var(--accent-soft);
  padding:1px 6px;border-radius:6px;margin-right:7px;vertical-align:2px;
}
.plates .lb{letter-spacing:.06em;margin-right:5px;opacity:.7}
.plates i{font-style:normal;opacity:.65}
.plates .off{color:var(--bad)}
.set.done .plates{opacity:.55}
.ex-foot{
  display:flex;gap:8px;align-items:center;padding:9px var(--pad);border-top:1px solid var(--line);
}
@media (max-width:360px){
  :root{--pad:10px}
  .set{grid-template-columns:18px 1fr 8px 1fr 40px;gap:4px}
  .grp button{width:24px}
  .tick{width:40px}
  .plates{padding-left:22px}
}

/* ---------- progress ---------- */
.statgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{
  background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
  padding:11px 12px;box-shadow:var(--shadow);
}
.stat .v{font-family:var(--mono);font-size:20px;font-weight:700;letter-spacing:-.02em;line-height:1.15}
.stat .l{font-size:11px;color:var(--ink-3);letter-spacing:.06em;text-transform:uppercase;margin-top:3px}

.banner{
  border-radius:var(--r);padding:12px 14px;
  border:1px solid transparent;text-align:left;
}
.banner.warn{background:var(--bad-soft);border-color:var(--bad-soft);color:var(--bad)}
.banner.info{background:var(--accent-soft);border-color:var(--accent-soft);color:var(--accent)}
.banner.calm{background:var(--panel);border-color:var(--line);color:var(--ink)}
.banner .bt{font-weight:700;font-size:14px}
.banner .bd{font-size:13px;color:var(--ink-2)}
.banner.warn .bd{color:var(--bad);opacity:.85}
.banner .acts{display:flex;gap:8px;margin-top:10px}

/* ---- weekly sets by muscle ---- */
.mrow{
  display:grid;grid-template-columns:82px 1fr 34px;align-items:center;
  gap:9px;padding:5px var(--pad);
}
.mrow .mn{font-size:13px;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mrow .mv{
  font-family:var(--mono);font-variant-numeric:tabular-nums;
  font-size:13px;font-weight:700;text-align:right;
}
.track{position:relative;height:16px;border-radius:5px;background:var(--panel-2);overflow:hidden}
.track .now{position:absolute;inset:0 auto 0 0;background:var(--accent);border-radius:5px}
.track .tick{position:absolute;top:0;bottom:0;width:1px;background:var(--bg);opacity:.75}
/* Last week is a marker, not a bar behind the fill: a ghost bar is invisible
   whenever this week is bigger, which is exactly when you'd want to see it. */
.track .prev{
  position:absolute;top:1px;bottom:1px;width:2px;margin-left:-1px;
  background:var(--ink-2);border-radius:2px;
}
.mrow.zero .mn,.mrow.zero .mv{color:var(--ink-3)}

/* ---- PR board ---- */
.prrow{
  display:flex;align-items:baseline;gap:10px;width:100%;text-align:left;
  padding:10px var(--pad);border-top:1px solid var(--line);
}
.prrow:first-child{border-top:none}
.prrow .prn{flex:1;min-width:0;font-size:14px;font-weight:650;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prrow .prs{font-family:var(--mono);font-size:13px;font-weight:700;flex:0 0 auto}
.prrow .prd{font-family:var(--mono);font-size:11px;color:var(--ink-3);flex:0 0 auto;width:52px;text-align:right}

/* ---- calendar ---- */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.cal .dow{
  font-size:10px;font-weight:700;letter-spacing:.06em;color:var(--ink-3);
  text-align:center;padding-bottom:2px;
}
.cal .cell{
  aspect-ratio:1;border-radius:7px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  font-family:var(--mono);font-size:12px;color:var(--ink-3);
  border:1px solid transparent;
}
.cal .cell.pad{visibility:hidden}
.cal .cell.today{border-color:var(--ink-3)}
.cal .cell.hit{background:var(--accent-soft);color:var(--accent);font-weight:700}
.cal .cell.hit .k{font-size:9px;letter-spacing:.05em;opacity:.85;margin-top:1px}
.cal .cell.hit:active{background:var(--accent);color:var(--on-accent)}
.calhead{display:flex;align-items:center;gap:8px;margin-bottom:9px}
.calhead .cm{flex:1;font-size:14px;font-weight:700}

/* ---- muscle picker ---- */
.mgrid{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 2px}
.mchip{
  padding:8px 12px;border-radius:999px;border:1px solid var(--line);
  font-size:13px;font-weight:600;color:var(--ink-2);background:transparent;
}
.mchip.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.mchip.on2{background:var(--accent-soft);border-color:var(--accent-soft);color:var(--accent)}
.mchip.off{opacity:.45}
.navrow{
  display:flex;align-items:center;gap:10px;padding:9px 0;
  border-top:1px solid var(--line);width:100%;text-align:left;
}
.navrow .fl{flex:1;font-size:14px}
.navrow .fv{font-size:13px;color:var(--ink-3);text-align:right;max-width:52%;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.navrow .ch{color:var(--ink-3);font-size:15px}

.plift{
  display:flex;align-items:center;gap:12px;
  padding:11px var(--pad);border-top:1px solid var(--line);
  width:100%;text-align:left;
}
.plift:first-child{border-top:none}
.plift .pt{flex:1;min-width:0}
.plift .pn{font-weight:650;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.plift .ps{font-size:12px;color:var(--ink-3);font-family:var(--mono)}
.plift canvas{flex:0 0 auto;width:78px;height:32px;display:block}

.sess{
  display:flex;align-items:center;gap:10px;width:100%;text-align:left;
  padding:10px var(--pad);border-top:1px solid var(--line);
}
.sess:first-child{border-top:none}
.sess .sd{font-family:var(--mono);font-size:12px;color:var(--ink-3);width:52px;flex:0 0 auto}
.sess .sn{flex:1;min-width:0;font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sess .sv{font-family:var(--mono);font-size:12px;color:var(--ink-2)}

table.hist{width:100%;border-collapse:collapse;font-size:13px}
table.hist th{
  text-align:left;font-size:10px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--ink-3);font-weight:700;padding:0 8px 6px 0;
}
table.hist td{padding:6px 8px 6px 0;border-top:1px solid var(--line);font-family:var(--mono)}
table.hist td:first-child{color:var(--ink-2)}
table.hist tr.dl td{opacity:.6}
.scrollx{overflow-x:auto;-webkit-overflow-scrolling:touch}

/* ---------- plan ---------- */
.pex{
  display:flex;align-items:center;gap:10px;
  padding:9px var(--pad);border-top:1px solid var(--line);
}
.pex .pxn{flex:1;min-width:0;font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pex .pxs{font-family:var(--mono);font-size:12px;color:var(--ink-3)}
.iconbtn{
  width:32px;height:32px;border-radius:8px;color:var(--ink-3);
  display:flex;align-items:center;justify-content:center;font-size:15px;flex:0 0 auto;
}
.iconbtn:active{background:var(--panel-2)}

.field-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line)}

<script>
/* ============================================================
   Iron Log — a friction-free lifting logbook.
   All data lives in this browser's localStorage. No server, no account.
   ============================================================ */
(function(){
"use strict";

/* Host may not supply a viewport tag (e.g. embedded); make sure one exists. */
if(!document.querySelector('meta[name="viewport"]')){
  var mv=document.createElement("meta");
  mv.name="viewport"; mv.content="width=device-width, initial-scale=1, viewport-fit=cover";
  document.head.appendChild(mv);
}

/* ============================ storage ============================ */
var BUILD="v11";                      // bump with CACHE in sw.js; shown in Plan
var KEY="ironlog.v1", storageOK=true;
try{ localStorage.setItem("__t","1"); localStorage.removeItem("__t"); }catch(e){ storageOK=false; }
var mem=null;

function defaultState(){
  return {
    version:4,
    settings:{unit:"lb",rest:120,autoRest:true,buzz:true,inc:5,
              sound:true, notify:false, rpe:false, keepTone:false,
              autoBackup:true, shareMode:"",
              doubleDefault:true,repLow:8,repHigh:12,
              bodyweight:0, deloadUntil:0, deloadSnooze:0,
              bar:45, plates:defaultPlates("lb"),
              lastBackup:0},
    routines:[
      {id:uid(),key:"A",name:"Day A",exercises:[]},
      {id:uid(),key:"B",name:"Day B",exercises:[]},
      {id:uid(),key:"C",name:"Day C",exercises:[]}
    ],
    sessions:[],
    active:null
  };
}
function load(){
  if(!storageOK) return mem||(mem=defaultState());
  try{
    var raw=localStorage.getItem(KEY);
    if(!raw) return defaultState();
    var s=JSON.parse(raw);
    if(!s||!s.routines) return defaultState();
    s.settings=Object.assign(defaultState().settings,s.settings||{});
    if(!Array.isArray(s.settings.plates)||!s.settings.plates.length)
      s.settings.plates=defaultPlates(s.settings.unit);
    s.version=4;
    return s;
  }catch(e){ return defaultState(); }
}
var saveTimer=null;
function writeNow(){
  clearTimeout(saveTimer); saveTimer=null;
  try{ localStorage.setItem(KEY,JSON.stringify(S)); }
  catch(e){ toast("Couldn't save — storage is full"); }
}
function save(){
  if(!storageOK){ mem=S; return; }
  clearTimeout(saveTimer);
  saveTimer=setTimeout(writeNow,120);
}
/* Never let a pending write die with the tab. */
function flush(){ if(storageOK&&saveTimer) writeNow(); }
window.addEventListener("pagehide",flush);
window.addEventListener("blur",flush);
document.addEventListener("visibilitychange",function(){ if(document.hidden) flush(); });

function uid(){ return Math.random().toString(36).slice(2,10); }
var S=load();

/* ============================ helpers ============================ */
function $(sel,root){ return (root||document).querySelector(sel); }
function $$(sel,root){ return [].slice.call((root||document).querySelectorAll(sel)); }
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
function num(v){ var n=parseFloat(v); return isFinite(n)?n:0; }
function round(n,d){ var p=Math.pow(10,d||0); return Math.round(n*p)/p; }
function fmt(n){ n=round(n,1); return (n%1===0)?String(n):n.toFixed(1); }
function commas(n){ return String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g,","); }
function today(){ return localDay(Date.now()); }
function localDay(ts){
  var d=new Date(ts);
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}
function shortDate(ts){
  var d=new Date(ts), n=new Date();
  var same=d.getFullYear()===n.getFullYear();
  return d.toLocaleDateString(undefined,same?{month:"short",day:"numeric"}:{month:"short",day:"numeric",year:"2-digit"});
}
function relDate(ts){
  var days=Math.floor((Date.now()-ts)/864e5);
  if(days<=0) return "today";
  if(days===1) return "yesterday";
  if(days<14) return days+"d ago";
  return shortDate(ts);
}
function dur(ms){
  var s=Math.max(0,Math.round(ms/1000)), m=Math.floor(s/60);
  if(m<60) return m+"m";
  return Math.floor(m/60)+"h "+(m%60)+"m";
}
function mmss(s){ s=Math.max(0,Math.round(s)); return Math.floor(s/60)+":"+String(s%60).padStart(2,"0"); }
function e1rm(w,r){ if(!w||!r) return 0; return r===1?w:w*(1+r/30); }
function unit(){ return S.settings.unit; }
function buzz(ms){ if(S.settings.buzz&&navigator.vibrate){ try{navigator.vibrate(ms);}catch(e){} } }
function plural(n,word){ return n+" "+word+(n===1?"":"s"); }

var toastTimer=null;
function toast(msg){
  var old=$(".toast"); if(old) old.remove();
  var t=document.createElement("div");
  t.className="toast"; t.textContent=msg;
  document.body.appendChild(t);
  clearTimeout(toastTimer);
  toastTimer=setTimeout(function(){ t.remove(); },2200);
}

/* Destructive actions get a window to take it back rather than a confirm
   dialog in front of every one of them. The caller keeps the removed object
   alive in the closure; nothing is re-derived from the DOM. */
function toastUndo(msg,fn){
  var old=$(".toast"); if(old) old.remove();
  var t=document.createElement("div");
  t.className="toast act";
  var label=document.createElement("span");
  label.textContent=msg;
  var b=document.createElement("button");
  b.type="button"; b.textContent="Undo";
  b.onclick=function(){ clearTimeout(toastTimer); t.remove(); fn(); };
  t.appendChild(label); t.appendChild(b);
  document.body.appendChild(t);
  clearTimeout(toastTimer);
  toastTimer=setTimeout(function(){ t.remove(); },10000);
}

var ICON={
  check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>',
  today:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 7v10M17.5 7v10M3.5 9.5v5M20.5 9.5v5M6.5 12h11"/></svg>',
  prog:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l5.5-6 4 3.5L21 6"/><path d="M21 11V6h-5"/></svg>',
  plan:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h10M4 12h16M4 18h7"/><circle cx="18.5" cy="6" r="1.6"/><circle cx="14.5" cy="18" r="1.6"/></svg>'
};

/* ============================ load model ============================
   BW modes: 0 = weighted (the number is the weight on the bar)
             1 = bodyweight (the number is weight ADDED to you)
             2 = assisted   (the number is assistance SUBTRACTED)
   Every logged set stores the resolved `load` so history stays true even
   after your bodyweight setting changes.
   =================================================================== */
function bwMode(ex){ return num(ex&&ex.bw)||0; }
function effLoad(w,mode,bodyweight){
  var bw=bodyweight===undefined?num(S.settings.bodyweight):num(bodyweight);
  if(mode===1) return bw+num(w);
  if(mode===2) return Math.max(0,bw-num(w));
  return num(w);
}
function loadOf(s){ return (s&&s.load!==undefined&&s.load!==null)?num(s.load):num(s&&s.w); }
function working(sets){ return (sets||[]).filter(function(s){ return !s.warm; }); }
/* How a set reads on screen: 185, BW, BW+25, −40 */
function entryText(s,mode){
  var w=num(s.w);
  if(mode===1) return w?("BW+"+fmt(w)):"BW";
  if(mode===2) return w?("−"+fmt(w)):"BW";
  return fmt(w);
}
function loadLabel(mode){
  if(mode===1) return "added "+unit();
  if(mode===2) return "assist "+unit();
  return unit();
}

/* ============================ history queries ============================ */
function normName(n){ return String(n||"").trim().toLowerCase(); }

/* Completed working sets for an exercise, grouped by session, newest first. */
function exSessions(name){
  var k=normName(name), out=[];
  for(var i=0;i<S.sessions.length;i++){
    var s=S.sessions[i];
    for(var j=0;j<s.exercises.length;j++){
      var e=s.exercises[j];
      if(normName(e.name)!==k) continue;
      var sets=working(e.sets).filter(function(x){ return x.done!==false&&num(x.r)>0; });
      if(sets.length) out.push({ts:s.ts,sets:sets,sessionId:s.id,deload:!!s.deload,bw:bwMode(e),metric:metricOf(e)});
    }
  }
  return out;
}
/* Same, minus anything logged during a deliberate deload — those must never
   read as a decline, or the app would chase its own tail. */
function exWorking(name){ return exSessions(name).filter(function(x){ return !x.deload; }); }
function lastPerf(name){ var h=exWorking(name); return h.length?h[0]:null; }
/* Most recent session's raw sets, warm-ups included, for prefill. */
function lastRawSets(name){
  var k=normName(name);
  for(var i=0;i<S.sessions.length;i++){
    var s=S.sessions[i];
    for(var j=0;j<s.exercises.length;j++){
      if(normName(s.exercises[j].name)===k&&s.exercises[j].sets.length) return s.exercises[j].sets;
    }
  }
  return null;
}
/* ============================ metrics ============================
   0 = reps (the default, and what every calculation used to assume)
   1 = time     — `r` holds seconds
   2 = distance — `r` holds distance in whatever unit you already think in
   `r` is reused rather than adding a field, so every input, stepper and
   history record keeps working unchanged; only its meaning moves.
   ================================================================= */
function metricOf(ex){ return num(ex&&ex.metric)||0; }
function metricNoun(m){ return m===1?"seconds":m===2?"distance":"reps"; }
function metricShort(m){ return m===1?"secs":m===2?"dist":"reps"; }
function metricJoin(m){ return m===0?"×":"for"; }
function metricStep(m){ return m===0?1:5; }
function metricSuffix(m){ return m===1?"s":""; }
/* Reps get Epley. Time and distance have no 1RM, so the comparable number is
   the work itself, scaled by load so a heavier carry still counts as harder.
   max(load,1) keeps an unloaded plank on its own seconds. */
function setScore(s,m){
  if(m===1||m===2) return num(s.r)*Math.max(loadOf(s),1);
  return e1rm(loadOf(s),num(s.r));
}
function scoreLabel(m){ return m===1?"best hold":m===2?"best distance":"e1RM"; }

function bestScore(name){
  var best=0;
  exSessions(name).forEach(function(s){
    s.sets.forEach(function(x){ best=Math.max(best,setScore(x,s.metric)); });
  });
  return best;
}
function sessionTopScore(s){
  var b=0; s.sets.forEach(function(x){ b=Math.max(b,setScore(x,s.metric)); }); return b;
}
/* Volume is weight × reps, which is only defined for rep work. A plank or a
   carry contributes nothing to a pound total rather than a fabricated one. */
function sessionVolume(sets,m){
  if(num(m)) return 0;
  var v=0;
  (sets||[]).forEach(function(x){ if(x.done!==false&&!x.warm) v+=loadOf(x)*num(x.r); });
  return v;
}
function exVolume(e){ return sessionVolume(e.sets,metricOf(e)); }
function allExerciseNames(){
  var seen={},out=[];
  S.sessions.forEach(function(s){ s.exercises.forEach(function(e){
    var k=normName(e.name); if(!seen[k]){ seen[k]=1; out.push({name:e.name,ts:s.ts}); }
  });});
  S.routines.forEach(function(r){ r.exercises.forEach(function(e){
    var k=normName(e.name); if(!seen[k]){ seen[k]=1; out.push({name:e.name,ts:0}); }
  });});
  return out.sort(function(a,b){ return b.ts-a.ts; });
}

/* Walk the whole history in order and re-flag PRs. Run after any edit,
   otherwise a corrected typo leaves a phantom record behind. */
function recomputePRs(){
  var best={};
  S.sessions.slice().sort(function(a,b){ return a.ts-b.ts; }).forEach(function(s){
    s.exercises.forEach(function(e){
      var k=normName(e.name);
      e.sets.forEach(function(x){
        if(x.warm||x.done===false){ x.pr=false; return; }
        var v=setScore(x,metricOf(e)), prev=best[k]||0;
        x.pr=prev>0&&v>prev+0.01;
        if(v>prev) best[k]=v;
      });
    });
  });
}

/* ---- trend / stall detection ---- */
function trend(name){
  var h=exWorking(name);
  if(h.length<4) return {state:"new",n:h.length,pct:0};
  var vals=h.map(sessionTopScore);
  var mean=function(a){ return a.reduce(function(x,y){return x+y;},0)/a.length; };
  var a=mean(vals.slice(0,3)), b=mean(vals.slice(3,6));
  if(!b) return {state:"new",n:h.length,pct:0};
  var pct=(a-b)/b*100;
  return {state: pct>=1.5?"up":(pct<=-2?"down":"flat"), n:h.length, pct:pct};
}
function trackedLifts(){
  var seen={},out=[];
  S.routines.forEach(function(r){ r.exercises.forEach(function(e){
    var k=normName(e.name); if(!seen[k]){ seen[k]=1; out.push(e.name); }
  });});
  return out;
}
function deloadCheck(){
  if(inDeloadWeek()) return null;
  if(Date.now()<(S.settings.deloadSnooze||0)) return null;
  var judged=[], stalled=[];
  trackedLifts().forEach(function(n){
    var t=trend(n);
    if(t.state==="new") return;
    judged.push(n);
    if(t.state!=="up") stalled.push({name:n,t:t});
  });
  if(judged.length<3) return null;
  var ratio=stalled.length/judged.length;
  if(ratio>=0.6) return {level:"high",stalled:stalled,judged:judged.length};
  if(ratio>=0.4) return {level:"watch",stalled:stalled,judged:judged.length};
  return null;
}

/* ---- deliberate deload ---- */
function inDeloadWeek(){ return Date.now()<(S.settings.deloadUntil||0); }
function startDeloadWeek(days){
  S.settings.deloadUntil=Date.now()+(days||7)*864e5;
  S.settings.deloadSnooze=0;
  writeNow();
}
function endDeloadWeek(){ S.settings.deloadUntil=0; writeNow(); }

/* ============================ plates ============================
   `bar` on an exercise is the weight of the empty bar, and 0 means the
   exercise isn't a loaded barbell at all — that's the whole flag. The
   inventory is counted in PAIRS, because you load a bar symmetrically and
   thinking in pairs is what you actually do on the gym floor.
   ================================================================ */
function defaultPlates(u){
  return u==="kg"
    ? [{w:25,n:4},{w:20,n:1},{w:15,n:1},{w:10,n:2},{w:5,n:2},{w:2.5,n:2},{w:1.25,n:2}]
    : [{w:45,n:4},{w:35,n:1},{w:25,n:2},{w:10,n:2},{w:5,n:2},{w:2.5,n:2}];
}
function defaultBar(u){ return u==="kg"?20:45; }
function barOf(ex){ var b=num(ex&&ex.bar); return b>0?b:0; }
function plateInv(){
  return (S.settings.plates||[])
    .filter(function(p){ return num(p.w)>0&&num(p.n)>0; })
    .sort(function(a,b){ return num(b.w)-num(a.w); });
}

/* Greedy from the heaviest plate down, bounded by how many pairs you own.
   Greedy is optimal for every real plate set (each denomination divides the
   ones above it), and where it isn't we say so instead of pretending. */
function platesFor(target,bar){
  var per=(num(target)-num(bar))/2, out=[], got=0;
  if(!(per>0)) return {list:[],per:per,got:num(bar),exact:per===0};
  plateInv().forEach(function(p){
    var w=num(p.w), n=Math.min(num(p.n),Math.floor((per-got+1e-9)/w));
    if(n>0){ out.push({w:w,n:n}); got+=n*w; }
  });
  return {list:out,per:per,got:num(bar)+got*2,exact:Math.abs(got-per)<1e-9};
}

/* Everything on the set row's second line. Returns inner HTML only — the
   .plates node itself is never replaced, so nothing on the logging path loses
   DOM identity. The RPE chip re-enables pointer events on itself; the rest of
   the line stays inert so it can't steal a tap meant for the tick. */
function rowExtras(ex,s){
  var pl=plateHint(ex,s), rp="";
  if(S.settings.rpe&&s.done)
    rp='<button class="rpe'+(num(s.rpe)?" set":"")+'" data-act="rpe" aria-label="Rate how hard that set was">'+
      (num(s.rpe)?"RPE "+fmt(s.rpe):"RPE")+'</button>';
  if(!pl&&!rp) return "";              // keeps .plates:empty hiding the row
  return '<span class="ptext">'+pl+'</span>'+rp;
}

/* The plate line. Returns inner HTML only. */
function plateHint(ex,s){
  var bar=barOf(ex);
  if(!bar||bwMode(ex)!==0) return "";
  var w=num(s.w);
  if(!w) return "";
  if(w<bar) return '<span class="off">under the '+fmt(bar)+' bar</span>';
  var r=platesFor(w,bar);
  if(!r.list.length) return '<span class="lb">SIDE</span>bar only';
  return '<span class="lb">SIDE</span>'+
    r.list.map(function(p){ return fmt(p.w)+(p.n>1?'<i>×'+p.n+'</i>':""); }).join("  ")+
    (r.exact?"":' <span class="off">= '+fmt(r.got)+'</span>');
}

/* ============================ muscle groups ============================
   `mg` is the main muscle (one, or "") and `mg2` is a list of helpers.
   A working set counts 1.0 toward the main muscle and 0.5 toward each helper.
   Full credit for everything is how volume trackers lie to you: three sets of
   bench would read as three chest AND three triceps AND three shoulders, and
   suddenly you're "doing" 40 triceps sets a week.
   ====================================================================== */
var MUSCLES=[
  {k:"chest",   n:"Chest"},
  {k:"back",    n:"Back"},
  {k:"traps",   n:"Traps"},
  {k:"delts",   n:"Shoulders"},
  {k:"biceps",  n:"Biceps"},
  {k:"triceps", n:"Triceps"},
  {k:"forearms",n:"Forearms"},
  {k:"quads",   n:"Quads"},
  {k:"hams",    n:"Hamstrings"},
  {k:"glutes",  n:"Glutes"},
  {k:"calves",  n:"Calves"},
  {k:"core",    n:"Core"}
];
function muscleName(k){
  for(var i=0;i<MUSCLES.length;i++) if(MUSCLES[i].k===k) return MUSCLES[i].n;
  return "";
}
function isMuscle(k){ return !!muscleName(k); }

/* First match wins, so the order is the specification: "leg curl" has to be
   caught before "curl", "upright row" before "row". */
var MG_GUESS=[
  [/leg\s*curl|lying\s*curl|nordic|ham(string)?\s*curl/i, "hams",   []],
  [/rdl|romanian|good\s?morning|stiff.?leg/i,             "hams",   ["glutes","back"]],
  [/deadlift|dead\s*lift/i,                               "back",   ["hams","glutes","traps"]],
  [/hip\s*thrust|glute\s*(bridge|kick)|hyperextension|back\s*extension/i,"glutes",["hams"]],
  [/leg\s*extension|knee\s*extension/i,                   "quads",  []],
  [/squat|leg\s*press|lunge|step.?up|hack|sissy/i,        "quads",  ["glutes","hams"]],
  [/calf|calve|toe\s*press/i,                             "calves", []],
  [/shrug/i,                                              "traps",  []],
  [/upright\s*row|lateral\s*raise|side\s*raise|front\s*raise/i,"delts",[]],
  [/rear\s*delt|face\s*pull|reverse\s*(fly|flye|pec)/i,   "delts",  ["back","traps"]],
  [/overhead\s*press|\bohp\b|shoulder\s*press|military|arnold/i,"delts",["triceps"]],
  [/bench|chest\s*press|push.?up|\bdips?\b|\bfly\b|flye|\bpec\b/i,"chest",["triceps","delts"]],
  /* Generic presses, but only after the overhead and leg variants above have
     had their turn — and only when the word "press" is actually there, so
     "incline dumbbell curl" still falls through to biceps. */
  [/(incline|decline|floor|dumbbell|\bdb\b)[\w\s-]*press/i,"chest",["triceps","delts"]],
  [/pull.?up|chin.?up|pull.?down|lat\s*pull|pullover|\brow\b|rows/i,"back",["biceps"]],
  [/tricep|skull\s?crusher|push.?down|press.?down|kick.?back|jm\s*press|close.?grip/i,"triceps",[]],
  [/curl/i,                                               "biceps", ["forearms"]],
  [/wrist|\bgrip\b|farmer|hang(ing)?\s*hold/i,            "forearms",[]],
  [/plank|crunch|sit.?up|leg\s*raise|ab\s*(wheel|roll)|russian\s*twist|woodchop|pallof|\bcore\b|\babs?\b/i,"core",[]]
];
function guessMuscles(name){
  var n=String(name||"");
  for(var i=0;i<MG_GUESS.length;i++)
    if(MG_GUESS[i][0].test(n)) return {mg:MG_GUESS[i][1], mg2:MG_GUESS[i][2].slice()};
  return {mg:"", mg2:[]};
}

/* Tags live on the exercise, but history logged before this feature has none —
   and a report that says "0 sets, ever" would be worse than useless. So an
   untagged exercise falls back to however that lift is tagged in the plan
   today, and failing that to the name guess. */
function mgIndex(){
  var idx={};
  S.routines.forEach(function(r){ r.exercises.forEach(function(e){
    if(e.mg||(e.mg2&&e.mg2.length)) idx[normName(e.name)]={mg:e.mg||"",mg2:e.mg2||[]};
  });});
  return idx;
}
function tagsOf(ex,idx){
  if(ex.mg||(ex.mg2&&ex.mg2.length)) return {mg:ex.mg||"",mg2:ex.mg2||[]};
  var t=(idx||mgIndex())[normName(ex.name)];
  return t?t:guessMuscles(ex.name);
}
function tagLabel(t){
  if(!t.mg&&!t.mg2.length) return "";
  var s=t.mg?muscleName(t.mg):"—";
  if(t.mg2.length) s+=" + "+t.mg2.map(muscleName).filter(Boolean).join(", ");
  return s;
}

/* Weekly sets per muscle, the headline hypertrophy number. Deload sessions
   count: you still did the sets. */
function setsByMuscle(a,b){
  var idx=mgIndex(), out={}, untagged=0;
  MUSCLES.forEach(function(m){ out[m.k]=0; });
  S.sessions.forEach(function(s){
    if(s.ts<a||s.ts>=b) return;
    s.exercises.forEach(function(e){
      var n=working(e.sets).filter(function(x){ return x.done!==false; }).length;
      if(!n) return;
      var t=tagsOf(e,idx);
      var main=isMuscle(t.mg)?t.mg:"";
      var sec=(t.mg2||[]).filter(isMuscle);
      if(!main&&!sec.length){ untagged+=n; return; }
      if(main) out[main]+=n;
      sec.forEach(function(k){ out[k]+=n*0.5; });
    });
  });
  return {by:out, untagged:untagged};
}

/* Only guessed for brand-new exercises, and always editable afterwards. */
var BAR_YES=/barbell|squat|bench|deadlift|dead lift|romanian|rdl|overhead press|ohp|military|hip thrust|clean|snatch|good ?morning|pendlay|jm press|floor press/i;
var BAR_NO=/dumbbell|\bdb\b|machine|cable|smith|kettlebell|\bkb\b|band|goblet|hack|leg press|pendulum|belt squat|bodyweight|assisted|landmine/i;
function guessBar(name){
  var n=String(name||"");
  if(BAR_NO.test(n)) return 0;
  return BAR_YES.test(n)?(num(S.settings.bar)||defaultBar(unit())):0;
}

function weekBounds(offset){
  var d=new Date(); d.setHours(0,0,0,0);
  var dow=(d.getDay()+6)%7;                 // Monday = 0
  d.setDate(d.getDate()-dow-7*(offset||0));
  var start=d.getTime();
  return {start:start,end:start+7*864e5};
}
function volumeInRange(a,b){
  var v=0,n=0;
  S.sessions.forEach(function(s){
    if(s.ts>=a&&s.ts<b){ n++; s.exercises.forEach(function(e){ v+=exVolume(e); }); }
  });
  return {v:v,n:n};
}

/* Every lift's best set by estimated 1RM, newest record first — the screen
   you actually want to look at after a good session. */
function prBoard(){
  var out=[];
  allExerciseNames().forEach(function(x){
    var best=null, bestV=0, bestTs=0, bestBw=0, bestMet=0;
    exSessions(x.name).forEach(function(s){
      s.sets.forEach(function(st){
        var v=setScore(st,s.metric);
        if(v>bestV){ bestV=v; best=st; bestTs=s.ts; bestBw=s.bw; bestMet=s.metric; }
      });
    });
    if(best) out.push({name:x.name,set:best,e:bestV,ts:bestTs,bw:bestBw,metric:bestMet});
  });
  return out.sort(function(a,b){ return b.ts-a.ts||b.e-a.e; });
}

/* Month grid, Monday-first to match weekBounds(). Returns 7-wide rows of
   {day, ts, sessions[]} with nulls for the leading and trailing padding. */
function monthGrid(offset){
  var now=new Date();
  var m=new Date(now.getFullYear(),now.getMonth()-(offset||0),1);
  var year=m.getFullYear(), mon=m.getMonth();
  var first=(new Date(year,mon,1).getDay()+6)%7;         // Monday = 0
  var days=new Date(year,mon+1,0).getDate();
  var byDay={};
  S.sessions.forEach(function(s){
    var d=new Date(s.ts);
    if(d.getFullYear()===year&&d.getMonth()===mon){
      (byDay[d.getDate()]=byDay[d.getDate()]||[]).push(s);
    }
  });
  var cells=[],i;
  for(i=0;i<first;i++) cells.push(null);
  for(i=1;i<=days;i++) cells.push({day:i,ts:new Date(year,mon,i).getTime(),sessions:byDay[i]||[]});
  while(cells.length%7) cells.push(null);
  var rows=[];
  for(i=0;i<cells.length;i+=7) rows.push(cells.slice(i,i+7));
  var trained=Object.keys(byDay).length;
  var n=0; Object.keys(byDay).forEach(function(k){ n+=byDay[k].length; });
  return {rows:rows, label:m.toLocaleDateString(undefined,{month:"long",year:"numeric"}),
          trained:trained, sessions:n, days:days, year:year, mon:mon,
          isCurrent:(offset||0)===0};
}

/* ============================ the progression engine ============================
   Read what you actually did last time, then decide today. All derived from
   history, so nothing can drift out of sync.

     double progression : hold the weight until every working set reaches the top
                          of the range, then add load and drop back to the bottom
     straight sets      : hit the target on every set, then add load
     autoregulation     : a lift sliding for 3 sessions gets one 10% back-off —
                          once, not compounding
     deload week        : while one is running, everything goes light and short
   ============================================================================== */
function stepFor(ex){ return num(ex.inc)||num(S.settings.inc)||5; }

/* On assisted work the number is help, so progress means the number goes DOWN.
   Everywhere else harder means the number goes up. */
function harder(w,step,mode){ return mode===2?Math.max(0,w-step):w+step; }
function easier(w,step,mode){
  if(mode===2) return w+step;                 // more assistance
  var back=Math.round(w*0.9/step)*step;       // roughly 10% off, on the step grid
  if(back>=w) back=w-step;
  return Math.max(0,back);
}
function harderPhrase(step,mode){
  return mode===2 ? "take "+fmt(step)+" "+unit()+" off the assist"
                  : "add "+fmt(step)+" "+unit();
}
/* "12s" for twelve reps, "60s" for sixty seconds — both read naturally.
   Distance has no such suffix. */
function amtText(v,m){ return m===2?String(v):(v+"s"); }
function rpeMean(sets){
  var v=(sets||[]).filter(function(s){ return num(s.rpe)>0; });
  if(!v.length||v.length*2<sets.length) return 0;
  return v.reduce(function(a,s){ return a+num(s.rpe); },0)/v.length;
}

function prescribe(name,ex){
  var step=stepFor(ex);
  var met=metricOf(ex);
  var rstep=metricStep(met);
  var low=Math.max(1,num(ex.reps)||num(S.settings.repLow)||8);
  var top=num(ex.repTop)||0;
  var mode=bwMode(ex);
  var nsets=Math.max(1,num(ex.sets)||3);
  var hist=exWorking(name);
  var last=hist[0];
  if(!last) return {w:"",r:low,sets:nsets,why:"",kind:"new"};

  var w=num(last.sets[0].w);
  if(!w&&mode===0) w=Math.max.apply(null,last.sets.map(function(s){ return num(s.w); }));
  var minR=Math.min.apply(null,last.sets.map(function(s){ return num(s.r); }));

  if(inDeloadWeek()){
    return {w:easier(w,step,mode),r:low,sets:Math.max(1,Math.round(nsets*0.6)),
            why:"Deload week — light and short on purpose",kind:"deload"};
  }

  if(trend(name).state==="down"){
    /* One cut, then hold and rebuild. If today's load is already below the
       peak of the last few sessions, the back-off has happened — cutting
       again is how an app chases its own tail down. */
    var recent=hist.slice(1,4).map(function(h){ return num(h.sets[0].w); });
    var peak=recent.length?Math.max.apply(null,recent):w;
    var alreadyDown=mode===2?(w>peak):(w<peak);
    if(alreadyDown)
      return {w:w,r:low,sets:nsets,why:"Already backed off — beat this before adding",kind:"hold"};
    if(mode===1&&w<=0)
      return {w:0,r:low,sets:Math.max(1,nsets-1),
              why:"Sliding 3 sessions — drop a set rather than adding load",kind:"deload"};
    var back=easier(w,step,mode);
    if(back===w)
      return {w:w,r:low,sets:Math.max(1,nsets-1),why:"Sliding 3 sessions — drop a set this week",kind:"deload"};
    return {w:back,r:low,sets:nsets,why:"Sliding 3 sessions — back off to "+fmt(back),kind:"deload"};
  }

  /* If last time was already a grind, adding load buys a stall. Only fires
     when RPE was actually recorded on at least half the working sets, so it is
     invisible to anyone not using the feature. */
  var rp=rpeMean(last.sets);
  if(rp>=9.5)
    return {w:w,r:Math.max(low,minR),sets:nsets,
            why:"Averaged RPE "+fmt(rp)+" last time — repeat it before adding",kind:"hold"};

  /* A plank or an unloaded carry has nothing to add weight to, so the metric
     itself is the progression axis and the range top is a floor, not a cap. */
  var noLoad=met!==0&&mode===0&&!(w>0);
  var nextR=Math.min(top||1e9,minR+rstep);

  if(top>low){                                        // double progression
    if(minR>=top){
      if(noLoad) return {w:w,r:minR+rstep,sets:nsets,
              why:"Held "+amtText(top,met)+" on every set — go for "+(minR+rstep),kind:"up"};
      return {w:harder(w,step,mode),r:low,sets:nsets,
              why:"Hit "+amtText(top,met)+" on every set — "+harderPhrase(step,mode),kind:"up"};
    }
    if(minR>=low)
      return {w:w,r:nextR,sets:nsets,
              why:(noLoad?"Same as last time":"Same weight")+" — go for "+nextR+" this time",kind:"reps"};
    return {w:w,r:low,sets:nsets,why:"Fell short of "+amtText(low,met)+" — run it back",kind:"hold"};
  }

  if(minR>=low){                                      // straight sets
    if(noLoad) return {w:w,r:minR+rstep,sets:nsets,
            why:"Hit all "+amtText(low,met)+" — go for "+(minR+rstep),kind:"up"};
    return {w:harder(w,step,mode),r:low,sets:nsets,
            why:"Hit all "+amtText(low,met)+" — "+harderPhrase(step,mode),kind:"up"};
  }
  return {w:w,r:low,sets:nsets,why:"Missed "+amtText(low,met)+" last time — run it back",kind:"hold"};
}

/* ============================ sparkline ============================ */
function spark(canvas,values,opts){
  opts=opts||{};
  var cs=getComputedStyle(document.documentElement);
  var accent=cs.getPropertyValue("--accent").trim()||"#C98A0E";
  var line=cs.getPropertyValue("--line").trim()||"#ccc";
  var dpr=window.devicePixelRatio||1;
  var w=canvas.clientWidth||78, h=canvas.clientHeight||32;
  canvas.width=Math.round(w*dpr); canvas.height=Math.round(h*dpr);
  var c=canvas.getContext("2d");
  c.setTransform(dpr,0,0,dpr,0,0);
  c.clearRect(0,0,w,h);
  if(!values||values.length<2){ c.fillStyle=line; c.fillRect(0,h-1.5,w,1.5); return; }
  var pad=opts.pad||3;
  var mn=Math.min.apply(null,values), mx=Math.max.apply(null,values);
  if(mx-mn<1e-6){ mn-=1; mx+=1; }
  var X=function(i){ return pad+(w-pad*2)*(i/(values.length-1)); };
  var Y=function(v){ return h-pad-(h-pad*2)*((v-mn)/(mx-mn)); };
  if(opts.grid){
    c.strokeStyle=line; c.lineWidth=1; c.globalAlpha=.7;
    for(var g=0;g<=2;g++){
      var y=pad+(h-pad*2)*(g/2)+.5;
      c.beginPath(); c.moveTo(0,y); c.lineTo(w,y); c.stroke();
    }
    c.globalAlpha=1;
  }
  c.beginPath(); c.moveTo(X(0),Y(values[0]));
  for(var i=1;i<values.length;i++) c.lineTo(X(i),Y(values[i]));
  var grad=c.createLinearGradient(0,0,0,h);
  grad.addColorStop(0,hexA(accent,.24)); grad.addColorStop(1,hexA(accent,0));
  c.lineTo(X(values.length-1),h); c.lineTo(X(0),h); c.closePath();
  c.fillStyle=grad; c.fill();
  c.beginPath(); c.moveTo(X(0),Y(values[0]));
  for(var j=1;j<values.length;j++) c.lineTo(X(j),Y(values[j]));
  c.strokeStyle=accent; c.lineWidth=opts.lw||1.8; c.lineJoin="round"; c.lineCap="round"; c.stroke();
  c.beginPath(); c.arc(X(values.length-1),Y(values[values.length-1]),opts.dot||2.6,0,Math.PI*2);
  c.fillStyle=accent; c.fill();
}
function hexA(hex,a){
  hex=hex.replace("#","");
  if(hex.length===3) hex=hex.split("").map(function(x){return x+x;}).join("");
  var n=parseInt(hex,16);
  return "rgba("+((n>>16)&255)+","+((n>>8)&255)+","+(n&255)+","+a+")";
}

/* ============================ rest timer ============================
   The countdown was always wall-clock correct, but the alert never arrived:
   a backgrounded page gets its timers throttled to nothing and vibration is
   ignored outright, so with the phone in a pocket the timer silently did
   nothing. Android Chrome will not freeze a page that is *playing audio*, so
   a rest keeps a near-silent loop running purely to stay alive, and swaps
   that same already-unlocked element to an audible tone at zero.

   Two WAVs are synthesised rather than embedded: keeps the one-file rule and
   costs a few hundred bytes of code instead of a few KB of base64.
   ==================================================================== */
var AU_RATE=8000;
function wavURL(rate,data){
  var n=data.length, buf=new ArrayBuffer(44+n*2), v=new DataView(buf), i;
  function tag(o,s){ for(var j=0;j<s.length;j++) v.setUint8(o+j,s.charCodeAt(j)); }
  tag(0,"RIFF"); v.setUint32(4,36+n*2,true); tag(8,"WAVEfmt ");
  v.setUint32(16,16,true); v.setUint16(20,1,true); v.setUint16(22,1,true);
  v.setUint32(24,rate,true); v.setUint32(28,rate*2,true);
  v.setUint16(32,2,true); v.setUint16(34,16,true);
  tag(36,"data"); v.setUint32(40,n*2,true);
  for(i=0;i<n;i++) v.setInt16(44+i*2,Math.max(-1,Math.min(1,data[i]))*32767,true);
  return URL.createObjectURL(new Blob([buf],{type:"audio/wav"}));
}
var AU=null;
function audioURLs(){
  if(AU) return AU;
  var i,n=AU_RATE,quiet=new Float32Array(n);
  /* The keep-alive has to be INAUDIBLE TO YOU but AUDIBLE TO CHROME, and those
     are different tests. Chrome decides whether a tab is "playing audio" — and
     therefore whether it may be frozen — from actual signal power. The first
     version of this used ±1/32767 dither, about -90 dBFS, which Chrome scores
     as silence: the tab froze anyway and the alarm never fired.
     A 30 Hz tone at -24 dBFS has real power, but no phone speaker reproduces
     30 Hz, so nothing comes out. On headphones it may be a faint rumble; that
     is the deliberate trade for an alarm that actually arrives. */
  for(i=0;i<n;i++) quiet[i]=Math.sin(2*Math.PI*30*i/n)*0.06;
  var beeps=3,on=.18,off=.14,tot=Math.round(n*beeps*(on+off)),alarm=new Float32Array(tot);
  for(var b=0;b<beeps;b++){
    var st=Math.round(b*(on+off)*n), len=Math.round(on*n);
    for(i=0;i<len;i++){
      var env=Math.min(1,i/(n*.008),(len-i)/(n*.02));   // no clicks at the edges
      alarm[st+i]=Math.sin(2*Math.PI*880*i/n)*.9*env;
    }
  }
  AU={quiet:wavURL(AU_RATE,quiet),alarm:wavURL(AU_RATE,alarm)};
  return AU;
}
var restAudio=null;
function audioEl(){
  if(!restAudio){
    restAudio=document.createElement("audio");
    restAudio.setAttribute("playsinline","");
    restAudio.preload="auto";
    restAudio.volume=1;
    document.body.appendChild(restAudio);
  }
  return restAudio;
}
function playSrc(url,loop){
  try{
    var a=audioEl();
    a.loop=!!loop; a.src=url;
    var p=a.play();
    if(p&&p.catch) p.catch(function(){});   // autoplay refused; vibration still tries
  }catch(e){}
}
function audioStop(){ if(restAudio){ try{ restAudio.loop=false; restAudio.pause(); }catch(e){} } }
/* Only worth keeping the page alive if something is going to happen at zero. */
function wantsBgAlert(){ return !!(S.settings.sound||S.settings.notify); }

/* ---- why there is no MediaSession here ----
   There was one. It made things worse. Declaring a media session tells Android
   "this is a music player", which is precisely what makes the system duck
   whatever you are actually listening to — and it put a pointless transport
   control in the notification shade. Reported from a real gym session: the
   30 Hz keep-alive was audible through headphones AND Android attenuated the
   user's music for the whole rest period to prioritise it. A rest timer that
   fights your music is not a rest timer anyone will keep using. */

function notifyRestDone(){
  if(!S.settings.notify) return;
  if(!("Notification" in window)||Notification.permission!=="granted") return;
  var opts={body:"Next set.",tag:"ironlog-rest",renotify:true,
            icon:"icon-192.png",badge:"icon-192.png",vibrate:[90,70,90]};
  try{
    /* .ready never resolves when nothing is registered — the artifact build
       has no service worker — so test for a live controller, not for the API. */
    if(navigator.serviceWorker&&navigator.serviceWorker.controller){
      navigator.serviceWorker.ready
        .then(function(reg){ return reg.showNotification("Rest done",opts); })
        .catch(function(){ try{ new Notification("Rest done",opts); }catch(e){} });
    } else new Notification("Rest done",opts);
  }catch(e){}
}
function clearRestNote(){
  if(!navigator.serviceWorker||!navigator.serviceWorker.controller) return;
  navigator.serviceWorker.ready.then(function(reg){
    if(!reg.getNotifications) return;
    reg.getNotifications({tag:"ironlog-rest"}).then(function(ns){
      ns.forEach(function(x){ x.close(); });
    }).catch(function(){});
  }).catch(function(){});
}
function notifyState(){
  if(!("Notification" in window)) return "none";
  return Notification.permission;               // granted | denied | default
}
/* Asked only when the switch is tapped, never on load, and the refusal path
   is a visible message rather than a switch that silently won't stay on. */
function askNotify(cb){
  if(!("Notification" in window)) return cb(false,"This browser can't show notifications.");
  if(Notification.permission==="granted") return cb(true,"");
  if(Notification.permission==="denied")
    return cb(false,"Notifications are blocked for this site — turn them back on in your browser settings.");
  try{
    /* Chrome resolves a promise *and* fires the legacy callback, so guard. */
    var done=false;
    var fin=function(p){
      if(done) return; done=true;
      cb(p==="granted",p==="granted"?"":"Notifications weren't allowed.");
    };
    var r=Notification.requestPermission(fin);
    if(r&&r.then) r.then(fin,function(){ fin("denied"); });
  }catch(e){ cb(false,"Couldn't ask for permission."); }
}

/* Whether a locked phone keeps this page running is not answerable from a
   desktop browser, so the app records it. The tick gap is the whole story: a
   frozen page stops ticking, so a run of 1s gaps means the keep-alive held and
   any failure is downstream (output routing, volume), while a 20s gap means
   Chrome froze us and the audio trick did not work. */
var diag=null;
function diagStart(sec){ diag={want:sec,t0:Date.now(),ticks:[],fired:0,audio:""}; }
function diagTick(){ if(diag) diag.ticks.push(Date.now()); }
function diagReport(){
  if(!diag) return null;
  var gaps=[],i;
  var prev=diag.t0;
  for(i=0;i<diag.ticks.length;i++){ gaps.push(diag.ticks[i]-prev); prev=diag.ticks[i]; }
  return {
    want:diag.want,
    ticks:diag.ticks.length,
    expected:diag.want,
    maxGap:gaps.length?Math.max.apply(null,gaps)/1000:0,
    fired:diag.fired?(diag.fired-diag.t0)/1000:0,
    audio:diag.audio,
    hidden:diag.hidden||0
  };
}

var rest={endsAt:0,total:0}, buzzed=false, restLate=0;
function startRest(sec){
  rest.total=sec; rest.endsAt=Date.now()+sec*1000; buzzed=false; restLate=0;
  clearRestNote();
  diagStart(sec);
  /* The tone is now opt-in. It is the only thing that guarantees Chrome won't
     freeze the page, but it costs you your music — Android ducks everything
     else the whole time it plays. Chrome doesn't freeze a backgrounded page
     immediately, so a normal 2-3 minute rest may well survive without it.
     Whether it does on YOUR phone is what the self-test answers. */
  if(wantsBgAlert()&&S.settings.keepTone) playSrc(audioURLs().quiet,true);
  renderHeader();
}
function stopRest(){ rest.endsAt=0; buzzed=false; audioStop(); clearRestNote(); renderHeader(); }
function restDone(){
  if(S.settings.sound) playSrc(audioURLs().alarm,false);
  else audioStop();
  buzz([90,70,90,70,160]);
  notifyRestDone();
  if(diag){
    diag.fired=Date.now();
    var a=restAudio;
    diag.audio=!a?"no element"
      :(a.error?("error "+a.error.code)
      :(a.paused?"paused":"playing")+" vol="+a.volume+(a.muted?" MUTED":""));
  }
}
setInterval(function(){
  if(rest.endsAt){
    diagTick();
    var left=(rest.endsAt-Date.now())/1000;
    if(left<=0&&!buzzed){
      buzzed=true;
      /* Late by more than a few seconds means the phone paused us. Record it:
         with the keep-alive tone off, a silently-missed alarm is the expected
         failure and the user deserves to be told rather than left guessing. */
      if(left<-4) restLate=-left;
      /* If the page was frozen and thawed minutes later, don't shout at
         someone who is already looking at the screen. */
      if(left>-90) restDone(); else audioStop();
    }
    renderHeader();
  } else if(S.active){ renderHeader(); }
},1000);
document.addEventListener("visibilitychange",function(){
  if(document.hidden){ if(diag) diag.hid=Date.now(); return; }
  if(diag&&diag.hid){ diag.hidden=(diag.hidden||0)+(Date.now()-diag.hid)/1000; diag.hid=0; }
  clearRestNote();
  if(rest.endsAt||S.active) renderHeader();
  if(restLate>4&&!S.settings.keepTone){
    var by=Math.round(restLate); restLate=0;
    toastUndo("Alarm was "+by+"s late — phone paused the app",function(){
      S.settings.keepTone=true; writeNow();
      toast("Keep-alive tone on. It will mute your music during rests.");
    });
    var t=$(".toast.act button"); if(t) t.textContent="Fix it";
  } else restLate=0;
});

function sheet(html,onMount){
  closeSheet();
  var b=document.createElement("div");
  b.className="backdrop";
  b.innerHTML='<div class="sheet"><div class="grab"></div>'+html+'</div>';
  b.addEventListener("click",function(ev){ if(ev.target===b) closeSheet(); });
  document.body.appendChild(b);
  if(onMount) onMount($(".sheet",b));
  return b;
}
function closeSheet(){ var b=$(".backdrop"); if(b) b.remove(); }

    '<div class="row" style="gap:8px">'+
      '<button class="btn ghost" style="flex:1" data-x="cancel">Cancel</button>'+
      '<button class="btn '+(danger?"danger":"primary")+'" style="flex:1" data-x="ok">'+esc(label)+'</button>'+

    function(el){
      $('[data-x="cancel"]',el).onclick=closeSheet;
      $('[data-x="ok"]',el).onclick=function(){ closeSheet(); fn(); };

/* ============================ TODAY ============================ */
function nextRoutine(){
  if(!S.routines.length) return null;
  var last=S.sessions.find(function(s){ return s.routineId; });
  if(!last) return S.routines[0];
  var i=S.routines.findIndex(function(r){ return r.id===last.routineId; });
  if(i<0) return S.routines[0];
  return S.routines[(i+1)%S.routines.length];
}

function startSession(routine){
  var ex=[];
  if(routine) routine.exercises.forEach(function(re){ ex.push(makeSessionEx(re,re.id)); });
  S.active={
    id:uid(), ts:Date.now(), date:today(),
    routineId:routine?routine.id:null,
    key:routine?routine.key:"—",
    name:routine?routine.name:"Freestyle",
    deload:inDeloadWeek(),
    note:"", exercises:ex
  };
  save(); render();
}

/* Build an in-session exercise, prefilled with today's prescription.
   Warm-ups carry over from last time so you don't retype them. */
function makeSessionEx(planEx,planId){
  var p=prescribe(planEx.name,planEx);
  var last=lastPerf(planEx.name);
  var raw=lastRawSets(planEx.name);
  var sets=[];
  if(raw) raw.forEach(function(s){ if(s.warm) sets.push({w:String(s.w),r:String(s.r),warm:true,done:false}); });
  var n=Math.max(1,num(p.sets)||3);
  for(var i=0;i<n;i++) sets.push({w:p.w===""?"":String(p.w),r:String(p.r),done:false});
  return {
    id:uid(), planId:planId||null, name:planEx.name,
    targetReps:p.r, reps:num(planEx.reps)||p.r, repTop:num(planEx.repTop)||0,
    inc:planEx.inc||null, bw:bwMode(planEx), bar:barOf(planEx), metric:metricOf(planEx),
    link:!!planEx.link,
    mg:planEx.mg||"", mg2:(planEx.mg2||[]).slice(),
    supplemental:!planId, note:"",
    why:p.why, kind:p.kind,
    lastW:last?num(last.sets[0].w):null, lastR:last?num(last.sets[0].r):null,
    sets:sets
  };
}

      '<div class="acts"><button class="btn sm ghost" data-act="end-deload">End it now</button></div></div>';

      '<div class="hero">'+
        '<div class="daymark"><div class="letter">'+esc(nr.key)+'</div><div class="sub">next</div></div>'+
        '<div class="body"><h2>'+esc(nr.name)+'</h2><div class="exlist">'+esc(names)+'</div></div>'+
      '</div>'+
      '<div style="margin-top:12px">'+
        (nr.exercises.length
          ? '<button class="btn primary big block" data-act="start" data-id="'+nr.id+'">Start '+esc(nr.name)+'</button>'
          : '<button class="btn primary big block" data-act="tab" data-tab="plan">Set up '+esc(nr.name)+'</button>')+
      '</div>'+
      '<div class="daypicks">'+
        S.routines.filter(function(r){ return r.id!==nr.id; }).map(function(r){
          return '<button class="daypick" data-act="start" data-id="'+r.id+'"><span class="k">'+esc(r.key)+'</span>'+esc(r.name)+'</button>';
        }).join("")+
        '<button class="daypick" data-act="start" data-id=""><span class="k">+</span>Freestyle</button>'+
      '</div>'+
    '</div>';
  } else {
    html+='<div class="card"><div class="empty">No training days yet.<br>Set up your split in <b>Plan</b>.</div>'+
      '<button class="btn primary block" data-act="tab" data-tab="plan">Build my split</button></div>';
  }

  /* The disaster-recovery moment. A new phone or a cleared browser lands on a
     stock split with empty days — not on "no routines" — so this keys off
     having no data anywhere. A backup file is no use if nothing offers to
     read it back. */
  var fresh=!S.sessions.length&&!S.routines.some(function(r){ return r.exercises.length; });
  if(fresh){
    html+='<div class="card"><div class="eyebrow">Been here before?</div>'+
      '<div class="tiny muted" style="margin:6px 0 10px">'+
        'New phone, or cleared your browser? Your exported file goes straight back in.</div>'+
      '<button class="btn ghost block" data-act="import">Restore from a backup</button></div>';
  }

  var last=S.sessions[0];
  if(last){
    var vol=0,sets=0;
    last.exercises.forEach(function(e){ vol+=exVolume(e); sets+=working(e.sets).length; });
    html+='<div class="card">'+
      '<div class="row"><div class="eyebrow">Last session</div><div style="flex:1"></div>'+
      '<span class="tiny muted">'+esc(relDate(last.ts))+'</span></div>'+
      '<div class="row" style="margin-top:8px">'+
        '<div><div class="num" style="font-size:19px;font-weight:700">'+esc(last.key)+'</div><div class="tiny muted">'+esc(last.name)+'</div></div>'+
        '<div style="margin-left:auto;text-align:right">'+
          '<div class="num" style="font-size:19px;font-weight:700">'+commas(vol)+'</div>'+
          '<div class="tiny muted">'+unit()+' volume · '+plural(sets,"set")+'</div>'+
        '</div>'+

  var d=deloadCheck();
  if(d&&d.level==="high"){
    html+='<div class="banner warn"><div class="bt">Deload worth considering</div>'+
      '<div class="bd">'+d.stalled.length+' of '+d.judged+' tracked lifts have stopped climbing.</div>'+
      '<div class="acts"><button class="btn sm primary" data-act="start-deload">Start deload week</button>'+
      '<button class="btn sm ghost" data-act="snooze-deload">Not now</button></div></div>';
  }
  if(backupDue()){
    html+='<button class="banner info" style="width:100%" data-act="backup"><div class="bt">Back up your log</div>'+
      '<div class="bd">'+(S.settings.lastBackup?"Last copy "+relDate(S.settings.lastBackup)+". ":"")+
      'One tap sends a file to Drive, Files, or anywhere else.</div></button>';
  }
  return html+'</div>';
}

function backupDue(){
  if(S.sessions.length<6) return false;
  var since=S.sessions.filter(function(s){ return s.ts>(S.settings.lastBackup||0); }).length;
  return since>=8||(Date.now()-(S.settings.lastBackup||0))>28*864e5;
}

function exerciseCard(ex,ei){
  var best=bestScore(ex.name);
  var last=lastPerf(ex.name);
  var t=trend(ex.name);
  var mode=bwMode(ex);
  var met=metricOf(ex);
  var range=(ex.repTop>ex.reps?(ex.reps+"–"+ex.repTop):String(ex.targetReps))+metricSuffix(met);
  var nWork=working(ex.sets).length;
  var gtag=groupTag(S.active.exercises,ei);

  var html='<section class="card ex" data-ei="'+ei+'">'+
    '<div class="ex-head"><div class="t">'+
      '<div class="ex-name">'+(gtag?'<span class="gtag">'+esc(gtag)+'</span>':"")+esc(ex.name)+'</div>'+
      '<div class="ex-meta">'+
        '<span>'+nWork+' × '+esc(range)+(ex.repTop>ex.reps?" range":" target")+'</span>'+
        (met?'<span class="chip tag">'+(met===1?"TIME":"DISTANCE")+'</span>':"")+
        (mode===1?'<span class="chip tag">BODYWEIGHT</span>':mode===2?'<span class="chip tag">ASSISTED</span>':"")+
        (ex.supplemental?'<span class="chip tag">EXTRA</span>':"")+
        (t.state==="down"?'<span class="chip bad tag">SLIPPING</span>':
         t.state==="flat"?'<span class="chip tag">FLAT</span>':
         t.state==="up"?'<span class="chip good tag">CLIMBING</span>':"")+
      '</div>'+
    '</div><button class="kebab" data-act="ex-menu" data-ei="'+ei+'" aria-label="Exercise options">⋯</button></div>';

  html+='<div class="callout">';
  if(last){
    var summary=last.sets.map(function(s){ return entryText(s,last.bw||mode)+metricJoin(met)+num(s.r)+metricSuffix(met); }).join("  ");
    var first=working(ex.sets)[0];
    var differs=ex.lastW!==null&&first&&(num(first.w)!==ex.lastW||num(first.r)!==ex.lastR);
    html+='<div class="lastrow"><span>'+esc(relDate(last.ts))+'</span>'+
      '<span class="num">'+esc(summary)+'</span>'+
      (differs?'<button class="revert" data-act="revert" data-ei="'+ei+'">Keep '+esc(entryText({w:ex.lastW},mode))+metricJoin(met)+ex.lastR+metricSuffix(met)+'</button>':"")+
    '</div>';
  } else {
    html+='<div class="lastrow"><span>First time logging this one.</span></div>';
  }
  if(ex.why){
    var glyph=ex.kind==="up"?"↑":ex.kind==="reps"?"+1":ex.kind==="deload"?"↓":"=";
    html+='<div class="why '+esc(ex.kind)+'"><span class="mark">'+glyph+'</span><span>'+esc(ex.why)+'</span></div>';
  }
  html+='</div>';

  html+='<div class="sets">';
  var wi=0;
  ex.sets.forEach(function(s,si){
    if(!s.warm) wi++;
    html+='<div class="set'+(s.warm?" warm":"")+(s.done?" done":"")+(s.done&&s.pr?" pr":"")+'" data-ei="'+ei+'" data-si="'+si+'">'+
      '<button class="idx" data-act="warm" aria-label="'+(s.warm?"Make this a working set":"Make this a warm-up")+'">'+(s.warm?"W":wi)+'</button>'+
      '<div class="grp">'+
        '<button data-act="step" data-f="w" data-d="-1" aria-label="Less weight">−</button>'+
        '<input inputmode="decimal" enterkeyhint="done" type="number" step="any" data-f="w" value="'+esc(s.w)+'" placeholder="'+esc(mode===1?"+":mode===2?"−":unit())+'" aria-label="Weight">'+
        '<button data-act="step" data-f="w" data-d="1" aria-label="More weight">+</button>'+
      '</div>'+
      '<span class="times">'+metricJoin(met)+'</span>'+
      '<div class="grp">'+
        '<button data-act="step" data-f="r" data-d="-1" aria-label="Less">−</button>'+
        '<input inputmode="numeric" enterkeyhint="done" type="number" step="1" data-f="r" value="'+esc(s.r)+'" placeholder="'+esc(metricShort(met))+'" aria-label="'+esc(metricNoun(met))+'">'+
        '<button data-act="step" data-f="r" data-d="1" aria-label="More">+</button>'+
      '</div>'+
      (s.pr?'<span class="prtag">PR</span>':"")+
      '<button class="tick" data-act="toggle" aria-label="Log set">'+ICON.check+'</button>'+
      '<div class="plates">'+rowExtras(ex,s)+'</div>'+
    '</div>';
  });
  html+='</div>';

  html+='<div class="ex-foot">'+
    '<button class="btn sm ghost" data-act="add-set" data-ei="'+ei+'">+ Set</button>'+
    (nWork>1?'<button class="btn sm ghost" data-act="del-set" data-ei="'+ei+'">− Set</button>':"")+
    (best?'<span class="chip mono" style="margin-left:auto">'+esc(scoreLabel(met))+' '+Math.round(best)+'</span>':"")+
  '</div></section>';
  return html;
}

/* ---- surgical updates: the logging path never rebuilds the page, so the
        soft keyboard and the browser's touch targets stay put ---- */
function refreshSetRow(ei,si){
  var row=$('.set[data-ei="'+ei+'"][data-si="'+si+'"]');
  if(!row) return;
  var st=S.active.exercises[ei].sets[si];
  row.classList.toggle("done",!!st.done);
  row.classList.toggle("pr",!!(st.done&&st.pr));
  var tag=$(".prtag",row);
  if(st.done&&st.pr&&!tag){
    var el=document.createElement("span");
    el.className="prtag"; el.textContent="PR";
    row.insertBefore(el,$(".tick",row));
  } else if((!st.done||!st.pr)&&tag){ tag.remove(); }
  refreshPlates(ei,si,row);
}
/* Weight changed, so the plate breakdown did too. Writes into the existing
   .plates node — the node itself is never replaced, and it can't take a tap. */
function refreshPlates(ei,si,row){
  row=row||$('.set[data-ei="'+ei+'"][data-si="'+si+'"]');
  if(!row) return;
  var el=$(".plates",row);
  if(!el) return;
  var ex=S.active.exercises[ei];
  el.innerHTML=rowExtras(ex,ex.sets[si]);
}
function refreshSummary(){
  var el=$("#sess-summary");
  if(!el||!S.active) return;
  var ds=0,vol=0;
  S.active.exercises.forEach(function(e){
    var mode=bwMode(e);
    e.sets.forEach(function(s){
      if(!s.done||s.warm) return;
      ds++; vol+=effLoad(s.w,mode)*num(s.r);
    });
  });
  el.innerHTML='<span class="num">'+plural(ds,"set")+'</span><span>·</span>'+
               '<span class="num">'+commas(vol)+' '+unit()+' volume</span>';
}

/* ---- interactions ---- */
$("#view").addEventListener("click",function(e){
  var t=e.target;

  var tabBtn=t.closest('[data-act="tab"]');
  if(tabBtn){ go(tabBtn.dataset.tab); return; }
  if(t.closest('[data-act="backup"]')){ backupSheet(); return; }
  /* Also reachable from Today's empty state — the Plan listener never sees it. */
  if(t.closest('[data-act="import"]')){ doImport(); return; }
  if(t.closest('[data-act="start-deload"]')){
    startDeloadWeek(7); render(); toast("Deload week started"); return;
  }
  if(t.closest('[data-act="snooze-deload"]')){
    S.settings.deloadSnooze=Date.now()+14*864e5; writeNow(); render(); toast("Muted for two weeks"); return;
  }
  if(t.closest('[data-act="end-deload"]')){ endDeloadWeek(); render(); toast("Back to normal"); return; }

  var startBtn=t.closest('[data-act="start"]');
  if(startBtn){
    startSession(S.routines.find(function(x){ return x.id===startBtn.dataset.id; })||null);
    return;
  }
  if(!S.active) return;

  var step=t.closest('[data-act="step"]');
  if(step){
    var row=step.closest(".set");
    var f=step.dataset.f, d=num(step.dataset.d);
    var ex=S.active.exercises[+row.dataset.ei], st=ex.sets[+row.dataset.si];
    var by=f==="w"?stepFor(ex):metricStep(metricOf(ex));
    st[f]=String(Math.max(0,round(num(st[f])+d*by,2)));
    $('input[data-f="'+f+'"]',row).value=st[f];
    if(st.done){ st.load=effLoad(st.w,bwMode(ex)); refreshSummary(); }
    if(f==="w") refreshPlates(+row.dataset.ei,+row.dataset.si,row);
    buzz(8); save(); return;
  }

  var tick=t.closest('[data-act="toggle"]');
  if(tick){
    var r2=tick.closest(".set");
    toggleSet(+r2.dataset.ei,+r2.dataset.si);
    return;
  }

  var rp=t.closest('[data-act="rpe"]');
  if(rp){
    var rrow=rp.closest(".set");
    rpeSheet(+rrow.dataset.ei,+rrow.dataset.si);
    return;
  }
  var wm=t.closest('[data-act="warm"]');
  if(wm){
    var r3=wm.closest(".set");
    var ex5=S.active.exercises[+r3.dataset.ei], st5=ex5.sets[+r3.dataset.si];
    st5.warm=!st5.warm;
    if(st5.warm) st5.pr=false;
    save(); viewToday(); refreshSummary();
    toast(st5.warm?"Marked as a warm-up":"Back to a working set");
    return;
  }

  var rev=t.closest('[data-act="revert"]');
  if(rev){
    var ex2=S.active.exercises[+rev.dataset.ei];
    ex2.sets.forEach(function(s){ if(!s.done&&!s.warm){ s.w=String(ex2.lastW); s.r=String(ex2.lastR); } });
    save(); viewToday(); refreshSummary();
    toast("Back to "+entryText({w:ex2.lastW},bwMode(ex2))+" × "+ex2.lastR);
    return;
  }

  var addSet=t.closest('[data-act="add-set"]');
  if(addSet){
    var ex3=S.active.exercises[+addSet.dataset.ei];
    var w3=working(ex3.sets);
    var lastS=w3[w3.length-1]||{w:"",r:ex3.targetReps};
    ex3.sets.push({w:lastS.w,r:lastS.r,done:false});
    save(); viewToday(); refreshSummary(); return;
  }
  var delSet=t.closest('[data-act="del-set"]');
  if(delSet){
    var ex4=S.active.exercises[+delSet.dataset.ei];
    for(var i=ex4.sets.length-1;i>=0;i--){
      if(!ex4.sets[i].warm){ ex4.sets.splice(i,1); break; }
    }
    save(); viewToday(); refreshSummary(); return;
  }
  var exMenu=t.closest('[data-act="ex-menu"]');
  if(exMenu){ exerciseMenu(+exMenu.dataset.ei); return; }

  if(t.closest('[data-act="add-ex"]')){ pickExercise(); return; }
  if(t.closest('[data-act="finish"]')){ finishSheet(); return; }
  if(t.closest('[data-act="discard"]')){
    confirmSheet("Discard this session?","Nothing gets saved to your history.","Discard",function(){
      S.active=null; stopRest(); save(); render();
    },true);
  }
});

$("#view").addEventListener("input",function(e){

    var row=inp.closest(".set");

    st[inp.dataset.f]=inp.value;

    if(inp.dataset.f==="w") refreshPlates(+row.dataset.ei,+row.dataset.si,row);
    save();

function toggleSet(ei,si){
  var ex=S.active.exercises[ei], st=ex.sets[si];
  if(st.done){
    st.done=false; st.pr=false; delete st.load;
    save(); refreshSetRow(ei,si); refreshSummary(); return;
  }
  if(!num(st.r)){ toast("Add reps first"); return; }
  st.done=true; st.ts=Date.now();
  st.load=effLoad(st.w,bwMode(ex));
  if(st.warm){ st.pr=false; }
  else {
    /* A PR has to beat the history and everything already done today. */
    var met=metricOf(ex);
    var histBest=bestScore(ex.name), bar=histBest;
    ex.sets.forEach(function(o,i){ if(o.done&&!o.warm&&i!==si) bar=Math.max(bar,setScore(o,met)); });
    st.pr=setScore(st,met)>0&&histBest>0&&setScore(st,met)>bar+0.01;
  }
  buzz(14);
  if(S.settings.autoRest&&lastInGroup(S.active.exercises,ei)) startRest(S.settings.rest);
  save();
  refreshSetRow(ei,si); refreshSummary();
  if(st.pr) toast("New PR on "+ex.name);
}

   log a set would break the one-tap rule outright. Off by default. */
var RPE_SCALE=[10,9.5,9,8.5,8,7.5,7,6.5,6];

  if(v>=10) return "nothing left";
  if(v>=9.5) return "maybe half a rep left";
  var rir=Math.round((10-v)*2)/2;
  return fmt(rir)+" rep"+(rir===1?"":"s")+" in reserve";
}

    '<div class="sub">'+esc(ex.name)+' · set '+(si+1)+'. Optional — it only changes what gets prescribed if you log it.</div>'+
    '<div class="picklist">'+RPE_SCALE.map(function(v){
      return '<button data-rpe="'+v+'"'+(num(st.rpe)===v?' style="background:var(--panel-2)"':"")+'>'+
        '<b>RPE '+fmt(v)+'</b><span class="h">'+esc(rpeHelp(v))+'</span></button>';
    }).join("")+'</div>'+
