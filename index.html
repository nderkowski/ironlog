function commitEdit(){
  var d=draft;
  if(!d) return;
  /* What bodyweight this session was logged at. `load` is resolved once, at
     log time, precisely so that changing your bodyweight later can't rewrite
     history — but sessions predating the d.bw snapshot have no record of it,
     and the editor used to fill that gap with TODAY's bodyweight. Editing the
     note on a months-old weighted pull-up silently moved every load in it.

     An untouched set still carries the load it was logged with, so the
     session's own bodyweight can be read back out of it. */
  function readBackBw(){
    var found=0;
    d.exercises.forEach(function(e){
      var mode=bwMode(e);
      if(found||!mode) return;
      e.sets.forEach(function(s){
        if(found||s.w0===undefined||s.w0!==s.w||!(num(s.load)>0)) return;
        found=mode===1?num(s.load)-num(s.w):num(s.load)+num(s.w);
      });
    });
    return found;
  }
  var known=(d.bw!==undefined&&num(d.bw)>0)?num(d.bw):readBackBw();
  var sbw=known||num(S.settings.bodyweight);
  /* Backfill only what was actually read back — writing today's bodyweight
     onto an old session would be inventing the very number this is protecting. */
  if(d.bw===undefined&&known>0) d.bw=known;

  /* Drop empty sets and empty exercises, resolve loads, then re-sort. */
  d.exercises.forEach(function(e){
    var mode=bwMode(e);
    e.sets=e.sets.filter(function(s){ return num(s.r)>0; });
    e.sets.forEach(function(s){
      var edited=s.w0===undefined||s.w0!==s.w;
      delete s.w0;
      s.done=true;
      /* Only a weight you actually changed gets re-resolved, and even then
         against this session's bodyweight rather than today's. */
      if(edited||!(num(s.load)>0)) s.load=effLoad(s.w,mode,sbw);
    });
  });
  d.exercises=d.exercises.filter(function(e){ return e.sets.length; });

  var i=S.sessions.findIndex(function(x){ return x.id===d.id; });
  if(i<0){ draft=null; closeSheet(); return; }
  S.sessions[i]=d;
  S.sessions.sort(function(a,b){ return b.ts-a.ts; });
  recomputePRs();
  writeNow();
  draft=null;
  closeSheet(); render();
  toast("Session updated");
}

/* ============================ PLAN ============================ */
var editingRoutine=null, editingVariant=0;

/* Which week the Plan tab is showing per day. Defaults to whatever is next, so
   opening Plan shows the session you are about to do rather than week 1
   forever. Reset on re-entering the tab, like the calendar's month. */
var PLANVAR={};
function shownVariant(r){
  var vs=variantsOf(r);
  var ix=PLANVAR[r.id];
  if(ix===undefined||ix>=vs.length) ix=nextVariantIx(r);
  return Math.max(0,Math.min(ix,vs.length-1));
}
/* Lifts that appear in this week only, and so come round fortnightly. */
function soloLifts(r,vi){
  var others={};
  variantsOf(r).forEach(function(v,i){
    if(i===vi) return;
    v.exercises.forEach(function(e){ others[normName(e.name)]=1; });
  });
  return planExOf(r,vi).filter(function(e){ return !others[normName(e.name)]; });
}
/* Adding a week to a day. A copy is the common case — an alternate week is
   usually a variation on the one you have — but starting empty is one tap
   away rather than a delete-everything chore. */
function addVariant(ri,copy){
  var r=S.routines[ri]; if(!r) return;
  var vs=variantsOf(r);
  if(!vs[0].label) vs[0].label="Week 1";
  var src=copy?planExOf(r,shownVariant(r)):[];
  var v=newVariant("Week "+(vs.length+1),src.map(function(e){
    return Object.assign({},e,{id:uid(),mg2:(e.mg2||[]).slice()});
  }));
  vs.push(v);
  PLANVAR[r.id]=vs.length-1;
  writeNow(); viewPlan();
  toastUndo(v.label+" added to "+r.name,function(){
    var i=vs.indexOf(v);
    if(i>=0) vs.splice(i,1);
    if(vs.length===1&&vs[0].label==="Week 1") vs[0].label="";
    delete PLANVAR[r.id];
    writeNow(); if(TAB==="plan") viewPlan();
    toast(v.label+" removed");
  });
}

/* Exercises that add weight the moment you hit the target, in a plan whose
   stated default is double progression. Almost always because they predate the
   feature: the switch has only ever set a default for *new* exercises, so a
   plan carried forward from an older version never got a range and nothing
   ever said so. */
function straightSetLifts(){
  var out=[];
  eachPlanEx(function(e,r){ if(!(num(e.repTop)>num(e.reps))) out.push({r:r,e:e}); });
  return out;
}
function rangeTiersHint(){
  if(!S.settings.doubleDefault) return "The rep target new exercises start at";
  var h=defaultRange("Barbell Bench Press",0), i=defaultRange("Cable Curl",0);
  return "For compounds. Heavy lifts start at "+h.low+"–"+h.top+
         ", isolation at "+i.low+"–"+i.top+", timed holds at 30–60s.";
}
/* Fit a range onto exercises that have none. The bottom is left exactly where
   it is — it is what you already train at, and moving it would silently change
   the programme — so only the reps-first room on top is added. */
function applyRanges(){
  var undo=[], n=0;
  function fit(e){
    undo.push({e:e, repTop:e.repTop});
    e.repTop=Math.max(1,num(e.reps))+rangeWidth(e.name,metricOf(e));
  }
  straightSetLifts().forEach(function(p){ fit(p.e); n++; });
  /* A workout already in progress holds its own copy of every exercise, and
     would otherwise keep showing the old mode until it was finished. */
  if(S.active) S.active.exercises.forEach(function(x){
    if(num(x.repTop)>num(x.reps)) return;
    var known=false;
    eachPlanEx(function(e){ if(normName(e.name)===normName(x.name)) known=true; });
    if(known) fit(x);
  });
  writeNow(); render();
  toastUndo(plural(n,"exercise")+" now climb reps first",function(){
    undo.forEach(function(u){ u.e.repTop=u.repTop; });
    writeNow(); render();
    toast("Rep ranges put back");
  });
}

/* ---- settings ----
   These lived at the foot of the Plan tab, below the split, where the list you
   scrolled past to reach them had nothing to do with them. Progression stayed
   behind with the split it shapes; everything else is here. */
function settingsSummary(){
  var bits=[unit(), S.settings.rest+"s rest"];
  if(S.settings.sound) bits.push("alarm on");
  if(S.settings.autoBackup) bits.push("auto-backup");
  return bits.join(" · ");
}
/* These rows live on the Settings screen but a few are still reachable from
   Plan, so anything that re-renders after changing one has to route rather
   than assume. */
function viewPrefs(){ if(TAB==="settings") viewSettings(); else viewPlan(); }
function viewSettings(){
  var v=$("#view");
  /* "This device" rather than a restatement of the brand: settings and the log
     are both keyed to this origin on this phone, which is worth saying where
     someone is about to change one. */
  var html='<div class="eyebrow">This device</div><h1 class="view-title">Settings</h1><div class="stack">';
  html+='<div class="eyebrow">Session</div><div class="card">'+
    '<div class="field-row"><div class="fl">Units</div>'+
      '<select class="txt" style="width:96px" data-set="unit">'+
        '<option value="lb"'+(unit()==="lb"?" selected":"")+'>lb</option>'+
        '<option value="kg"'+(unit()==="kg"?" selected":"")+'>kg</option></select></div>'+
    '<div class="field-row"><div class="fl">Your bodyweight<div class="fh">Used to score pull-ups, dips and assisted work</div></div>'+
      '<input class="txt small" inputmode="decimal" type="number" step="any" data-set="bodyweight" value="'+(S.settings.bodyweight||"")+'"></div>'+
    '<div class="field-row"><div class="fl">Rest timer<div class="fh">Seconds after each logged set</div></div>'+
      '<input class="txt small" inputmode="numeric" type="number" data-set="rest" value="'+esc(S.settings.rest)+'"></div>'+
    '<div class="field-row"><div class="fl">Start rest automatically</div>'+
      '<button class="switch'+(S.settings.autoRest?" on":"")+'" data-set="autoRest"></button></div>'+
    '<div class="field-row"><div class="fl">Vibrate<div class="fh">On logging a set and when rest ends</div></div>'+
      '<button class="switch'+(S.settings.buzz?" on":"")+'" data-set="buzz"></button></div>'+
    '<div class="field-row"><div class="fl">Alarm when rest ends'+
      '<div class="fh">Beeps out loud, and keeps the timer running with the screen off</div></div>'+
      '<button class="switch'+(S.settings.sound?" on":"")+'" data-set="sound"></button></div>'+
    '<div class="field-row"><div class="fl">Rate sets (RPE)'+
      '<div class="fh">Adds an optional tag after you log a set. A hard week then holds the weight instead of adding.</div></div>'+
      '<button class="switch'+(S.settings.rpe?" on":"")+'" data-set="rpe"></button></div>'+
    '<div class="field-row"><div class="fl">Keep-alive tone during rests'+
      '<div class="fh">'+(S.settings.keepTone
        ? '<span style="color:var(--bad)">Guarantees the alarm, but Android mutes your music for the whole rest.</span>'
        : "Off — your music plays untouched. If an alarm ever arrives late, the app will offer to turn this on.")+'</div></div>'+
      '<button class="switch'+(S.settings.keepTone?" on":"")+'" data-set="keepTone"></button></div>'+
    '<div class="field-row"><div class="fl">Back up after every workout'+
      '<div class="fh">Writes a file to your downloads when you tap Save workout. No extra tap, and it is the only backup that can\'t be forgotten.</div></div>'+
      '<button class="switch'+(S.settings.autoBackup?" on":"")+'" data-set="autoBackup"></button></div>'+
    '<div class="field-row"><div class="fl">Test the alarm with the screen off'+
      '<div class="fh">Runs a 20-second rest and reports whether the phone kept the timer alive</div></div>'+
      '<button class="btn sm ghost" data-act="bgtest">Test</button></div>'+
    '<div class="field-row"><div class="fl">Notify when rest ends'+
      '<div class="fh">'+(notifyState()==="denied"
        ? '<span style="color:var(--bad)">Blocked in your browser settings for this site</span>'
        : notifyState()==="none"
          ? "This browser can't show notifications"
          : "Shows up on the lock screen. Needs permission.")+'</div></div>'+
      '<button class="switch'+(S.settings.notify?" on":"")+'" data-act="toggle-notify"></button></div>'+
  '</div>';

  html+='<div class="eyebrow" style="margin:6px 0 0">Barbell</div><div class="card">'+
    '<div class="field-row"><div class="fl">Bar weight<div class="fh">Used for new barbell exercises. Set it per exercise in its ⋯ menu.</div></div>'+
      '<input class="txt small" inputmode="decimal" type="number" step="any" data-set="bar" value="'+esc(S.settings.bar||"")+'"></div>'+
    '<div class="field-row" style="display:block">'+
      '<div class="fl">Plates you own<div class="fh">Counted in pairs — one for each side.</div></div>'+
      '<div class="plate-ed">'+
        (S.settings.plates||[]).map(function(p,i){
          return '<div class="pr-row">'+
            '<input class="txt" inputmode="decimal" type="number" step="any" data-pw="'+i+'" value="'+esc(p.w)+'">'+
            '<span class="x">'+esc(unit())+' ×</span>'+
            '<input class="txt" style="width:60px" inputmode="numeric" type="number" data-pn="'+i+'" value="'+esc(p.n)+'">'+
            '<span class="x">pairs</span><span class="sp"></span>'+
            '<button class="rm" data-act="plate-rm" data-i="'+i+'" aria-label="Remove this plate">✕</button>'+
          '</div>';
        }).join("")+
      '</div>'+
      '<div class="row" style="gap:8px;margin-top:8px">'+
        '<button class="btn sm ghost" style="flex:1" data-act="plate-add">+ Add a size</button>'+
        '<button class="btn sm ghost" style="flex:1" data-act="plate-reset">Reset to '+esc(unit())+'</button>'+
      '</div>'+
    '</div>'+
  '</div>';

  html+='<div class="eyebrow" style="margin:6px 0 0">Workout plan</div><div class="card"><div class="stack">'+
    planSettingsHtml()+'</div></div>';

  html+='<div class="eyebrow" style="margin:6px 0 0">Data</div><div class="card"><div class="stack">'+
    '<div class="tiny muted" id="storage-status">'+esc(storageLine())+'</div>'+
    '<div class="tiny muted">Your log lives in this browser on this device. It only leaves it when you back it up to GitHub below, or send a file out.'+
    (S.settings.lastBackup?' Last copy '+relDate(S.settings.lastBackup)+'.':' No copy yet.')+'</div>'+
    '<button class="btn primary block" data-act="backup">Save a file copy</button>'+
    '<div class="row" style="gap:8px">'+
      '<button class="btn" style="flex:1" data-act="export">Export file</button>'+
      '<button class="btn" style="flex:1" data-act="import">Import</button>'+
    '</div>'+
    '<button class="btn danger block" data-act="wipe">Erase everything</button>'+
  '</div></div>';


  html+='<div class="eyebrow" style="margin:6px 0 0">GitHub backup</div><div class="card"><div class="stack">'+
    gistSettingsHtml()+'</div></div>';

  html+='<div class="eyebrow" style="margin:6px 0 0">AI coach</div><div class="card"><div class="stack">'+
    aiSettingsHtml()+'</div></div>';

  html+='<div class="eyebrow" style="margin:6px 0 0">About</div><div class="card">'+
    '<div class="field-row"><div class="fl">Version<div class="fh">Also printed at the foot of the Plan tab — check it on the device before believing any bug report</div></div>'+
      '<span class="chip mono">'+esc(BUILD)+'</span></div>'+
    '<div class="field-row"><div class="fl">Logged<div class="fh">Everything lives in this browser, on this device</div></div>'+
      '<span class="chip mono">'+plural(S.sessions.length,"session")+'</span></div>'+
  '</div>';

  v.innerHTML=html+'</div>';
}

function viewPlan(){
  var v=$("#view");
  var html='<div class="eyebrow">Your split</div><h1 class="view-title">Plan</h1><div class="stack">';

  S.routines.forEach(function(r,ri){
    var vs=variantsOf(r);
    var vi=shownVariant(r);
    var list=planExOf(r,vi);
    html+='<section class="card" style="padding:0">'+
      '<div class="ex-head" style="align-items:center">'+
        '<div class="daymark" style="width:40px;height:40px;flex:0 0 auto"><div class="letter" style="font-size:18px">'+esc(r.key)+'</div></div>'+
        '<div class="t" style="margin-left:2px"><div class="ex-name" style="font-size:15px">'+esc(r.name)+'</div>'+
        '<div class="ex-meta">'+plural(list.length,"exercise")+
          (vs.length>1?' · next up: '+esc(variantLabel(r,nextVariantIx(r))):"")+'</div></div>'+
        '<button class="kebab" data-act="day-menu" data-ri="'+ri+'" aria-label="Day options">⋯</button>'+
      '</div>';
    /* One segmented control per day, only once there is more than one week to
       choose between — a solitary "Week 1" tab is noise. */
    if(vs.length>1){
      html+='<div class="vseg">'+vs.map(function(v,i){
        return '<button'+(i===vi?' class="on"':"")+' data-act="pex-var" data-ri="'+ri+'" data-vi="'+i+'">'+
          esc(variantLabel(r,i))+'</button>';
      }).join("")+'</div>';
    }
    list.forEach(function(e,ei){
      /* Compact here on purpose. "straight" spells out the mode on the session
         card, where the confusion actually happened and there is room for it;
         in this row it costs more width than the muscle tag, and at 320px
         something has to give. The Progression banner above names every
         straight-sets exercise outright, which beats a word per row. */
      var range=e.repTop>e.reps?(e.reps+"–"+e.repTop):String(e.reps);
      var mode=bwMode(e);
      html+='<div class="pex">'+
        '<span class="pxn">'+(groupTag(list,ei)?'<span class="gtag">'+esc(groupTag(list,ei))+'</span>':"")+esc(e.name)+(mode?' <span class="chip tag">'+(mode===1?"BW":"ASST")+'</span>':"")+
          (!mode&&barOf(e)?' <span class="chip tag">BAR '+fmt(barOf(e))+'</span>':"")+'</span>'+
        '<span class="pxs">'+esc(muscleName(tagsOf(e).mg)||"?")+' · '+e.sets+'×'+esc(range)+'</span>'+
        '<button class="iconbtn" data-act="pex-up" data-ri="'+ri+'" data-vi="'+vi+'" data-ei="'+ei+'" aria-label="Move up">↑</button>'+
        '<button class="iconbtn" data-act="pex-edit" data-ri="'+ri+'" data-vi="'+vi+'" data-ei="'+ei+'" aria-label="Edit">⋯</button>'+
      '</div>';
    });
    if(!list.length) html+='<div class="empty" style="padding:14px">No exercises yet.</div>';
    /* Honest about the cost of splitting a day in two: a lift that appears in
       only one week is trained fortnightly, and trend() needs 4 sessions. */
    var solo=vs.length>1?soloLifts(r,vi).length:0;
    if(solo){
      html+='<div class="tiny muted" style="padding:0 14px 10px">'+
        (solo===1?"1 lift here runs":solo+" lifts here run")+
        ' only in this week — fortnightly rather than weekly, so trends take about twice as long to appear.</div>';
    }
    html+='<div class="ex-foot"><button class="btn sm ghost" data-act="pex-add" data-ri="'+ri+'" data-vi="'+vi+'">+ Add exercise</button>'+
      (vs.length>1?"":'<button class="btn sm ghost" data-act="var-add" data-ri="'+ri+'">+ Alternate week</button>')+
      '</div></section>';
  });

  html+='<div class="row" style="gap:8px">'+
    '<button class="btn ghost" style="flex:1" data-act="day-add">+ Training day</button>'+
    '<button class="btn ghost" style="flex:1" data-act="tpl">Start from a template</button>'+
  '</div>';

  html+='<hr class="sep"><div class="eyebrow" style="margin-bottom:8px">Progression</div><div class="card">';

  /* The switch below has only ever applied to exercises made *after* it was
     turned on, so a plan built before rep ranges existed keeps adding weight
     the moment you hit the target — and nothing said so. This offers the fix
     for the exercises already in the plan. */
  var ss=S.settings.doubleDefault?straightSetLifts():[];
  if(ss.length&&!S.settings.rangeFixHidden){
    var shown=ss.slice(0,3).map(function(p){ return p.e.name; }).join(", ");
    html+='<div class="banner warn" style="margin:0 0 10px">'+
      '<div class="bt">'+plural(ss.length,"exercise")+' still on straight sets</div>'+
      '<div class="bd">'+esc(shown)+(ss.length>3?" and "+(ss.length-3)+" more":"")+
        ' add weight as soon as you hit the target, instead of climbing reps first.'+
        ' The switch below only ever applied to new exercises, so anything in your'+
        ' plan from before it never got a range.</div>'+
      '<div class="acts"><button class="btn sm primary" data-act="fix-ranges">Give them rep ranges</button>'+
      '<button class="btn sm ghost" data-act="hide-fix">Leave them</button></div></div>';
  }

  html+='<div class="field-row"><div class="fl">Double progression by default<div class="fh">New exercises climb by reps first, then weight</div></div>'+
      '<button class="switch'+(S.settings.doubleDefault?" on":"")+'" data-set="doubleDefault"></button></div>'+
    '<div class="field-row"><div class="fl">Default rep range'+
      '<div class="fh">'+esc(rangeTiersHint())+'</div></div>'+
      '<div class="row" style="gap:6px">'+
        '<input class="txt tiny-n" inputmode="numeric" type="number" data-set="repLow" value="'+esc(S.settings.repLow)+'">'+
        '<span class="muted tiny">to</span>'+
        '<input class="txt tiny-n" inputmode="numeric" type="number" data-set="repHigh" value="'+esc(S.settings.repHigh)+'">'+
      '</div></div>'+
    '<div class="field-row"><div class="fl">Default weight step<div class="fh">Used by ± and by the weight jumps</div></div>'+
      '<input class="txt small" inputmode="decimal" type="number" step="any" data-set="inc" value="'+esc(S.settings.inc)+'"></div>'+
    '<div class="field-row"><div class="fl">Deload week'+
      '<div class="fh">'+(inDeloadWeek()
        ? "Running through "+esc(shortDate(S.settings.deloadUntil))+" — light prescriptions, excluded from trends"
        : "Light and short on purpose, and invisible to the trend maths")+'</div></div>'+
      (inDeloadWeek()
        ? '<button class="btn sm ghost" data-act="end-deload">End</button>'
        : '<button class="btn sm" data-act="start-deload">Start</button>')+'</div>'+
  '</div>';

  /* Progression stays here: rep ranges and the deload window shape the split
     they sit under, and separating cause from effect is what made the
     doubleDefault bug invisible. Everything else moved behind the gear. */
  html+='<button class="card" style="width:100%;text-align:left;margin:6px 0 0" data-act="settings">'+
    '<div class="row" style="align-items:center"><div>'+
      '<div class="ex-name" style="font-size:15px">Settings</div>'+
      '<div class="ex-meta"><span>'+esc(settingsSummary())+'</span></div></div>'+
    '<div style="flex:1"></div><span class="muted" style="font-size:20px">\u203A</span></div></button>';
  /* The build marker is here because a whole test round was wasted on a phone
     running an older deploy. Check this before believing any bug report. */
  html+='<div class="tiny muted" style="text-align:center;padding:6px 0">'+
    plural(S.sessions.length,"session")+' logged · Iron Log '+esc(BUILD)+'</div>';

  v.innerHTML=html+'</div>';
}

$("#view").addEventListener("click",function(e){
  if(TAB==="progress"){
    var cal=e.target.closest("[data-cal]");
    if(cal){
      /* offset counts backwards, and there is no future to page into */
      calOffset=Math.max(0,calOffset-(+cal.dataset.cal));
      viewProgress(); return;
    }
    var cd=e.target.closest("[data-calday]");
    if(cd){ sessionSheet(cd.dataset.calday); return; }
    if(e.target.closest('[data-act="pr-all"]')){ prSheet(); return; }
    var lb=e.target.closest("[data-lift]");
    if(lb){ liftSheet(lb.dataset.lift); return; }
    var sb=e.target.closest("[data-sess]");
    if(sb){ sessionSheet(sb.dataset.sess); return; }
  }
  /* The settings rows moved to their own screen but kept their handlers, so
     this listener has to answer for both. Miss this and every switch in
     Settings silently does nothing. */
  if(TAB!=="plan"&&TAB!=="settings") return;

  var t=e.target;
  if(t.closest('[data-act="settings"]')){ go("settings"); return; }
  var dm=t.closest('[data-act="day-menu"]');
  if(dm){ dayMenu(+dm.dataset.ri); return; }
  if(t.closest('[data-act="tpl"]')){ templateSheet(); return; }
  if(t.closest('[data-act="day-add"]')){
    var k=String.fromCharCode(65+S.routines.length);
    S.routines.push(newRoutine(k,"Day "+k));
    save(); viewPlan(); return;
  }
  var pv=t.closest('[data-act="pex-var"]');
  if(pv){ PLANVAR[S.routines[+pv.dataset.ri].id]=+pv.dataset.vi; viewPlan(); return; }
  var va=t.closest('[data-act="var-add"]');
  if(va){ variantAddSheet(+va.dataset.ri); return; }
  var pa=t.closest('[data-act="pex-add"]');
  if(pa){ editingRoutine=+pa.dataset.ri; editingVariant=+pa.dataset.vi||0; pickExercise("plan"); return; }
  var pu=t.closest('[data-act="pex-up"]');
  if(pu){
    var list=planExOf(S.routines[+pu.dataset.ri],+pu.dataset.vi), i=+pu.dataset.ei;
    if(i>0){
      var tmp=list[i-1]; list[i-1]=list[i]; list[i]=tmp;
      if(i-1===0) list[0].link=false;          // nothing above to pair with
      save(); viewPlan();
    }
    return;
  }
  var pe=t.closest('[data-act="pex-edit"]');
  if(pe){ planExMenu(+pe.dataset.ri,+pe.dataset.vi,+pe.dataset.ei); return; }

  /* Notifications need a grant, so this switch can't be a plain toggle: it
     only goes on if the browser actually says yes. */
  if(t.closest('[data-act="toggle-notify"]')){
    if(S.settings.notify){ S.settings.notify=false; writeNow(); viewPrefs(); return; }
    askNotify(function(ok,why){
      S.settings.notify=ok; writeNow(); viewPrefs();
      toast(ok?"Rest alerts will show on your lock screen":(why||"Notifications weren't allowed."));
    });
    return;
  }
  if(t.closest('[data-act="bgtest"]')){ bgTestSheet(); return; }
  var pAdd=t.closest('[data-act="plate-add"]');
  if(pAdd){ S.settings.plates.push({w:0,n:1}); save(); viewPrefs(); return; }
  var pRm=t.closest('[data-act="plate-rm"]');
  if(pRm){ S.settings.plates.splice(+pRm.dataset.i,1); save(); viewPrefs(); return; }
  if(t.closest('[data-act="plate-reset"]')){
    S.settings.plates=defaultPlates(unit());
    S.settings.bar=defaultBar(unit());
    save(); viewPrefs(); toast("Back to the standard "+unit()+" set"); return;
  }

  if(t.closest('[data-act="fix-ranges"]')){ applyRanges(); return; }
  if(t.closest('[data-act="hide-fix"]')){ S.settings.rangeFixHidden=true; save(); viewPlan(); return; }

  var sw=t.closest('[data-set]');
  if(sw&&sw.classList.contains("switch")){
    var k2=sw.dataset.set; S.settings[k2]=!S.settings[k2];
    sw.classList.toggle("on",S.settings[k2]); save();
    if(k2==="sound"&&S.settings[k2]) playSrc(audioURLs().alarm,false);   // proves it works
    if(k2==="sound"&&!S.settings[k2]&&!S.settings.notify) audioStop();
    /* Turning it on has to mean something for the plan you already have, not
       just for whatever you add next — so re-offer the repair. */
    if(k2==="doubleDefault"){ S.settings.rangeFixHidden=false; save(); viewPlan(); }
    return;
  }
  var pw=t.closest("[data-pw],[data-pn]");
  if(pw) return;                                  // let the input handler have it
  if(t.closest('[data-act="plan-fixc"]')){
    if(S.active){ toast("Finish or discard the workout first"); return; }
    if(recFixDayC()){ viewSettings(); toast("Day C re-paired"); }
    return;
  }
  if(t.closest('[data-act="plan-rec"]')||t.closest('[data-act="plan-back"]')){
    var back=!!t.closest('[data-act="plan-back"]');
    if(S.active){ toast("Finish or discard the workout first"); return; }
    confirmSheet(back?"Switch back to your previous plan?":"Switch to the recommended plan?",
      back?"Your days go back to how they were before you switched, and rest goes back to "+S.planBackup.rest+" s. Logged sessions are not touched."
          :"Days A, B and C are replaced with the plan above and rest becomes "+REC_PLAN.rest+" s (now "+S.settings.rest+
           " s). Every logged session is kept, with Lateral Riase and the two face-pull spellings merged. You can switch back here at any time.",
      back?"Switch back":"Switch",
      function(){
        if(back) switchBackPlan(); else switchToRecPlan();
        viewSettings();
        var nx=nextRoutine();
        toast((back?"Previous plan restored":"Switched")+(nx?" — "+nx.name+" is next":""));
      });
    return;
  }
  if(t.closest('[data-act="gist-save"]')){ if(gistSaveToken()) viewPrefs(); return; }
  if(t.closest('[data-act="gist-remove"]')){ gistRemoveToken(); viewPrefs(); return; }
  if(t.closest('[data-act="gist-now"]')){ gistNowTap(); return; }
  if(t.closest('[data-act="ai-save"]')){ if(aiSaveTap()) viewSettings(); return; }
  if(t.closest('[data-act="ai-remove"]')){ aiStore({}); aiClientP=null; viewSettings(); toast("Key removed from this browser"); return; }
  if(t.closest('[data-act="ai-test"]')){ aiTestTap(); return; }
  if(t.closest('[data-act="gist-restore"]')){ gistRestore(); return; }
  if(t.closest('[data-act="put-back"]')){ putBackBeforeRestore(); return; }
  if(t.closest('[data-act="export"]')){ doExport(); return; }
  if(t.closest('[data-act="import"]')){ doImport(); return; }
  if(t.closest('[data-act="wipe"]')){
    /* Erase used to be followed, 30 s later, by a push of the empty log over
       the GitHub backup. Now it detaches from the gist first (gistDetach()):
       the backup is kept and never touched, and Restore brings it back. */
    var hasGist=!!gistLoad().token;
    confirmSheet("Erase everything?",
      "Every session, day and setting on this phone is deleted."+
      (hasGist?" Your GitHub backup is kept and not touched: this phone stops backing up to it, and Restore from GitHub brings it back."
              :" Back up first if you want a copy."),
      "Erase",function(){
        S=defaultState(); writeNow(); gistDetach(); go("today"); toast("Wiped clean");
      },true);
  }
});
$("#view").addEventListener("change",function(e){
  var el=e.target.closest("[data-set]");
  if(!el||el.classList.contains("switch")) return;
  var k=el.dataset.set;
  if(k==="unit"){
    var to=el.value;
    if(to===S.settings.unit) return;
    /* Nothing logged and nothing planned means nothing to convert or mislabel,
       so don't make an empty app ask a question it can answer itself. */
    if(!S.sessions.length&&planIsEmpty()&&!S.active){
      S.settings.unit=to;
      S.settings.bar=defaultBar(to); S.settings.plates=defaultPlates(to);
      S.settings.inc=defaultInc(to);
      writeNow(); viewPrefs(); return;
    }
    unitSheet(S.settings.unit,to);
    return;
  }
  S.settings[k]=num(el.value);
  if(k==="rest"&&S.settings.rest<5) S.settings.rest=5;
  if(k==="repLow") S.settings.repLow=Math.max(1,S.settings.repLow);
  if(k==="repHigh") S.settings.repHigh=Math.max(S.settings.repLow,S.settings.repHigh);
  if(k==="bar") S.settings.bar=Math.max(0,S.settings.bar);
  save();
});
/* Plate rows update on input rather than change, so editing the inventory
   never re-renders the list out from under the field you're typing in. */
$("#view").addEventListener("input",function(e){
  if(TAB!=="plan"&&TAB!=="settings") return;
  var el=e.target, p;
  if(el.dataset.pw!==undefined){
    p=S.settings.plates[+el.dataset.pw];
    if(p){ p.w=Math.max(0,num(el.value)); save(); }
  } else if(el.dataset.pn!==undefined){
    p=S.settings.plates[+el.dataset.pn];
    if(p){ p.n=Math.max(0,Math.round(num(el.value))); save(); }
  }
});

function addToPlan(name){
  var r=S.routines[editingRoutine];
  if(!r) return;
  planExOf(r,editingVariant).push(newPlanEx(name));
  save(); viewPlan();
}

function variantAddSheet(ri){
  var r=S.routines[ri]; if(!r) return;

/* ---- data in / out ---- */
function payload(){ return JSON.stringify(S,null,2); }
function backupName(){ return "ironlog-"+today()+".json"; }
function markBackedUp(){ S.settings.lastBackup=Date.now(); writeNow(); }

/* Android's share sheet refuses some file types outright, and which ones is not
   something to guess at. Offer the tidy name first, fall back to .txt — which
   every share target accepts — and let canShare() pick. The contents are the
   same JSON either way, and the importer takes both. */
function shareableFile(data){
  var opts=shareVariants(data);
  /* A mode proven to work on this device wins over the default order. */
  for(var i=0;i<opts.length;i++){
    if(opts[i].k===S.settings.shareMode&&opts[i].file) return opts[i].file;
  }
  for(i=0;i<opts.length;i++){
    if(opts[i].file&&opts[i].can) return opts[i].file;
  }
  return null;
}
var lastShareErr="";

/* ---- why sharing fails, answered on the device instead of guessed ----
   navigator.share() rejects with NotAllowedError in two unrelated cases: the
   call had no transient user activation, or Chrome refused the file's type.
   No permission prompt is involved in either, which is why "Permission denied"
   is such a misleading string. The fixes are opposite, so the app tries the
   variants one tap at a time and remembers which one worked. */
function shareVariants(data){
  function f(name,type){ try{ return new File([data],name,{type:type}); }catch(e){ return null; } }
  var base=backupName();
  var list=[
    {k:"txt",   label:"File as .txt",        file:f(base.replace(/\.json$/,".txt"),"text/plain")},
    {k:"json",  label:"File as .json",       file:f(base,"application/json")},
    {k:"titled",label:"File plus a title",   file:f(base,"application/json"), title:true},
    {k:"text",  label:"Plain text, no file", file:null, text:true}
  ];
  list.forEach(function(v){
    try{
      v.can = v.text ? !!navigator.share
            : !!(v.file&&navigator.canShare&&navigator.canShare({files:[v.file]}));
    }catch(e){ v.can=false; }
  });
  return list;
}
function sharePayload(v,data){
  if(v.text) return {title:"Iron Log backup",text:data.slice(0,1500)};
  return v.title ? {files:[v.file],title:"Iron Log backup"} : {files:[v.file]};
}
var shareResults={};
function shareTestSheet(){
  var data=payload();
  var vs=shareVariants(data);
  function draw(){
    var anyOk=Object.keys(shareResults).some(function(k){ return shareResults[k]==="worked"; });
    sheet('<h3>Why sharing fails</h3>'+
      '<div class="sub">Tap each one. The share sheet should open — back out of it and the result lands here. '+
      'If <b>every</b> line fails the same way, the problem is this browser blocking sharing outright, not the file type.</div>'+
      '<div class="card" style="padding:0;margin-bottom:12px">'+
        vs.map(function(v){
          var r=shareResults[v.k];
          return '<div class="field-row" style="padding:10px 12px;margin:0">'+
            '<div class="fl">'+esc(v.label)+
              '<div class="fh">'+(v.can?"allowed by canShare()":"canShare() says no")+'</div></div>'+
            (r?'<div class="num tiny" style="color:'+(r==="worked"?"var(--good)":"var(--bad)")+'">'+esc(r)+'</div>'
              :'<button class="btn sm ghost" data-try="'+v.k+'">Try</button>')+
          '</div>';
        }).join("")+
      '</div>'+
      (anyOk?'<div class="banner calm" style="margin-bottom:12px"><div class="bt">Found one that works</div>'+
        '<div class="bd">"Send a copy" will use it from now on.</div></div>':"")+
      '<button class="btn ghost block" data-x="close">Close</button>',
      function(el){
        $$("[data-try]",el).forEach(function(btn){
          btn.onclick=function(){
            var v=vs.filter(function(x){ return x.k===btn.dataset.try; })[0];
            var p;
            try{ p=navigator.share(sharePayload(v,data)); }
            catch(err){ shareResults[v.k]=(err&&err.name)||"threw"; draw(); return; }
            if(!p||!p.then){ shareResults[v.k]="no promise"; draw(); return; }
            p.then(function(){
              shareResults[v.k]="worked";
              if(!v.text){ S.settings.shareMode=v.k; writeNow(); lastShareErr=""; }
              draw();
            }).catch(function(err){
              /* Backing out of a sheet that opened still proves it opened. */
              shareResults[v.k]=(err&&err.name==="AbortError")?"worked":((err&&err.name)||"failed");
              if(shareResults[v.k]==="worked"&&!v.text){ S.settings.shareMode=v.k; writeNow(); lastShareErr=""; }
              draw();
            });
          };
        });
        $('[data-x="close"]',el).onclick=function(){ closeSheet(); render(); };
      });
  }
  draw();
}

/* One tap into whatever the phone can share to — Drive, Files, email, iCloud. */
function backupSheet(){
  var data=payload();
  var file=shareableFile(data);

  sheet('<h3>Back up your log</h3>'+
    '<div class="sub">'+plural(S.sessions.length,"session")+' · '+Math.round(data.length/1024)+' KB. '+
      'Send yourself a copy anywhere that syncs — Drive, Files, email. Importing it later restores everything exactly.</div>'+
    (lastShareErr?'<div class="banner warn" style="margin-bottom:10px"><div class="bt">Sharing failed last time</div>'+
      '<div class="bd">'+esc(lastShareErr)+' — "Save file" below always works. That error does not mean you '+
      'refused a prompt; there isn\'t one. It means the browser blocked the call.</div>'+
      '</div>':"")+
    (file&&!lastShareErr?'<button class="btn primary big block" data-x="share" style="margin-bottom:8px">Send a copy…</button>':
      file?'<button class="btn block" data-x="share" style="margin-bottom:8px">Try sharing again</button>':
      '<div class="tiny muted" style="margin-bottom:8px">This browser won\'t share files, so save one instead.</div>')+
    '<button class="btn '+(file&&!lastShareErr?"":"primary big ")+'block" data-x="dl">Save file to this device</button>'+
    '<button class="btn ghost block" style="margin-top:8px" data-x="copy">Copy as text</button>'+
    (file?'<button class="tiny muted block" style="width:100%;padding:10px 0" data-x="why">Sharing not working? Test it ›</button>':"")+
    (S.settings.lastBackup?'<div class="tiny muted" style="text-align:center;margin-top:12px">Last copy '+relDate(S.settings.lastBackup)+'</div>':""),
    function(el){
      var sh=$('[data-x="share"]',el);
      if(sh) sh.onclick=function(){
        /* Nothing async before share() — Chrome needs the tap's user
           activation still live when it is called. */
        var p, settled=false;
        /* No title unless a titled variant is what proved to work — a bare
           files payload is the most widely accepted shape. */
        var body=S.settings.shareMode==="titled"
          ? {files:[file],title:"Iron Log backup"} : {files:[file]};
        try{ p=navigator.share(body); }
        catch(err){ shareFailed(err,data); return; }
        if(!p||!p.then){ shareFailed(new Error("share() returned nothing"),data); return; }
        /* A share() that neither resolves nor rejects looks exactly like a dead
           button. If the sheet had opened it would have taken focus, so still
           being focused after three seconds means it never appeared. */
        var watchdog=setTimeout(function(){
          if(settled||document.hidden||!document.hasFocus()) return;
          settled=true;
          shareFailed(new Error("the share sheet never opened"),data);
        },3000);
        p.then(function(){
          if(settled) return;
          settled=true; clearTimeout(watchdog); lastShareErr="";
          markBackedUp(); closeSheet(); render(); toast("Copy sent");
        }).catch(function(err){
          if(settled) return;
          settled=true; clearTimeout(watchdog);
          shareFailed(err,data);
        });
      };
      var why=$('[data-x="why"]',el);
      if(why) why.onclick=function(){ shareTestSheet(); };
      $('[data-x="dl"]',el).onclick=function(){ downloadBackup(data); closeSheet(); render(); };
      $('[data-x="copy"]',el).onclick=function(){
        if(navigator.clipboard){
          navigator.clipboard.writeText(data).then(function(){ markBackedUp(); toast("Copied"); closeSheet(); render(); })
            .catch(function(){ doExport(); });
        } else doExport();
      };
    });
}
/* The old version swallowed every rejection as "user backed out", which made a
   genuinely broken share indistinguishable from a cancelled one — the reported
   symptom was a button that did nothing at all. Cancelling is silent; anything
   else says so and still leaves you holding a file. */
function shareFailed(err,data){
  var name=(err&&err.name)||"Error";
  if(name==="AbortError"){ return; }            // you closed the share sheet
  lastShareErr=name+(err&&err.message?": "+err.message:"");
  downloadBackup(data,true);        // one message, not two fighting
  closeSheet(); render();
  toast("Share didn't work — saved to your files instead");
}
function downloadBackup(data,quiet){
  try{
    var blob=new Blob([data],{type:"application/json"});
    var url=URL.createObjectURL(blob);
    var a=document.createElement("a");
    a.href=url; a.download=backupName();
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){ URL.revokeObjectURL(url); },2000);
    markBackedUp();
    if(!quiet) toast("Saved to your downloads");
  }catch(e){ toast("Couldn't save the file — try Copy as text"); }
}
function doExport(){
  var data=payload();
  downloadBackup(data);
  sheet('<h3>Export</h3><div class="sub">Saved as '+esc(backupName())+'. You can also copy the raw log and paste it somewhere safe.</div>'+
      '<textarea class="txt" style="min-height:120px;font-family:var(--mono);font-size:12px" readonly>'+esc(data)+'</textarea>'+
      '<div class="row" style="gap:8px;margin-top:10px">'+
      '<button class="btn ghost" style="flex:1" data-x="close">Close</button>'+
      '<button class="btn primary" style="flex:1" data-x="copy">Copy</button></div>',
    function(el){
      $('[data-x="close"]',el).onclick=function(){ closeSheet(); render(); };
      $('[data-x="copy"]',el).onclick=function(){
        var ta=$("textarea",el);
        ta.select(); ta.setSelectionRange(0,999999);
        if(navigator.clipboard) navigator.clipboard.writeText(data).then(function(){ toast("Copied"); });
        else { try{ document.execCommand("copy"); toast("Copied"); }catch(e){ toast("Select the text and copy"); } }
      };
    });
}
function doImport(){
  if(refuseMidWorkout()) return;
  sheet('<h3>Import</h3><div class="sub">Replaces everything currently in the app. Pick a file you backed up, or paste the JSON.</div>'+
    '<input type="file" accept="application/json,.json,text/plain,.txt" data-x="file" style="margin-bottom:12px">'+
    '<textarea class="txt" style="min-height:110px;font-family:var(--mono);font-size:12px" placeholder="…or paste here" data-x="paste"></textarea>'+
    '<div class="row" style="gap:8px;margin-top:10px">'+
    '<button class="btn ghost" style="flex:1" data-x="close">Cancel</button>'+
    '<button class="btn primary" style="flex:1" data-x="go">Import</button></div>',
    function(el){
      var pending=null;
      $('[data-x="file"]',el).onchange=function(){
        var f=this.files&&this.files[0]; if(!f) return;
        var fr=new FileReader();
        fr.onload=function(){ pending=String(fr.result); toast("File ready — tap Import"); };
        fr.readAsText(f);
      };
      $('[data-x="close"]',el).onclick=closeSheet;
      $('[data-x="go"]',el).onclick=function(){
        var raw=pending||$('[data-x="paste"]',el).value;
        if(!raw){ toast("Nothing to import"); return; }
        var parsed;
        try{ parsed=JSON.parse(raw); }catch(e){ toast("That isn't valid Iron Log JSON"); return; }
        if(!parsed||!parsed.routines||!parsed.sessions){ toast("That file is missing routines or sessions"); return; }
        if(refuseMidWorkout()) return;
        replaceLog(parsed);
        closeSheet(); go("today"); toast("Log imported");
      };
    });
}

/* The one way a whole log comes in, from a file or from GitHub. */
function replaceLog(parsed){
  S=normalize(parsed);
  recomputePRs();
  writeNow();
}

/* ============================ GitHub backup ============================ */
/* The token and gist id live under their own key and never in S, so they
   can't reach the export file, the gist content or a backup. */
var GIST_KEY="ironlog.gist", GIST_FILE="ironlog.json", GIST_DELAY=30000;
var BEFORE_KEY="ironlog.v1.before-restore";
var gistMem=null, gistTimer=null, gistQueue=Promise.resolve();
var storageKept=null;                 // true/false as the browser reports it; null = not said

function gistLoad(){
  if(gistMem) return gistMem;
  var g=null;
  try{ g=JSON.parse(localStorage.getItem(GIST_KEY)||"null"); }
  catch(e){ /* unreadable or blocked storage: behave as if not set up */ }
  return (g&&typeof g==="object")?g:{};
}
/* Returns false when the browser refuses the write; the record then lives in
   memory for this visit only, and the caller says so where it matters. */
function gistStore(g){
  try{ localStorage.setItem(GIST_KEY,JSON.stringify(g)); gistMem=null; return true; }
  catch(e){ gistMem=g; return false; }
}
function gistPatch(fields){
  var g=gistLoad();
  Object.keys(fields).forEach(function(k){ g[k]=fields[k]; });
  gistStore(g);
  return g;
}

/* Called from writeNow(), so every save path is covered without each one
   knowing GitHub exists. Marks the gist stale now and sends it GIST_DELAY on.
   gistGen counts changes in memory: a push notes it when it reads the log, and
   clears `dirty` on success only if nothing changed while it was uploading. */
var gistGen=0;
function gistChanged(){
  gistGen++;
  var g=gistLoad();
  if(!g.token) return;
  if(!g.dirty) gistPatch({dirty:true});
  clearTimeout(gistTimer);
  gistTimer=setTimeout(gistBackupNow,GIST_DELAY);
}

/* Pushes are queued so two never race to create two gists, and each one
   reads the log when it starts, so the last one sent is the newest state. */
function gistBackupNow(opts){
  clearTimeout(gistTimer); gistTimer=null;
  if(!gistLoad().token) return Promise.resolve();
  gistQueue=gistQueue.then(function(){ return gistPush(opts); }).catch(function(err){
    gistPatch({dirty:true, lastError:"Backup failed: "+(err&&err.message||"unknown error")+"."});
    gistPaint();
  });
  return gistQueue;
}
function gistNewBody(files){
  return {description:"Iron Log backup", public:false, files:files};
}
/* No gist id in this browser does NOT mean no backup exists: a new phone, or
   a cleared browser, with the token pasted back in. Creating a gist there
   would put a near-empty log on top as the newest backup, and Restore — which
   picks the newest — would then offer the empty one. So look first. Adopt an
   existing backup only when this phone holds at least as many sessions;
   otherwise stop and ask for a restore. Nothing is ever lost (GitHub keeps
   every revision), but this keeps the obvious button pointing at the right
   log. */
function gistTarget(g,mine){
  if(g.gistId) return Promise.resolve(g.gistId);
  return gistFind().then(function(id){
    return gistReq("GET","/gists/"+encodeURIComponent(id)).then(function(gist){
      return gistFileText(gist).then(function(text){
        var n=0;
        try{ var p=JSON.parse(text); n=(p&&Array.isArray(p.sessions))?p.sessions.length:0; }
        catch(e){ n=0; }                  // unreadable: nothing in it worth protecting
        if(n>mine)
          throw gistFail("GitHub already has a backup with "+plural(n,"session")+
            ", more than this phone. Restore it first so it isn't buried.");
        gistPatch({gistId:id, pushedSessions:n});   // what it holds, until this push lands
        return id;
      });
    });
  },function(err){
    if(err&&err.none) return "";          // genuinely no backup yet: create one
    throw err;
  });
}
/* The log as saved, not this window's copy of it: after another window has
   saved (see otherWrote()), the stored log is the newest one there is. A save
   still waiting on its 120 ms debounce goes in first. */
function gistLog(){
  flush();
  if(storageOK){
    try{
      var p=JSON.parse(localStorage.getItem(KEY)||"null");
      if(p&&typeof p==="object"&&Array.isArray(p.sessions)) return p;
    }catch(e){ /* unreadable: fall back to what this window holds, below */ }
  }
  return S;
}
/* Never put a log holding fewer sessions than the last successful push over
   the backup without asking. Erase everything did exactly that 30 s after the
   wipe, and an empty log became the newest backup — the one Restore offers.
   Only "Back up now", confirmed (gistNowTap), passes {force:true}. */
function gistSessionsMoved(d){
  var g=gistLoad();
  if(g.pushedSessions===undefined||g.pushedSessions===null) return;
  gistPatch({pushedSessions:Math.max(0,num(g.pushedSessions)+d)});
}
/* Backups that have stopped are said where he looks, not only in Settings. */
function gistPausedBanner(){
  var g=gistLoad();
  if(!g.token||!g.dirty||!g.lastError) return "";
  return '<div class="banner warn"><div class="bt">GitHub backup paused</div>'+
    '<div class="bd">'+esc(g.lastError)+'</div>'+
    '<div class="acts"><button class="btn sm ghost" data-act="settings">Open Settings</button></div></div>';
}
function gistPush(opts){
  var g=gistLoad();
  if(!g.token) return Promise.resolve();
  var log=gistLog(), mine=log.sessions.length, theirs=num(g.pushedSessions);
  var gen=gistGen;                        // flush() above may have bumped it; this push covers that
  clearTimeout(gistTimer); gistTimer=null;
  if(mine<theirs&&!(opts&&opts.force)){
    gistPatch({dirty:true, lastError:"This log has fewer sessions than your GitHub backup ("+mine+" vs "+theirs+
      "). Restore it, or tap Back up now to replace it."});
    gistPaint();
    return Promise.resolve();
  }
  var files={}; files[GIST_FILE]={content:JSON.stringify(log,null,2)};
  var sent=gistTarget(g,mine).then(function(id){
    if(!id) return gistReq("POST","/gists",gistNewBody(files));
    return gistReq("PATCH","/gists/"+encodeURIComponent(id),{files:files}).catch(function(err){
      if(err.status!==404) throw err;
      /* Deleted on GitHub: start again, once. The old id is no longer useful. */
      gistPatch({gistId:""});
      return gistReq("POST","/gists",gistNewBody(files));
    });
  });
  return sent.then(function(res){
    /* A change made while this was uploading is not in it, so it is still
       waiting: keep dirty and make sure another push is coming. */
    var behind=gistGen!==gen;
    gistPatch({gistId:res.id, lastSync:Date.now(), lastError:"", dirty:behind, pushedSessions:mine});
    if(behind&&!gistTimer) gistTimer=setTimeout(gistBackupNow,GIST_DELAY);
    gistPaint();
  },function(err){
    gistPatch({dirty:true, lastError:gistErrText(err)});
    gistPaint();
  });
}

function gistReq(method,path,body){
  var g=gistLoad();
  var init={method:method, cache:"no-store", headers:{
    "Accept":"application/vnd.github+json",
    "X-GitHub-Api-Version":"2022-11-28",
    "Authorization":"Bearer "+g.token}};
  if(body){ init.headers["Content-Type"]="application/json"; init.body=JSON.stringify(body); }
  return fetch("https://api.github.com"+path,init).then(function(res){
    return res.text().then(function(text){
      if(!res.ok){ var err=new Error("HTTP "+res.status); err.status=res.status; throw err; }
      if(!text) return null;
      try{ return JSON.parse(text); }
      catch(e){ throw gistFail("GitHub sent back something unreadable."); }
    });
  },function(){
    var err=new Error("network"); err.status=0; throw err;
  });
}
function gistFail(msg){ var e=new Error(msg); e.userMsg=msg; return e; }
function gistErrText(err){
  if(err&&err.userMsg) return err.userMsg;
  var s=err&&err.status;
  if(s===0) return "Couldn't reach GitHub. Will retry when you're back online.";
  if(s===401||s===403) return "GitHub rejected the token. It is invalid or lacks gist permission.";
  if(s===404) return "The backup gist was not found on GitHub.";
  if(s) return "GitHub returned an error ("+s+"). Will retry on the next change.";
  return "Backup failed: "+(err&&err.message||"unknown error")+".";
}

/* Status text is written into the node directly. A backup never re-renders
   the screen, so it can finish while you are still looking at it. */
function gistStatusText(){
  var g=gistLoad();
  if(!g.token) return "Not set up. Save a token to start.";
  if(g.lastError) return "Not backed up: "+g.lastError;
  if(g.dirty) return "Changes waiting to be backed up.";
  if(g.lastSync) return "Last backed up "+relDate(g.lastSync)+" at "+
    new Date(g.lastSync).toLocaleTimeString(undefined,{hour:"numeric",minute:"2-digit"})+".";
  return "Token saved. Nothing backed up yet.";
}
function gistPaint(){ var el=document.getElementById("gist-status"); if(el) el.textContent=gistStatusText(); }
function paintStorage(){ var el=document.getElementById("storage-status"); if(el) el.textContent=storageLine(); }

function gistSettingsHtml(){

/* Returns true when a token was stored, so the caller re-renders the row. */
function gistSaveToken(){
  var el=$('[data-gist="token"]');
  var t=el?String(el.value||"").trim():"";
  if(!t){ toast("Paste a token first"); return false; }
  if(/\s/.test(t)){ toast("That doesn't look like a token"); return false; }
  var g=gistLoad();
  g.token=t; g.dirty=true; g.lastError="";        // nothing is in the gist yet
  gistStore(g);
  toast("Token saved");
  return true;
}
function gistRemoveToken(){
  var g=gistLoad();
  clearTimeout(gistTimer); gistTimer=null;
  /* Keep the gist id, and what it holds, so a re-added token resumes it. */
  gistStore(g.gistId?{gistId:g.gistId, pushedSessions:g.pushedSessions}:{});
  toast("Token removed from this browser");
}
/* Erase everything stops backing up to the gist instead of emptying it: the
   id, its session count and anything waiting are dropped, the token is kept.
   A later backup then has to find the gist again, and gistTarget() won't put
   a smaller log over it — Restore from GitHub is how the log comes back. */
function gistDetach(){
  clearTimeout(gistTimer); gistTimer=null;
  var g=gistLoad();
  gistStore(g.token?{token:g.token, dirty:false, lastError:""}:{});
}
/* The one way past gistPush()'s fewer-sessions guard: asked, by name, with
   both counts in front of you. */
function gistNowTap(){
  var g=gistLoad();
  if(!g.token){ toast("Save a token first"); return; }
  function run(opts){
    gistBackupNow(opts).then(function(){
      var g2=gistLoad();
      toast(g2.dirty?(g2.lastError||"Backup didn't finish"):"Backed up to GitHub");
    });
  }
  var mine=gistLog().sessions.length, theirs=num(g.pushedSessions);
  if(mine<theirs){
    confirmSheet("Replace your GitHub backup?",
      "This log has "+plural(mine,"session")+" and your GitHub backup has "+plural(theirs,"session")+
      ". Backing up now replaces the backup with this log. GitHub keeps the old one in the gist's revision history, "+
      "but Restore only offers the newest. To get the backup's sessions onto this phone instead, use Restore from GitHub.",
      "Replace backup",function(){ run({force:true}); },true);
    return;
  }
  run();
}

/* Finds the most recently updated gist holding a backup, for when the token is
   known but the id isn't (a fresh install, or a second phone). */
function gistFind(){
  return gistReq("GET","/gists?per_page=100").then(function(list){
    var hits=(Array.isArray(list)?list:[]).filter(function(x){ return x&&x.files&&x.files[GIST_FILE]; });
    hits.sort(function(a,b){ return String(b.updated_at).localeCompare(String(a.updated_at)); });
    if(!hits.length){
      var e=gistFail("No Iron Log backup was found in this account's gists.");
      e.none=true; throw e;
    }
    return hits[0].id;
  });
}
function gistFileText(gist){
  var f=gist&&gist.files&&gist.files[GIST_FILE];
  if(!f) return Promise.reject(gistFail("That gist has no "+GIST_FILE+" in it."));
  if(!f.truncated) return Promise.resolve(String(f.content||""));
  /* Large files come back truncated. The raw URL is fetched without the token,
     so the token never goes to a second host. */
  return fetch(f.raw_url,{cache:"no-store"}).then(function(res){
    if(!res.ok) throw gistFail("Couldn't download the full backup (HTTP "+res.status+").");
    return res.text();
  },function(){ throw gistFail("Couldn't reach GitHub. Try again when you're online."); });
}
/* Restore and file import both replace S wholesale, S.active included, so
   mid-workout they would silently drop the sets logged so far. Same rule and
   words as the plan switch. */
function refuseMidWorkout(){
  if(!S.active) return false;
  toast("Finish or discard the workout first");
  return true;
}
function gistRestore(){
  var g=gistLoad();
  if(!g.token){ toast("Save a token first"); return; }
  if(refuseMidWorkout()) return;
  toast("Fetching your backup…");
  var have=g.gistId?Promise.resolve(g.gistId):gistFind();
  have.then(function(id){
    return gistReq("GET","/gists/"+encodeURIComponent(id)).then(function(gist){
      if(!g.gistId) gistPatch({gistId:id});
      return gistFileText(gist).then(function(text){ return {gist:gist, text:text}; });
    });
  }).then(function(r){
    var parsed;
    try{ parsed=JSON.parse(r.text); }
    catch(e){ throw gistFail("That backup isn't valid Iron Log JSON."); }
    if(!parsed||!Array.isArray(parsed.routines)||!Array.isArray(parsed.sessions))
      throw gistFail("That backup is missing routines or sessions.");
    confirmRestore(parsed,r.gist);
  }).catch(function(err){ toast(gistErrText(err)); });
}
function confirmRestore(parsed,gist){
  var when="", ts=gist?Date.parse(gist.updated_at):NaN;
  if(isFinite(ts)) when=" (saved "+shortDate(ts)+")";
  confirmSheet("Restore from GitHub?",
    "The backup"+when+" has "+plural(parsed.sessions.length,"session")+". This phone has "+
    plural(S.sessions.length,"session")+". Restoring replaces everything on this phone with the backup. "+
    "A copy of what's on this phone now is kept on the phone, in case you need it back.",
    "Restore",function(){ applyRestore(parsed); },true);
}
function applyRestore(parsed){
  if(refuseMidWorkout()) return;
  /* Keep what's there first. If that copy can't be made, nothing is replaced. */
  try{ localStorage.setItem(BEFORE_KEY,JSON.stringify(S)); }
  catch(e){ toast("Couldn't keep a copy of this log, so nothing was restored"); return; }
  try{ replaceLog(parsed); }
  catch(e){ toast("That backup couldn't be read, so nothing was restored"); return; }
  gistPatch({pushedSessions:parsed.sessions.length});   // the gist holds exactly this log
  go("today"); toast("Restored from GitHub");
}

/* The copy applyRestore() keeps, offered back from Settings while it exists. */
function beforeRestoreKept(){
  try{ return !!localStorage.getItem(BEFORE_KEY); }
  catch(e){ return false; }               // storage blocked: there is nothing to offer
}
function putBackBeforeRestore(){
  if(refuseMidWorkout()) return;
  var kept=null;
  try{ kept=JSON.parse(localStorage.getItem(BEFORE_KEY)||"null"); }
  catch(e){ kept=null; }
  if(!kept||typeof kept!=="object"||!Array.isArray(kept.sessions)){
    toast("The kept log couldn't be read, so nothing was changed"); return;
  }
  confirmSheet("Put back the log from before the restore?",
    "The log kept from before the restore has "+plural(kept.sessions.length,"session")+". This phone has "+
    plural(S.sessions.length,"session")+" now. Putting it back replaces everything on this phone with the kept log.",
    "Put it back",function(){
      if(refuseMidWorkout()) return;
      try{ replaceLog(kept); }
      catch(e){ toast("The kept log couldn't be read, so nothing was changed"); return; }
      try{ localStorage.removeItem(BEFORE_KEY); }
      catch(e){ toast("Put back, but the kept copy couldn't be removed"); go("today"); return; }
      go("today"); toast("The log from before the restore is back");
    },true);
}

/* ============================ AI (optional) ============================
   The one door to Claude, shared by the coach's check-in (v26/v27) and the
   form check (v28). Off until a key is saved. Talks the Messages API either
   to Anthropic directly or to any proxy that speaks it (LiteLLM's
   /v1/messages): the base URL is the only difference. A Claude.ai
   subscription can't be used from here — that needs API credits, directly
   or behind the proxy.

   The key, proxy URL and model live under their own key and never in S, so
   they can't reach a backup, an export or the gist (like the GitHub token).
   The official SDK is loaded only when an AI feature is used, pinned:
   1.3.0 (23 Oct 2026). The service worker only caches same-origin requests,
   so it never caches the SDK or a response.

   aiCall({system, content, schema, maxTokens, effort}) → {text, json, usage, model}
   rejects with an Error whose .userMsg is fit to show. With a schema, the
   reply is constrained to it (output_config.format) and parsed. */
var AI_KEY="ironlog.ai", AI_SDK="https://cdn.jsdelivr.net/npm/@anthropic-ai/sdk@1.3.0/+esm";
var AI_DEFAULT_MODEL="claude-opus-5-5";
var aiClientP=null, aiClientFor="";
function aiLoad(){
  var g=null;
  try{ g=JSON.parse(localStorage.getItem(AI_KEY)||"null"); }
  catch(e){ /* unreadable or blocked storage: behave as if not set up */ }
  return (g&&typeof g==="object")?g:{};
}
function aiStore(c){
  try{ localStorage.setItem(AI_KEY,JSON.stringify(c)); return true; }
  catch(e){ toast("Couldn't save the AI settings in this browser"); return false; }
}
function aiReady(){ return !!aiLoad().key; }
function aiModel(){ return aiLoad().model||AI_DEFAULT_MODEL; }
function aiFail(msg){ var e=new Error(msg); e.userMsg=msg; return e; }
function aiErr(err){
  if(err&&err.userMsg) return err;
  var st=err&&err.status;
  if(st===401||st===403) return aiFail("The key was rejected — check it in Settings → AI coach.");
  if(st===429) return aiFail("Too many requests, or the account is out of credit. Try again later.");
  if(st===404) return aiFail("The model or address wasn't found — check the model name and proxy URL.");
  if(st) return aiFail("Claude's service returned an error ("+st+"). Try again later.");
  return aiFail("Couldn't reach "+(aiLoad().base?"your proxy":"Claude")+". Check the connection"+(aiLoad().base?" and that the proxy allows this site (CORS).":"."));
}
function aiClient(){
  var c=aiLoad(), sig=(c.base||"")+"|"+(c.key||"");
  if(aiClientP&&aiClientFor===sig) return aiClientP;
  aiClientFor=sig;
  aiClientP=import(AI_SDK).then(function(m){
    var Anthropic=m.default||m.Anthropic;
    /* The key sits on this phone and is visible to it — acceptable for an app
       with one user, and exactly what the SDK's browser flag acknowledges. */
    var o={apiKey:c.key, dangerouslyAllowBrowser:true, maxRetries:1};
    if(c.base) o.baseURL=String(c.base).replace(/\/+$/,"");
    return new Anthropic(o);
  },function(){ aiClientP=null; throw aiFail("Couldn't load the Claude library — check the connection."); });
  return aiClientP;
}
function aiCall(o){
  var c=aiLoad();
  if(!c.key) return Promise.reject(aiFail("Add an API key in Settings → AI coach first."));
  var req={model:aiModel(), max_tokens:o.maxTokens||16000, messages:[{role:"user", content:o.content}],
           output_config:{effort:o.effort||"medium"}};
  if(o.system) req.system=o.system;
  if(o.schema) req.output_config.format={type:"json_schema", schema:o.schema};
  return aiClient().then(function(cl){
    /* Straight to Anthropic: server-side refusal fallback, so a request a
       safety classifier declines is retried on a suitable model in the same
       call. A proxy may not pass beta parameters through, so not there. */
    if(!c.base) return cl.beta.messages.create(Object.assign({betas:["server-side-fallback-2026-07-01"], fallbacks:"default"},req));
    return cl.messages.create(req);
  }).then(function(r){
    if(r.stop_reason==="refusal") throw aiFail("Claude declined that request.");
    if(r.stop_reason==="max_tokens") throw aiFail("The answer was cut off — try again.");
    var text=(r.content||[]).filter(function(b){ return b.type==="text"; }).map(function(b){ return b.text; }).join("");
    var json=null;
    if(o.schema){
      try{ json=JSON.parse(text); }
      catch(e){ throw aiFail("The answer didn't come back in the expected shape — try again."); }
    }
    return {text:text, json:json, usage:r.usage||null, model:r.model||aiModel()};
  },function(err){ throw aiErr(err); });
}
function aiSettingsHtml(){
  var c=aiLoad(), h='<div class="field-row" style="display:block"><div class="fl">Claude, for the coach\'s check-in and form checks'+
    '<div class="fh">Optional, and off until a key is saved. Uses an Anthropic API key (API credits — a Claude.ai subscription can\'t be used here), '+
    'either straight to Anthropic or through your own proxy such as LiteLLM; a proxy must allow this site (CORS). '+
    'The key stays on this phone and is never in a backup or export.</div></div>';
  if(c.key){
    h+='<div class="row" style="gap:8px;margin-top:8px"><span class="tiny" style="flex:1">Key saved · '+esc(c.base?"via "+c.base:"Anthropic direct")+
      ' · '+esc(aiModel())+'</span><button class="btn sm ghost" data-act="ai-remove">Remove</button></div>'+
      '<div class="row" style="gap:8px;margin-top:8px"><button class="btn sm" data-act="ai-test">Test the connection</button></div>';
  } else {
    h+='<input class="txt" type="password" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="API key (or proxy key)" data-ai="key" style="width:100%;margin-top:8px">'+
      '<input class="txt" type="url" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Proxy URL (blank = Anthropic)" data-ai="base" style="width:100%;margin-top:8px">'+
      '<input class="txt" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Model ('+AI_DEFAULT_MODEL+')" data-ai="model" style="width:100%;margin-top:8px">'+
      '<div class="row" style="gap:8px;margin-top:8px"><button class="btn sm primary" data-act="ai-save">Save</button></div>';
  }
  h+='<div class="tiny muted" id="ai-status" style="margin-top:8px"></div></div>';
  return h;
}
function aiSaveTap(){
  var k=($('[data-ai="key"]')||{}).value||"", b=($('[data-ai="base"]')||{}).value||"", m=($('[data-ai="model"]')||{}).value||"";
  k=k.trim(); b=b.trim(); m=m.trim();
  if(!k){ toast("Paste a key first"); return false; }

  if(!aiStore({key:k, base:b, model:m})) return false;

}

/* ============================ storage ============================ */
function storageLine(){
  if(storageKept===true) return "Storage: kept by the browser";
  if(storageKept===false) return "Storage: the browser may clear this if space runs low";
  return "Storage: this browser doesn't say whether it keeps the log";
}
/* Asked once per load. A missing API or a refusal is reported on the line,
   never thrown at the user. */
function askPersist(){
  if(!(navigator.storage&&navigator.storage.persisted)) return;
  Promise.resolve()
    .then(function(){ return navigator.storage.persisted(); })
    .then(function(kept){ return kept?true:navigator.storage.persist(); })
    .then(function(kept){ storageKept=!!kept; },function(){ storageKept=null; })
    .then(paintStorage);
}

/* ============================ recommended plan ============================
   Nick's own lifts, repacked to fit the ~45 minutes his logs show a session
   really lasts. As written, Day A was 21 straight sets at 180 s rest, about
   80 min; he stopped after three exercises on three of the four times he ran
   it as written, and the lifts at the end of each day were the ones that
   never got done. So:
   one main lift, then three supersets (`link`), 120 s rest. Lateral Raise is
   12–20 everywhere so its slots agree. Face Pull is out — no variation ever
   felt right, and it was skipped every time after 9 Aug — and Rear Delt Fly

/* ============================ the coach (v26 rules, v27 Claude) ============================
   ONE suggestion system with two sources. The rules (v26) look at the log
   every 14 days; Claude (v27) is asked on demand. Both raise the same thing:
   a proposal in S.coach.proposals, shown as a card with a reason and choices.

   Three promises, because they are what Nick asked for:
   - It PROMPTS. Nothing here changes the plan until a button on a card is
     tapped (coachApply), and every accepted change is one tap to undo.
   - It NEVER sets a weight or a rep. The only actions are swap a lift, trim
     or add a set, remove a lift, pair two as a superset. Progression stays
     with prescribe()/shadowPrescribe(). The one number a swap does write is
     `startW` on the NEW row, read by prescribe()'s "new" branch only, so the
     first card for a lift with no history isn't blank.
   - At most COACH_OPEN_MAX proposals are open at once, and a lift+reason
     that was kept (or accepted) isn't raised again for weeks.

   S.coach = {proposals:[], history:[], lastCheck}
     proposal = {id, ts, source:"rules"|"claude", kind, key, lift, rid, title,
                 reason, evidence, options:[{act,label,lift,to?,n?,with?}],
                 status:"open"|"accepted"|"skipped", decided, chosen, undo?}

var COACH_EVERY=14*864e5, COACH_OPEN_MAX=2, COACH_MIN_SESSIONS=6, COACH_EXPIRE=28*864e5;

var COACH_MIN_WEEKLY=6;     // weekly sets per muscle under which the volume rule speaks

function coachShape(c){

function coachState(){ return (S.coach=coachShape(S.coach)); }
function coachOpen(){ return coachState().proposals.filter(function(p){ return p.status==="open"; }); }

var COACH_FAM=null;

function coachFamOf(name){

function coachInPlan(name){

  return found;

/* Up to `max` similar lifts to offer for `name`, minus anything already in the plan. */
/* Lifts Nick has ruled out: no face-pull variation ever felt right. They stay
   in their family so a plan that still has one can swap OUT of it. */
var COACH_NEVER=["face pull"];
function coachAlternatives(name,max){
  var me=coachFamOf(name); if(!me) return [];
  var out=[];
  COACH_FAMILIES[me.fi].forEach(function(m){
    if(normName(m[0])===normName(me.name)||coachInPlan(m[0])) return;
    if(COACH_NEVER.indexOf(normName(m[0]))>=0) return;   // looked up, never offered
    out.push(m[0]);

function coachSwapOpts(name,max,not){
  return coachAlternatives(name,(max||3)+3).filter(function(n){ return normName(n)!==normName(not||""); })
    .slice(0,max||3).map(function(n){ return {act:"swap", lift:name, to:n, label:"Swap for "+n}; });
}
/* Where to start a lift that has no history: the old lift's working load, scaled
   by the guessed ratio between the two, times COACH_LIGHT, rounded DOWN to the
   increment. A guess by design — it only fills a blank, and he finds the real
   weight in a set or two. 0 = no suggestion. */
function coachStartW(oldName,newName,row){
  if(bwMode(row)||metricOf(row)) return 0;
  var fo=coachFamOf(oldName), fn=coachFamOf(newName);
  if(!fo||!fn||!fo.f||!fn.f) return 0;
  var h=lastPerf(oldName); if(!h||h.bw||h.metric) return 0;
  var w=workLoad(h.sets,h.bw); if(!(w>0)) return 0;
  var step=stepFor(row);
  var v=Math.floor(w*fn.f/fo.f*COACH_LIGHT/step+1e-9)*step;
  return v>0?round(v,1):0;
}
/* A swapped-in row takes the old slot's shape (sets, range, superset, increment,

function coachNewRow(old,to){

}

/* ---- what the rules read ---- */
function coachMedian(a){
  var s=a.slice().sort(function(x,y){ return x-y; }), n=s.length;
  return n?(n%2?s[(n-1)/2]:(s[n/2-1]+s[n/2])/2):0;
}
function coachDone(s,name){
  var k=normName(name);
  return s.exercises.some(function(e){
    return normName(e.name)===k&&working(e.sets).some(function(x){ return x.done!==false&&num(x.r)>0; });
  });
}
/* Timestamps of a session's logged working sets, sorted. */
function coachSetTimes(s){
  var ts=[];
  s.exercises.forEach(function(e){ working(e.sets).forEach(function(x){ if(x.done!==false&&num(x.ts)>0) ts.push(num(x.ts)); }); });
  return ts.sort(function(a,b){ return a-b; });
}
/* ACTIVE minutes: the sum of the gaps between consecutive logged sets that are
   15 minutes or less. First-to-last is wrong for this log — sets get ticked
   hours or days later (real sessions spanning 17 h and 4 days), so a span reads
   a 45-minute workout as a marathon. A longer gap is a break in the app, not in
   the lifting, and counts for nothing. Null when the log can't say (fewer than
   4 stamped sets). */
var COACH_GAP=15*60e3;
function coachActiveMin(s){
  var ts=coachSetTimes(s);
  if(ts.length<4) return null;
  var sum=0;
  for(var i=1;i<ts.length;i++) if(ts[i]-ts[i-1]<=COACH_GAP) sum+=ts[i]-ts[i-1];
  return sum/60000;

/* The raw first-to-last span, for the summary only (it is what the old rule used). */
function coachSpanMin(s){
  var ts=coachSetTimes(s);
  return ts.length<4?null:(ts[ts.length-1]-ts[0])/60000;
}
/* Median active minutes of a day's last 4 sessions; null unless 3 can be timed. */
function coachDayActive(r){
  var d=coachDaySessions(r).slice(0,4).map(coachActiveMin).filter(function(x){ return x!==null; });
  return d.length>=3?coachMedian(d):null;
}
/* A day's sessions, newest first, deloads left out (they are short on purpose).
   For a lift in only some of a day's weeks, only the weeks it is planned in. */
function coachDaySessions(r,name){
  var k=name?normName(name):"", vs=variantsOf(r);
  var ids=name?vs.filter(function(v){ return v.exercises.some(function(e){ return normName(e.name)===k; }); })
    .map(function(v){ return v.id; }):null;
  return S.sessions.filter(function(s){
    return s.routineId===r.id&&!s.deload&&(!ids||vs.length<2||ids.indexOf(s.variantId)>=0);
