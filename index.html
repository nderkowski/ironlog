/* ============================ load model ============================
   BW modes: 0 = weighted (the number is the weight on the bar)
             1 = bodyweight (the number is weight ADDED to you)
             2 = assisted   (the number is assistance SUBTRACTED)
   Every logged set stores the resolved `load` so history stays true even
   after your bodyweight setting changes.
   =================================================================== */
function bwMode(ex){ return num(ex&&ex.bw)||0; }
function effLoad(w,mode,bodyweight){
  var bw=bodyweight===undefined?num(S.settings.bodyweight):num(bodyweight);
  if(mode===1) return bw+num(w);
  if(mode===2) return Math.max(0,bw-num(w));
  return num(w);
}
function loadOf(s){ return (s&&s.load!==undefined&&s.load!==null)?num(s.load):num(s&&s.w); }
function working(sets){ return (sets||[]).filter(function(s){ return !s.warm; }); }
/* How a set reads on screen: 185, BW, BW+25, −40 */
function entryText(s,mode){
  var w=num(s.w);
  if(mode===1) return w?("BW+"+fmt(w)):"BW";
  if(mode===2) return w?("−"+fmt(w)):"BW";
  return fmt(w);
}
function loadLabel(mode){
  if(mode===1) return "added "+unit();
  if(mode===2) return "assist "+unit();
  return unit();
}

/* ============================ history queries ============================ */
function normName(n){ return String(n||"").trim().toLowerCase(); }

/* Completed working sets for an exercise, grouped by session, newest first. */
function exSessions(name){
  var k=normName(name), out=[];
  for(var i=0;i<S.sessions.length;i++){
    var s=S.sessions[i];
    for(var j=0;j<s.exercises.length;j++){
      var e=s.exercises[j];
      if(normName(e.name)!==k) continue;
      var sets=working(e.sets).filter(function(x){ return x.done!==false&&num(x.r)>0; });
      if(sets.length) out.push({ts:s.ts,sets:sets,sessionId:s.id,deload:!!s.deload,bw:bwMode(e),metric:metricOf(e),
                                kind:e.kind||"", lo:num(e.reps), top:num(e.repTop),
                                tgt:(e.shadow&&e.shadow.used)?num(e.shadow.r):num(e.targetReps)});
    }
  }
  return out;
}
/* Same, minus anything logged during a deliberate deload — those must never
   read as a decline, or the app would chase its own tail. */
function exWorking(name){ return exSessions(name).filter(function(x){ return !x.deload; }); }
function lastPerf(name){ var h=exWorking(name); return h.length?h[0]:null; }
/* Most recent session's raw sets, warm-ups included, for prefill. */
function lastRawSets(name){
  var k=normName(name);
  for(var i=0;i<S.sessions.length;i++){
    var s=S.sessions[i];
    for(var j=0;j<s.exercises.length;j++){
      if(normName(s.exercises[j].name)===k&&s.exercises[j].sets.length) return s.exercises[j].sets;
    }
  }
  return null;
}
/* ============================ metrics ============================
   0 = reps (the default, and what every calculation used to assume)
   1 = time     — `r` holds seconds
   2 = distance — `r` holds distance in whatever unit you already think in
   `r` is reused rather than adding a field, so every input, stepper and
   history record keeps working unchanged; only its meaning moves.
   ================================================================= */
function metricOf(ex){ return num(ex&&ex.metric)||0; }
function metricNoun(m){ return m===1?"seconds":m===2?"distance":"reps"; }
function metricShort(m){ return m===1?"secs":m===2?"dist":"reps"; }
function metricJoin(m){ return m===0?"×":"for"; }
function metricStep(m){ return m===0?1:5; }
function metricSuffix(m){ return m===1?"s":""; }
/* Reps get Epley. Time and distance have no 1RM, so the comparable number is
   the work itself, scaled by load so a heavier carry still counts as harder.
   max(load,1) keeps an unloaded plank on its own seconds. */
function setScore(s,m){
  if(m===1||m===2) return num(s.r)*Math.max(loadOf(s),1);
  return e1rm(loadOf(s),num(s.r));
}
function scoreLabel(m){ return m===1?"best hold":m===2?"best distance":"e1RM"; }

function bestScore(name){
  var best=0;
  exSessions(name).forEach(function(s){
    s.sets.forEach(function(x){ best=Math.max(best,setScore(x,s.metric)); });
  });
  return best;
}
function sessionTopScore(s){
  var b=0; s.sets.forEach(function(x){ b=Math.max(b,setScore(x,s.metric)); }); return b;
}
/* Volume is weight × reps, which is only defined for rep work. A plank or a
   carry contributes nothing to a pound total rather than a fabricated one. */
function sessionVolume(sets,m){
  if(num(m)) return 0;
  var v=0;
  (sets||[]).forEach(function(x){ if(x.done!==false&&!x.warm) v+=loadOf(x)*num(x.r); });
  return v;
}
function exVolume(e){ return sessionVolume(e.sets,metricOf(e)); }
/* ---- week variants ----
   A day holds variants[]; one variant is the old behaviour. Two rotations run
   independently: which *day* is next (nextRoutine) and which *week* that day
   is on (nextVariantIx). Finishing Day A week 1 must advance Day A to week 2
   while the day rotation moves on to B, so they are never collapsed into one
   modulo. Both are derived from history — there is no stored counter to drift. */
function variantsOf(r){ return (r&&r.variants)||[]; }
function variantAt(r,ix){
  var v=variantsOf(r); if(!v.length) return null;
  return v[Math.max(0,Math.min(num(ix)||0,v.length-1))];
}
function planExOf(r,ix){ var v=variantAt(r,ix); return v?v.exercises:[]; }
/* The variant the in-progress session was started from. Falls back to the
   first, so a session started before variants existed still has a home. */
function activeVariant(r){
  if(!S.active||!r) return null;
  return variantsOf(r).find(function(v){ return v.id===S.active.variantId; })||variantAt(r,0);
}
/* Label for display. Unlabelled variants are numbered, so a day that has just
   gained a second week reads "Week 1 / Week 2" without anyone naming them. */
function variantLabel(r,ix){
  var v=variantAt(r,ix); if(!v) return "";
  if(v.label) return v.label;
  return variantsOf(r).length>1?("Week "+(num(ix)+1)):"";
}
/* Which week of this day comes next. Reads the most recent session of this
   routine and flips; an unknown or deleted variant restarts at the first. */
function nextVariantIx(r){
  var vs=variantsOf(r);
  if(vs.length<2) return 0;
  for(var i=0;i<S.sessions.length;i++){
    var s=S.sessions[i];
    if(s.routineId!==r.id) continue;
    var ix=vs.findIndex(function(v){ return v.id===s.variantId; });
    return ix<0?0:(ix+1)%vs.length;
  }
  return 0;
}
/* Every plan exercise in the whole split, across every variant. Anything that
   asks "what lifts am I training" — muscle tags, tracked lifts, renames, the
   straight-sets count — has to span variants or it judges the block on half
   the plan. */
/* `opts.backup` also walks the plan kept by Settings → Workout plan
   (S.planBackup), for the edits that must reach it too — a rename or a unit
   conversion that skipped it made "Switch back" restore a lift cut off from
   its history, or a 45 kg bar. Everything that asks what is being trained
   now leaves it out, which is why it is opt-in. */
function eachPlanEx(fn,opts){
  var days=S.routines;
  if(opts&&opts.backup&&S.planBackup&&Array.isArray(S.planBackup.routines))
    days=days.concat(S.planBackup.routines);
  days.forEach(function(r){
    variantsOf(r).forEach(function(v,vi){
      (v.exercises||[]).forEach(function(e,ei){ fn(e,r,v,vi,ei); });
    });
  });
}
function planIsEmpty(){
  var any=false;
  eachPlanEx(function(){ any=true; });
  return !any;
}

function allExerciseNames(){
  var seen={},out=[];
  S.sessions.forEach(function(s){ s.exercises.forEach(function(e){
    var k=normName(e.name); if(!seen[k]){ seen[k]=1; out.push({name:e.name,ts:s.ts}); }
  });});
  eachPlanEx(function(e){
    var k=normName(e.name); if(!seen[k]){ seen[k]=1; out.push({name:e.name,ts:0}); }
  });
  return out.sort(function(a,b){ return b.ts-a.ts; });
}

/* Walk the whole history in order and re-flag PRs. Run after any edit,
   otherwise a corrected typo leaves a phantom record behind. */
function recomputePRs(){
  var best={};
  S.sessions.slice().sort(function(a,b){ return a.ts-b.ts; }).forEach(function(s){
    s.exercises.forEach(function(e){
      var k=normName(e.name);
      e.sets.forEach(function(x){
        if(x.warm||x.done===false){ x.pr=false; return; }
        var v=setScore(x,metricOf(e)), prev=best[k]||0;
        x.pr=prev>0&&v>prev+0.01;
        if(v>prev) best[k]=v;
      });
    });
  });
}

/* ---- trend / stall detection ---- */
/* How many sessions one double-progression cycle takes: climb from the bottom
   of the range to the top, then the load steps and reps reset. Straight sets
   have no cycle, so 1. Read from the plan first, then from history, so a lift
   that has been dropped from the plan still scores sensibly. */
function cycleOf(name){
  var k=normName(name), lo=0, top=0;
  eachPlanEx(function(e){
    if(top||normName(e.name)!==k) return;
    lo=num(e.reps); top=num(e.repTop);
  });
  if(!(top>lo)){
    lo=0; top=0;
    for(var i=0;i<S.sessions.length&&!(top>lo);i++){
      S.sessions[i].exercises.forEach(function(e){
        if(top>lo||normName(e.name)!==k) return;
        lo=num(e.reps); top=num(e.repTop);
      });
    }
  }
  return (top>lo&&lo>0)?(top-lo+1):1;
}

/* Is this lift moving.

   This used to be the mean of the last 3 sessions against the 3 before, and it
   was measuring the wrong thing. Under double progression e1RM *sawtooths* —
   reps climb from the bottom of the range to the top, then the load steps and
   reps reset, dropping the score back. A 3-vs-3 mean straddling that reset
   reads the phase of the sawtooth, not the trend.

   On a simulated flawless run — never a missed rep — it reported "down" at
   8–12 × 185 (−2.6%), 6–10 × 185 (−2.8%), 8–15 × 135 (−8.3%) and 8–20 × 100
   (−16.6%), and it got *worse the stronger you got*, because a fixed 5 lb step
   is a shrinking fraction of the load while the rep climb is not. "down" is
   what makes prescribe() cut 10% off the bar, so the engine could back off
   someone doing everything right, and deloadCheck() counts flat and down as
   stalled.

   A least-squares slope over a window guaranteed to contain a whole cycle has
   no phase to read. Scaled to "% per 3 sessions" so the ±1.5 / −2 thresholds
   keep the calibration they were tuned with. Verified against the same
   simulations: every false "down" above becomes flat or up, it survives ±1 rep
   of session-to-session noise, and a genuine 2%-per-session decline still
   reports −6.5% and a genuine stall −0.1%. */
/* What a session says about strength, for the trend only (PR board and
   charts keep sessionTopScore). A rep-out set is taken near failure, so its
   score is the honest one and it has no double-progression sawtooth. Without
   one, only sets at the working load count: a single test set at 170 between
   two at 150 held Lat Pulldown on "Already backed off" for two sessions. */
function trendScore(s){
  var w=workLoad(s.sets,s.bw), b=0;
  s.sets.forEach(function(x){ if(isAt(x,w,s.bw)) b=Math.max(b,setScore(x,s.metric)); });
  /* A real rep-out is the session's best set. One that isn't was not pushed
     — the flag is set by position at save, not by effort — and scoring it
     would read an easy last set as a decline (it cut a simulated lifter a
     third time, below his true 8RM). So take whichever says more. */
  var out=s.sets.filter(function(x){ return x.out; });
  if(out.length) b=Math.max(b,setScore(out[out.length-1],s.metric));
  return b||sessionTopScore(s);
}
/* A load drop the lifter chose — not one the app prescribed (kind "deload")
   — is a reset, not a decline. The trend starts after it, so going 65 → 55
   by choice doesn't read as "slipping" for the next nine sessions. Newest
   first in, newest first out. */
function sinceChosenDrop(h){
  for(var i=0;i+1<h.length;i++){
    var a=workLoad(h[i].sets,h[i].bw), b=workLoad(h[i+1].sets,h[i+1].bw);
    /* Only when the session recorded what the app prescribed: a log without
       it (old, hand-built) can't tell a choice from a decline, so it keeps
       its whole history. */
    if(heavierLoad(b,a,h[i].bw)&&h[i].kind&&h[i].kind!=="deload") return h.slice(0,i+1);
  }
  return h;
}
function trendAt(name,win){
  var h=sinceChosenDrop(exWorking(name));
  if(h.length<4) return {state:"new",n:h.length,pct:0};
  var vals=h.slice(0,win).map(trendScore).reverse();   // oldest first
  var n=vals.length;
  var ym=vals.reduce(function(x,y){ return x+y; },0)/n;
  if(!ym) return {state:"new",n:h.length,pct:0};
  var xm=(n-1)/2, sxy=0, sxx=0;
  for(var i=0;i<n;i++){ sxy+=(i-xm)*(vals[i]-ym); sxx+=(i-xm)*(i-xm); }
  if(!sxx) return {state:"new",n:h.length,pct:0};
  var pct=(sxy/sxx)/ym*100*3;
  return {state: pct>=1.5?"up":(pct<=-2?"down":"flat"), n:h.length, pct:pct};
}
/* How many sessions the card's verdict is computed from. Named because
   prescribe()'s back-off guard has to use the same window: a guard shorter
   than the signal it guards expires while the signal is still firing, which is
   how the app used to cut 10% off the bar again and again. */
function trendWin(name){ return Math.max(6,cycleOf(name)+3); }
function trend(name){ return trendAt(name,trendWin(name)); }

/* The deload question needs a longer horizon than the card chip, and the
   reason is worth understanding before anyone "simplifies" this back to one
   function.

   Over a short window the slope still depends a little on where in the rep
   cycle you happen to be. Simulated across every plausible range and load, a
   flawless run dips as low as −0.37% at its worst phase — while a genuine
   stall reads exactly 0.00%. The two overlap, so no threshold on the short
   window can separate "progressing slowly" from "not progressing". Over
   2 cycles the phase washes out: flawless never drops below +0.35%, a stall is
   still 0.00%, and `pct <= 0` splits them cleanly.

   The short window is right for the card, where the question is "what is this
   lift doing lately". The long one is right here, where the answer starts
   nagging you to take a week off. */
function trendLong(name){ return trendAt(name,Math.max(10,2*cycleOf(name)+3)); }
/* The plan's own entry for a lift, whichever day or week it lives in. What
   prescribe() needs to answer "and what happens next time" anywhere the name
   is all you have. */
function planExByName(name){
  var k=normName(name), found=null;
  eachPlanEx(function(e){ if(!found&&normName(e.name)===k) found=e; });
  return found;
}
/* Spans every variant: judging the block on half the plan because the other
   week's lifts weren't counted would make deloadCheck() nonsense. */
function trackedLifts(){
  var seen={},out=[];
  eachPlanEx(function(e){
    var k=normName(e.name); if(!seen[k]){ seen[k]=1; out.push(e.name); }
  });
  return out;
}
/* Past this width the long window stops washing the cycle phase out, and no
   threshold can separate "progressing slowly" from "not progressing". Measured
   on flawless runs at 185/225/315/405, worst phase: cycle 7 reads +0.27%,
   cycle 8 +0.15%, cycle 9 +0.02%, cycle 10 −0.05%. A stall reads exactly 0.00,
   so from cycle 9 the two classes touch. Every default tier (5–8, 8–12, 12–16)
   is far inside this; it only bites a range widened by hand. */
var DELOAD_MAX_CYCLE=8;
/* Everything deloadCheck() looked at and what it concluded, so the Progress
   tab can say what it is watching instead of going silent. */
function deloadStatus(){
  var judged=[], stalled=[], waiting=0, wide=[];
  trackedLifts().forEach(function(n){
    if(cycleOf(n)>DELOAD_MAX_CYCLE){ wide.push(n); return; }
    var t=trendLong(n);
    /* Six sessions before this gets an opinion. Below that the long horizon
       collapses to the short one and the phase problem comes back. */
    if(t.state==="new"||t.n<6){ waiting++; return; }
    judged.push(n);
    /* Not the "up" label — that band includes real but slow progress, and
       counting it as stalled is how a working plan gets told to deload. */
    if(t.pct<=0) stalled.push({name:n,t:t});
  });
  return {judged:judged,stalled:stalled,waiting:waiting,wide:wide,
          tracked:judged.length+waiting+wide.length};
}
function deloadCheck(){
  if(inDeloadWeek()) return null;
  if(Date.now()<(S.settings.deloadSnooze||0)) return null;
  var st=deloadStatus();
  if(st.judged.length<3) return null;
  var ratio=st.stalled.length/st.judged.length;
  if(ratio>=0.6) return {level:"high",stalled:st.stalled,judged:st.judged.length};
  if(ratio>=0.4) return {level:"watch",stalled:st.stalled,judged:st.judged.length};
  return null;
}

/* ---- deliberate deload ---- */
function inDeloadWeek(){ return Date.now()<(S.settings.deloadUntil||0); }
/* Deload sessions are left out of every trend (exWorking), so the moment a
   deload week ends deloadStatus() sees exactly the data that asked for it and
   asks again — simulated after an illness, 10.8 deload weeks in a year, 8.8 of
   them back to back. Stay quiet for three weeks after one, so there are new
   working sessions to judge. */
var DELOAD_QUIET=21*864e5;
function startDeloadWeek(days){
  S.settings.deloadUntil=Date.now()+(days||7)*864e5;
  S.settings.deloadSnooze=S.settings.deloadUntil+DELOAD_QUIET;
  writeNow();
}
function endDeloadWeek(){
  S.settings.deloadUntil=0;
  S.settings.deloadSnooze=Date.now()+DELOAD_QUIET;
  writeNow();
}

/* ============================ plates ============================
   `bar` on an exercise is the weight of the empty bar, and 0 means the
   exercise isn't a loaded barbell at all — that's the whole flag. The
   inventory is counted in PAIRS, because you load a bar symmetrically and
   thinking in pairs is what you actually do on the gym floor.
   ================================================================ */
function defaultPlates(u){
  return u==="kg"
    ? [{w:25,n:4},{w:20,n:1},{w:15,n:1},{w:10,n:2},{w:5,n:2},{w:2.5,n:2},{w:1.25,n:2}]
    : [{w:45,n:4},{w:35,n:1},{w:25,n:2},{w:10,n:2},{w:5,n:2},{w:2.5,n:2}];
}
function defaultBar(u){ return u==="kg"?20:45; }

/* ---- changing units ----
   Flipping lb → kg used to relabel and nothing else, so a 225 lb squat became
   a "225 kg" squat: every number in the log silently changed meaning, and the
   bar and plate inventory were left stranded in the old unit. Both readings of
   the switch are legitimate — "convert my log" and "the numbers were already
   kg, the label was wrong" — and the app cannot tell them apart, so it asks
   instead of guessing. Either way the bar and plates end up in the new unit,
   which is the half that was simply broken. */
var LB_PER_KG=0.45359237;

/* Reps, seconds and distance are not weights and are never touched. `load` is
   converted alongside `w` so the pair stays coherent — it is a resolved weight,
   not a derived-on-read value. */
function convertUnits(to){
  var f=(to==="kg")?LB_PER_KG:(1/LB_PER_KG);
  var oldBar=num(S.settings.bar);
  function cv(v){ var n=num(v); return n?round(n*f,1):n; }
  /* A bar that was the standard one snaps to the new standard: converting it
     gives a 20.4 kg bar, and plate maths against 20.4 with real kg plates is
     inexact on every single lift. A genuinely custom bar — a trap bar, a
     safety squat bar — is converted, because there is no standard to snap to. */
  function cvBar(v){
    var n=num(v);
    if(!n) return n;
    return (n===oldBar||n===defaultBar(to==="kg"?"lb":"kg"))?defaultBar(to):cv(n);
  }
  /* A session exercise also carries weights that aren't sets: the shadow
     prescription and last time's first set, behind "Use" and "Keep". Left
     behind, a mid-workout switch to kg made Use fill 65 kg where 65 lb was
     meant, and the shadow outcome in history read against the wrong unit. */
  function cvEx(e){
    e.inc=e.inc?cv(e.inc):e.inc; e.bar=cvBar(e.bar);
    if(e.startW) e.startW=cv(e.startW);          // the coach's suggested first weight is a weight too
    if(e.shadow&&num(e.shadow.w)) e.shadow.w=cv(e.shadow.w);
    if(e.lastW) e.lastW=cv(e.lastW);
  }
  function cvSets(sets){
    (sets||[]).forEach(function(s){
      if(s.w!==""&&s.w!==null&&s.w!==undefined) s.w=String(cv(s.w));
      if(s.load!==undefined&&s.load!==null) s.load=cv(s.load);
    });
  }
  S.sessions.forEach(function(sess){
    sess.bw=cv(sess.bw);
    sess.exercises.forEach(function(e){ cvEx(e); cvSets(e.sets); });
  });
  if(S.active){
    S.active.bw=cv(S.active.bw);
    S.active.exercises.forEach(function(e){ cvEx(e); cvSets(e.sets); });
  }
  eachPlanEx(cvEx,{backup:true});                 // the kept plan too, or Switch back brings a 45 kg bar
  coachState().proposals.forEach(function(p){ delete p.undo; });   // saved rows are in the old unit
  S.settings.bodyweight=cv(S.settings.bodyweight);
  S.settings.inc=cv(S.settings.inc)||defaultInc(to);
}
function defaultInc(u){ return u==="kg"?2.5:5; }

function setUnit(to,convert){
  /* A full snapshot, because this rewrites every weight in the log and an undo
     that re-derives would be a second chance to get the maths wrong. */
  var before=JSON.parse(JSON.stringify(S));
  if(convert) convertUnits(to);
  S.settings.unit=to;
  /* Both paths land the bar and plates in the new unit: converting gives you
     20.4 kg plates, which don't exist, and relabelling means the numbers were
     already in the new unit so a 45 "kg" bar was never right either. */
  S.settings.bar=defaultBar(to);
  S.settings.plates=defaultPlates(to);
  recomputePRs();
  writeNow(); viewPrefs();
  toastUndo(convert?("Log converted to "+to):("Now labelled "+to),function(){
    S=before; recomputePRs(); writeNow(); render();
    toast("Units put back");
  });
}

function unitSheet(from,to){
  var n=S.sessions.length;
  sheet('<h3>Switch to '+esc(to)+'?</h3>'+
    '<div class="sub">'+(n
      ? "You have "+plural(n,"session")+" logged in "+esc(from)+"."
      : "Your plan is set up in "+esc(from)+".")+
      ' The app can\'t tell which of these you mean, so it won\'t guess.</div>'+
    '<div class="menu">'+
      '<button data-x="conv"><b>Convert my log to '+esc(to)+'</b>'+
        '<span class="h">every weight ×'+(to==="kg"?"0.45":"2.2")+'</span></button>'+
      '<button data-x="label"><b>Just change the label</b>'+
        '<span class="h">numbers stay as they are</span></button>'+
    '</div>'+
    '<div class="tiny muted" style="margin:10px 0 0">Converting multiplies every logged weight, '+
      'so a '+(from==="lb"?"225 lb":"100 kg")+' lift reads '+(from==="lb"?"102.1 kg":"220.5 lb")+
      ' afterwards. Relabelling leaves the numbers alone — use it only if they were already in '+esc(to)+
      '. Either way your bar and plates are reset to the standard '+esc(to)+' set, and a backup file is '+
      'saved first. Ten seconds to undo.</div>'+
    '<button class="btn ghost block" style="margin-top:10px" data-x="cancel">Cancel</button>',
    function(el){
      function go(convert){
        /* Still inside the tap, which is what a download needs. */
        try{ downloadBackup(payload(),true); }catch(e){}
        closeSheet(); setUnit(to,convert);
      }
      $('[data-x="conv"]',el).onclick=function(){ go(true); };
      $('[data-x="label"]',el).onclick=function(){ go(false); };
      $('[data-x="cancel"]',el).onclick=function(){ closeSheet(); viewPrefs(); };
    });
}
function barOf(ex){ var b=num(ex&&ex.bar); return b>0?b:0; }
function plateInv(){
  return (S.settings.plates||[])
    .filter(function(p){ return num(p.w)>0&&num(p.n)>0; })
    .sort(function(a,b){ return num(b.w)-num(a.w); });
}

/* Greedy from the heaviest plate down, bounded by how many pairs you own.
   Greedy is optimal for every real plate set (each denomination divides the
   ones above it), and where it isn't we say so instead of pretending. */
function platesFor(target,bar){
  var per=(num(target)-num(bar))/2, out=[], got=0;
  if(!(per>0)) return {list:[],per:per,got:num(bar),exact:per===0};
  plateInv().forEach(function(p){
    var w=num(p.w), n=Math.min(num(p.n),Math.floor((per-got+1e-9)/w));
    if(n>0){ out.push({w:w,n:n}); got+=n*w; }
  });
  return {list:out,per:per,got:num(bar)+got*2,exact:Math.abs(got-per)<1e-9};
}

/* Everything on the set row's second line. Returns inner HTML only — the
   .plates node itself is never replaced, so nothing on the logging path loses
   DOM identity. The RPE chip re-enables pointer events on itself; the rest of
   the line stays inert so it can't steal a tap meant for the tick. */
function rowExtras(ex,s){
  var pl=plateHint(ex,s), rp="";
  if(S.settings.rpe&&s.done)
    rp='<button class="rpe'+(num(s.rpe)?" set":"")+'" data-act="rpe" aria-label="Rate how hard that set was">'+
      (num(s.rpe)?"RPE "+fmt(s.rpe):"RPE")+'</button>';
  if(!pl&&!rp) return "";              // keeps .plates:empty hiding the row
  return '<span class="ptext">'+pl+'</span>'+rp;
}

/* The plate line. Returns inner HTML only. */
function plateHint(ex,s){
  var bar=barOf(ex);
  if(!bar||bwMode(ex)!==0) return "";
  var w=num(s.w);
  if(!w) return "";
  if(w<bar) return '<span class="off">under the '+fmt(bar)+' bar</span>';
  var r=platesFor(w,bar);
  if(!r.list.length) return '<span class="lb">SIDE</span>bar only';
  return '<span class="lb">SIDE</span>'+
    r.list.map(function(p){ return fmt(p.w)+(p.n>1?'<i>×'+p.n+'</i>':""); }).join("  ")+
    (r.exact?"":' <span class="off">= '+fmt(r.got)+'</span>');
}

/* ============================ muscle groups ============================
   `mg` is the main muscle (one, or "") and `mg2` is a list of helpers.
   A working set counts 1.0 toward the main muscle and 0.5 toward each helper.
   Full credit for everything is how volume trackers lie to you: three sets of
   bench would read as three chest AND three triceps AND three shoulders, and
   suddenly you're "doing" 40 triceps sets a week.
   ====================================================================== */
var MUSCLES=[
  {k:"chest",   n:"Chest"},
  {k:"back",    n:"Back"},
  {k:"traps",   n:"Traps"},
  {k:"delts",   n:"Shoulders"},
  {k:"biceps",  n:"Biceps"},
  {k:"triceps", n:"Triceps"},
  {k:"forearms",n:"Forearms"},
  {k:"quads",   n:"Quads"},
  {k:"hams",    n:"Hamstrings"},
  {k:"glutes",  n:"Glutes"},
  {k:"calves",  n:"Calves"},
  {k:"core",    n:"Core"}
];
function muscleName(k){
  for(var i=0;i<MUSCLES.length;i++) if(MUSCLES[i].k===k) return MUSCLES[i].n;
  return "";
}
function isMuscle(k){ return !!muscleName(k); }

/* First match wins, so the order is the specification: "leg curl" has to be
   caught before "curl", "upright row" before "row". */
var MG_GUESS=[
  [/leg\s*curl|lying\s*curl|nordic|ham(string)?\s*curl/i, "hams",   []],
  [/rdl|romanian|good\s?morning|stiff.?leg/i,             "hams",   ["glutes","back"]],
  [/deadlift|dead\s*lift/i,                               "back",   ["hams","glutes","traps"]],
  [/hip\s*thrust|glute\s*(bridge|kick)|hyperextension|back\s*extension/i,"glutes",["hams"]],
  [/leg\s*extension|knee\s*extension/i,                   "quads",  []],
  [/squat|leg\s*press|lunge|step.?up|hack|sissy/i,        "quads",  ["glutes","hams"]],
  [/calf|calve|toe\s*press/i,                             "calves", []],
  [/shrug/i,                                              "traps",  []],
  [/upright\s*row|lateral\s*raise|side\s*raise|front\s*raise/i,"delts",[]],
  [/rear\s*delt|face\s*pull|reverse\s*(fly|flye|pec)/i,   "delts",  ["back","traps"]],
  [/overhead\s*press|\bohp\b|shoulder\s*press|military|arnold/i,"delts",["triceps"]],
  /* A fly is shoulder horizontal adduction with the elbow fixed: chest, with
     front delts helping, and no triceps. It shared the press row and handed
     triceps half a set per set of flies (external review, Argon). After the
     rear-delt row, so a reverse fly is still delts. */
  [/\bfly\b|flye|pec\s*deck|\bpec\b/i,                 "chest",  ["delts"]],
  [/bench|chest\s*press|push.?up|\bdips?\b/i,           "chest",  ["triceps","delts"]],
  /* Generic presses, but only after the overhead and leg variants above have
     had their turn — and only when the word "press" is actually there, so
     "incline dumbbell curl" still falls through to biceps. */
  [/(incline|decline|floor|dumbbell|\bdb\b)[\w\s-]*press/i,"chest",["triceps","delts"]],
  [/pull.?up|chin.?up|pull.?down|lat\s*pull|pullover|\brow\b|rows/i,"back",["biceps"]],
  [/tricep|skull\s?crusher|push.?down|press.?down|kick.?back|jm\s*press|close.?grip/i,"triceps",[]],
  [/curl/i,                                               "biceps", ["forearms"]],
  [/wrist|\bgrip\b|farmer|hang(ing)?\s*hold/i,            "forearms",[]],
  [/plank|crunch|sit.?up|leg\s*raise|ab\s*(wheel|roll)|russian\s*twist|woodchop|pallof|\bcore\b|\babs?\b/i,"core",[]]
];
function guessMuscles(name){
  var n=String(name||"");
  for(var i=0;i<MG_GUESS.length;i++)
    if(MG_GUESS[i][0].test(n)) return {mg:MG_GUESS[i][1], mg2:MG_GUESS[i][2].slice()};
  return {mg:"", mg2:[]};
}

/* ---- how a movement wants to be programmed ----
   A cable curl and a deadlift do not want the same rep range, and everything
   used to arrive at the one global default. Ordered like MG_GUESS: first match
   wins, so specific patterns come before general ones. */
var MOVE_CLASS=[
  [/upright\s*row|leg\s*curl|leg\s*extension|knee\s*extension/i,          "iso"],
  [/calf|calve|toe\s*press|shrug/i,                                       "iso"],
  [/raise|\bfly\b|flye|pec\s*deck|rear\s*delt|face\s*pull|reverse\s*(fly|flye|pec)/i,"iso"],
  [/curl|push.?down|press.?down|kick.?back|skull|pullover|wrist|\bgrip\b/i,"iso"],
  [/crunch|sit.?up|ab\s*(wheel|roll)|russian\s*twist|woodchop|pallof/i,    "iso"],
  [/squat|deadlift|dead\s*lift|rdl|romanian|good\s?morning|stiff.?leg/i,  "heavy"],
  [/bench|chest\s*press|overhead\s*press|\bohp\b|shoulder\s*press|military/i,"heavy"],
  [/\brow\b|rows|pendlay|pull.?up|chin.?up|\bdips?\b/i,                   "heavy"]
];
/* Anything loaded by hand or off a stack is not a heavy barbell lift whatever
   the movement is called: a dumbbell bench press belongs in the middle tier. */
var MOVE_LIGHT=/dumbbell|\bdb\b|machine|cable|smith|hammer\s*strength|band|kettlebell|\bkb\b/i;

function movementClass(name){
  var n=String(name||"");
  for(var i=0;i<MOVE_CLASS.length;i++){
    if(!MOVE_CLASS[i][0].test(n)) continue;
    var c=MOVE_CLASS[i][1];
    return (c==="heavy"&&MOVE_LIGHT.test(n))?"compound":c;
  }
  return "compound";
}

/* The rep range a new exercise starts at.

   settings.repLow/repHigh stays the spec for an ordinary compound and the
   other tiers are derived from it, so one setting still steers the whole plan
   rather than the app growing three of them. Timed work is the exception: a
   plank measured in seconds has nothing to do with a rep count, and arriving
   as "8–12 seconds" was nonsense.

   Every one of these is a default, not a rule — the range is two taps away in
   the exercise's own menu. */
function defaultRange(name,met){
  var s=S.settings;
  var low=Math.max(1,num(s.repLow)||8);
  var top=Math.max(low+1,num(s.repHigh)||12);
  if(num(met)===1){ low=30; top=60; }
  else{
    var c=movementClass(name);
    if(c==="heavy"){ low=Math.max(1,low-3); top=Math.max(low+1,top-4); }
    else if(c==="iso"){ low=low+4; top=top+4; }
  }
  if(!s.doubleDefault) top=0;
  return {low:low, top:top, cls:num(met)===1?"time":movementClass(name)};
}
/* How much reps-first room a range gives. Used when fitting a range onto an
   exercise that already has a bottom you train at, where moving that bottom
   would quietly change the programme. */
function rangeWidth(name,met){
  var r=defaultRange(name,met);
  return Math.max(1,(r.top||r.low+4)-r.low);
}

/* Which of the two progressions an exercise is actually on, in words. The only
   signal used to be "range" versus "target" on the card, which is not a signal
   — an exercise silently running straight sets looks exactly like one that is
   climbing reps. */
function modeHint(ex){
  var met=metricOf(ex), n=metricNoun(met);
  var lo=Math.max(1,num(ex.reps)), tp=num(ex.repTop)||0;
  if(tp>lo)
    return "Climbing "+n+" from "+lo+" to "+tp+" before the weight goes up.";
  return "Straight sets — the weight goes up as soon as you hit "+lo+" "+n+
         " on every set. Fill the second box to climb "+n+" first.";
}

/* Every plan exercise is built here. This object literal used to be written
   out in five places and two of them quietly dropped bar, metric and the
   muscle tags — so an exercise promoted from a session lost its plate maths
   and stopped counting toward the right muscle. One constructor means the next
   field added to the model can't be forgotten in one of them. */
function newPlanEx(name){
  var last=lastPerf(name), mgN=tagsOf({name:name});
  var met=last?metricOf(last):guessMetric(name);
  var rng=defaultRange(name,met);
  /* With double progression off there is no range to sit in, so the single
     target follows what you last did rather than a setting. */
  var low=rng.top?rng.low:(last?num(last.sets[0].r)||rng.low:rng.low);
  return {
    id:uid(), name:name,
    sets:last?last.sets.length:3,
    reps:Math.max(1,low), repTop:rng.top,
    inc:null,
    bw:last?bwMode(last):0,
    bar:(last&&last.bar!==undefined)?barOf(last):guessBar(name),
    metric:met,
    link:false,
    mg:mgN.mg, mg2:(mgN.mg2||[]).slice(),
    added:Date.now()          // when the row joined the plan; the coach's skipped-lift rule won't judge a row younger than its window
  };
}

/* Promoting an exercise you added mid-session into the plan. Carries every
   field the session copy holds, which is the half that kept getting missed. */
function planExFromSession(ex){
  return {
    id:uid(), name:ex.name,
    sets:Math.max(1,working(ex.sets).length),
    reps:Math.max(1,num(ex.reps)||num(ex.targetReps)||8),
    repTop:num(ex.repTop)||0,
    inc:ex.inc||null,
    bw:bwMode(ex), bar:barOf(ex), metric:metricOf(ex), link:!!ex.link,
    mg:ex.mg||"", mg2:(ex.mg2||[]).slice(),
    added:Date.now()
  };
}

/* Tags live on the exercise, but history logged before this feature has none —
   and a report that says "0 sets, ever" would be worse than useless. So an
   untagged exercise falls back to however that lift is tagged in the plan
   today, and failing that to the name guess. */
function mgIndex(){
  var idx={};
  eachPlanEx(function(e){
    if(e.mg||(e.mg2&&e.mg2.length)) idx[normName(e.name)]={mg:e.mg||"",mg2:e.mg2||[]};
  });
  return idx;
}
function tagsOf(ex,idx){
  if(ex.mg||(ex.mg2&&ex.mg2.length)) return {mg:ex.mg||"",mg2:ex.mg2||[]};
  var t=(idx||mgIndex())[normName(ex.name)];
  return t?t:guessMuscles(ex.name);
}
function tagLabel(t){
  if(!t.mg&&!t.mg2.length) return "";
  var s=t.mg?muscleName(t.mg):"—";
  if(t.mg2.length) s+=" + "+t.mg2.map(muscleName).filter(Boolean).join(", ");
  return s;
}

/* Weekly sets per muscle, the headline hypertrophy number. Deload sessions
   count: you still did the sets. */
function setsByMuscle(a,b){
  var idx=mgIndex(), out={}, untagged=0;
  MUSCLES.forEach(function(m){ out[m.k]=0; });
  S.sessions.forEach(function(s){
    if(s.ts<a||s.ts>=b) return;
    s.exercises.forEach(function(e){
      var n=working(e.sets).filter(function(x){ return x.done!==false; }).length;
      if(!n) return;
      var t=tagsOf(e,idx);
      var main=isMuscle(t.mg)?t.mg:"";
      var sec=(t.mg2||[]).filter(isMuscle);
      if(!main&&!sec.length){ untagged+=n; return; }
      if(main) out[main]+=n;
      sec.forEach(function(k){ out[k]+=n*0.5; });
    });
  });
  return {by:out, untagged:untagged};
}

/* Only guessed for brand-new exercises, and always editable afterwards. */
var BAR_YES=/barbell|squat|bench|deadlift|dead lift|romanian|rdl|overhead press|ohp|military|hip thrust|clean|snatch|good ?morning|pendlay|jm press|floor press/i;
var BAR_NO=/dumbbell|\bdb\b|machine|cable|smith|kettlebell|\bkb\b|band|goblet|hack|leg press|pendulum|belt squat|bodyweight|assisted|landmine/i;
function guessBar(name){
  var n=String(name||"");
  if(BAR_NO.test(n)) return 0;
  return BAR_YES.test(n)?(num(S.settings.bar)||defaultBar(unit())):0;
}

function weekBounds(offset){
  var d=new Date(); d.setHours(0,0,0,0);
  var dow=(d.getDay()+6)%7;                 // Monday = 0
  d.setDate(d.getDate()-dow-7*(offset||0));
  var start=d.getTime();
  return {start:start,end:start+7*864e5};
}
function volumeInRange(a,b){
  var v=0,n=0;
  S.sessions.forEach(function(s){
    if(s.ts>=a&&s.ts<b){ n++; s.exercises.forEach(function(e){ v+=exVolume(e); }); }
  });
  return {v:v,n:n};
}

/* Every lift's best set by estimated 1RM, newest record first — the screen
   you actually want to look at after a good session. */
function prBoard(){
  var out=[];
  allExerciseNames().forEach(function(x){
    var best=null, bestV=0, bestTs=0, bestBw=0, bestMet=0;
    exSessions(x.name).forEach(function(s){
      s.sets.forEach(function(st){
        var v=setScore(st,s.metric);
        if(v>bestV){ bestV=v; best=st; bestTs=s.ts; bestBw=s.bw; bestMet=s.metric; }
      });
    });
    if(best) out.push({name:x.name,set:best,e:bestV,ts:bestTs,bw:bestBw,metric:bestMet});
  });
  return out.sort(function(a,b){ return b.ts-a.ts||b.e-a.e; });
}

/* Month grid, Monday-first to match weekBounds(). Returns 7-wide rows of
   {day, ts, sessions[]} with nulls for the leading and trailing padding. */
function monthGrid(offset){
  var now=new Date();
  var m=new Date(now.getFullYear(),now.getMonth()-(offset||0),1);
  var year=m.getFullYear(), mon=m.getMonth();
  var first=(new Date(year,mon,1).getDay()+6)%7;         // Monday = 0
  var days=new Date(year,mon+1,0).getDate();
  var byDay={};
  S.sessions.forEach(function(s){
    var d=new Date(s.ts);
    if(d.getFullYear()===year&&d.getMonth()===mon){
      (byDay[d.getDate()]=byDay[d.getDate()]||[]).push(s);
    }
  });
  var cells=[],i;
  for(i=0;i<first;i++) cells.push(null);
  for(i=1;i<=days;i++) cells.push({day:i,ts:new Date(year,mon,i).getTime(),sessions:byDay[i]||[]});
  while(cells.length%7) cells.push(null);
  var rows=[];
  for(i=0;i<cells.length;i+=7) rows.push(cells.slice(i,i+7));
  var trained=Object.keys(byDay).length;
  var n=0; Object.keys(byDay).forEach(function(k){ n+=byDay[k].length; });
  return {rows:rows, label:m.toLocaleDateString(undefined,{month:"long",year:"numeric"}),
          trained:trained, sessions:n, days:days, year:year, mon:mon,
          isCurrent:(offset||0)===0};
}

/* ============================ the progression engine ============================
   Read what you actually did last time, then decide today. All derived from
   history, so nothing can drift out of sync.

     double progression : hold the weight until every working set reaches the top
                          of the range, then add load and drop back to the bottom
     straight sets      : hit the target on every set, then add load
     autoregulation     : a lift sliding for 3 sessions gets one 10% back-off —
                          once, not compounding, and never more than MAX_CUT
     deload week        : while one is running, everything goes light and short
   ============================================================================== */
function stepFor(ex){ return num(ex.inc)||num(S.settings.inc)||5; }

/* On assisted work the number is help, so progress means the number goes DOWN.
   Everywhere else harder means the number goes up. */
function harder(w,step,mode){ return mode===2?Math.max(0,w-step):w+step; }
function easier(w,step,mode){
  if(mode===2) return w+step;                 // more assistance
  var back=Math.round(w*0.9/step)*step;       // roughly 10% off, on the step grid
  if(back>=w) back=w-step;
  return Math.max(0,back);
}
function harderPhrase(step,mode){
  return mode===2 ? "take "+fmt(step)+" "+unit()+" off the assist"
                  : "add "+fmt(step)+" "+unit();
}
/* "12s" for twelve reps, "60s" for sixty seconds — both read naturally.
   Distance has no such suffix. */
function amtText(v,m){ return m===2?String(v):(v+"s"); }
function rpeMean(sets){
  var v=(sets||[]).filter(function(s){ return num(s.rpe)>0; });
  if(!v.length||v.length*2<sets.length) return 0;
  return v.reduce(function(a,s){ return a+num(s.rpe); },0)/v.length;
}

/* The load a session was trained at: the one most of its working sets were
   done at, ties going to the heavier (on assisted work, the less help). Not
   the first set — a ramp starts light and a top set with back-offs ends
   light, and reading the wrong end judged 225×8, 185×8, 135×8 as three
   eights at 225 and prescribed 135 after 130/150/170. Not the heaviest set
   either — one test set at 170 between two at 150 is not the working weight.
   A blank weight on plain loaded work is a set nobody retyped, not a set at
   zero; on bodyweight work blank genuinely means no added load. */
function blankW(s,mode){ return mode===0&&(s.w==null||String(s.w).trim()===""); }
function heavierLoad(a,b,mode){ return mode===2?a<b:a>b; }
function workLoad(sets,mode){
  var n={}, best=null;
  sets.forEach(function(s){
    if(blankW(s,mode)) return;
    var v=num(s.w); n[v]=(n[v]||0)+1;
    if(best===null||n[v]>n[best]||(n[v]===n[best]&&heavierLoad(v,best,mode))) best=v;
  });
  return best===null?0:best;
}
function isAt(s,w,mode){ return blankW(s,mode)||num(s.w)===w; }
/* Lighter sets BEFORE the first one at the working load are a ramp —
   warm-ups logged without the warm-up flag — and say nothing about it, the
   same way a session with fewer sets than planned is judged on the sets it
   has. Lighter sets AFTER it are back-offs or a weight dropped mid-exercise,
   and those are what prescribe() holds on. Counting the ramp too would hold
   anyone who pyramids up at the same weight for ever. Heavier sets anywhere
   are a bonus, not a verdict on the working load. */
function droppedSets(sets,w,mode){
  var seen=false, n=0;
  sets.forEach(function(s){
    if(isAt(s,w,mode)) seen=true;
    else if(seen&&!blankW(s,mode)&&heavierLoad(w,num(s.w),mode)) n++;
  });
  return n;
}

/* A 10% cut on the step grid is fine on a 185 lb bar and brutal on a 15 lb
   dumbbell, where the grid rounds it to a third (and a 5 lb one to zero).
   Past this the slide is answered with a set, not with load. */
var MAX_CUT=0.2;

/* ---- v25: a jump that was tried and failed is remembered, read from the log ----
   A fixed 5 lb step is 33% of a 15 lb raise and 50% of a 10 lb fly. Simulated
   over a year, prescribe() took the raise to 20 and then said "fell short — run
   it back" for a median 34 weeks, and the rep-out shadow flipped load up and
   down 198 times. Both now (a) step back when a jump observably fails and
   (b) don't retry it until the reps at the lighter load have recovered what
   that jump cost — measured from what happened, not predicted from Epley,
   which is what made the v22 jump check wrong on the real log. */
function repsAt(h,w,mode,best){
  var v=h.sets.filter(function(s){ return isAt(s,w,mode); }).map(function(s){ return num(s.r); });
  if(!v.length) return 0;
  return best?Math.max.apply(null,v):Math.min.apply(null,v);
}
/* True when the lifter stepped up to W and has met the bottom of the range at
   every session since — the case where a "down" trend is the double-progression
   reset, not a decline. */
function steppedUpAndMaking(hist,W,mode,low){
  for(var i=0;i<hist.length;i++){
    var wi=workLoad(hist[i].sets,mode);
    if(wi!==W) return i>0&&heavierLoad(W,wi,mode);
    if(repsAt(hist[i],W,mode)<low) return false;
  }
  return false;
}
/* Newest exposure (index ≥ 1) heavier than W whose previous one was at W. */
function jumpAwayFrom(hist,W,mode){
  for(var i=1;i+1<hist.length;i++){
    var Wi=workLoad(hist[i].sets,mode);
    if(heavierLoad(Wi,W,mode)&&workLoad(hist[i+1].sets,mode)===W) return {i:i,w:Wi};
  }
  return null;
}

/* v26.1 (independent review, tools/review): one lift, two ranges. The plan can
   hold the same lift at different ranges on different days — Nick's lateral
   raise is 4×12–20 on Day A and 3×8–12 on Day B — and both rows read one
   history. Topping out the 12–20 day stepped the 8–12 day up; the 12–20 day
   then missed its bottom at the new load and was cut back. Simulated over a
   year, that was 9.9 load cuts per lifter-year on the raise and a cut-fail-cut
   spiral in 96% of lifter-years; the real log bounces 10/15/20. When the plan
   holds a lift at more than one range, each row reads the exposures done at
   its own range, falling back to all of them until there is one. A range
   changed for good (one range in the plan) keeps its whole history. */
function rangeHist(hist,name,ex){
  var k=normName(name), seen={}, n=0;
  eachPlanEx(function(e){
    if(normName(e.name)!==k) return;
    var key=num(e.reps)+"-"+num(e.repTop); if(!seen[key]){ seen[key]=1; n++; }
  });
  if(n<2) return hist;
  var lo=num(ex.reps), top=num(ex.repTop);
  var same=hist.filter(function(h){ return h.lo===lo&&h.top===top; });
  return same.length?same:hist;
}

function prescribe(name,ex){
  var step=stepFor(ex);
  var met=metricOf(ex);
  var rstep=metricStep(met);
  var low=Math.max(1,num(ex.reps)||num(S.settings.repLow)||8);
  var top=num(ex.repTop)||0;
  var mode=bwMode(ex);
  var nsets=Math.max(1,num(ex.sets)||3);
  var hist=rangeHist(exWorking(name),name,ex);
  var last=hist[0];
  if(!last){
    /* v26: a lift the coach swapped in has no history to read, so the plan row
       carries a conservative starting weight (coachStartW). This branch only. */
    var sw=num(ex.startW);
    if(sw>0&&mode===0&&met===0)
      return {w:sw,r:low,sets:nsets,why:"First time — start around "+fmt(sw)+" and find your "+low,kind:"new"};
    return {w:"",r:low,sets:nsets,why:"",kind:"new"};
  }

  var w=workLoad(last.sets,mode);
  var at=last.sets.filter(function(s){ return isAt(s,w,mode); });
  /* Only the sets at the working load say anything about it. A back-off set
     of 8 at 185 is not an 8 at 225, and a dropped set of 6 at 185 is not a
     miss at 225 either. */
  var minR=Math.min.apply(null,at.map(function(s){ return num(s.r); }));
  /* Reps keep climbing while held — never pinned to the bottom (trap 17b). */
  var climb=(top>low&&minR>=low)?Math.min(top,minR+rstep):low;

  if(inDeloadWeek()){
    return {w:easier(w,step,mode),r:low,sets:Math.max(1,Math.round(nsets*0.6)),
            why:"Deload week — light and short on purpose",kind:"deload"};
  }

  /* Not straight after a step up that is being made. The trend is read from
     sets stopped at their target, so after a long climb the reset that
     follows a load step reads as a decline: since at least v23 a lifter
     getting stronger every session, who made 190×8 and 190×9 at the new
     load, was cut to 170 (t28). A same-weight slide still gets its back-off. */
  if(trend(name).state==="down"&&!steppedUpAndMaking(hist,w,mode,low)){
    /* One cut, then hold and rebuild — and the two halves of that have to be
       measured over the SAME window, or they fight each other.

       The guard used to look at the last 3 sessions while the verdict it
       guards is a slope over cycle+3 (≈9). Three obedient sessions at the cut
       weight pushed every heavier one out of the lookback, so "already backed
       off" went false while the slope still contained the pre-cut scores and
       stayed down — a second cut, then a third, every 4 sessions. Simulated
       closed-loop, that walked a lifter whose true 1RM was *rising* from
       190 lb to 115. The guard window must be at least the trend window:
       never cut again while today's load is still below the best working
       load anywhere the "down" verdict was computed from. */
    var recent=hist.slice(1,1+trendWin(name)).map(function(h){ return workLoad(h.sets,mode); });
    /* On assisted work the best session is the one with the LEAST help, so
       "peak" inverts with the load direction like harder()/easier() do. */
    var peak=recent.length?(mode===2?Math.min.apply(null,recent):Math.max.apply(null,recent)):w;
    var alreadyDown=mode===2?(w>peak):(w<peak);
    if(alreadyDown)
      /* Hold the load, but let the reps keep climbing. Pinning them to the
         bottom of the range every session meant an obedient lifter could never
         produce a rising e1RM — the hold suppressed exactly the evidence that
         would clear the verdict, so the verdict never cleared. */
      /* Same hold either way; say who backed off. When the heavier sessions
         in the window all predate a drop he chose (sinceChosenDrop), "already
         backed off" credits the app with his decision. External review
         (Argon) proposed reading the guard from sinceChosenDrop() instead —
         on the real log that turns this hold into a 10% cut (55 → 50) off a
         four-session dip after a 25-day gap, so only the words change. */
      return {w:w,r:climb,sets:nsets,
              why:sinceChosenDrop(hist).slice(1).some(function(h){ return heavierLoad(workLoad(h.sets,mode),w,mode); })||
                  sinceChosenDrop(hist).length===hist.length?
                  "Already backed off — beat this before adding":
                  "You dropped to "+fmt(w)+" — build reps here before adding",kind:"hold"};
    if(mode===1&&w<=0)
      return {w:0,r:climb,sets:Math.max(1,nsets-1),
              why:"Sliding 3 sessions — drop a set rather than adding load",kind:"deload"};
    var back=easier(w,step,mode);
    /* On a light dumbbell the step grid turns 10% into a third, or into
       nothing at all (5 lb "backed off to 0"). Take a set instead, and keep
       the reps free to climb so a recovered lifter can clear the verdict —
       the same reason the hold above doesn't pin them. */
    if(back===w||(mode!==2&&w-back>w*MAX_CUT))
      return {w:w,r:climb,sets:Math.max(1,nsets-1),why:"Sliding 3 sessions — drop a set this week",kind:"deload"};
    return {w:back,r:low,sets:nsets,why:"Sliding 3 sessions — back off to "+fmt(back),kind:"deload"};
  }

  /* If last time was already a grind, adding load buys a stall. Only fires
     when RPE was actually recorded on at least half the working sets, so it is
     invisible to anyone not using the feature. */
  var rp=rpeMean(last.sets);
  if(rp>=9.5)
    return {w:w,r:Math.max(low,minR),sets:nsets,
            why:"Averaged RPE "+fmt(rp)+" last time — repeat it before adding",kind:"hold"};

  /* A plank or an unloaded carry has nothing to add weight to, so the metric
     itself is the progression axis and the range top is a floor, not a cap. */
  var noLoad=met!==0&&mode===0&&!(w>0);
  var nextR=Math.min(top||1e9,minR+rstep);

  /* Some sets after the first at the working load were lighter: a top set
     and back-offs, or dropping the weight mid-exercise. Adding reps or load on the strength
     of one set would ask for three at a weight that has only ever been done
     once. Get them all there first. */
  var dropped=droppedSets(last.sets,w,mode);
  if(dropped>0&&!noLoad)
    return {w:w,r:(top>low)?Math.max(low,Math.min(top,minR)):low,sets:nsets,
            why:"Only "+at.length+" of "+(at.length+dropped)+" sets at "+entryText({w:w},mode)+" — get them all there first",
            kind:"hold"};

  if(top>low){                                        // double progression
    if(minR>=top){
      if(noLoad) return {w:w,r:minR+rstep,sets:nsets,
              why:"Held "+amtText(top,met)+" on every set — go for "+(minR+rstep),kind:"up"};
      /* The last jump from here failed? Not again until the reps here have
         recovered what it cost, and let them run past the top meanwhile. */
      var jf=jumpAwayFrom(hist,w,mode);
      if(jf&&repsAt(hist[jf.i],jf.w,mode)<low-1){
        var cost=repsAt(hist[jf.i+1],w,mode,true)-repsAt(hist[jf.i],jf.w,mode,true);
        if(repsAt(last,w,mode,true)<low+cost)
          return {w:w,r:minR+rstep,sets:nsets,
                  why:"Building reps before "+fmt(jf.w)+" again (it cost "+cost+" reps last time) — go for "+(minR+rstep),kind:"reps"};
      }
      return {w:harder(w,step,mode),r:low,sets:nsets,
              why:"Hit "+amtText(top,met)+" on every set — "+harderPhrase(step,mode),kind:"up"};
    }
    if(minR>=low)
      return {w:w,r:nextR,sets:nsets,
              why:(noLoad?"Same as last time":"Same weight")+" — go for "+nextR+" this time",kind:"reps"};
    /* Out of reach for now — so step back, rather than "run it back" for
       months. Judged on the BEST set at the load, not the worst: replayed on
       the real log, judging by the worst set cut an incline press after
       65×8,6,4 (fatigue, not failure — next session was 65×8×3) and halved a
       cable fly after 20×10,14,16. Right after a jump, go back to the load
       it came from whatever the percentage, since that load was being made.
       At an established load, only after two sessions in a row and never by
       more than MAX_CUT; a 10 lb step on a 20 lb fly holds instead. Plain
       shortfalls only — never on top of the trend back-off above (17b). */
    if(!noLoad&&hist[1]&&repsAt(last,w,mode,true)<low){
      var w1=workLoad(hist[1].sets,mode), bk=0;
      if(heavierLoad(w,w1,mode)) bk=w1;
      else if(w1===w&&repsAt(hist[1],w,mode,true)<low&&last.lo===hist[1].lo){
        bk=mode===2?w+step:Math.max(0,w-step);
        if(mode!==2&&w-bk>w*MAX_CUT) bk=0;
      }
      if(bk&&bk!==w) return {w:bk,r:low,sets:nsets,
        why:"Couldn't reach "+amtText(low,met)+" at "+fmt(w)+" — back to "+fmt(bk)+" and build up",kind:"deload"};
    }
    return {w:w,r:low,sets:nsets,why:"Fell short of "+amtText(low,met)+" — run it back",kind:"hold"};
  }

  if(minR>=low){                                      // straight sets
    if(noLoad) return {w:w,r:minR+rstep,sets:nsets,
            why:"Hit all "+amtText(low,met)+" — go for "+(minR+rstep),kind:"up"};
    return {w:harder(w,step,mode),r:low,sets:nsets,
            why:"Hit all "+amtText(low,met)+" — "+harderPhrase(step,mode),kind:"up"};
  }
  return {w:w,r:low,sets:nsets,why:"Missed "+amtText(low,met)+" last time — run it back",kind:"hold"};
}

/* ============================ v24: rep-out shadow ============================
   The last working set of a ranged rep exercise is a rep-out: as many as you
   can (compounds stop one short of form breaking, isolation goes to failure).
   That is the one number in the log that measures capacity rather than echoing
   the target, and shadowPrescribe() decides the next session from it alone.

   It is a SHADOW: shown beside prescribe()'s answer, applied only when you
   tap Use, recorded either way, so whether it should replace double
   progression is decided from evidence (ROADMAP v24/v25), not assumed.

   APRE-style (Mann 2010), relative to the range and counted in equipment
   steps. No e1RM anywhere, so it is valid at 12–20 reps where rep-to-1RM
   formulas aren't (Reynolds 2006):
     A < low−1        one step lighter       working sets at low
     low−1 ≤ A < low  hold                   working sets at low
     low ≤ A < top    hold                   working sets at A
     top ≤ A < top+4  one step heavier       working sets at low
     A ≥ top+4        two steps heavier      working sets at low
   The step comes when the rep-out REACHES the top, not when it passes it.
   The rep-out is the last set, already tired by the ones before it, so it
   reads about three reps under fresh capacity; waiting for top+1 asked for
   more reserve than double progression ever does, and in the closed loop
   (t32) a lifter with reserve parked at 195 while v23's engine reached 200.
   Working sets match the rep-out's count for the same reason: sets 1–2 are
   fresher than the set that produced A, so A reps leaves them 2–3 short of
   failure — inside the 1–3 the evidence supports. A−2 left about five.
   =============================================================================== */
var OUT_JUMP2=4;
function repOutApplies(ex){ return metricOf(ex)===0&&num(ex.repTop)>num(ex.reps); }
function repOutHint(name){
  return movementClass(name)==="iso"?"take it to failure":"stop 1 short of form breaking";
}
function repOutOf(h){
  var o=h.sets.filter(function(x){ return x.out; });
  return o.length?o[o.length-1]:null;
}
function shadowPrescribe(name,ex){
  if(inDeloadWeek()||!repOutApplies(ex)) return null;
  var low=Math.max(1,num(ex.reps)), top=num(ex.repTop), mode=bwMode(ex);
  var step=stepFor(ex), nsets=Math.max(1,num(ex.sets)||3);
  var hist=rangeHist(exWorking(name),name,ex), last=hist[0];   // v26.1: own range's exposures (rangeHist)
  var o=last&&repOutOf(last);
  if(!o) return null;
  /* The rep-out has to be AT the working load to say anything about it.
     External review (Argon), confirmed on the real log: after RDL
     225×8, 185×8, 135×8 the shadow read the last set and suggested 135×8;
     after Cable Row 75×8, 75×8, 65×10 it suggested 65. A set dropped after
     the working load is a back-off, not a measurement — hold there exactly
     as prescribe() does, and let the next real rep-out decide. */
  var wl=workLoad(last.sets,mode);
  var W=blankW(o,mode)?wl:num(o.w), A=num(o.r);
  if(W!==wl||droppedSets(last.sets,wl,mode)>0){
    var atW=last.sets.filter(function(x){ return isAt(x,wl,mode); });
    var mr=atW.length?Math.min.apply(null,atW.map(function(x){ return num(x.r); })):low;
    return {w:wl, r:Math.max(low,Math.min(top,mr)), sets:nsets, steps:0, stall:false,
            why:"last set was lighter than "+fmt(wl)+" — hold there and get every set to it"};
  }
  var k=A<low-1?-1:A<top?0:A<top+OUT_JUMP2?1:2;
  var held="";
  /* (b) Two steps only when two steps are a small jump: the +2 rule fired 142
     times in 20 simulated years and every one was over 10% (10 → 20 on a fly).
     Measured on the load actually moved — on assisted work that is bodyweight
     minus the help, not the help. */
  if(k===2&&2*step>0.10*effLoad(W,mode,num(S.settings.bodyweight))) k=1;
  /* (a) The last jump from W failed: don't retry it until the mean of the
     newest two rep-outs at W has recovered what it cost. The cost is smoothed
     over up to three rep-outs before the jump — one noisy pair blocked a
     curl for good in simulation. */
  if(k>0){
    for(var i=1;i+1<hist.length;i++){
      var oh=repOutOf(hist[i]), op=repOutOf(hist[i+1]);
      if(!oh||!op) continue;
      if(heavierLoad(num(oh.w),W,mode)&&num(op.w)===W){
        if(num(oh.r)<low-1){
          var pre=[];
          for(var y=i+1;y<hist.length&&pre.length<3;y++){
            var q=repOutOf(hist[y]); if(!q||num(q.w)!==W) break; pre.push(num(q.r));
          }
          var cost=pre.reduce(function(a,b){ return a+b; },0)/pre.length-num(oh.r);
          var o2=hist[1]&&repOutOf(hist[1]);
          var now2=(o2&&num(o2.w)===W)?(A+num(o2.r))/2:A;
          if(now2<low-1+cost){ k=0; held=num(oh.w); }
        }
        break;
      }
    }
  }
  /* (c) One low rep-out at an established load is a bad day, not a reason to
     cut: step down only straight after a jump, or when the rep-out before
     this one, at this load, was short too. 9.3 → 2.6 false compound cuts a
     year in simulation. */
  var bad=false;
  if(k<0&&hist[1]){
    var pw=workLoad(hist[1].sets,mode), po=repOutOf(hist[1]);
    if(!heavierLoad(W,pw,mode)&&!(po&&num(po.w)===W&&num(po.r)<low)){ k=0; bad=true; }
  }
  var w=W;
  if(k<0) w=mode===2?W+step:Math.max(0,W-step);
  for(var j=0;j<k;j++) w=harder(w,step,mode);
  if(k<0&&w===W) k=0;                        // nothing lighter to go to
  /* While a jump is being earned the working sets follow the rep-out past
     the top — rep progression grows muscle about as well as load (Plotkin
     2022), and it is what earns the jump back. */
  var r=k===0?(held!==""&&A>=top?A:Math.max(low,Math.min(top,A))):low;
  /* A last set that reads exactly the prefilled target says "I ticked it",
     not "that was all I had" — and half of Nick's logged exercises sit
     exactly on target. Taken at face value the method then repeats the same
     number for ever. If every set at the load made that target, ask for one
     more, as double progression would. External review (Argon); simulated
     year: sessions progressing 38% → 55%, and for a lifter who ticks the
     prefill half the time 25% → 58%, with unreachable loads, flips and the
     85% gate unchanged. (Its other two ideas — step compounds at top−1 twice,
     and never lower the target on one low day — were simulated too: the first
     changed nothing, the second made progress slower.) */
  if(k===0&&held===""&&!bad&&A>=low&&last.tgt&&A===last.tgt&&last.tgt<top&&repsAt(last,W,mode)>=last.tgt)
    r=Math.min(top,last.tgt+1);
  var why=held!==""?"last set "+A+" — building reps before "+fmt(held)+" again":
          bad?"last set "+A+", one low day — repeat it":
          k===2?"last set "+A+", well past "+top+" — two steps up":
          k===1?"last set "+A+", at the top — one step up":
          k<0?"last set "+A+", under "+low+" — one step down":
          A<low?"last set "+A+" — repeat it":"last set "+A+" — same weight";
  /* No stall flag (v25). Simulated, the v24 rule fired on ~35% of exposures
     while strength was rising, and a stricter slope rule caught only 47% of
     real plateaus. It comes back with v26's coach, with a rule that can tell
     slow progress from none. */
  return {w:w,r:r,sets:nsets,why:why,steps:k,stall:false};
}

/* ============================ sparkline ============================ */
function spark(canvas,values,opts){
  opts=opts||{};
  var cs=getComputedStyle(document.documentElement);
  var accent=cs.getPropertyValue("--accent").trim()||"#C98A0E";
  var line=cs.getPropertyValue("--line").trim()||"#ccc";
  var dpr=window.devicePixelRatio||1;
  var w=canvas.clientWidth||78, h=canvas.clientHeight||32;
  canvas.width=Math.round(w*dpr); canvas.height=Math.round(h*dpr);
  var c=canvas.getContext("2d");
  c.setTransform(dpr,0,0,dpr,0,0);
  c.clearRect(0,0,w,h);
  if(!values||values.length<2){ c.fillStyle=line; c.fillRect(0,h-1.5,w,1.5); return; }
  var pad=opts.pad||3;
  var mn=Math.min.apply(null,values), mx=Math.max.apply(null,values);
  if(mx-mn<1e-6){ mn-=1; mx+=1; }
  var X=function(i){ return pad+(w-pad*2)*(i/(values.length-1)); };
  var Y=function(v){ return h-pad-(h-pad*2)*((v-mn)/(mx-mn)); };
  if(opts.grid){
    c.strokeStyle=line; c.lineWidth=1; c.globalAlpha=.7;
    for(var g=0;g<=2;g++){
      var y=pad+(h-pad*2)*(g/2)+.5;
      c.beginPath(); c.moveTo(0,y); c.lineTo(w,y); c.stroke();
    }
    c.globalAlpha=1;
  }
  c.beginPath(); c.moveTo(X(0),Y(values[0]));
  for(var i=1;i<values.length;i++) c.lineTo(X(i),Y(values[i]));
  var grad=c.createLinearGradient(0,0,0,h);
  grad.addColorStop(0,hexA(accent,.24)); grad.addColorStop(1,hexA(accent,0));
  c.lineTo(X(values.length-1),h); c.lineTo(X(0),h); c.closePath();
  c.fillStyle=grad; c.fill();
  c.beginPath(); c.moveTo(X(0),Y(values[0]));
  for(var j=1;j<values.length;j++) c.lineTo(X(j),Y(values[j]));
  c.strokeStyle=accent; c.lineWidth=opts.lw||1.8; c.lineJoin="round"; c.lineCap="round"; c.stroke();
  c.beginPath(); c.arc(X(values.length-1),Y(values[values.length-1]),opts.dot||2.6,0,Math.PI*2);
  c.fillStyle=accent; c.fill();
}
function hexA(hex,a){
  hex=hex.replace("#","");
  if(hex.length===3) hex=hex.split("").map(function(x){return x+x;}).join("");
  var n=parseInt(hex,16);
  return "rgba("+((n>>16)&255)+","+((n>>8)&255)+","+(n&255)+","+a+")";
}

/* ============================ rest timer ============================
   The countdown was always wall-clock correct, but the alert never arrived:
   a backgrounded page gets its timers throttled to nothing and vibration is
   ignored outright, so with the phone in a pocket the timer silently did
   nothing. Android Chrome will not freeze a page that is *playing audio*, so
   a rest keeps a near-silent loop running purely to stay alive, and swaps
   that same already-unlocked element to an audible tone at zero.

   Two WAVs are synthesised rather than embedded: keeps the one-file rule and
   costs a few hundred bytes of code instead of a few KB of base64.
   ==================================================================== */
var AU_RATE=8000;
function wavURL(rate,data){
  var n=data.length, buf=new ArrayBuffer(44+n*2), v=new DataView(buf), i;
  function tag(o,s){ for(var j=0;j<s.length;j++) v.setUint8(o+j,s.charCodeAt(j)); }
  tag(0,"RIFF"); v.setUint32(4,36+n*2,true); tag(8,"WAVEfmt ");
  v.setUint32(16,16,true); v.setUint16(20,1,true); v.setUint16(22,1,true);
  v.setUint32(24,rate,true); v.setUint32(28,rate*2,true);
  v.setUint16(32,2,true); v.setUint16(34,16,true);
  tag(36,"data"); v.setUint32(40,n*2,true);
  for(i=0;i<n;i++) v.setInt16(44+i*2,Math.max(-1,Math.min(1,data[i]))*32767,true);
  return URL.createObjectURL(new Blob([buf],{type:"audio/wav"}));
}
var AU=null;
function audioURLs(){
  if(AU) return AU;
  var i,n=AU_RATE,quiet=new Float32Array(n);
  /* The keep-alive has to be INAUDIBLE TO YOU but AUDIBLE TO CHROME, and those
     are different tests. Chrome decides whether a tab is "playing audio" — and
     therefore whether it may be frozen — from actual signal power. The first
     version of this used ±1/32767 dither, about -90 dBFS, which Chrome scores
     as silence: the tab froze anyway and the alarm never fired.
     A 30 Hz tone at -24 dBFS has real power, but no phone speaker reproduces
     30 Hz, so nothing comes out. On headphones it may be a faint rumble; that
     is the deliberate trade for an alarm that actually arrives. */
  for(i=0;i<n;i++) quiet[i]=Math.sin(2*Math.PI*30*i/n)*0.06;
  var beeps=3,on=.18,off=.14,tot=Math.round(n*beeps*(on+off)),alarm=new Float32Array(tot);
  for(var b=0;b<beeps;b++){
    var st=Math.round(b*(on+off)*n), len=Math.round(on*n);
    for(i=0;i<len;i++){
      var env=Math.min(1,i/(n*.008),(len-i)/(n*.02));   // no clicks at the edges
      alarm[st+i]=Math.sin(2*Math.PI*880*i/n)*.9*env;
    }
  }
  AU={quiet:wavURL(AU_RATE,quiet),alarm:wavURL(AU_RATE,alarm)};
  return AU;
}
var restAudio=null;
function audioEl(){
  if(!restAudio){
    restAudio=document.createElement("audio");
    restAudio.setAttribute("playsinline","");
    restAudio.preload="auto";
    restAudio.volume=1;
    document.body.appendChild(restAudio);
  }
  return restAudio;
}
function playSrc(url,loop){
  try{
    var a=audioEl();
    a.loop=!!loop; a.src=url;
    var p=a.play();
    if(p&&p.catch) p.catch(function(){});   // autoplay refused; vibration still tries
  }catch(e){}
}
function audioStop(){ if(restAudio){ try{ restAudio.loop=false; restAudio.pause(); }catch(e){} } }
/* Only worth keeping the page alive if something is going to happen at zero. */
function wantsBgAlert(){ return !!(S.settings.sound||S.settings.notify); }

/* ---- why there is no MediaSession here ----
   There was one. It made things worse. Declaring a media session tells Android
   "this is a music player", which is precisely what makes the system duck
   whatever you are actually listening to — and it put a pointless transport
   control in the notification shade. Reported from a real gym session: the
   30 Hz keep-alive was audible through headphones AND Android attenuated the
   user's music for the whole rest period to prioritise it. A rest timer that
   fights your music is not a rest timer anyone will keep using. */

function notifyRestDone(){
  if(!S.settings.notify) return;
  if(!("Notification" in window)||Notification.permission!=="granted") return;
  var opts={body:"Next set.",tag:"ironlog-rest",renotify:true,
            icon:"icon-192.png",badge:"icon-192.png",vibrate:[90,70,90]};
  try{
    /* .ready never resolves when nothing is registered — the artifact build
       has no service worker — so test for a live controller, not for the API. */
    if(navigator.serviceWorker&&navigator.serviceWorker.controller){
      navigator.serviceWorker.ready
        .then(function(reg){ return reg.showNotification("Rest done",opts); })
        .catch(function(){ try{ new Notification("Rest done",opts); }catch(e){} });
    } else new Notification("Rest done",opts);
  }catch(e){}
}
function clearRestNote(){
  if(!navigator.serviceWorker||!navigator.serviceWorker.controller) return;
  navigator.serviceWorker.ready.then(function(reg){
    if(!reg.getNotifications) return;
    reg.getNotifications({tag:"ironlog-rest"}).then(function(ns){
      ns.forEach(function(x){ x.close(); });
    }).catch(function(){});
  }).catch(function(){});
}
function notifyState(){
  if(!("Notification" in window)) return "none";
  return Notification.permission;               // granted | denied | default
}
/* Asked only when the switch is tapped, never on load, and the refusal path
   is a visible message rather than a switch that silently won't stay on. */
function askNotify(cb){
  if(!("Notification" in window)) return cb(false,"This browser can't show notifications.");
  if(Notification.permission==="granted") return cb(true,"");
  if(Notification.permission==="denied")
    return cb(false,"Notifications are blocked for this site — turn them back on in your browser settings.");
  try{
    /* Chrome resolves a promise *and* fires the legacy callback, so guard. */
    var done=false;
    var fin=function(p){
      if(done) return; done=true;
      cb(p==="granted",p==="granted"?"":"Notifications weren't allowed.");
    };
    var r=Notification.requestPermission(fin);
    if(r&&r.then) r.then(fin,function(){ fin("denied"); });
  }catch(e){ cb(false,"Couldn't ask for permission."); }
}

/* Whether a locked phone keeps this page running is not answerable from a
   desktop browser, so the app records it. The tick gap is the whole story: a
   frozen page stops ticking, so a run of 1s gaps means the keep-alive held and
   any failure is downstream (output routing, volume), while a 20s gap means
   Chrome froze us and the audio trick did not work. */
var diag=null;
function diagStart(sec){ diag={want:sec,t0:Date.now(),ticks:[],fired:0,audio:""}; }
function diagTick(){ if(diag) diag.ticks.push(Date.now()); }
function diagReport(){
  if(!diag) return null;
  var gaps=[],i;
  var prev=diag.t0;
  for(i=0;i<diag.ticks.length;i++){ gaps.push(diag.ticks[i]-prev); prev=diag.ticks[i]; }
  return {
    want:diag.want,
    ticks:diag.ticks.length,
    expected:diag.want,
    maxGap:gaps.length?Math.max.apply(null,gaps)/1000:0,
    fired:diag.fired?(diag.fired-diag.t0)/1000:0,
    audio:diag.audio,
    hidden:diag.hidden||0
  };
}

var rest={endsAt:0,total:0}, buzzed=false, restLate=0;
function startRest(sec){
  rest.total=sec; rest.endsAt=Date.now()+sec*1000; buzzed=false; restLate=0;
  clearRestNote();
  diagStart(sec);
  /* The tone is now opt-in. It is the only thing that guarantees Chrome won't
     freeze the page, but it costs you your music — Android ducks everything
     else the whole time it plays. Chrome doesn't freeze a backgrounded page
     immediately, so a normal 2-3 minute rest may well survive without it.
     Whether it does on YOUR phone is what the self-test answers. */
  if(wantsBgAlert()&&S.settings.keepTone) playSrc(audioURLs().quiet,true);
  renderHeader();
}
function stopRest(){ rest.endsAt=0; buzzed=false; audioStop(); clearRestNote(); renderHeader(); }
function restDone(){
  if(S.settings.sound) playSrc(audioURLs().alarm,false);
  else audioStop();
  buzz([90,70,90,70,160]);
  notifyRestDone();
  if(diag){
    diag.fired=Date.now();
    var a=restAudio;
    diag.audio=!a?"no element"
      :(a.error?("error "+a.error.code)
      :(a.paused?"paused":"playing")+" vol="+a.volume+(a.muted?" MUTED":""));
  }
}
setInterval(function(){
  if(rest.endsAt){
    diagTick();
    var left=(rest.endsAt-Date.now())/1000;
    if(left<=0&&!buzzed){
      buzzed=true;
      /* Late by more than a few seconds means the phone paused us. Record it:
         with the keep-alive tone off, a silently-missed alarm is the expected
         failure and the user deserves to be told rather than left guessing. */
      if(left<-4) restLate=-left;
      /* If the page was frozen and thawed minutes later, don't shout at
         someone who is already looking at the screen. */
      if(left>-90) restDone(); else audioStop();
    }
    renderHeader();
  } else if(S.active){ renderHeader(); }
},1000);
document.addEventListener("visibilitychange",function(){
  if(document.hidden){ if(diag) diag.hid=Date.now(); return; }
  if(diag&&diag.hid){ diag.hidden=(diag.hidden||0)+(Date.now()-diag.hid)/1000; diag.hid=0; }
  clearRestNote();
  if(rest.endsAt||S.active) renderHeader();
  if(restLate>4&&!S.settings.keepTone){
    var by=Math.round(restLate); restLate=0;
    toastUndo("Alarm was "+by+"s late — phone paused the app",function(){
      S.settings.keepTone=true; writeNow();
      toast("Keep-alive tone on. It will mute your music during rests.");
    });
    var t=$(".toast.act button"); if(t) t.textContent="Fix it";
  } else restLate=0;
});

function nextRoutine(){
  if(!S.routines.length) return null;
  var last=S.sessions.find(function(s){ return s.routineId; });
  if(!last) return S.routines[0];
  var i=S.routines.findIndex(function(r){ return r.id===last.routineId; });
  if(i<0) return S.routines[0];
  return S.routines[(i+1)%S.routines.length];
}

function startSession(routine,vix){
  var ex=[];
  var v=routine?variantAt(routine,vix===undefined?nextVariantIx(routine):vix):null;
  if(v) v.exercises.forEach(function(re){ ex.push(makeSessionEx(re,re.id)); });
  S.active={
    id:uid(), ts:Date.now(), date:today(),
    routineId:routine?routine.id:null,
    key:routine?routine.key:"—",
    name:routine?routine.name:"Freestyle",
    /* The id is what the rotation reads; the label is a snapshot for history,
       like key and name already are, so deleting a variant later can't rewrite
       what a past session says it was. */
    variantId:v?v.id:null,
    variantName:routine&&v?variantLabel(routine,variantsOf(routine).indexOf(v)):"",
    deload:inDeloadWeek(),
    note:"", exercises:ex
  };
  save(); render();
}

/* Build an in-session exercise, prefilled with today's prescription.
   Warm-ups carry over from last time so you don't retype them. */
function makeSessionEx(planEx,planId){
  var p=prescribe(planEx.name,planEx);
  var sp=shadowPrescribe(planEx.name,planEx);
  /* v25: once the rep-out method has earned it (repOutCard) and been made the
     default, it is the prescription wherever there is a rep-out to read, and
     still recorded as used so the scorecard keeps judging it. Lifts with no
     rep-out yet stay on the classic engine. */
  var auto=!!(S.settings.repOutDefault&&sp);
  if(auto) p={w:sp.w, r:sp.r, sets:sp.sets, why:"Rep-out method · "+sp.why,
              kind:sp.steps>0?"up":sp.steps<0?"deload":"reps"};
  var last=lastPerf(planEx.name);
  /* A lift the coach swapped in that has been done before but not for 4+ weeks
     starts one step lighter. Here and not in prescribe(): it is a prefill, not
     a progression rule. */
  if(planEx.stepBack&&last&&p.w!==""&&p.kind!=="deload"&&bwMode(planEx)===0&&metricOf(planEx)===0&&Date.now()-last.ts>28*864e5){
    var lighter=num(p.w)-stepFor(planEx);
    if(lighter>0){ p.w=lighter; p.why=(p.why?p.why+" · ":"")+"back after "+Math.round((Date.now()-last.ts)/864e5/7)+" weeks — one step lighter"; }
  }
  var raw=lastRawSets(planEx.name);
  var sets=[];
  if(raw) raw.forEach(function(s){ if(s.warm) sets.push({w:String(s.w),r:String(s.r),warm:true,done:false}); });
  var n=Math.max(1,num(p.sets)||3);
  for(var i=0;i<n;i++) sets.push({w:p.w===""?"":String(p.w),r:String(p.r),done:false});
  return {
    id:uid(), planId:planId||null, name:planEx.name,
    targetReps:p.r, reps:num(planEx.reps)||p.r, repTop:num(planEx.repTop)||0,
    inc:planEx.inc||null, bw:bwMode(planEx), bar:barOf(planEx), metric:metricOf(planEx),
    link:!!planEx.link,
    mg:planEx.mg||"", mg2:(planEx.mg2||[]).slice(),
    supplemental:!planId, note:"",
    why:p.why, kind:p.kind,
    shadow:sp?{w:sp.w,r:sp.r,why:sp.why,steps:sp.steps,stall:false,used:auto,auto:auto}:null,
    lastW:last?num(last.sets[0].w):null, lastR:last?num(last.sets[0].r):null,
    sets:sets
  };
}
