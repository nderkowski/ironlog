<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="A friction-free lifting logbook. Your split, carried forward, with progression and deload calls made for you.">
<meta name="theme-color" content="#EEEFF1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111417" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Iron Log">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Iron Log</title>
</head>
<body>
<!--ARTIFACT-START-->
<style>
/* ============================================================
   Iron Log — tokens
   ============================================================ */
:root{
  --bg:#EEEFF1;
  --panel:#FFFFFF;
  --panel-2:#E4E6EA;
  --ink:#14171B;
  --ink-2:#5A6169;
  --ink-3:#878F98;
  --line:#D3D7DD;
  --accent:#C98A0E;
  --on-accent:#14171B;
  --accent-soft:rgba(201,138,14,.14);
  --good:#2E7D57;
  --good-soft:rgba(46,125,87,.13);
  --bad:#B03A32;
  --bad-soft:rgba(176,58,50,.12);
  --shadow:0 1px 2px rgba(20,23,27,.06), 0 6px 18px rgba(20,23,27,.05);

  --mono:ui-monospace,SFMono-Regular,"SF Mono","Roboto Mono","DejaVu Sans Mono",Menlo,Consolas,monospace;
  --ui:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;

  --r:12px;
  --pad:14px;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#111417;
    --panel:#191D21;
    --panel-2:#242A30;
    --ink:#EDEFF2;
    --ink-2:#98A1AA;
    --ink-3:#6E777F;
    --line:#2C3238;
    --accent:#E8AC2B;
    --on-accent:#14171B;
    --accent-soft:rgba(232,172,43,.16);
    --good:#4FBE85;
    --good-soft:rgba(79,190,133,.15);
    --bad:#E0645A;
    --bad-soft:rgba(224,100,90,.15);
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 6px 18px rgba(0,0,0,.28);
  }
}
:root[data-theme="dark"]{
  --bg:#111417; --panel:#191D21; --panel-2:#242A30;
  --ink:#EDEFF2; --ink-2:#98A1AA; --ink-3:#6E777F; --line:#2C3238;
  --accent:#E8AC2B; --on-accent:#14171B; --accent-soft:rgba(232,172,43,.16);
  --good:#4FBE85; --good-soft:rgba(79,190,133,.15);
  --bad:#E0645A; --bad-soft:rgba(224,100,90,.15);
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 6px 18px rgba(0,0,0,.28);
}
:root[data-theme="light"]{
  --bg:#EEEFF1; --panel:#FFFFFF; --panel-2:#E4E6EA;
  --ink:#14171B; --ink-2:#5A6169; --ink-3:#878F98; --line:#D3D7DD;
  --accent:#C98A0E; --on-accent:#14171B; --accent-soft:rgba(201,138,14,.14);
  --good:#2E7D57; --good-soft:rgba(46,125,87,.13);
  --bad:#B03A32; --bad-soft:rgba(176,58,50,.12);
  --shadow:0 1px 2px rgba(20,23,27,.06), 0 6px 18px rgba(20,23,27,.05);
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:var(--ui); font-size:15px; line-height:1.45;
  overscroll-behavior-y:contain;
  touch-action:manipulation;
  -webkit-tap-highlight-color:transparent;
}
button,input,select,textarea{font:inherit;color:inherit;touch-action:manipulation}
button{cursor:pointer;background:none;border:none;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}

/* ---------- shell ---------- */
.wrap{max-width:560px;margin:0 auto;padding:0 12px 96px}

header.top{
  position:sticky;top:0;z-index:40;
  max-width:560px;margin:0 auto;
  background:var(--bg);
  display:flex;align-items:center;gap:8px;
  padding:10px 12px 8px;
  border-bottom:1px solid transparent;
}
header.top.stuck{border-bottom-color:var(--line)}
.brand{
  font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;
  color:var(--ink-3);
}
.brand b{color:var(--ink)}
.top .spacer{flex:1}

.chip{
  display:inline-flex;align-items:center;gap:6px;
  padding:4px 9px;border-radius:999px;
  font-size:12px;font-weight:600;
  background:var(--panel-2);color:var(--ink-2);
  border:1px solid transparent;white-space:nowrap;
}
.chip.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.chip.good{background:var(--good-soft);color:var(--good)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip.accent{background:var(--accent-soft);color:var(--accent)}
.chip.tag{padding:1px 7px;font-size:10px}

button.rest{
  font-family:var(--mono);font-variant-numeric:tabular-nums;
  background:var(--accent);color:var(--on-accent);
  padding:5px 11px;border-radius:999px;font-size:13px;font-weight:700;
  display:inline-flex;align-items:center;gap:7px;
}
button.rest.over{background:var(--good);color:#fff}

/* ---------- typography ---------- */
h1,h2,h3{margin:0;text-wrap:balance}
.eyebrow{
  font-size:11px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;
  color:var(--ink-3);
}
.view-title{font-size:22px;font-weight:700;letter-spacing:-.015em;margin:2px 0 12px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--ink-2)}
.tiny{font-size:12px}

/* ---------- cards ---------- */
.card{
  background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
  box-shadow:var(--shadow);
  padding:var(--pad);
}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;align-items:center;gap:10px}

/* ---------- buttons ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  padding:10px 14px;border-radius:10px;
  background:var(--panel-2);color:var(--ink);
  font-weight:600;font-size:14px;
  border:1px solid transparent;
  min-height:42px;
}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--accent);color:var(--on-accent)}
.btn.ghost{background:transparent;border-color:var(--line);color:var(--ink-2)}
.btn.danger{background:var(--bad-soft);color:var(--bad)}
.btn.block{width:100%}
.btn.big{min-height:54px;font-size:16px;border-radius:12px}
.btn.sm{min-height:34px;padding:6px 10px;font-size:13px;border-radius:8px}
.btn[disabled]{opacity:.45;pointer-events:none}

/* ---------- next-up hero ---------- */
.hero{display:flex;gap:14px;align-items:stretch}
.daymark{
  flex:0 0 auto;width:64px;border-radius:10px;
  background:var(--accent-soft);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  border:1px solid var(--accent-soft);
}
.daymark .letter{
  font-family:var(--mono);font-size:30px;font-weight:700;line-height:1;
  color:var(--accent);letter-spacing:-.02em;
}
.daymark .sub{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);opacity:.8;margin-top:3px}
.hero .body{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px;justify-content:center}
.hero h2{font-size:19px;font-weight:700;letter-spacing:-.01em}
.exlist{font-size:13px;color:var(--ink-2);overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}

.daypicks{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.daypick{
  padding:7px 12px;border-radius:9px;border:1px solid var(--line);
  background:transparent;font-size:13px;font-weight:600;color:var(--ink-2);
  display:inline-flex;gap:7px;align-items:center;
}
.daypick .k{font-family:var(--mono);color:var(--ink);font-weight:700}

/* Today: the one-line "Last ... Edit" row under the day card */
.lastsess{
  display:flex;align-items:center;gap:10px;width:100%;min-height:44px;
  padding:8px 12px;border-radius:12px;border:1px solid var(--line);
  background:var(--panel);text-align:left;font-size:13px;color:var(--ink-2);
}
.lastsess .ls-t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lastsess .ls-t b{color:var(--ink);font-weight:700}
.lastsess .ls-k{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);font-weight:700}
.lastsess .ls-edit{flex:0 0 auto;font-weight:700;color:var(--accent);padding:4px 8px}

/* ---------- exercise card ---------- */
.ex{padding:0;overflow:hidden}
.ex-head{
  display:flex;align-items:flex-start;gap:8px;
  padding:12px var(--pad) 10px;
}
.ex-head .t{flex:1;min-width:0}
.ex-name{font-size:16px;font-weight:700;letter-spacing:-.01em;word-break:break-word}
.ex-meta{font-size:12px;color:var(--ink-3);margin-top:1px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.kebab{
  width:34px;height:34px;border-radius:8px;color:var(--ink-3);
  display:flex;align-items:center;justify-content:center;font-size:18px;line-height:1;
  flex:0 0 auto;
}

/* the "what to do today, and why" block */
.callout{
  margin:0 var(--pad) 10px;border-radius:9px;overflow:hidden;
  background:var(--panel-2);
}
.callout .lastrow{
  display:flex;align-items:center;gap:8px;flex-wrap:wrap;
  padding:7px 10px;font-size:12px;color:var(--ink-2);
}
.callout .lastrow .num{color:var(--ink)}
.callout .revert{
  margin-left:auto;font-size:12px;font-weight:700;
  padding:3px 8px;border-radius:7px;background:var(--panel);color:var(--ink-2);
  border:1px solid var(--line);white-space:nowrap;
}
.callout .why{
  display:flex;align-items:center;gap:7px;
  padding:7px 10px;font-size:12.5px;font-weight:600;
  border-top:1px solid var(--line);
}
.callout .why .mark{font-family:var(--mono);font-weight:700;flex:0 0 auto}
.why.up{background:var(--accent-soft);color:var(--accent)}
.why.reps{background:var(--good-soft);color:var(--good)}
.why.deload{background:var(--bad-soft);color:var(--bad)}
.why.hold{color:var(--ink-2)}
/* v24: the rep-out instruction and the shadow prescription. Same strip shape
   as .why so the callout reads as one block. */
.callout .outhint,.callout .shadow{
  display:flex;align-items:center;gap:7px;
  padding:7px 10px;font-size:12.5px;border-top:1px solid var(--line);color:var(--ink-2);
}
.callout .shadow{font-weight:600;color:var(--ink)}
.callout .shadow .use{
  margin-left:auto;font-size:12px;font-weight:700;padding:3px 10px;border-radius:7px;
  background:var(--accent);color:#fff;white-space:nowrap;flex:0 0 auto;
}
.callout .shadow.stall{color:var(--bad);font-weight:600}
.set.out .idx{color:var(--accent);font-weight:800}
/* Per-lift notes: a quiet tap line until there is something to say. */
.exnote{padding:2px var(--pad) 0}
.exnote-add{font-size:12.5px;color:var(--ink-2);padding:6px 0;background:none;border:0}
.exnote-txt{width:100%;min-height:44px;font-size:14px;margin:4px 0 2px;resize:vertical}

/* ---------- form check (v28) ---------- */
.fc-how{margin:0 0 12px;padding-left:18px;font-size:14px;color:var(--ink-2)}
.fc-how li{margin:3px 0}
.fc-how b{color:var(--ink)}
.fc-lbl{font-size:13px;font-weight:600;margin:10px 0 6px}
.fc-sets{display:flex;flex-wrap:wrap;gap:6px}
.fc-set{padding:7px 11px;border-radius:999px;font-size:13px;font-weight:600;background:var(--panel-2);color:var(--ink-2);text-align:left}
.fc-set.on{background:var(--accent);color:var(--on-accent)}
.fc-link{display:inline;padding:6px 2px;background:none;border:0;color:var(--accent);font-size:12px;font-weight:600;text-decoration:underline}
.fc-bar{height:6px;border-radius:3px;background:var(--panel-2);overflow:hidden;margin-top:6px}
.fc-bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
.fc-bar.ind i{width:35%;animation:fcslide 1.1s ease-in-out infinite alternate}
@keyframes fcslide{from{transform:translateX(0)}to{transform:translateX(185%)}}
.fc-strip{display:flex;gap:6px;overflow-x:auto;padding:2px 0 6px;margin:0 0 6px;position:relative;-webkit-overflow-scrolling:touch}
.fc-th{flex:0 0 auto;position:relative;width:56px;height:76px;padding:0;border:2px solid transparent;border-radius:8px;overflow:hidden;background:var(--panel-2)}
.fc-th img{width:100%;height:100%;object-fit:cover;display:block}
.fc-th span{position:absolute;left:2px;bottom:2px;font:600 10px var(--mono);background:rgba(0,0,0,.65);color:#fff;border-radius:4px;padding:0 4px}
.fc-th.on{border-color:var(--accent)}
.fc-big{display:none;margin:0 0 8px;text-align:center}
.fc-big img{max-width:100%;max-height:44vh;border-radius:10px;display:block;margin:0 auto 4px}
.fc-cue{display:flex;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.fc-cue:first-child{border-top:0}
.fc-cue .n{flex:0 0 auto;width:22px;height:22px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font:700 12px var(--mono);display:flex;align-items:center;justify-content:center}
.fc-cue .t{min-width:0;overflow-wrap:anywhere}
.fc-hist{margin-top:6px}
.fc-hcues{margin:4px 0 0;padding-left:18px;color:var(--ink-2)}

.sets{display:flex;flex-direction:column}
.set{
  display:grid;
  grid-template-columns:20px 1fr 10px 1fr 44px;
  align-items:center;gap:5px;
  padding:7px var(--pad);
  border-top:1px solid var(--line);
  position:relative;
}
.set::before{
  content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:transparent;
}
.set.done::before{background:var(--accent)}
.set.done{background:var(--panel-2)}
.set.pr::before{background:var(--good)}
.set.warm::before{background:transparent}
.set.warm.done::before{background:var(--line)}
.set.warm .grp input{color:var(--ink-2)}
.idx{
  font-family:var(--mono);font-size:12px;color:var(--ink-3);
  height:38px;width:100%;display:flex;align-items:center;justify-content:center;
  border-radius:6px;
}
.idx:active{background:var(--panel-2)}
.set.done .idx{color:var(--ink-2)}
.set.warm .idx{color:var(--ink-3);font-weight:700;font-size:11px}
.grp{display:flex;align-items:center;gap:2px;min-width:0}
.grp button{
  flex:0 0 auto;width:28px;height:38px;border-radius:8px;
  color:var(--ink-2);font-size:17px;font-weight:600;line-height:1;
  display:flex;align-items:center;justify-content:center;
}
.grp button:active{background:var(--panel-2)}
.grp input{
  flex:1;min-width:0;width:100%;
  height:38px;border:1px solid var(--line);border-radius:8px;
  background:var(--bg);
  font-family:var(--mono);font-variant-numeric:tabular-nums;
  font-size:16px;font-weight:600;text-align:center;
  padding:0 1px;
  -moz-appearance:textfield;
}
.set.done .grp input{background:transparent;border-color:transparent}
.grp input::-webkit-outer-spin-button,.grp input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.times{text-align:center;color:var(--ink-3);font-size:13px}
.tick{
  width:44px;height:40px;border-radius:9px;
  border:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;
  color:var(--ink-3);
}
.tick svg{width:20px;height:20px;display:block}
.set.done .tick{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.set.done.warm .tick{background:var(--ink-3);border-color:var(--ink-3);color:var(--bg)}
.set.done.pr .tick{background:var(--good);border-color:var(--good);color:#fff}
.prtag{
  position:absolute;right:58px;top:50%;transform:translateY(-50%);
  font-size:10px;font-weight:800;letter-spacing:.08em;color:var(--good);
  pointer-events:none;
}
/* Plate hint. Spans the whole row so it drops onto an implicit second grid
   row, and it is pointer-events:none so it can never eat a tap. */
.plates{
  grid-column:1/-1;
  display:flex;align-items:center;gap:8px;
  font-family:var(--mono);font-variant-numeric:tabular-nums;
  font-size:11px;color:var(--ink-3);
  padding-left:25px;margin-top:-3px;
  pointer-events:none;
}
.plates:empty{display:none}
.plates .ptext{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* display:inline-flex is load-bearing, not decoration. A plain <button> here
   measured 112px wide no matter what text it held — its width was not content
   driven at all, in Chrome, as either a float or a flex item. inline-flex
   makes it shrink-wrap its label like every other chip in the app. */
.plates .rpe{
  display:inline-flex;align-items:center;
  flex:0 0 auto;pointer-events:auto;
  font-size:11px;font-weight:700;letter-spacing:.02em;
  color:var(--ink-3);padding:6px 11px;border-radius:999px;
  border:1px solid var(--line);
}
.plates .rpe.set{color:var(--accent);border-color:var(--accent-soft);background:var(--accent-soft)}
.gtag{
  display:inline-block;font-family:var(--mono);font-size:11px;font-weight:700;
  color:var(--accent);background:var(--accent-soft);
  padding:1px 6px;border-radius:6px;margin-right:7px;vertical-align:2px;
}
.plates .lb{letter-spacing:.06em;margin-right:5px;opacity:.7}
.plates i{font-style:normal;opacity:.65}
.plates .off{color:var(--bad)}
.set.done .plates{opacity:.55}
.ex-foot{
  display:flex;gap:8px;align-items:center;padding:9px var(--pad);border-top:1px solid var(--line);
}
@media (max-width:360px){
  :root{--pad:10px}
  .set{grid-template-columns:18px 1fr 8px 1fr 40px;gap:4px}
  .grp button{width:24px}
  .tick{width:40px}
  .plates{padding-left:22px}
}

/* ---------- progress ---------- */
.statgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{
  background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
  padding:11px 12px;box-shadow:var(--shadow);
}
.stat .v{font-family:var(--mono);font-size:20px;font-weight:700;letter-spacing:-.02em;line-height:1.15}
.stat .l{font-size:11px;color:var(--ink-3);letter-spacing:.06em;text-transform:uppercase;margin-top:3px}

.banner{
  border-radius:var(--r);padding:12px 14px;
  border:1px solid transparent;text-align:left;
}
.banner.warn{background:var(--bad-soft);border-color:var(--bad-soft);color:var(--bad)}
.banner.info{background:var(--accent-soft);border-color:var(--accent-soft);color:var(--accent)}
.banner.calm{background:var(--panel);border-color:var(--line);color:var(--ink)}
.banner .bt{font-weight:700;font-size:14px}
.banner .bd{font-size:13px;color:var(--ink-2)}
.banner.warn .bd{color:var(--bad);opacity:.85}
.banner .acts{display:flex;gap:8px;margin-top:10px}
/* the coach's cards: a reason, then one button per choice */
.co-p{padding:11px 0;border-top:1px solid var(--line)}
.co-p:first-child{padding-top:0;border-top:0}
.co-p:last-child{padding-bottom:0}
.co-t{font-weight:700;font-size:14px;min-width:0;overflow-wrap:anywhere}
.co-r{font-size:13px;color:var(--ink-2);margin-top:4px;line-height:1.4}
.co-e{font-size:12px;color:var(--ink-3);margin-top:5px;line-height:1.4}
.co-q{margin:4px 0 0;padding-left:18px}
.co-o{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.co-o .btn{justify-content:flex-start;text-align:left;white-space:normal;overflow-wrap:anywhere;height:auto}
.co-d{display:flex;align-items:center;gap:8px;font-size:13px;padding:3px 0}
.co-d>span{flex:1;min-width:0;overflow-wrap:anywhere}
/* Another window saved the log: covers everything until Reload (writeNow refuses meanwhile). */
.stale-veil{
  position:fixed;inset:0;z-index:90;background:rgba(10,12,14,.55);
  display:flex;align-items:flex-start;justify-content:center;
  padding:calc(16px + env(safe-area-inset-top,0px)) 16px 16px;
}
.stale-veil .banner{width:100%;max-width:520px;box-shadow:var(--shadow);border-color:var(--bad)}
.stale-veil .bt{color:var(--bad)}

/* ---- weekly sets by muscle ---- */
.mrow{
  display:grid;grid-template-columns:82px 1fr 34px;align-items:center;
  gap:9px;padding:5px var(--pad);
}
.mrow .mn{font-size:13px;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mrow .mv{
  font-family:var(--mono);font-variant-numeric:tabular-nums;
  font-size:13px;font-weight:700;text-align:right;
}
.track{position:relative;height:16px;border-radius:5px;background:var(--panel-2);overflow:hidden}
.track .now{position:absolute;inset:0 auto 0 0;background:var(--accent);border-radius:5px}
.track .tick{position:absolute;top:0;bottom:0;width:1px;background:var(--bg);opacity:.75}
/* Last week is a marker, not a bar behind the fill: a ghost bar is invisible
   whenever this week is bigger, which is exactly when you'd want to see it. */
.track .prev{
  position:absolute;top:1px;bottom:1px;width:2px;margin-left:-1px;
  background:var(--ink-2);border-radius:2px;
}

/* ---- PR board ---- */
.prrow{

}

.prrow .prs{font-family:var(--mono);font-size:13px;font-weight:700;flex:0 0 auto}
.prrow .prd{font-family:var(--mono);font-size:11px;color:var(--ink-3);flex:0 0 auto;width:52px;text-align:right}

/* ---- calendar ---- */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.cal .dow{
  font-size:10px;font-weight:700;letter-spacing:.06em;color:var(--ink-3);
  text-align:center;padding-bottom:2px;
}
.cal .cell{
  aspect-ratio:1;border-radius:7px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  font-family:var(--mono);font-size:12px;color:var(--ink-3);
  border:1px solid transparent;
}
.cal .cell.pad{visibility:hidden}
.cal .cell.today{border-color:var(--ink-3)}
.cal .cell.hit{background:var(--accent-soft);color:var(--accent);font-weight:700}
.cal .cell.hit .k{font-size:9px;letter-spacing:.05em;opacity:.85;margin-top:1px}
.cal .cell.hit:active{background:var(--accent);color:var(--on-accent)}
.calhead{display:flex;align-items:center;gap:8px;margin-bottom:9px}
.calhead .cm{flex:1;font-size:14px;font-weight:700}

/* ---- muscle picker ---- */
.mgrid{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 2px}
.mchip{
  padding:8px 12px;border-radius:999px;border:1px solid var(--line);
  font-size:13px;font-weight:600;color:var(--ink-2);background:transparent;
}
.mchip.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.mchip.on2{background:var(--accent-soft);border-color:var(--accent-soft);color:var(--accent)}
.mchip.off{opacity:.45}
.navrow{
  display:flex;align-items:center;gap:10px;padding:9px 0;
  border-top:1px solid var(--line);width:100%;text-align:left;
}
.navrow .fl{flex:1;font-size:14px}
.navrow .fv{font-size:13px;color:var(--ink-3);text-align:right;max-width:52%;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.navrow .ch{color:var(--ink-3);font-size:15px}

.plift{
  display:flex;align-items:center;gap:12px;
  padding:11px var(--pad);border-top:1px solid var(--line);
  width:100%;text-align:left;
}
.plift:first-child{border-top:none}
.plift .pt{flex:1;min-width:0}
.plift .pn{font-weight:650;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.plift .ps{font-size:12px;color:var(--ink-3);font-family:var(--mono)}
.plift canvas{flex:0 0 auto;width:78px;height:32px;display:block}

.sess{
  display:flex;align-items:center;gap:10px;width:100%;text-align:left;
  padding:10px var(--pad);border-top:1px solid var(--line);
}
.sess:first-child{border-top:none}
.sess .sd{font-family:var(--mono);font-size:12px;color:var(--ink-3);width:52px;flex:0 0 auto}
.sess .sn{flex:1;min-width:0;font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sess .sv{font-family:var(--mono);font-size:12px;color:var(--ink-2)}

table.hist{width:100%;border-collapse:collapse;font-size:13px}
table.hist th{
  text-align:left;font-size:10px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--ink-3);font-weight:700;padding:0 8px 6px 0;
}
table.hist td{padding:6px 8px 6px 0;border-top:1px solid var(--line);font-family:var(--mono)}
table.hist td:first-child{color:var(--ink-2)}
table.hist tr.dl td{opacity:.6}
.scrollx{overflow-x:auto;-webkit-overflow-scrolling:touch}

/* ---------- plan ---------- */
.pex{
  display:flex;align-items:center;gap:10px;
  padding:9px var(--pad);border-top:1px solid var(--line);
}
/* The name yields, the numbers don't. .pxs had no shrink control at all while
   .pxn was flex:1/min-width:0, so the name was the first thing to go and a
   long muscle name could render a row with no exercise name in it whatsoever.
   Letting both shrink is worse — flexbox eats the sets×reps, which is the half
   you came to read. So: meta rigid, name truncates, 6ch of it always survives.
   That only balances because the row's meta is kept short; check the 320px
   overflow assertion in t21 before adding anything to it. */
.pex .pxn{
  flex:1 1 auto;min-width:6ch;font-size:14px;font-weight:600;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.pex .pxs{
  flex:0 0 auto;white-space:nowrap;text-align:right;
  font-family:var(--mono);font-size:12px;color:var(--ink-3);
}
.iconbtn{
  width:32px;height:32px;border-radius:8px;color:var(--ink-3);
  display:flex;align-items:center;justify-content:center;font-size:15px;flex:0 0 auto;
}
.iconbtn:active{background:var(--panel-2)}
/* Without this an inline SVG fills the whole 32px button edge to edge — the
   text-labelled .iconbtns (↑, ⋯) have natural padding and hid the omission. */
.iconbtn svg{width:20px;height:20px;display:block}
/* The header gear is the only way into Settings, so it gets the readable ink
   rather than the most muted one. */
header.top .iconbtn{color:var(--ink-2)}

.field-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.field-row:first-child{border-top:none}
.field-row .fl{flex:1;font-size:14px}
.field-row .fh{font-size:12px;color:var(--ink-3);margin-top:1px}
input.txt,select.txt{
  background:var(--bg);border:1px solid var(--line);border-radius:9px;
  padding:9px 10px;font-size:16px;width:100%;
}
input.small{width:78px;text-align:center;font-family:var(--mono);font-weight:600}
input.tiny-n{width:58px;text-align:center;font-family:var(--mono);font-weight:600}
textarea.txt{
  background:var(--bg);border:1px solid var(--line);border-radius:9px;
  padding:10px;font-size:16px;width:100%;resize:vertical;min-height:64px;font-family:var(--ui);
}
.switch{
  width:46px;height:28px;border-radius:999px;background:var(--panel-2);
  position:relative;flex:0 0 auto;transition:background .15s;
  border:1px solid var(--line);
}
.switch::after{
  content:"";position:absolute;top:2px;left:2px;width:22px;height:22px;border-radius:50%;
  background:var(--panel);box-shadow:0 1px 2px rgba(0,0,0,.25);transition:transform .15s;
}
.switch.on{background:var(--accent);border-color:var(--accent)}
.switch.on::after{transform:translateX(18px);background:#fff}

/* ---------- edit-session rows ---------- */
.erow{
  display:grid;grid-template-columns:26px 1fr 10px 1fr 34px;
  align-items:center;gap:6px;padding:6px 0;border-top:1px solid var(--line);
}
.erow .ei{font-family:var(--mono);font-size:11px;color:var(--ink-3);text-align:center}
.erow input{
  height:38px;width:100%;border:1px solid var(--line);border-radius:8px;background:var(--bg);
  font-family:var(--mono);font-size:16px;font-weight:600;text-align:center;padding:0 2px;
  -moz-appearance:textfield;
}
.erow input::-webkit-outer-spin-button,.erow input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.erow .rm{width:32px;height:34px;border-radius:8px;color:var(--ink-3);display:flex;align-items:center;justify-content:center}
.erow .rm:active{background:var(--panel-2)}
.erow.warm input{color:var(--ink-2)}

/* ---------- bottom nav ---------- */
nav.tabs{
  position:fixed;left:0;right:0;bottom:0;z-index:50;
  background:var(--panel);border-top:1px solid var(--line);
  padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));
  display:flex;justify-content:center;gap:4px;
}
nav.tabs .t{
  flex:1;max-width:170px;
  display:flex;flex-direction:column;align-items:center;gap:2px;
  padding:6px 4px;border-radius:10px;
  font-size:11px;font-weight:650;letter-spacing:.03em;color:var(--ink-3);
}
nav.tabs .t svg{width:21px;height:21px;display:block}
nav.tabs .t.on{color:var(--accent);background:var(--accent-soft)}

/* ---------- sheet ---------- */
.backdrop{
  position:fixed;inset:0;z-index:60;background:rgba(10,12,14,.5);
  display:flex;align-items:flex-end;justify-content:center;
  animation:fade .16s ease-out;
}
.sheet{
  width:100%;max-width:560px;max-height:88vh;overflow-y:auto;
  background:var(--bg);border-radius:16px 16px 0 0;
  border:1px solid var(--line);border-bottom:none;
  padding:8px 14px calc(20px + env(safe-area-inset-bottom,0px));
  animation:up .2s cubic-bezier(.2,.8,.3,1);
}
/* editor Save/Cancel stay in reach: sticky to the bottom of the scrolling sheet,
   cancelling the sheet's own bottom padding so it sits flush above the safe area */
.sheet .sheet-foot{
  position:sticky;bottom:calc(-20px - env(safe-area-inset-bottom,0px));z-index:2;display:flex;gap:8px;
  margin:12px -14px calc(-20px - env(safe-area-inset-bottom,0px));
  padding:10px 14px calc(14px + env(safe-area-inset-bottom,0px));
  background:var(--bg);border-top:1px solid var(--line);
}
.grab{width:38px;height:4px;border-radius:2px;background:var(--line);margin:6px auto 12px}
.sheet h3{font-size:17px;font-weight:700;margin-bottom:2px}
.sheet .sub{font-size:13px;color:var(--ink-2);margin-bottom:14px}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes up{from{transform:translateY(14px)}to{transform:translateY(0)}}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
}

.picklist{display:flex;flex-direction:column;margin:8px 0}
.picklist button{
  text-align:left;padding:11px 12px;border-radius:9px;font-size:15px;
  display:flex;align-items:center;gap:10px;
}
.picklist button:active{background:var(--panel-2)}
.picklist .h{font-size:12px;color:var(--ink-3);font-family:var(--mono);margin-left:auto}

.menu button{
  width:100%;text-align:left;padding:12px;border-radius:9px;font-size:15px;
  display:flex;align-items:center;gap:10px;
}
.menu button:active{background:var(--panel-2)}
.menu button.dang{color:var(--bad)}

.seg{display:flex;gap:4px;background:var(--panel-2);padding:3px;border-radius:9px}
.seg button{
  flex:1;padding:7px 4px;border-radius:7px;font-size:13px;font-weight:600;color:var(--ink-2);
  white-space:nowrap;
}
.seg button.on{background:var(--panel);color:var(--ink);box-shadow:var(--shadow)}

/* The week switcher inside a Plan day card. Same idea as .seg but it sits
   flush inside the card rather than floating in a panel, and it scrolls
   sideways rather than squeezing when a day has several weeks. */
.vseg{
  display:flex;gap:4px;padding:8px 12px 4px;overflow-x:auto;
  -webkit-overflow-scrolling:touch;scrollbar-width:none;
}
.vseg::-webkit-scrollbar{display:none}
.vseg button{
  flex:0 0 auto;padding:6px 12px;border-radius:999px;font-size:12.5px;font-weight:600;
  color:var(--ink-2);background:var(--panel-2);white-space:nowrap;
}
.vseg button.on{background:var(--accent);color:var(--on-accent)}

.toast{
  position:fixed;left:50%;bottom:84px;transform:translateX(-50%);
  z-index:80;background:var(--ink);color:var(--bg);
  padding:9px 15px;border-radius:999px;font-size:13px;font-weight:600;
  box-shadow:var(--shadow);pointer-events:none;
  animation:fade .15s ease-out;text-align:center;
  /* left:50% caps a shrink-to-fit fixed box at 50vw, which wraps anything
     longer than a few words. max-content opts out of that. */
  width:max-content;max-width:90vw;
}
/* The undo variant is the one toast you can hit — but only the pill itself
   takes pointer events, so a 10-second toast can't sit on top of Finish. */
.toast.act{
  display:flex;align-items:center;gap:6px;
  padding:5px 6px 5px 15px;text-align:left;
}
.toast.act span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.toast.act button{
  pointer-events:auto;
  color:inherit;font-weight:800;font-size:13px;letter-spacing:.03em;
  padding:7px 12px;border-radius:999px;flex:0 0 auto;
  border:1px solid currentColor;
}
.toast.act button:active{opacity:.6}

/* plate inventory editor */
.plate-ed{display:flex;flex-direction:column;gap:6px;margin:8px 0 4px}
.plate-ed .pr-row{display:flex;align-items:center;gap:8px}
.plate-ed .pr-row .txt{width:78px}
.plate-ed .pr-row .x{font-size:12px;color:var(--ink-3);flex:0 0 auto}
.plate-ed .pr-row .sp{flex:1}
.plate-ed .pr-row .rm{
  width:34px;height:34px;border-radius:8px;color:var(--ink-3);
  display:flex;align-items:center;justify-content:center;flex:0 0 auto;
}
.plate-ed .pr-row .rm:active{background:var(--panel-2)}
.empty{text-align:center;color:var(--ink-3);font-size:14px;padding:26px 10px}
hr.sep{border:none;border-top:1px solid var(--line);margin:18px 0 14px}

<script>
/* ============================================================
   Iron Log — a friction-free lifting logbook.
   All data lives in this browser's localStorage. No server, no account.
   ============================================================ */
(function(){
"use strict";

/* Host may not supply a viewport tag (e.g. embedded); make sure one exists. */
if(!document.querySelector('meta[name="viewport"]')){
  var mv=document.createElement("meta");
  mv.name="viewport"; mv.content="width=device-width, initial-scale=1, viewport-fit=cover";
  document.head.appendChild(mv);
}

/* ============================ storage ============================ */
var BUILD="v26.4";                      // bump with CACHE in sw.js; shown in Plan
var KEY="ironlog.v1", storageOK=true;
try{ localStorage.setItem("__t","1"); localStorage.removeItem("__t"); }catch(e){ storageOK=false; }
var mem=null;

function defaultState(){
  return {
    version:5,
    settings:{unit:"lb",rest:120,autoRest:true,buzz:true,inc:5,
              sound:true, notify:false, rpe:false, keepTone:false,
              autoBackup:true, shareMode:"",
              doubleDefault:true,repLow:8,repHigh:12,rangeFixHidden:false,
              bodyweight:0, deloadUntil:0, deloadSnooze:0, repOutDefault:false,
              bar:45, plates:defaultPlates("lb"),
              lastBackup:0},
    routines:[
      newRoutine("A","Day A"),
      newRoutine("B","Day B"),
      newRoutine("C","Day C")
    ],
    sessions:[],
    active:null,
    coach:{proposals:[], history:[], lastCheck:0}
  };
}
/* A training day holds one or more week variants. A single-variant day is the
   old behaviour exactly, which is what makes the migration a one-liner. */
function newRoutine(key,name){
  return {id:uid(), key:key, name:name, variants:[newVariant("")]};
}
function newVariant(label,exercises){
  return {id:uid(), label:label||"", exercises:exercises||[]};
}

/* Every state that comes in from anywhere — storage, a backup file, a paste —
   goes through here, so an old export lands as a valid v5 state rather than
   half-migrating and crashing on the first read of r.variants. */
var MIGRATED=false;
function normalize(s){
  if(num(s.version)<5) MIGRATED=true;
  s.settings=Object.assign(defaultState().settings,s.settings||{});
  if(!Array.isArray(s.settings.plates)||!s.settings.plates.length)
    s.settings.plates=defaultPlates(s.settings.unit);
  /* This is documented as the only door into the state, so it has to check the
     whole shape and not just the parts that have needed migrating. A state
     whose `sessions` key is missing — a truncated backup, a half-finished
     write — used to render a blank page and stay blank on every reload, with
     nothing but "clear your storage" to do about it. */
  if(!Array.isArray(s.sessions)){ s.sessions=[]; MIGRATED=true; }
  if(!Array.isArray(s.routines)){ s.routines=[]; MIGRATED=true; }
  s.sessions.forEach(function(x){
    if(!Array.isArray(x.exercises)){ x.exercises=[]; MIGRATED=true; }
    x.exercises.forEach(function(e){ if(!Array.isArray(e.sets)){ e.sets=[]; MIGRATED=true; } });
  });
  if(s.active&&!Array.isArray(s.active.exercises)){ s.active=null; MIGRATED=true; }
  (s.routines||[]).forEach(function(r){
    if(!Array.isArray(r.variants)||!r.variants.length)
      r.variants=[newVariant("",Array.isArray(r.exercises)?r.exercises:[])];
    /* One home for the list. Leaving r.exercises behind would let the two
       drift, and every read would have to guess which one is current. */
    delete r.exercises;
    r.variants.forEach(function(v){
      if(!v.id) v.id=uid();
      if(!Array.isArray(v.exercises)) v.exercises=[];
      if(typeof v.label!=="string") v.label="";
    });
  });
  s.coach=coachShape(s.coach);      // the coach's cards; absent in any log older than v26
  s.version=5;
  return s;
}
function load(){
  if(!storageOK) return mem||(mem=defaultState());
  try{
    var raw=localStorage.getItem(KEY);
    if(!raw) return defaultState();
    var s=JSON.parse(raw);
    if(!s||typeof s!=="object") return defaultState();
    /* Nothing recognisable at all — take the stock split. But a log with a
       damaged `routines` key is still a log, and handing back defaultState()
       there would silently discard every session in it. */
    if(!s.routines&&!Array.isArray(s.sessions)) return defaultState();
    return normalize(s);
  }catch(e){ return defaultState(); }
}
var saveTimer=null;
/* STALE: another window saved this log after this one last read it, and this
   window can't take the new copy without losing something (see otherWrote()).
   Nothing more is written from here until the user reloads. mineJSON is the
   log as this window last wrote or read it, so "unsaved edits" is a compare. */
var STALE=false, mineJSON=null;
function writeNow(){
  clearTimeout(saveTimer); saveTimer=null;
  if(STALE){ staleVeil(); return; }   // writing now would put a stale log over a newer one
  var out=JSON.stringify(S);
  try{ localStorage.setItem(KEY,out); mineJSON=out; }
  catch(e){ toast("Couldn't save — storage is full"); }
  gistChanged();                      // GitHub backup, debounced; see below
}
function save(){
  if(!storageOK){ mem=S; gistChanged(); return; }
  clearTimeout(saveTimer);
  saveTimer=setTimeout(writeNow,120);
}
/* Never let a pending write die with the tab. */
function flush(){ if(storageOK&&saveTimer) writeNow(); }
window.addEventListener("pagehide",flush);
window.addEventListener("blur",flush);
document.addEventListener("visibilitychange",function(){ if(document.hidden) flush(); });

function uid(){ return Math.random().toString(36).slice(2,10); }
var S=load();
mineJSON=JSON.stringify(S);

/* ---- a second window ----
   The installed app and a browser tab share this log. Each used to write its
   own in-memory copy wholesale, so a tab opened before a workout was saved
   elsewhere put the old log back with its next change of any kind. Now a write
   from another window is taken in at once: S is reloaded through load() and
   normalize(), and the screen is redrawn.
   Except mid-workout. Re-rendering on the set-logging path is trap 1, and a
   session with edits this window hasn't saved can't be merged with someone
   else's. Then a blocking veil asks for a reload, and writeNow() refuses until
   it is given, so the stale copy can never land. */
window.addEventListener("storage",function(e){
  if(e.storageArea&&e.storageArea!==window.localStorage) return;
  if(e.key!==KEY&&e.key!==null) return;          // null: the whole store was cleared
  otherWrote();
});
function otherWrote(){
  if(STALE) return;                              // already waiting for the reload
  var unsaved=JSON.stringify(S)!==mineJSON;
  var logging=TAB==="today"&&!document.hidden;   // the session screen is in front of someone
  if(S.active&&(unsaved||logging)){
    STALE=true; clearTimeout(saveTimer); saveTimer=null;
    staleVeil();
    return;
  }
  reloadLog();
}
function reloadLog(){
  STALE=false;
  S=load(); mineJSON=JSON.stringify(S);
  var veil=document.querySelector(".stale-veil"); if(veil) veil.remove();
  if(!S.active) stopRest();
  closeSheet(); render();
}
function staleVeil(){
  if(document.querySelector(".stale-veil")) return;
  var d=document.createElement("div");
  d.className="stale-veil";
  d.innerHTML='<div class="banner calm" role="alertdialog" aria-labelledby="stale-t">'+
    '<div class="bt" id="stale-t">This log changed in another window — reload</div>'+
    '<div class="bd">It was saved in another tab or in the installed app. Nothing more is saved from this window until you reload it, '+
      'so the newer log can\'t be overwritten. Anything entered here since that save is not kept.</div>'+
    '<div class="acts"><button class="btn primary" data-act="stale-reload">Reload</button></div></div>';
  d.querySelector('[data-act="stale-reload"]').onclick=reloadLog;
  document.body.appendChild(d);
}

/* ============================ helpers ============================ */
function $(sel,root){ return (root||document).querySelector(sel); }
function $$(sel,root){ return [].slice.call((root||document).querySelectorAll(sel)); }
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
function num(v){ var n=parseFloat(v); return isFinite(n)?n:0; }
function round(n,d){ var p=Math.pow(10,d||0); return Math.round(n*p)/p; }
function fmt(n){ n=round(n,1); return (n%1===0)?String(n):n.toFixed(1); }
function commas(n){ return String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g,","); }
function today(){ return localDay(Date.now()); }
function localDay(ts){
  var d=new Date(ts);
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}
function shortDate(ts){
  var d=new Date(ts), n=new Date();
  var same=d.getFullYear()===n.getFullYear();
  return d.toLocaleDateString(undefined,same?{month:"short",day:"numeric"}:{month:"short",day:"numeric",year:"2-digit"});
}
function relDate(ts){
  var days=Math.floor((Date.now()-ts)/864e5);
  if(days<=0) return "today";
  if(days===1) return "yesterday";
  if(days<14) return days+"d ago";
  return shortDate(ts);
}
function dur(ms){
  var s=Math.max(0,Math.round(ms/1000)), m=Math.floor(s/60);
  if(m<60) return m+"m";
  return Math.floor(m/60)+"h "+(m%60)+"m";
}
function mmss(s){ s=Math.max(0,Math.round(s)); return Math.floor(s/60)+":"+String(s%60).padStart(2,"0"); }
function e1rm(w,r){ if(!w||!r) return 0; return r===1?w:w*(1+r/30); }
function unit(){ return S.settings.unit; }
function buzz(ms){ if(S.settings.buzz&&navigator.vibrate){ try{navigator.vibrate(ms);}catch(e){} } }
function plural(n,word){ return n+" "+word+(n===1?"":"s"); }

var toastTimer=null;
function toast(msg){
  var old=$(".toast"); if(old) old.remove();
  var t=document.createElement("div");
  t.className="toast"; t.textContent=msg;
  document.body.appendChild(t);
  clearTimeout(toastTimer);
  toastTimer=setTimeout(function(){ t.remove(); },2200);
}

/* Destructive actions get a window to take it back rather than a confirm
   dialog in front of every one of them. The caller keeps the removed object
   alive in the closure; nothing is re-derived from the DOM. */
function toastUndo(msg,fn){
  var old=$(".toast"); if(old) old.remove();
  var t=document.createElement("div");
  t.className="toast act";
  var label=document.createElement("span");
  label.textContent=msg;
  var b=document.createElement("button");
  b.type="button"; b.textContent="Undo";
  b.onclick=function(){ clearTimeout(toastTimer); t.remove(); fn(); };
  t.appendChild(label); t.appendChild(b);
  document.body.appendChild(t);
  clearTimeout(toastTimer);
  toastTimer=setTimeout(function(){ t.remove(); },10000);
}
