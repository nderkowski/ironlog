<script>
/* Boot integrity gate (2.0-a1). Inline on purpose: it must run even when the
   js files do not, and a classic inline script still runs after an external one
   404s or fails to parse. It is the last script in the page, so by now every
   js file above has either run or failed.

   Each of the numbered files (01-12) ends by counting itself in self.__ilf, so
   the count is the number of files that ran to their last line; FILES below is
   how many there are (t47 asserts it equals js/files.js). 12-boot.js also
   refuses to start unless the eleven before it all counted (its first lines),
   so with any file missing the log is neither read nor written. Whatever the
   reason (a 404, a file cut short, a throw, 12-boot.js never running) this
   puts up the screen instead of a half-built app. It never touches
   localStorage; the log is exactly as it was. */
(function(){
  var FILES=12;
  if(self.__ilf===FILES) return;
  function retry(btn){
    btn.disabled=true;
    var go=function(){ location.reload(); };
    if(!("serviceWorker" in navigator)) return go();
    var t=setTimeout(go,4000);        // an update check that hangs must not trap the button
    navigator.serviceWorker.getRegistration()
      .then(function(reg){ return reg&&reg.update(); })
      .catch(function(){})
      .then(function(){ clearTimeout(t); go(); });
  }
  var d=document.createElement("div");
  d.setAttribute("role","alertdialog");
  d.setAttribute("aria-label","Iron Log didn't finish updating");
  d.setAttribute("data-ilf-gate","1");
  d.style.cssText="position:fixed;top:0;left:0;right:0;bottom:0;z-index:2147483647;"+
    "display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;"+
    "padding:32px;box-sizing:border-box;background:#111417;color:#EEEFF1;text-align:center;"+
    "font:18px/1.5 system-ui,-apple-system,sans-serif";
  var p=document.createElement("p");
  p.style.cssText="margin:0;max-width:20em";
  p.textContent="Iron Log didn't finish updating. Reconnect and reopen the app \u2014 your data is safe.";
  var b=document.createElement("button");
  b.textContent="Retry";
  b.style.cssText="font:inherit;font-weight:600;min-width:140px;min-height:48px;padding:0 28px;"+
    "border:0;border-radius:12px;background:#EEEFF1;color:#111417";
  b.onclick=function(){ retry(b); };
  d.appendChild(p); d.appendChild(b);
  (document.body||document.documentElement).appendChild(d);
})();
</script>
<!--ARTIFACT-END-->
</body>
</html>
