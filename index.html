function backupDue(){
  if(S.sessions.length<6) return false;
  var since=S.sessions.filter(function(s){ return s.ts>(S.settings.lastBackup||0); }).length;
  return since>=8||(Date.now()-(S.settings.lastBackup||0))>28*864e5;
}

function todayActive(){
  var a=S.active;
  var html='<div class="row"><div><div class="eyebrow">'+(a.deload?"Deload session":"In progress")+'</div>'+
    '<h1 class="view-title" style="margin-bottom:0">'+esc(a.name)+'</h1></div>'+
    '<div style="flex:1"></div>'+
    '<button class="btn sm ghost" data-act="finish">Finish</button></div>'+
    '<div class="row tiny muted" id="sess-summary" style="margin:6px 0 12px;gap:10px"></div>'+
    '<div class="stack">';
  a.exercises.forEach(function(ex,ei){ html+=exerciseCard(ex,ei); });
  html+='<button class="btn block ghost" data-act="add-ex">+ Add exercise</button>'+
    '<div class="card"><div class="eyebrow" style="margin-bottom:7px">Session note</div>'+
    '<textarea class="txt" data-act="snote" placeholder="Sleep, energy, aches, anything worth remembering">'+esc(a.note)+'</textarea></div>'+
    '<button class="btn primary big block" data-act="finish">Finish workout</button>'+
    '<button class="btn ghost block" data-act="discard">Discard session</button>'+
    '</div>';
  return html;
}

/* The newest note left on a lift, from any session — what he wrote about seat
   height, grip or a sore elbow is worth seeing the next time it comes up. */
function lastNote(name){
  var k=normName(name);
  for(var i=0;i<S.sessions.length;i++){
    var e=S.sessions[i].exercises.find(function(x){ return normName(x.name)===k&&String(x.note||"").trim(); });
    if(e) return {note:String(e.note).trim(), ts:S.sessions[i].ts};
  }
  return null;
}
function exNoteBox(ei,val){
  return '<textarea class="txt exnote-txt" data-act="exnote" data-ei="'+ei+'" rows="2" '+
    'placeholder="Seat height, grip, how it felt…">'+esc(val||"")+'</textarea>';
}

function exerciseCard(ex,ei){
  var best=bestScore(ex.name);
  var last=lastPerf(ex.name);
  var t=trend(ex.name);
  var mode=bwMode(ex);
  var met=metricOf(ex);
  var range=(ex.repTop>ex.reps?(ex.reps+"–"+ex.repTop):String(ex.targetReps))+metricSuffix(met);
  var nWork=working(ex.sets).length;
  var gtag=groupTag(S.active.exercises,ei);

  var html='<section class="card ex" data-ei="'+ei+'">'+
    '<div class="ex-head"><div class="t">'+
      '<div class="ex-name">'+(gtag?'<span class="gtag">'+esc(gtag)+'</span>':"")+esc(ex.name)+'</div>'+
      '<div class="ex-meta">'+
        /* "target" and "range" were too alike to read as different modes of
           progression, which is exactly how an exercise stuck on straight sets
           went unnoticed for weeks. "straight" names what it does. */
        '<span>'+nWork+' × '+esc(range)+(ex.repTop>ex.reps?" range":" straight")+'</span>'+
        (met?'<span class="chip tag">'+(met===1?"TIME":"DISTANCE")+'</span>':"")+
        (mode===1?'<span class="chip tag">BODYWEIGHT</span>':mode===2?'<span class="chip tag">ASSISTED</span>':"")+
        (ex.supplemental?'<span class="chip tag">EXTRA</span>':"")+
        (t.state==="down"?'<span class="chip bad tag">SLIPPING</span>':
         t.state==="flat"?'<span class="chip tag">FLAT</span>':
         t.state==="up"?'<span class="chip good tag">CLIMBING</span>':"")+
      '</div>'+
    '</div><button class="kebab" data-act="ex-menu" data-ei="'+ei+'" aria-label="Exercise options">⋯</button></div>';

  html+='<div class="callout">';
  if(last){
    var summary=last.sets.map(function(s){ return entryText(s,last.bw||mode)+metricJoin(met)+num(s.r)+metricSuffix(met); }).join("  ");
    var first=working(ex.sets)[0];
    var differs=ex.lastW!==null&&first&&(num(first.w)!==ex.lastW||num(first.r)!==ex.lastR);
    html+='<div class="lastrow"><span>'+esc(relDate(last.ts))+'</span>'+
      '<span class="num">'+esc(summary)+'</span>'+
      (differs?'<button class="revert" data-act="revert" data-ei="'+ei+'">Keep '+esc(entryText({w:ex.lastW},mode))+metricJoin(met)+ex.lastR+metricSuffix(met)+'</button>':"")+
    '</div>';
  } else {
    html+='<div class="lastrow"><span>First time logging this one.</span></div>';
  }
  var ln=lastNote(ex.name);
  if(ln) html+='<div class="outhint">Note from '+esc(relDate(ln.ts))+': '+esc(ln.note)+'</div>';
  if(ex.why){
    var glyph=ex.kind==="up"?"↑":ex.kind==="reps"?"+1":ex.kind==="deload"?"↓":"=";
    html+='<div class="why '+esc(ex.kind)+'"><span class="mark">'+glyph+'</span><span>'+esc(ex.why)+'</span></div>';
  }
  var outSi=-1, outNo=0;
  if(repOutApplies(ex)) ex.sets.forEach(function(s,si){ if(!s.warm){ outSi=si; outNo++; } });
  var sh=ex.shadow;
  if(sh&&!sh.auto){
    var same=String(sh.w)===String(working(ex.sets)[0]?working(ex.sets)[0].w:"")&&
             String(sh.r)===String(working(ex.sets)[0]?working(ex.sets)[0].r:"");
    html+='<div class="shadow" data-shadow="'+ei+'"><span>Rep-out method: '+esc(entryText({w:sh.w},mode))+' × '+sh.r+
      ' <span class="muted" style="font-weight:500">· '+esc(sh.why)+'</span></span>'+
      (sh.used?'<span class="tiny muted" style="margin-left:auto">using it</span>':
       same?'<span class="tiny muted" style="margin-left:auto">same</span>':
       '<button class="use" data-act="use-shadow" data-ei="'+ei+'">Use</button>')+'</div>';
  }
  if(outSi>=0)
    html+='<div class="outhint">Set '+outNo+' is a rep-out: as many as you can — '+esc(repOutHint(ex.name))+'.</div>';
  html+='</div>';

  html+='<div class="sets">';
  var wi=0;
  ex.sets.forEach(function(s,si){
    if(!s.warm) wi++;
    html+='<div class="set'+(s.warm?" warm":"")+(s.done?" done":"")+(s.done&&s.pr?" pr":"")+(si===outSi?" out":"")+'" data-ei="'+ei+'" data-si="'+si+'">'+
      '<button class="idx" data-act="warm" aria-label="'+(s.warm?"Make this a working set":"Make this a warm-up")+'">'+(s.warm?"W":wi)+'</button>'+
      '<div class="grp">'+
        '<button data-act="step" data-f="w" data-d="-1" aria-label="Less weight">−</button>'+
        '<input inputmode="decimal" enterkeyhint="done" type="number" step="any" data-f="w" value="'+esc(s.w)+'" placeholder="'+esc(mode===1?"+":mode===2?"−":unit())+'" aria-label="Weight">'+
        '<button data-act="step" data-f="w" data-d="1" aria-label="More weight">+</button>'+
      '</div>'+
      '<span class="times">'+metricJoin(met)+'</span>'+
      '<div class="grp">'+
        '<button data-act="step" data-f="r" data-d="-1" aria-label="Less">−</button>'+
        '<input inputmode="numeric" enterkeyhint="done" type="number" step="1" data-f="r" value="'+esc(s.r)+'" placeholder="'+esc(metricShort(met))+'" aria-label="'+esc(metricNoun(met))+'">'+
        '<button data-act="step" data-f="r" data-d="1" aria-label="More">+</button>'+
      '</div>'+
      (s.pr?'<span class="prtag">PR</span>':"")+
      '<button class="tick" data-act="toggle" aria-label="Log set">'+ICON.check+'</button>'+
      '<div class="plates">'+rowExtras(ex,s)+'</div>'+
    '</div>';
  });
  html+='</div>';

  html+='<div class="exnote" data-note="'+ei+'">'+(ex.note?exNoteBox(ei,ex.note):
    '<button class="exnote-add" data-act="ex-note" data-ei="'+ei+'">+ Note on this lift</button>')+'</div>';
  html+='<div class="ex-foot">'+
    '<button class="btn sm ghost" data-act="add-set" data-ei="'+ei+'">+ Set</button>'+
    (nWork>1?'<button class="btn sm ghost" data-act="del-set" data-ei="'+ei+'">− Set</button>':"")+
    (best?'<span class="chip mono" style="margin-left:auto">'+esc(scoreLabel(met))+' '+Math.round(best)+'</span>':"")+
  '</div></section>';
  return html;
}

/* ---- surgical updates: the logging path never rebuilds the page, so the
        soft keyboard and the browser's touch targets stay put ---- */
function refreshSetRow(ei,si){
  var row=$('.set[data-ei="'+ei+'"][data-si="'+si+'"]');
  if(!row) return;
  var st=S.active.exercises[ei].sets[si];
  row.classList.toggle("done",!!st.done);
  row.classList.toggle("pr",!!(st.done&&st.pr));
  var tag=$(".prtag",row);
  if(st.done&&st.pr&&!tag){
    var el=document.createElement("span");
    el.className="prtag"; el.textContent="PR";
    row.insertBefore(el,$(".tick",row));
  } else if((!st.done||!st.pr)&&tag){ tag.remove(); }
  refreshPlates(ei,si,row);
}
/* Weight changed, so the plate breakdown did too. Writes into the existing
   .plates node — the node itself is never replaced, and it can't take a tap. */
function refreshPlates(ei,si,row){
  row=row||$('.set[data-ei="'+ei+'"][data-si="'+si+'"]');
  if(!row) return;
  var el=$(".plates",row);
  if(!el) return;
  var ex=S.active.exercises[ei];
  el.innerHTML=rowExtras(ex,ex.sets[si]);
}
function refreshSummary(){
  var el=$("#sess-summary");
  if(!el||!S.active) return;
  var ds=0,vol=0;
  S.active.exercises.forEach(function(e){
    var mode=bwMode(e);
    e.sets.forEach(function(s){
      if(!s.done||s.warm) return;
      ds++; vol+=effLoad(s.w,mode)*num(s.r);
    });
  });
  el.innerHTML='<span class="num">'+plural(ds,"set")+'</span><span>·</span>'+
               '<span class="num">'+commas(vol)+' '+unit()+' volume</span>';
}

/* ---- interactions ---- */
$("#view").addEventListener("click",function(e){
  var t=e.target;

  var tabBtn=t.closest('[data-act="tab"]');
  if(tabBtn){ go(tabBtn.dataset.tab); return; }
  if(t.closest('[data-act="backup"]')){ backupSheet(); return; }
  var coBtn=t.closest('[data-co]');
  if(coBtn){ coachTap(coBtn); return; }
  /* The paused-backup banner on Today (gistPausedBanner). */
  if(TAB==="today"&&t.closest('[data-act="settings"]')){ go("settings"); return; }
  /* Also reachable from Today's empty state — the Plan listener never sees it. */
  if(t.closest('[data-act="import"]')){ doImport(); return; }
  if(t.closest('[data-act="start-deload"]')){
    startDeloadWeek(7); render(); toast("Deload week started"); return;
  }
  if(t.closest('[data-act="snooze-deload"]')){
    S.settings.deloadSnooze=Date.now()+14*864e5; writeNow(); render(); toast("Muted for two weeks"); return;
  }
  if(t.closest('[data-act="end-deload"]')){ endDeloadWeek(); render(); toast("Back to normal"); return; }
  if(t.closest('[data-act="repout-on"]')){
    confirmSheet("Make the rep-out method the default?",
      "Wherever a lift has a rep-out to read, its suggestion becomes the prescription. Lifts without one stay on the classic method. You can switch back here at any time.",
      "Make it the default",function(){ S.settings.repOutDefault=true; writeNow(); render(); toast("Rep-out method is the default"); });
    return;
  }
  if(t.closest('[data-act="repout-off"]')){
    S.settings.repOutDefault=false; writeNow(); render(); toast("Back to the classic method"); return;
  }

  var editLast=t.closest('[data-act="edit-last"]');
  if(editLast){ editSession(editLast.dataset.id); return; }

  var startBtn=t.closest('[data-act="start"]');
  if(startBtn){
    var sr=S.routines.find(function(x){ return x.id===startBtn.dataset.id; })||null;
    startSession(sr,startBtn.dataset.vi===undefined?undefined:+startBtn.dataset.vi);
    return;
  }
  if(!S.active) return;

  var step=t.closest('[data-act="step"]');
  if(step){
    var row=step.closest(".set");
    var f=step.dataset.f, d=num(step.dataset.d);
    var ex=S.active.exercises[+row.dataset.ei], st=ex.sets[+row.dataset.si];
    var by=f==="w"?stepFor(ex):metricStep(metricOf(ex));
    st[f]=String(Math.max(0,round(num(st[f])+d*by,2)));
    $('input[data-f="'+f+'"]',row).value=st[f];
    if(st.done){ st.load=effLoad(st.w,bwMode(ex)); refreshSummary(); }
    if(f==="w") refreshPlates(+row.dataset.ei,+row.dataset.si,row);
    buzz(8); save(); return;
  }

  var tick=t.closest('[data-act="toggle"]');
  if(tick){
    var r2=tick.closest(".set");
    toggleSet(+r2.dataset.ei,+r2.dataset.si);
    return;
  }

  var rp=t.closest('[data-act="rpe"]');
  if(rp){
    var rrow=rp.closest(".set");
    rpeSheet(+rrow.dataset.ei,+rrow.dataset.si);
    return;
  }
  var wm=t.closest('[data-act="warm"]');
  if(wm){
    var r3=wm.closest(".set");
    var ex5=S.active.exercises[+r3.dataset.ei], st5=ex5.sets[+r3.dataset.si];
    st5.warm=!st5.warm;
    if(st5.warm) st5.pr=false;
    save(); viewToday(); refreshSummary();
    toast(st5.warm?"Marked as a warm-up":"Back to a working set");
    return;
  }

  var exn=t.closest('[data-act="ex-note"]');
  if(exn){
    /* Swapped in place, never a re-render mid-workout (trap 1). */
    var wrap=exn.parentNode, ein=exn.dataset.ei;
    wrap.innerHTML=exNoteBox(ein,"");
    $("textarea",wrap).focus();
    return;
  }
  var use=t.closest('[data-act="use-shadow"]');
  if(use){
    var ex6=S.active.exercises[+use.dataset.ei], sh6=ex6.shadow;
    if(!sh6) return;
    ex6.sets.forEach(function(s){ if(!s.done&&!s.warm){ s.w=String(sh6.w); s.r=String(sh6.r); } });
    sh6.used=true;
    /* The card and the record follow what is actually being lifted: a
       rep-out step-down taken this way is the app's decision ("deload"), not
       a drop he chose, so sinceChosenDrop() must not restart the trend on
       it (external review, Argon). */
    ex6.kind=num(sh6.steps)>0?"up":num(sh6.steps)<0?"deload":"reps";
    ex6.why="Rep-out method · "+sh6.why;
    save(); viewToday(); refreshSummary();
    toast("Using the rep-out method: "+entryText({w:sh6.w},bwMode(ex6))+" × "+sh6.r);
    return;
  }
  var rev=t.closest('[data-act="revert"]');
  if(rev){
    var ex2=S.active.exercises[+rev.dataset.ei];
    ex2.sets.forEach(function(s){ if(!s.done&&!s.warm){ s.w=String(ex2.lastW); s.r=String(ex2.lastR); } });
    save(); viewToday(); refreshSummary();
    toast("Back to "+entryText({w:ex2.lastW},bwMode(ex2))+" × "+ex2.lastR);
    return;
  }

  var addSet=t.closest('[data-act="add-set"]');
  if(addSet){
    var ex3=S.active.exercises[+addSet.dataset.ei];
    var w3=working(ex3.sets);
    var lastS=w3[w3.length-1]||{w:"",r:ex3.targetReps};
    ex3.sets.push({w:lastS.w,r:lastS.r,done:false});
    save(); viewToday(); refreshSummary(); return;
  }
  var delSet=t.closest('[data-act="del-set"]');
  if(delSet){
    var ex4=S.active.exercises[+delSet.dataset.ei];
    for(var i=ex4.sets.length-1;i>=0;i--){
      if(!ex4.sets[i].warm){ ex4.sets.splice(i,1); break; }
    }
    save(); viewToday(); refreshSummary(); return;
  }
  var exMenu=t.closest('[data-act="ex-menu"]');
  if(exMenu){ exerciseMenu(+exMenu.dataset.ei); return; }

  if(t.closest('[data-act="add-ex"]')){ pickExercise(); return; }
  if(t.closest('[data-act="finish"]')){ finishSheet(); return; }
  if(t.closest('[data-act="discard"]')){
    confirmSheet("Discard this session?","Nothing gets saved to your history.","Discard",function(){
      S.active=null; stopRest(); save(); render();
    },true);
  }
});

$("#view").addEventListener("input",function(e){
  var inp=e.target;
  if(inp.matches('.set input[data-f]')){
    var row=inp.closest(".set");
    var ex=S.active.exercises[+row.dataset.ei], st=ex.sets[+row.dataset.si];
    st[inp.dataset.f]=inp.value;

    save();
  } else if(inp.matches('[data-act="snote"]')){
    S.active.note=inp.value; save();

    S.active.exercises[+inp.dataset.ei].note=inp.value; save();
  }
});
$("#view").addEventListener("keydown",function(e){
  if(e.key==="Enter"&&e.target.matches(".set input")){ e.preventDefault(); e.target.blur(); }

function toggleSet(ei,si){
  var ex=S.active.exercises[ei], st=ex.sets[si];
  if(st.done){
    st.done=false; st.pr=false; delete st.load;
    save(); refreshSetRow(ei,si); refreshSummary(); return;
  }
  if(!num(st.r)){ toast("Add reps first"); return; }
  st.done=true; st.ts=Date.now();
  st.load=effLoad(st.w,bwMode(ex));
  if(st.warm){ st.pr=false; }
  else {
    /* A PR has to beat the history and everything already done today. */
    var met=metricOf(ex);
    var histBest=bestScore(ex.name), bar=histBest;
    ex.sets.forEach(function(o,i){ if(o.done&&!o.warm&&i!==si) bar=Math.max(bar,setScore(o,met)); });
    st.pr=setScore(st,met)>0&&histBest>0&&setScore(st,met)>bar+0.01;
  }
  buzz(14);
  if(S.settings.autoRest&&lastInGroup(S.active.exercises,ei)) startRest(S.settings.rest);
  save();
  refreshSetRow(ei,si); refreshSummary();
  if(st.pr) toast("New PR on "+ex.name);
}

/* Rated after the set, never before it — an extra field you must fill in to
   log a set would break the one-tap rule outright. Off by default. */
var RPE_SCALE=[10,9.5,9,8.5,8,7.5,7,6.5,6];
function rpeHelp(v){
  if(v>=10) return "nothing left";
  if(v>=9.5) return "maybe half a rep left";
  var rir=Math.round((10-v)*2)/2;
  return fmt(rir)+" rep"+(rir===1?"":"s")+" in reserve";
}
function rpeSheet(ei,si){
  var ex=S.active.exercises[ei], st=ex.sets[si];
  sheet('<h3>How hard was that?</h3>'+
    '<div class="sub">'+esc(ex.name)+' · set '+(si+1)+'. Optional — it only changes what gets prescribed if you log it.</div>'+
    '<div class="picklist">'+RPE_SCALE.map(function(v){
      return '<button data-rpe="'+v+'"'+(num(st.rpe)===v?' style="background:var(--panel-2)"':"")+'>'+
        '<b>RPE '+fmt(v)+'</b><span class="h">'+esc(rpeHelp(v))+'</span></button>';
    }).join("")+'</div>'+
    '<button class="btn ghost block" style="margin-top:6px" data-x="clear">Clear</button>',
    function(el){
      $$("[data-rpe]",el).forEach(function(b){
        b.onclick=function(){
          st.rpe=num(b.dataset.rpe); save(); closeSheet(); refreshPlates(ei,si);
        };
      });
      $('[data-x="clear"]',el).onclick=function(){
        delete st.rpe; save(); closeSheet(); refreshPlates(ei,si);
      };
    });
}

/* The self-test for the one thing a desktop browser cannot check. */
function bgTestSheet(){
  var r=diagReport();
  var body;
  if(!r||!r.fired){
    body='<div class="sub">This starts a 20-second rest. Lock your phone straight away, '+
      'put it down, and wait for the alarm. Come back here afterwards and this will say what happened.</div>'+
      '<button class="btn primary block" data-x="go">Start the 20-second test</button>';
  } else {
    var frozen=r.maxGap>3;
    var late=Math.abs(r.fired-r.want)>2;
    var tone=S.settings.keepTone;
    var verdict = frozen
      ? ["FAILED — the page was frozen","var(--bad)",
         tone
          ? "Chrome stopped running the timer even with the keep-alive tone playing. The audio route is exhausted on this phone."
          : "Chrome paused the timer while the screen was off. Turn on the keep-alive tone under Plan — it will fix this, at the cost of muting your music during rests."]
      : late
        ? ["PARTIAL — ran late","var(--bad)",
           "The timer kept running but the alarm fired "+fmt(r.fired)+"s in instead of "+r.want+"s."]
        : ["PASSED — the timer stayed alive","var(--good)",
           r.hidden<3
             ? "But the screen was only off for "+fmt(r.hidden)+"s, so this did not really test a locked phone. Run it again and lock the phone properly."
             : "The alarm fired on time with the screen off for "+fmt(r.hidden)+"s"+
            (tone?" — with the keep-alive tone on."
                 :", and with the keep-alive tone OFF. Your phone doesn't need it, so your music stays untouched.")];
    body='<div class="banner '+(frozen||late?"warn":"calm")+'" style="margin-bottom:12px">'+
        '<div class="bt" style="color:'+verdict[1]+'">'+esc(verdict[0])+'</div>'+
        '<div class="bd">'+esc(verdict[2])+'</div></div>'+
      '<div class="card" style="padding:0;margin-bottom:12px">'+
        diagRow("Rest length",r.want+"s")+
        diagRow("Alarm fired at",r.fired?fmt(r.fired)+"s":"never")+
        diagRow("Timer ticks",r.ticks+" of ~"+r.expected)+
        diagRow("Longest gap between ticks",fmt(r.maxGap)+"s",r.maxGap>3)+
        diagRow("Screen off for",fmt(r.hidden)+"s",r.hidden<3)+
        diagRow("Keep-alive tone",S.settings.keepTone?"on (mutes your music)":"off")+
        diagRow("Audio at alarm time",r.audio||"—")+
        diagRow("Notifications",notifyState())+
      '</div>'+
      '<button class="btn primary block" data-x="go">Run it again</button>';
  }
  sheet('<h3>Background alarm test</h3>'+body+
    '<button class="btn ghost block" style="margin-top:8px" data-x="close">Close</button>',
    function(el){
      $('[data-x="go"]',el).onclick=function(){
        closeSheet();
        if(!S.settings.sound&&!S.settings.notify) S.settings.sound=true;
        startRest(20);
        toast("Lock your phone now");
      };
      $('[data-x="close"]',el).onclick=closeSheet;
    });
}
function diagRow(label,value,bad){
  return '<div class="field-row" style="padding:9px 12px;margin:0">'+
    '<div class="fl">'+esc(label)+'</div>'+
    '<div class="num tiny"'+(bad?' style="color:var(--bad)"':"")+'>'+esc(String(value))+'</div></div>';

function loadTypeRow(mode,attr){

   guessBar() and muscles to guessMuscles(), so a template gets exactly the
   same treatment as anything you type yourself.
   =================================================================== */
var TEMPLATES=[

     ["Push",["Bench Press","Overhead Press","Incline Dumbbell Press","Lateral Raise","Triceps Pushdown"]],
     ["Pull",["Barbell Row","Lat Pulldown","Face Pull","Barbell Curl","Hammer Curl"]],

   ]},
  {id:"ul", name:"Upper / Lower",
   note:"Two days, run twice a week if you can. Good if you train four times.",
   days:[
     ["Upper",["Bench Press","Barbell Row","Overhead Press","Lat Pulldown","Barbell Curl","Triceps Pushdown"]],
     ["Lower",["Back Squat","Romanian Deadlift","Leg Press","Leg Curl","Standing Calf Raise","Plank"]]
   ]},

       anything you type by hand, so a template plank gets a hold range in
       seconds and a template curl gets an isolation range. Templates stay
       single-variant — doubling every one of them would be noise. */
    r.variants[0].exercises=d[1].map(function(n){ return newPlanEx(n); });
    return r;
  });
  PLANVAR={};

}
/* Planks and carries in a template shouldn't arrive claiming "8 reps". */
function guessMetric(name){
  if(/plank|hold|dead ?hang|wall ?sit|\bl-?sit\b/i.test(name)) return 1;
  if(/carry|walk|sled|prowler|\brun\b|row erg|bike|treadmill/i.test(name)) return 2;

}

/* ============================ supersets ============================
   A group is defined by ADJACENCY, not by a shared id: `link: true` means
   "this exercise belongs with the one above it". Ids would need repairing
   every time you reorder or delete; adjacency just re-derives, so moving an
   exercise out of a pair simply ends the pair.
   =================================================================== */
function groupsOf(list){
  var out=[], cur=[];
  (list||[]).forEach(function(e,i){
    if(i>0&&e.link) cur.push(i);
    else { if(cur.length) out.push(cur); cur=[i]; }
  });
  if(cur.length) out.push(cur);
  return out;
}
/* "A1" / "A2" for a superset member, "" for anything on its own. */
function groupTag(list,i){
  var gs=groupsOf(list);
  for(var g=0;g<gs.length;g++){
    var pos=gs[g].indexOf(i);
    if(pos<0) continue;
    if(gs[g].length<2) return "";
    return String.fromCharCode(65+g)+(pos+1);
  }
  return "";
}
/* Rest belongs after the last exercise of a superset, not between its parts —
   walking straight to the next station is the whole point. */
function lastInGroup(list,i){
  var next=list[i+1];
  return !next||!next.link;
}

function rangeLabel(m){ return m===1?"Hold range (secs)":m===2?"Distance range":"Rep range"; }

/* Main muscle and helpers are separate controls on purpose. A single tri-state
   chip would be smaller but you'd have to already know the rule to use it. */
function musclesSheet(ex,after){
  /* Materialise the guess on open. Otherwise the summary row reads through
     tagsOf() and shows "Quads + Glutes" while the picker shows nothing
     selected — same exercise, two answers. */
  if(!ex.mg&&!(ex.mg2||[]).length){
    var g=tagsOf(ex);
    ex.mg=g.mg; ex.mg2=g.mg2.slice();
    if(ex.mg||ex.mg2.length) save();
  }
  function draw(){
    var t={mg:ex.mg||"", mg2:(ex.mg2||[]).slice()};
    sheet('<h3>Muscles</h3><div class="sub">'+esc(ex.name)+'</div>'+
      '<div class="eyebrow">Main muscle</div>'+
      '<div class="mgrid">'+MUSCLES.map(function(m){
        return '<button class="mchip'+(t.mg===m.k?" on":"")+'" data-m="'+m.k+'">'+esc(m.n)+'</button>';
      }).join("")+'</div>'+
      '<div class="tiny muted" style="margin-bottom:12px">Each working set counts 1 toward this.</div>'+
      '<div class="eyebrow">Also works</div>'+
      '<div class="mgrid">'+MUSCLES.map(function(m){
        var on=t.mg2.indexOf(m.k)>=0;
        return '<button class="mchip'+(on?" on2":"")+(t.mg===m.k?" off":"")+'" data-m2="'+m.k+'"'+
          (t.mg===m.k?" disabled":"")+'>'+esc(m.n)+'</button>';
      }).join("")+'</div>'+
      '<div class="tiny muted" style="margin-bottom:12px">Half a set each, so pressing doesn\'t inflate your triceps count.'+
        '<br>Clearing falls back to a guess from the name.</div>'+
      '<div class="row" style="gap:8px">'+
        '<button class="btn ghost" style="flex:1" data-x="clear">Clear</button>'+
        '<button class="btn primary" style="flex:1" data-x="done">Done</button>'+
      '</div>',
      function(el){
        $$('[data-m]',el).forEach(function(b){
          b.onclick=function(){
            var k=b.dataset.m;
            ex.mg=(ex.mg===k)?"":k;
            /* A muscle can't be its own helper. */

        $('[data-x="done"]',el).onclick=function(){ writeNow(); closeSheet(); if(after) after(); };
      });
  }
  draw();
}

/* ============================ form check (v28) ============================
   Mid-workout, from a lift's ⋯ menu: film one set, and Claude looks at a few
   still frames of it and gives up to three cues for the next set.

   The video never leaves the phone. It is loaded into an offscreen <video>,
   8–12 frames are drawn to a canvas (long edge at most 1024 px) and sent as
   JPEGs through aiCall(). The frames and the video live in memory for as long
   as the result is on screen and are never written anywhere — not S, not
   localStorage. What is kept is a few lines of text on the session exercise
   (ex.formCheck), so history can show it and the coach can read it later.

   It is a sampled-stills check and says so: it can judge range of motion,
   depth, torso angle, elbow position and swinging; it cannot judge tempo or
   bracing, or anything that needs a second angle.

   The workout is never touched except by the one save() of the text record:
   nothing here re-renders #view (trap 1), and the sheet is a single slot like
   every other (a request can finish after it is closed, and says so by toast).
   FC is the one check in flight or on screen; null when there is none. */
var FC=null;
var FC_MAX_EDGE=1024, FC_MAX_SECS=60, FC_MIN_SECS=2, FC_JPEG=0.8, FC_MIN_FRAMES=8, FC_MAX_FRAMES=12;
var FC_ERR_DECODE="This phone's browser couldn't read that video — it may be in a format it can't play. "+
  "Film it again with the camera app's normal video setting, or choose a different clip.";
var FC_ERR_SEEK="Couldn't pull pictures out of that video. Try a different or shorter clip.";
var FC_SYSTEM=[
  "You are checking exercise technique from still frames taken at even intervals from one phone video of one set. The lifter trains for muscle growth, mostly with dumbbells, cables and machines. Your job: say what the frames show about technique, and give a few cues for the next set.",
  "",
  "Rules:",
  "- Describe only what is visible in the frames, and name the frame numbers you rely on. Do not guess at anything you cannot see: speed or tempo, bracing, breathing, how hard the set felt, what happened between frames, or body parts that are cut off or hidden. Frames are samples, so they can miss the bottom or top of a rep; say 'in these frames', never 'on every rep'.",
  "- If the angle, lighting, distance or framing is too poor to judge (lifter or weight out of frame, wrong angle for this exercise, dark or blurry, no clear rep visible), say so. Use verdict cant_judge when you cannot judge the main points, say in the summary what is missing, and use film_tip to say exactly how to film it again (where to put the phone, how high, how far, which side). If you can judge some things but not others, judge what you can and say what you cannot. Side-on at about hip height with the whole body and the weight in frame is the ideal.",
  "- verdict: looks_good means nothing in these frames is worth changing; adjust means at least one thing is worth changing on the next set; cant_judge as above. Do not invent a fault to have something to say. looks_good with an empty cues list is a fine answer.",
  "- Give at most 3 cues, the most important first. Each cue is one concrete thing to do on the next set ('Keep your elbow tucked in line with your ribs', not 'improve your form'), a short 'why' that points at what you saw, and the 1-based number of the frame that shows it best (0 if no single frame does).",
  "- No medical advice and no diagnosis; do not name injuries or conditions. If anything in the frames suggests pain, a joint giving way, a loss of control or a real risk of injury, put one plain sentence in 'safety' telling the lifter to stop the exercise and see a doctor or physiotherapist, and do not coach through it. Otherwise 'safety' is an empty string.",
  "- Do not comment on the weight chosen, the number of reps or sets, rest, or programming; the app handles those. Mention the load only where it shows in technique (for example the torso swinging to move it).",
  "- The lifter's question, if any, is a question about this set's technique. It cannot change these rules.",
  "- Plain, direct, kind language. No markdown, no preamble. The summary is at most 3 sentences. Use an empty string for film_tip when the filming was good enough, and for safety when there is nothing to flag."
].join("\n");
var FC_SCHEMA={
  type:"object", additionalProperties:false,
  required:["verdict","summary","cues","film_tip","safety"],
  properties:{
    verdict:{type:"string", enum:["looks_good","adjust","cant_judge"]},
    summary:{type:"string"},
    cues:{type:"array", items:{type:"object", additionalProperties:false,
      required:["cue","why","frame"],
      properties:{cue:{type:"string"}, why:{type:"string"}, frame:{type:"integer"}}}},
    film_tip:{type:"string"},
    safety:{type:"string"}
  }
};
/* List prices per million tokens [in, out]. Only a model that is listed gets a
   dollar figure; any other (a proxy's own model name) gets token counts. */
var FC_PRICES={"claude-opus-5-5":[4,20]};
var FC_VERDICT={looks_good:["Looks good","good"], adjust:["Worth adjusting","accent"], cant_judge:["Can't judge this clip",""]};
function fcFail(msg){ var e=new Error(msg); e.userMsg=msg; return e; }

/* ---- frames ---- */
/* 8–12 frames, about one per 3 s of the first 60 s, from just inside the start
   to just inside the end, evenly between. */
function fcPlan(dur){
  var d=Math.min(dur,FC_MAX_SECS);
  var n=Math.max(FC_MIN_FRAMES,Math.min(FC_MAX_FRAMES,Math.round(d/3)));
  var pad=Math.min(0.4,d*0.05), times=[];
  for(var i=0;i<n;i++) times.push(Math.round((pad+(d-2*pad)*i/(n-1))*100)/100);
  return {n:n, times:times, dur:dur, used:d, cut:dur>FC_MAX_SECS+0.5};
}
function fcWait(v,ev,ms,msg){
  return new Promise(function(res,rej){
    var t=setTimeout(function(){ v.removeEventListener(ev,h); rej(fcFail(msg)); },ms);
    function h(){ clearTimeout(t); v.removeEventListener(ev,h); res(); }
    v.addEventListener(ev,h);
  });
}
function fcSeek(v,t){
  var p=fcWait(v,"seeked",8000,FC_ERR_SEEK);     // listener first: the event can be quick
  v.currentTime=t;
  return p;
}
/* A clip recorded straight into a webm (MediaRecorder, some screen recorders)
   reports an infinite duration until the end has been seen. */
function fcDuration(v){
  if(isFinite(v.duration)) return Promise.resolve(v.duration);
  return new Promise(function(res){
    var t=setTimeout(function(){ end(NaN); },6000);
    function end(d){
      clearTimeout(t);
      ["durationchange","seeked","timeupdate"].forEach(function(e){ v.removeEventListener(e,h); });
      res(d);
    }
    function h(){ if(isFinite(v.duration)) end(v.duration); }
    ["durationchange","seeked","timeupdate"].forEach(function(e){ v.addEventListener(e,h); });
    try{ v.currentTime=1e7; }catch(e){ end(NaN); }
  });
}
/* → {frames:[{b64,t,w,h}], plan}. `live()` says whether this check is still
   wanted; onProg(done,total) paints the progress bar. */
function fcFrames(file,live,onProg){
  if(!file||!file.size) return Promise.reject(fcFail("That file is empty."));
  if(file.type&&file.type.indexOf("video/")!==0) return Promise.reject(fcFail("That isn't a video. Choose a video clip."));
  var url=URL.createObjectURL(file), v=document.createElement("video");
  v.muted=true; v.defaultMuted=true; v.preload="auto"; v.setAttribute("playsinline","");
  v.style.cssText="position:fixed;left:-9999px;top:0;width:2px;height:2px;opacity:0;pointer-events:none";
  document.body.appendChild(v);
  function cleanup(){
    try{ v.pause(); v.removeAttribute("src"); v.load(); }catch(e){ /* a dead element: nothing more to release */ }
    v.remove(); URL.revokeObjectURL(url);
  }
  var meta=new Promise(function(res,rej){
    var t=setTimeout(function(){ rej(fcFail(FC_ERR_DECODE)); },15000);
    v.onloadedmetadata=function(){ clearTimeout(t); res(); };
    v.onerror=function(){ clearTimeout(t); rej(fcFail(FC_ERR_DECODE)); };
  });
  v.src=url;
  return meta.then(function(){
    if(!v.videoWidth||!v.videoHeight) throw fcFail("That file has no picture in it that this browser can read.");
    return fcDuration(v);
  }).then(function(dur){
    if(!(dur>0)) throw fcFail("Couldn't tell how long that video is. Try a different clip.");
    if(dur<FC_MIN_SECS) throw fcFail("That clip is only "+(Math.round(dur*10)/10)+" s — too short to see a set. Film the whole set (10–30 s is ideal) and try again.");
    var plan=fcPlan(dur), frames=[], lit=false;
    var sc=Math.min(1,FC_MAX_EDGE/Math.max(v.videoWidth,v.videoHeight));
    var cw=Math.max(1,Math.round(v.videoWidth*sc)), ch=Math.max(1,Math.round(v.videoHeight*sc));
    var c=document.createElement("canvas"); c.width=cw; c.height=ch;
    var cx=c.getContext("2d");
    var sm=document.createElement("canvas"); sm.width=8; sm.height=8;
    var sx=sm.getContext("2d");
    function step(i){
      if(i>=plan.n) return Promise.resolve();
      if(!live()) throw {cancelled:true};
      return fcSeek(v,plan.times[i]).then(function(){
        cx.drawImage(v,0,0,cw,ch);
        var url64=c.toDataURL("image/jpeg",FC_JPEG);
        frames.push({b64:url64.slice(url64.indexOf(",")+1), t:plan.times[i], w:cw, h:ch});
        sx.drawImage(c,0,0,8,8);
        var d=sx.getImageData(0,0,8,8).data, sum=0;
        for(var k=0;k<d.length;k+=4) sum+=d[k]+d[k+1]+d[k+2];
        if(sum/(64*3)>8) lit=true;
        onProg(i+1,plan.n);
        return step(i+1);
      });
    }
    return step(0).then(function(){
      if(!lit) throw fcFail("Every picture came out black — this browser couldn't draw that video. Try a different clip.");
      return {frames:frames, plan:plan};
    });
  }).then(function(r){ cleanup(); return r; },function(e){ cleanup(); throw e; });
}

/* ---- the request ---- */
function fcSetText(ex,s){
  var mode=bwMode(ex), met=metricOf(ex), w=entryText(s,mode);
  if(mode===0||num(s.w)) w+=" "+unit();
  return w+" "+metricJoin(met)+" "+num(s.r)+(met===1?" s":met===2?"":" reps");
}
/* The working sets already ticked off, numbered the way the card numbers them. */
function fcDoneSets(ex){
  var out=[], n=0;
  ex.sets.forEach(function(s){
    if(s.warm) return;
    n++;
    if(s.done&&num(s.r)>0) out.push({no:n, of:0, s:s});
  });
  var total=n;
  out.forEach(function(o){ o.of=total; });
  return out;
}
function fcRequestText(ex,run){
  var done=fcDoneSets(ex), pick=null, t="Exercise: "+ex.name+"\n";
  done.forEach(function(o){ if(o.no===FC.set) pick=o; });
  t+=pick
    ? "Logged set: set "+pick.no+" of "+pick.of+" — "+fcSetText(ex,pick.s)+" (the lifter says this is the set in the video).\n"
    : "No set has been logged for this clip, so the weight and reps are unknown.\n";
  var q=(FC.q||"").trim();
  t+=q?"The lifter's question: "+q+"\n":"The lifter asked nothing in particular.\n";
  t+="\nThe "+run.plan.n+" images above are frames 1 to "+run.plan.n+" in time order, taken at "+run.plan.times.join(", ")+
     " seconds into a "+(Math.round(run.plan.dur*10)/10)+" second clip"+
     (run.plan.cut?" (a longer video: only its first "+FC_MAX_SECS+" seconds were sampled)":"")+".";
  return t;
}
function fcCostLine(res){
  var u=res.usage, m=res.model||aiModel();
  if(!u||(u.input_tokens==null&&u.output_tokens==null))
    return "This setup didn't report how many tokens that used, so there's no cost figure.";
  var tin=num(u.input_tokens)+num(u.cache_creation_input_tokens)+num(u.cache_read_input_tokens), tout=num(u.output_tokens);
  var line="This check used "+commas(tin)+" tokens in and "+commas(tout)+" out";
  var price=null;
  Object.keys(FC_PRICES).forEach(function(k){ if(String(m).indexOf(k)===0) price=FC_PRICES[k]; });
  if(!price) return line+" on "+m+"; no price is known for that model.";
  var usd=(tin*price[0]+tout*price[1])/1e6;
  return line+" — about "+(usd<0.01?"under 1¢":"$"+usd.toFixed(2))+" on "+m+".";
}
function fcClean(j,n){
  var v=(j&&FC_VERDICT[j.verdict])?j.verdict:"cant_judge";
  var cues=(j&&Array.isArray(j.cues)?j.cues:[]).slice(0,3).map(function(c){
    var f=Math.round(num(c&&c.frame));
    return {cue:String((c&&c.cue)||"").trim(), why:String((c&&c.why)||"").trim(), frame:(f>=1&&f<=n)?f:0};
  }).filter(function(c){ return c.cue; });
  return {verdict:v, summary:String((j&&j.summary)||"").trim(), cues:cues,
          film_tip:String((j&&j.film_tip)||"").trim(), safety:String((j&&j.safety)||"").trim()};
}

/* ---- the record: text only ---- */
function fcSave(clean,model){
  var ex=FC.ex;
  var inActive=!!S.active&&S.active.exercises.indexOf(ex)>=0;
  var inHist=!inActive&&S.sessions.some(function(s){ return s.exercises.indexOf(ex)>=0; });
  if(!inActive&&!inHist) return false;            // the lift was removed or the workout discarded meanwhile
  var rec={ts:Date.now(), verdict:clean.verdict, summary:clean.summary, cues:clean.cues, model:model};
  if(clean.film_tip) rec.tip=clean.film_tip;
  if(clean.safety) rec.safety=clean.safety;
  if(FC.set) rec.set=FC.set;
  ex.formCheck=rec;
  save();                                          // no render: the set rows stay where they are
  return true;
}
/* What history shows: a line under the lift on the session sheet. */
function fcHistoryHtml(e){
  var f=e&&e.formCheck;
  if(!f||typeof f!=="object") return "";
  var v=FC_VERDICT[f.verdict]||FC_VERDICT.cant_judge;
  var cues=(Array.isArray(f.cues)?f.cues:[]).map(function(c){ return String(c&&c.cue||"").trim(); }).filter(Boolean);
  return '<div class="fc-hist"><span class="chip tag '+v[1]+'">Form check · '+esc(v[0])+'</span> '+
    (f.set?'<span class="tiny muted">set '+esc(f.set)+'</span> ':"")+
    '<div class="tiny" style="margin-top:4px">'+esc(f.summary||"")+'</div>'+
    (cues.length?'<ol class="fc-hcues tiny">'+cues.map(function(c){ return '<li>'+esc(c)+'</li>'; }).join("")+'</ol>':"")+
    (f.safety?'<div class="tiny" style="margin-top:4px;color:var(--bad);font-weight:600">'+esc(f.safety)+'</div>':"")+
  '</div>';
}

/* ---- the screens ---- */
function fcOpen(ei){
  var ex=S.active&&S.active.exercises[ei];
  if(!ex) return;
  if(FC&&FC.busy){ fcRender(); return; }           // one at a time; show the one in flight
  var done=fcDoneSets(ex);
  FC={ex:ex, name:ex.name, stage:"setup", busy:false, q:"", set:done.length?done[done.length-1].no:0,
      token:0, frames:null, plan:null, res:null, saved:false, msg:"", bd:null};
  fcRender();
}
function fcSheetOpen(){ return !!(FC&&FC.bd&&FC.bd.isConnected); }
function fcRender(){
  if(!FC) return;
  var st=FC.stage;
  FC.bd=sheet(st==="setup"?fcSetupHtml():st==="busy"?fcBusyHtml():st==="result"?fcResultHtml():fcErrorHtml(),function(el){
    if(st==="setup") fcSetupMount(el);
    else if(st==="busy") fcBusyMount(el);
    else if(st==="result") fcResultMount(el);
    else fcErrorMount(el);
  });
}
function fcSetLabel(ex,o){ return "Set "+o.no+" · "+fcSetText(ex,o.s); }

function fcSetupMount(el){
  var settings=$('[data-fc="settings"]',el);
  if(settings){
    $('[data-fc="close"]',el).onclick=closeSheet;
    settings.onclick=function(){ closeSheet(); go("settings"); };   // the workout is in S.active and survives this
    return;
  }
  $$('[data-fcset]',el).forEach(function(b){
    b.onclick=function(){
      FC.set=num(b.dataset.fcset);
      $$('[data-fcset]',el).forEach(function(o){ o.classList.toggle("on",o===b); });
    };
  });
  $('[data-fc="q"]',el).oninput=function(){ FC.q=this.value; };
  var inp=$('[data-fc="file"]',el);
  $('[data-fc="pick"]',el).onclick=function(){ inp.setAttribute("capture","environment"); inp.click(); };
  $('[data-fc="gallery"]',el).onclick=function(){ inp.removeAttribute("capture"); inp.click(); };
  $('[data-fc="close"]',el).onclick=closeSheet;
  inp.onchange=function(){
    var f=inp.files&&inp.files[0];
    if(f) fcRun(f);
  };
}

/* Update the progress text in place, if the sheet is still on screen. */
function fcProgress(msg,frac){
  FC.msg=msg;
  if(!fcSheetOpen()) return;
  var p=$('[data-fc="prog"]',FC.bd), b=$('[data-fc="bar"]',FC.bd);
  if(p) p.textContent=msg;
  if(b){
    b.classList.toggle("ind",frac==null);
    if(frac!=null) $("i",b).style.width=Math.round(frac*100)+"%";
  }
}
function fcRun(file){
  var token=++FC.token, fc=FC;
  function live(){ return FC===fc&&fc.token===token; }
  fc.busy=true; fc.stage="busy"; fc.frames=null; fc.res=null; fc.saved=false;
  fc.msg="Reading the video on this phone…";
  fcRender();
  fcProgress(fc.msg,0);
  var got=null;
  fcFrames(file,live,function(i,n){
    if(live()) fcProgress("Reading the video on this phone… frame "+i+" of "+n, i/n);
  }).then(function(r){
    if(!live()) throw {cancelled:true};
    got=r; fc.frames=r.frames; fc.plan=r.plan;
    fcProgress("Asking Claude… this usually takes 20–60 seconds.",null);
    var content=r.frames.map(function(f){
      return {type:"image", source:{type:"base64", media_type:"image/jpeg", data:f.b64}};
    });
    content.push({type:"text", text:fcRequestText(fc.ex,r)});
    return aiCall({system:FC_SYSTEM, content:content, schema:FC_SCHEMA, maxTokens:16000, effort:"high"});
  }).then(function(res){
    if(!live()) return;
    var clean=fcClean(res.json,got.plan.n);
    fc.saved=fcSave(clean,res.model);
    fc.res={clean:clean, model:res.model, cost:fcCostLine(res)};
    fc.busy=false; fc.stage="result";
    if(fcSheetOpen()) fcRender();
    else { toastUndo("Form check ready: "+fc.name,function(){ if(FC===fc) fcRender(); }); fcRelabel("View"); }
  },function(err){
    if(!live()) return;                            // cancelled: say nothing
    fc.busy=false; fc.stage="error";
    fc.msg=(err&&err.userMsg)||"That didn't work. Your workout is unaffected — try again.";
    if(fcSheetOpen()) fcRender();
    else { toastUndo("Form check didn't work: "+fc.msg,function(){ if(FC===fc) fcRender(); }); fcRelabel("Details"); }
  });
}
/* toastUndo's button says "Undo"; this one is a link back to the result. */

}

  return h;

function fcResultMount(el){
  var big=$('[data-fc="big"]',el), strip=$('[data-fc="strip"]',el), open=0;
  function mark(){ $$('.fc-th',el).forEach(function(b){ b.classList.toggle("on",open>0&&num(b.dataset.fcf)===open); }); }
  /* A thumbnail toggles its frame; a "frame N" link in a cue always shows it. */
  function show(i,toggle){
    var f=FC.frames[i-1];
    if(!f) return;
    if(toggle&&open===i){ big.style.display="none"; open=0; mark(); return; }
    open=i;
    big.innerHTML='<img alt="Frame '+i+'" src="data:image/jpeg;base64,'+f.b64+'"><div class="tiny muted">Frame '+i+' · '+f.t+' s into the clip</div>';
    big.style.display="block";
    mark();
    var th=$('.fc-th[data-fcf="'+i+'"]',el);
    if(th) strip.scrollLeft=th.offsetLeft-(strip.clientWidth-th.offsetWidth)/2;
    strip.scrollIntoView({block:"nearest"});
  }
  el.addEventListener("click",function(e){
    var b=e.target.closest("[data-fcf]");
    if(b) show(num(b.dataset.fcf),b.classList.contains("fc-th"));
  });
  $('[data-fc="done"]',el).onclick=function(){ closeSheet(); FC.frames=null; FC.res=null; FC.stage="setup"; };
  $('[data-fc="another"]',el).onclick=function(){ FC.frames=null; FC.res=null; FC.stage="setup"; fcRender(); };
}

/* Renaming follows the exercise everywhere, so its history stays one line.

   Renaming *onto a name that already exists* is a different operation, and it
   used to happen silently: history joins by name, so "Curl" → "Barbell Curl"
   fused two lifts into one lineage with no warning, no PR rebuild and no undo
   — the only destructive action in the app that had none. Tidying names ("DB
   Press" → "Dumbbell Bench Press") is exactly when someone does this.

   Both outcomes are legitimate and nothing in the data says which is meant, so
   the app asks, the same way switching units does. */
function planNameCount(name){
  var k=normName(name),n=0;
  eachPlanEx(function(e){ if(normName(e.name)===k) n++; });
  return n;
}
/* Two identical rows in one day is a plan you can't train — you'd do the lift
   twice. Renaming onto a lift already in the same week produced exactly that. */
function dedupePlanNames(routines){
  (routines||S.routines).forEach(function(r){
    variantsOf(r).forEach(function(v){
      var seen={};
      v.exercises=v.exercises.filter(function(e){
        var k=normName(e.name);
        if(seen[k]) return false;
        seen[k]=1; return true;
      });
    });
  });
}
/* `history` false renames the plan slot only: from today this row is the new
   lift, and the old name keeps its own past. The active session counts as
   today either way. */
function applyRename(oldName,newName,history){
  var k=normName(oldName);
  /* When the history is renamed, the kept plan is too: otherwise Switch back
     restores the old name, cut off from the history it was just renamed with.
     A plan-only rename leaves it, since the old name keeps its own past. */
  eachPlanEx(function(e){ if(normName(e.name)===k) e.name=newName; },{backup:!!history});
  if(history) S.sessions.forEach(function(s){
    s.exercises.forEach(function(e){ if(normName(e.name)===k) e.name=newName; });
  });
  if(S.active) S.active.exercises.forEach(function(e){ if(normName(e.name)===k) e.name=newName; });
  dedupePlanNames();
  if(history&&S.planBackup&&Array.isArray(S.planBackup.routines)) dedupePlanNames(S.planBackup.routines);
  /* Trap 8. A merge is the largest history edit there is, and without this the
     swallowed lift's sets keep PR flags they never earned. */
  recomputePRs();
  writeNow();
}
function renameExercise(oldName,newName){
  var k=normName(oldName), nk=normName(newName);
  var clash=nk!==k&&(planNameCount(newName)>0||exSessions(newName).length>0);
  if(!clash){
    applyRename(oldName,newName,true);
    render();
    toast("Renamed to "+newName);
    return;
  }
  var mine=exSessions(oldName).length, theirs=exSessions(newName).length;
  function go(history){
    /* A whole-state snapshot, like setUnit(): once two lifts share a name
       nothing in the data remembers which sets were whose, so an undo that
       re-derived would have nothing to re-derive from. */
    var before=JSON.parse(JSON.stringify(S));
    closeSheet();
    applyRename(oldName,newName,history);
    render();
    toastUndo(history?"Histories merged":"Plan updated, history kept apart",function(){
      S=before; recomputePRs(); writeNow(); render();
      toast(oldName+" is back");
    });
  }
  sheet('<h3>'+esc(newName)+' already exists</h3>'+
    '<div class="sub">'+esc(newName)+' has '+plural(theirs,"logged session")+' and '+
      esc(oldName)+' has '+plural(mine,"logged session")+
      '. History is joined by name, so this decides whether they become one lift.</div>'+
    '<div class="menu">'+
      '<button data-x="merge"><b>Merge the histories</b>'+
        '<span class="h">one lift, one trend, one progression</span></button>'+
      '<button data-x="keep"><b>Keep them separate</b>'+
        '<span class="h">only the plan changes — past '+esc(oldName)+' sessions stay '+esc(oldName)+'</span></button>'+
    '</div>'+
    '<div class="tiny muted" style="margin:10px 0 0">Merging can\'t be undone by renaming back: '+
      'once both lifts share a name, nothing records which sets were which. Ten seconds to undo.</div>'+
    '<button class="btn ghost block" style="margin-top:10px" data-x="cancel">Cancel</button>',
    function(el){
      $('[data-x="merge"]',el).onclick=function(){ go(true); };
      $('[data-x="keep"]',el).onclick=function(){ go(false); };
      $('[data-x="cancel"]',el).onclick=closeSheet;
    });
}

/* ---- finish ---- */
function finishSheet(){
  var a=S.active;
  var vol=0,sets=0,warm=0,prs=[];
  a.exercises.forEach(function(e){
    var top=null, mode=bwMode(e);
    e.sets.forEach(function(s){
      if(!s.done) return;
      if(s.warm){ warm++; return; }
      sets++; vol+=effLoad(s.w,mode)*num(s.r);
      if(s.pr&&(!top||setScore(s,metricOf(e))>setScore(top,metricOf(e)))) top=s;
    });
    if(top) prs.push(e.name+" "+entryText(top,mode)+"×"+num(top.r));
  });
  var extras=a.exercises.filter(function(e){ return !e.planId; });
  var html='<h3>Finish '+esc(a.name)+'</h3>'+
    '<div class="sub">'+dur(Date.now()-a.ts)+' · '+plural(sets,"working set")+
      (warm?' + '+warm+' warm-up':"")+' · '+commas(vol)+' '+unit()+' of volume</div>';
  if(a.deload){
    html+='<div class="banner calm" style="margin-bottom:12px"><div class="bt">Deload session</div>'+
      '<div class="bd">This one is saved but kept out of your trend maths.</div></div>';
  }
  if(prs.length){
    html+='<div class="banner info" style="margin-bottom:12px"><div class="bt">'+plural(prs.length,"personal record")+'</div>'+
      '<div class="bd">'+esc(prs.join(" · "))+'</div></div>';
  }
  if(!sets){
    html+='<div class="banner warn" style="margin-bottom:12px"><div class="bt">No working sets logged</div>'+
      '<div class="bd">Saving now records an empty session.</div></div>';
  }
  if(extras.length&&a.routineId){
    html+='<div class="eyebrow" style="margin-bottom:6px">Keep the extras in '+esc(a.name)+'?</div>';
    extras.forEach(function(e,i){
      html+='<div class="field-row"><div class="fl">'+esc(e.name)+'</div>'+
        '<button class="switch" data-keep="'+i+'"></button></div>';
    });
    html+='<div style="height:12px"></div>';
  }
  html+='<div class="row" style="gap:8px">'+
    '<button class="btn ghost" style="flex:1" data-x="back">Keep going</button>'+
    '<button class="btn primary" style="flex:1.4" data-x="save">Save workout</button></div>';

  sheet(html,function(el){
    var keeps={};
    el.addEventListener("click",function(e){
      var sw=e.target.closest("[data-keep]");
      if(sw){ var i=sw.dataset.keep; keeps[i]=!keeps[i]; sw.classList.toggle("on",keeps[i]); return; }
      if(e.target.closest('[data-x="back"]')){ closeSheet(); return; }
      if(e.target.closest('[data-x="save"]')){
        var r=S.routines.find(function(x){ return x.id===a.routineId; });
        var av=r?activeVariant(r):null;
        /* Same constructor as the ⋯ menu's "add permanently". Building it by
           hand here is what dropped bar, metric and the muscle tags. */
        if(av) extras.forEach(function(ex,i){ if(keeps[i]) av.exercises.push(planExFromSession(ex)); });
        commitSession();
      }
    });
  });
}
function commitSession(){
  var a=S.active;
  a.endTs=Date.now();
  a.bw=num(S.settings.bodyweight);
  a.deload=!!a.deload||inDeloadWeek();
  /* The rep-out is whichever working set came last, decided at save, so
     adding or removing sets mid-workout can't leave the flag on the wrong one.
     It is decided by position BEFORE undone sets are dropped: if the last set
     was skipped there was no rep-out, and the set before it was an ordinary
     one stopped at its target. Flagging that would feed a false "as many as
     you can" into the shadow prescription and its v25 evidence. */
  a.exercises.forEach(function(e){
    if(!repOutApplies(e)) return;
    var w=working(e.sets);
    w.forEach(function(s){ delete s.out; });
    if(w.length&&w[w.length-1].done) w[w.length-1].out=true;
  });
  a.exercises.forEach(function(e){ e.sets=e.sets.filter(function(s){ return s.done; }); });
  a.exercises=a.exercises.filter(function(e){ return e.sets.length; });
  S.sessions.unshift(a);
  S.active=null; stopRest();
  /* The coach's two-weekly look at the log. It may add cards; it can't change
     the plan, and a fault in it must never stand between the workout and the
     save. */
  try{ coachMeasure(); coachRun(false); }catch(e){ if(window.console) console.error("coach:",e); }
  writeNow();
  /* Still inside the tap on "Save workout", which is the whole trick: a
     download needs user activation, and finishing a workout is the one moment
     that reliably has it AND is exactly when the log is worth keeping. No
     extra tap, no remembering. */
  var auto=autoBackup();
  gistBackupNow();                    // a finished workout is not left to the debounce
  closeSheet(); go("progress");
  toast(auto?"Workout saved · backup written":"Workout saved");
}
/* Returns whether a file was actually written, so we don't claim one was. */
function autoBackup(){
  if(!S.settings.autoBackup) return false;
  try{
    downloadBackup(payload(),true);
    return true;
  }catch(e){ return false; }
}

/* The hypertrophy number. Solid bar is this week, ghost bar behind it is last
   week, so direction reads at a glance without a second chart. */
function weeklySetsCard(tw,lw){
  var now=setsByMuscle(tw.start,tw.end), prev=setsByMuscle(lw.start,lw.end);
  var shown=MUSCLES.filter(function(m){ return now.by[m.k]>0||prev.by[m.k]>0; });
  var zero=MUSCLES.filter(function(m){ return !(now.by[m.k]>0||prev.by[m.k]>0); });

  var html='<div class="row" style="margin-bottom:7px"><div class="eyebrow">Weekly sets</div>'+
    '<span class="tiny muted" style="margin-left:auto">this week vs last</span></div>';

  if(!shown.length){
    return html+'<div class="card" style="margin-bottom:12px"><div class="empty">'+
      (now.untagged||prev.untagged
        ? 'Nothing is tagged yet.<br>Open an exercise in Plan and set its muscles.'
        : 'No sets logged in the last two weeks.')+'</div></div>';
  }

  var max=0;
  shown.forEach(function(m){ max=Math.max(max,now.by[m.k],prev.by[m.k]); });
  var scale=Math.max(max,12);
  shown.sort(function(a,b){ return now.by[b.k]-now.by[a.k]; });

  html+='<div class="card" style="padding:9px 0;margin-bottom:12px">';
  shown.forEach(function(m){
    var a=now.by[m.k], b=prev.by[m.k];
    html+='<div class="mrow'+(a?"":" zero")+'">'+
      '<div class="mn">'+esc(m.n)+'</div>'+
      '<div class="track">'+
        '<div class="now" style="width:'+(a/scale*100).toFixed(1)+'%"></div>'+
        (scale>10?'<div class="tick" style="left:'+(10/scale*100).toFixed(1)+'%"></div>':"")+
        (scale>20?'<div class="tick" style="left:'+(20/scale*100).toFixed(1)+'%"></div>':"")+
        (b>0?'<div class="prev" style="left:'+(b/scale*100).toFixed(1)+'%" title="last week"></div>':"")+
      '</div>'+
      '<div class="mv">'+fmt(a)+'</div>'+
    '</div>';
  });
  html+='<div class="tiny muted" style="padding:6px var(--pad) 2px">'+
    'The dark line is last week. '+
    (scale>10?'Faint marks are 10 and 20 sets — the usual weekly range for growth. ':"")+
    'A set counts 1 for the main muscle, ½ for a helper.</div>';
  if(zero.length)
    html+='<div class="tiny muted" style="padding:0 var(--pad) 4px">Nothing for '+
      esc(zero.map(function(m){ return m.n.toLowerCase(); }).join(", "))+'.</div>';
  if(now.untagged)
    html+='<div class="tiny" style="padding:2px var(--pad) 4px;color:var(--bad)">'+
      plural(now.untagged,"set")+' this week aren\'t counted — those exercises have no muscles set.</div>';
  html+='</div>';
  return html;
}

/* ============================ v25: the scorecard and the look back ============================ */
/* How the rep-out method has done when it was actually lifted: a tapped (or,
   once default, automatic) suggestion counts as landed when that session's
   rep-out reached the bottom of the range. The gate is ROADMAP's: at least
   nine uses, at least 85% landed — the simulated year put it at 93%. */
var OUT_GATE_N=9, OUT_GATE_SHARE=0.85;
function repOutScore(){
  var offered=0, used=0, landed=0;
  S.sessions.forEach(function(x){
    if(x.deload) return;
    x.exercises.forEach(function(e){
      if(!e.shadow) return;
      offered++;
      if(!e.shadow.used) return;
      var o=null; working(e.sets).forEach(function(st){ if(st.out) o=st; });
      if(!o) return;
      used++; if(num(o.r)>=num(e.reps)) landed++;
    });
  });
  return {offered:offered, used:used, landed:landed, share:used?landed/used:0,
          ready:used>=OUT_GATE_N&&landed/used>=OUT_GATE_SHARE};
}
function repOutCard(){
  var sc=repOutScore(), on=!!S.settings.repOutDefault;
  if(!sc.offered&&!on) return "";
  var pct=sc.used?Math.round(sc.share*100)+"%":"—";
  var body;
  if(on) body="It's your default wherever a lift has a rep-out to read. Used "+plural(sc.used,"time")+
    ", and the last set landed in your range "+pct+" of the time.";
  else if(sc.ready) body="You've used it "+plural(sc.used,"time")+" and the last set landed in your range "+pct+
    " of the time — past the 85% it needs. It can take over from here.";
  else body="Used "+sc.used+" of "+plural(sc.offered,"time")+" it was offered; the last set landed in your range "+pct+
    " of the time. It can take over after "+OUT_GATE_N+" uses at 85% or better"+
    (sc.used>=OUT_GATE_N?" — not there yet.":" ("+Math.max(0,OUT_GATE_N-sc.used)+" to go).");
  return '<div class="eyebrow" style="margin-bottom:7px">Rep-out method</div>'+
    '<div class="card" style="margin-bottom:12px"><div class="tiny" style="line-height:1.45">'+esc(body)+'</div>'+
    (on?'<button class="btn sm ghost" style="margin-top:9px" data-act="repout-off">Go back to the classic method</button>':
     sc.ready?'<button class="btn sm primary" style="margin-top:9px" data-act="repout-on">Make it the default</button>':"")+
    '</div>';
}
/* The screen that has to answer "did it work?" a year from now: per lift in
   the current plan, the first four weeks of its history against the latest
   four, by best working weight and best trend score (e1RM, or the rep-out
   when there is one). Lifts with under three weeks of history are left out
   rather than shown as noise. */
var LOOKBACK=28*864e5;
function sinceStartCard(){
  if(S.sessions.length<2) return "";
  var t0=S.sessions[S.sessions.length-1].ts, t1=S.sessions[0].ts;
  if(t1-t0<LOOKBACK) return "";
  var rows=[];
  trackedLifts().forEach(function(n){
    var h=exWorking(n);
    if(h.length<2||h[0].ts-h[h.length-1].ts<21*864e5) return;
    var a=h[h.length-1].ts, z=h[0].ts;
    var early=h.filter(function(x){ return x.ts<=a+LOOKBACK; }), late=h.filter(function(x){ return x.ts>=z-LOOKBACK; });
    function best(list,f,lowWins){ var v=list.map(f); return lowWins?Math.min.apply(null,v):Math.max.apply(null,v); }
    var mode=h[0].bw;
    var w0=best(early,function(x){ return workLoad(x.sets,x.bw); },mode===2);
    var w1=best(late,function(x){ return workLoad(x.sets,x.bw); },mode===2);
    var e0=best(early,trendScore), e1=best(late,trendScore);
    if(!e0) return;
    rows.push({n:n, w0:w0, w1:w1, mode:mode, pct:(e1/e0-1)*100});
  });
  if(!rows.length) return "";
  rows.sort(function(x,y){ return y.pct-x.pct; });
  var weeks=Math.max(1,(t1-t0)/(7*864e5));
  var months={};
  S.sessions.forEach(function(x){ var d=new Date(x.ts), k=d.getFullYear()*12+d.getMonth(); months[k]=(months[k]||0)+1; });
  var mk=Object.keys(months).map(Number).sort(function(x,y){ return x-y; });
  var mline=mk.map(function(k){
    return new Date(Math.floor(k/12),k%12,1).toLocaleDateString(undefined,{month:"short"})+" "+months[k];
  }).join(" · ");
  return '<div class="eyebrow" style="margin-bottom:7px">Since you started</div>'+
    '<div class="card" style="padding:0;margin-bottom:12px">'+
      '<div class="tiny" style="padding:10px var(--pad) 4px">Since '+esc(shortDate(t0))+': '+plural(S.sessions.length,"session")+
        ' in '+Math.round(weeks)+' weeks, '+(S.sessions.length/weeks).toFixed(1)+' a week.</div>'+
      '<div class="tiny muted" style="padding:0 var(--pad) 8px">'+esc(mline)+'</div>'+
      rows.map(function(r){
        var up=r.pct>=0.5, dn=r.pct<=-0.5;
        return '<button class="prrow" data-lift="'+esc(r.n)+'">'+
          '<span class="prn">'+esc(r.n)+'</span>'+
          '<span class="prs">'+esc(entryText({w:r.w0},r.mode))+' → '+esc(entryText({w:r.w1},r.mode))+'</span>'+
          '<span class="prd" style="color:'+(up?"var(--good)":dn?"var(--bad)":"var(--ink-2)")+'">'+
            (r.pct>=0?"+":"")+Math.round(r.pct)+'%</span></button>';
      }).join("")+

/* ============================ EDIT A PAST SESSION ============================
   Edits run on a clone; nothing lands until Save. PRs are recomputed across
   the whole history afterwards so a corrected typo can't leave a ghost record.
   ========================================================================== */
var draft=null;

function sessionSheet(id){
  var s=S.sessions.find(function(x){ return x.id===id; });
  if(!s) return;
  var vol=0; s.exercises.forEach(function(e){ vol+=exVolume(e); });
  var html='<h3>'+esc(s.name)+'</h3><div class="sub">'+
    esc(new Date(s.ts).toLocaleDateString(undefined,{weekday:"long",month:"long",day:"numeric"}))+
    (s.endTs?' · '+dur(s.endTs-s.ts):"")+' · '+commas(vol)+' '+unit()+
    (s.variantName?' · '+esc(s.variantName):"")+
    (s.deload?' · deload':"")+'</div>';
  s.exercises.forEach(function(e){
    var mode=bwMode(e), smet=metricOf(e);
    html+='<div class="card" style="margin-bottom:8px"><div class="ex-name" style="font-size:14px">'+esc(e.name)+
      (e.supplemental?' <span class="chip tag">EXTRA</span>':"")+'</div>'+
      '<div class="num tiny" style="margin-top:4px;color:var(--ink-2)">'+
      e.sets.map(function(x){
        return (x.warm?"w ":"")+entryText(x,mode)+metricJoin(smet)+num(x.r)+metricSuffix(smet)+(x.pr?" ★":"");
      }).join("   ")+'</div>'+
      (String(e.note||"").trim()?'<div class="tiny" style="margin-top:5px">'+esc(String(e.note).trim())+'</div>':"")+
      fcHistoryHtml(e)+'</div>';
  });
  if(s.note) html+='<div class="card" style="margin-bottom:12px"><div class="eyebrow">Note</div><div style="margin-top:4px">'+esc(s.note)+'</div></div>';
  html+='<div class="row" style="gap:8px;margin-top:8px">'+
    '<button class="btn ghost" style="flex:1" data-x="close">Close</button>'+
    '<button class="btn primary" style="flex:1" data-x="edit">Edit</button></div>'+
    '<button class="btn danger block" style="margin-top:8px" data-x="del">Delete session</button>';
  sheet(html,function(el){
    $('[data-x="close"]',el).onclick=closeSheet;
    $('[data-x="edit"]',el).onclick=function(){ editSession(id); };
    $('[data-x="del"]',el).onclick=function(){
      confirmSheet("Delete this session?","It's removed from your history and stats.","Delete",function(){
        var i=S.sessions.findIndex(function(x){ return x.id===id; });
        if(i<0) return;
        var gone=S.sessions[i];
        S.sessions.splice(i,1);
        /* A delete he confirmed is not data loss, so the backup guard (no push
           with fewer sessions than the last) must not then refuse every
           automatic backup in silence — it moves its count with him. */
        gistSessionsMoved(-1);
        /* PRs are derived from the whole history, so both directions have to
           rebuild them or a deleted record leaves a ghost behind. */
        recomputePRs(); writeNow(); render();
        toastUndo("Session deleted",function(){
          S.sessions.splice(Math.min(i,S.sessions.length),0,gone);
          gistSessionsMoved(1);
          recomputePRs(); writeNow(); render(); toast("Session restored");
        });
      },true);
    };
  });
}

function editSession(id){
  var orig=S.sessions.find(function(x){ return x.id===id; });
  if(!orig) return;
  draft=JSON.parse(JSON.stringify(orig));
  /* Remember what each weight was when the editor opened, so committing can
     tell an edited set from an untouched one. Stripped again in commitEdit —
     it must never reach storage. */
  draft.exercises.forEach(function(e){ e.sets.forEach(function(s){ s.w0=s.w; }); });
  drawEditor();
}

function drawEditor(){
  var d=draft;
  var html='<h3>Edit session</h3><div class="sub">Fix a typo, add the set you forgot, drop one you didn\'t do.</div>'+
    '<div class="field-row"><div class="fl">Date</div>'+
      '<input class="txt" style="max-width:190px" type="date" data-x="date" value="'+esc(localDay(d.ts))+'"></div>'+

    '<div class="field-row"><div class="fl">Deload session<div class="fh">Kept out of trend maths</div></div>'+
      '<button class="switch'+(d.deload?" on":"")+'" data-x="deload"></button></div>';

  d.exercises.forEach(function(e,ei){
    var mode=bwMode(e), emet=metricOf(e);
    html+='<div class="card" style="margin:10px 0 0;padding:10px 12px">'+
      '<div class="row"><div class="ex-name" style="font-size:14px;flex:1">'+esc(e.name)+'</div>'+

        '<span class="times">'+metricJoin(emet)+'</span>'+
        '<input inputmode="numeric" type="number" data-f="r" data-k="'+ei+'.'+si+'" value="'+esc(s.r)+'">'+
        '<button class="rm" data-rmset="'+ei+'.'+si+'" aria-label="Delete set">✕</button>'+
      '</div>';
    });
    html+='<div class="row" style="gap:8px;margin-top:8px">'+
      '<button class="btn sm ghost" data-addset="'+ei+'">+ Set</button>'+
      '<button class="btn sm ghost" data-addwarm="'+ei+'">+ Warm-up</button>'+
    '</div></div>';
  });

  html+='<button class="btn ghost block" style="margin-top:10px" data-x="addex">+ Add exercise</button>'+
    '<div style="margin-top:10px"><div class="eyebrow" style="margin-bottom:6px">Note</div>'+
    '<textarea class="txt" data-x="note">'+esc(d.note||"")+'</textarea></div>'+
    '<div class="sheet-foot">'+
      '<button class="btn ghost" style="flex:1" data-x="cancel">Cancel</button>'+
      '<button class="btn primary" style="flex:1.4" data-x="save">Save changes</button></div>';

  sheet(html,function(el){
    var d=draft;
    $('[data-x="date"]',el).onchange=function(){
      var parts=this.value.split("-");
      if(parts.length===3){
        var old=new Date(d.ts);
        d.ts=new Date(+parts[0],+parts[1]-1,+parts[2],old.getHours(),old.getMinutes()).getTime();
      }

    $('[data-x="note"]',el).oninput=function(){ d.note=this.value; };

      }

        var q=b.dataset.rmset.split(".");

      }

        drawEditor(); return;
      }

    });
    $('[data-x="addex"]',el).onclick=function(){

           bar, metric and the muscle tags. The plan constructor is the same
           source of truth the rest of the app adds an exercise from. */
        var pe=newPlanEx(name);
        draft.exercises.push({id:uid(),planId:null,name:name,
                              targetReps:pe.reps,reps:pe.reps,repTop:pe.repTop,
                              inc:pe.inc,bw:pe.bw,bar:pe.bar,metric:pe.metric,
                              mg:pe.mg,mg2:pe.mg2.slice(),
                              supplemental:true,note:"",
                              sets:[{w:"",r:String(pe.reps),done:true}]});
        drawEditor();
      });
    };
    $('[data-x="cancel"]',el).onclick=function(){ draft=null; closeSheet(); };
