/* The self-test for the one thing a desktop browser cannot check. */
function bgTestSheet(){
  var r=diagReport();
  var body;
  if(!r||!r.fired){
    body='<div class="sub">This starts a 20-second rest. Lock your phone straight away, '+
      'put it down, and wait for the alarm. Come back here afterwards and this will say what happened.</div>'+
      '<button class="btn primary block" data-x="go">Start the 20-second test</button>';
  } else {
    var frozen=r.maxGap>3;
    var late=Math.abs(r.fired-r.want)>2;
    var tone=S.settings.keepTone;
    var verdict = frozen
      ? ["FAILED — the page was frozen","var(--bad)",
         tone
          ? "Chrome stopped running the timer even with the keep-alive tone playing. The audio route is exhausted on this phone."
          : "Chrome paused the timer while the screen was off. Turn on the keep-alive tone under Plan — it will fix this, at the cost of muting your music during rests."]
      : late
        ? ["PARTIAL — ran late","var(--bad)",
           "The timer kept running but the alarm fired "+fmt(r.fired)+"s in instead of "+r.want+"s."]
        : ["PASSED — the timer stayed alive","var(--good)",
           r.hidden<3
             ? "But the screen was only off for "+fmt(r.hidden)+"s, so this did not really test a locked phone. Run it again and lock the phone properly."
             : "The alarm fired on time with the screen off for "+fmt(r.hidden)+"s"+
            (tone?" — with the keep-alive tone on."
                 :", and with the keep-alive tone OFF. Your phone doesn't need it, so your music stays untouched.")];
    body='<div class="banner '+(frozen||late?"warn":"calm")+'" style="margin-bottom:12px">'+
        '<div class="bt" style="color:'+verdict[1]+'">'+esc(verdict[0])+'</div>'+
        '<div class="bd">'+esc(verdict[2])+'</div></div>'+
      '<div class="card" style="padding:0;margin-bottom:12px">'+
        diagRow("Rest length",r.want+"s")+
        diagRow("Alarm fired at",r.fired?fmt(r.fired)+"s":"never")+
        diagRow("Timer ticks",r.ticks+" of ~"+r.expected)+
        diagRow("Longest gap between ticks",fmt(r.maxGap)+"s",r.maxGap>3)+
        diagRow("Screen off for",fmt(r.hidden)+"s",r.hidden<3)+
        diagRow("Keep-alive tone",S.settings.keepTone?"on (mutes your music)":"off")+
        diagRow("Audio at alarm time",r.audio||"—")+
        diagRow("Notifications",notifyState())+
      '</div>'+
      '<button class="btn primary block" data-x="go">Run it again</button>';
  }
  sheet('<h3>Background alarm test</h3>'+body+
    '<button class="btn ghost block" style="margin-top:8px" data-x="close">Close</button>',
    function(el){
      $('[data-x="go"]',el).onclick=function(){
        closeSheet();
        if(!S.settings.sound&&!S.settings.notify) S.settings.sound=true;
        startRest(20);
        toast("Lock your phone now");
      };
      $('[data-x="close"]',el).onclick=closeSheet;
    });
}

/* Reps is the default and always will be; the other two exist so planks and
   carries stop being logged as a lie ("60 reps"). */
/* ============================ templates ============================
   Three empty days and a text box is a twenty-minute setup and the most
   predictable reason to give up before the first session. These are ordinary
   routines — nothing here is a special case afterwards; `bar` is left to
   guessBar() and muscles to guessMuscles(), so a template gets exactly the
   same treatment as anything you type yourself.
   =================================================================== */
var TEMPLATES=[
  {id:"ppl", name:"Push / Pull / Legs",
   note:"Three days, each hit once a week. The most common split there is.",
   days:[
     ["Push",["Bench Press","Overhead Press","Incline Dumbbell Press","Lateral Raise","Triceps Pushdown"]],
     ["Pull",["Barbell Row","Lat Pulldown","Face Pull","Barbell Curl","Hammer Curl"]],
     ["Legs",["Back Squat","Romanian Deadlift","Leg Press","Leg Curl","Standing Calf Raise"]]
   ]},
  {id:"ul", name:"Upper / Lower",
   note:"Two days, run twice a week if you can. Good if you train four times.",
   days:[
     ["Upper",["Bench Press","Barbell Row","Overhead Press","Lat Pulldown","Barbell Curl","Triceps Pushdown"]],
     ["Lower",["Back Squat","Romanian Deadlift","Leg Press","Leg Curl","Standing Calf Raise","Plank"]]
   ]},
  {id:"fb", name:"Full body, 3 days",
   note:"Everything every session. Best return if you only train three times.",
   days:[
     ["Day A",["Back Squat","Bench Press","Barbell Row","Overhead Press","Plank"]],
     ["Day B",["Deadlift","Overhead Press","Lat Pulldown","Leg Press","Hanging Leg Raise"]],
     ["Day C",["Front Squat","Incline Dumbbell Press","Barbell Row","Barbell Curl","Standing Calf Raise"]]
   ]}
];
function applyTemplate(t){
  S.routines=t.days.map(function(d,i){
    return {
      id:uid(), key:String.fromCharCode(65+i), name:d[0],
      exercises:d[1].map(function(n){
        var g=guessMuscles(n);
        return {id:uid(), name:n,
                sets:3,
                reps:S.settings.repLow||8,
                repTop:S.settings.repHigh||12,
                inc:null, bw:0, bar:guessBar(n), metric:guessMetric(n),
                mg:g.mg, mg2:g.mg2};
      })
    };
  });
  writeNow();
}
/* Planks and carries in a template shouldn't arrive claiming "8 reps". */
function guessMetric(name){
  if(/plank|hold|dead ?hang|wall ?sit|\bl-?sit\b/i.test(name)) return 1;
  if(/carry|walk|sled|prowler|\brun\b|row erg|bike|treadmill/i.test(name)) return 2;
  return 0;
}
function templateSheet(){
  var used=S.routines.some(function(r){ return r.exercises.length; });
  sheet('<h3>Start from a template</h3>'+
    '<div class="sub">'+(used
      ? "This replaces your training days. Sessions already logged stay in your history."
      : "Pick one and edit it — every exercise, rep range and set count is yours to change.")+'</div>'+
    '<div class="picklist">'+TEMPLATES.map(function(t){
      return '<button data-tpl="'+t.id+'" style="display:block">'+
        '<div style="font-weight:700">'+esc(t.name)+'</div>'+
        '<div class="tiny muted" style="margin-top:2px">'+esc(t.note)+'</div>'+
        '<div class="tiny muted" style="margin-top:3px;font-family:var(--mono)">'+
          esc(t.days.map(function(d){ return d[0]+" ("+d[1].length+")"; }).join(" · "))+'</div>'+
      '</button>';
    }).join("")+'</div>'+
    '<button class="btn ghost block" style="margin-top:6px" data-x="cancel">Cancel</button>',
    function(el){
      $$("[data-tpl]",el).forEach(function(b){
        b.onclick=function(){
          var t=TEMPLATES.filter(function(x){ return x.id===b.dataset.tpl; })[0];
          if(!t) return;
          var before=JSON.parse(JSON.stringify(S.routines));
          applyTemplate(t); closeSheet(); viewPlan();
          toastUndo(t.name+" loaded",function(){
            S.routines=before; writeNow(); if(TAB==="plan") viewPlan(); toast("Put your split back");
          });
        };
      });
      $('[data-x="cancel"]',el).onclick=closeSheet;
    });

/* ============================ supersets ============================
   A group is defined by ADJACENCY, not by a shared id: `link: true` means
   "this exercise belongs with the one above it". Ids would need repairing
   every time you reorder or delete; adjacency just re-derives, so moving an
   exercise out of a pair simply ends the pair.
   =================================================================== */
function groupsOf(list){
  var out=[], cur=[];
  (list||[]).forEach(function(e,i){
    if(i>0&&e.link) cur.push(i);
    else { if(cur.length) out.push(cur); cur=[i]; }
  });
  if(cur.length) out.push(cur);
  return out;
}
/* "A1" / "A2" for a superset member, "" for anything on its own. */
function groupTag(list,i){
  var gs=groupsOf(list);
  for(var g=0;g<gs.length;g++){
    var pos=gs[g].indexOf(i);
    if(pos<0) continue;
    if(gs[g].length<2) return "";
    return String.fromCharCode(65+g)+(pos+1);
  }
  return "";
}
/* Rest belongs after the last exercise of a superset, not between its parts —
   walking straight to the next station is the whole point. */
function lastInGroup(list,i){
  var next=list[i+1];
  return !next||!next.link;
}

function rangeLabel(m){ return m===1?"Hold range (secs)":m===2?"Distance range":"Rep range"; }
function metricRow(met,attr){
  return '<div class="field-row"><div class="fl">Measured in<div class="fh">'+
      (met===1?"Sets are held for a number of seconds"
       :met===2?"Sets cover a distance — in whatever unit you already use"
       :"Sets are counted in reps")+
    '</div></div>'+
    '<div class="seg" style="margin:0 0 4px">'+
      '<button data-'+attr+'="0"'+(met===0?' class="on"':"")+'>Reps</button>'+
      '<button data-'+attr+'="1"'+(met===1?' class="on"':"")+'>Time</button>'+
      '<button data-'+attr+'="2"'+(met===2?' class="on"':"")+'>Distance</button>'+
    '</div>'+
    (met?'<div class="tiny muted" style="margin-bottom:8px">No pound volume is counted for '+
      metricNoun(met)+' work — weight × reps isn\'t defined for it.</div>':"");
}

/* A summary row that opens the picker, rather than 24 chips inline — the
   exercise menu is already long and this is set once per exercise, not per set. */
function muscleRow(ex){
  var t=tagsOf(ex), lab=tagLabel(t);
  var own=!!(ex.mg||(ex.mg2&&ex.mg2.length));
  return '<button class="navrow" data-x="mg"><span class="fl">Muscles'+
    (own?"":'<div class="fh">'+(lab?"Guessed from the name — tap to confirm":"Not set, so its sets go uncounted")+'</div>')+
    '</span><span class="fv">'+esc(lab||"None")+'</span><span class="ch">›</span></button>';
}

/* Main muscle and helpers are separate controls on purpose. A single tri-state
   chip would be smaller but you'd have to already know the rule to use it. */
function musclesSheet(ex,after){
  /* Materialise the guess on open. Otherwise the summary row reads through
     tagsOf() and shows "Quads + Glutes" while the picker shows nothing
     selected — same exercise, two answers. */
  if(!ex.mg&&!(ex.mg2||[]).length){
    var g=tagsOf(ex);
    ex.mg=g.mg; ex.mg2=g.mg2.slice();
    if(ex.mg||ex.mg2.length) save();
  }
  function draw(){
    var t={mg:ex.mg||"", mg2:(ex.mg2||[]).slice()};
    sheet('<h3>Muscles</h3><div class="sub">'+esc(ex.name)+'</div>'+
      '<div class="eyebrow">Main muscle</div>'+
      '<div class="mgrid">'+MUSCLES.map(function(m){
        return '<button class="mchip'+(t.mg===m.k?" on":"")+'" data-m="'+m.k+'">'+esc(m.n)+'</button>';
      }).join("")+'</div>'+
      '<div class="tiny muted" style="margin-bottom:12px">Each working set counts 1 toward this.</div>'+
      '<div class="eyebrow">Also works</div>'+
      '<div class="mgrid">'+MUSCLES.map(function(m){
        var on=t.mg2.indexOf(m.k)>=0;
        return '<button class="mchip'+(on?" on2":"")+(t.mg===m.k?" off":"")+'" data-m2="'+m.k+'"'+
          (t.mg===m.k?" disabled":"")+'>'+esc(m.n)+'</button>';
      }).join("")+'</div>'+
      '<div class="tiny muted" style="margin-bottom:12px">Half a set each, so pressing doesn\'t inflate your triceps count.'+
        '<br>Clearing falls back to a guess from the name.</div>'+
      '<div class="row" style="gap:8px">'+
        '<button class="btn ghost" style="flex:1" data-x="clear">Clear</button>'+
        '<button class="btn primary" style="flex:1" data-x="done">Done</button>'+
      '</div>',
      function(el){
        $$('[data-m]',el).forEach(function(b){
          b.onclick=function(){
            var k=b.dataset.m;
            ex.mg=(ex.mg===k)?"":k;
            /* A muscle can't be its own helper. */
            if(ex.mg) ex.mg2=(ex.mg2||[]).filter(function(x){ return x!==ex.mg; });
            save(); draw();
          };
        });
        $$('[data-m2]',el).forEach(function(b){
          b.onclick=function(){
            var k=b.dataset.m2, a=(ex.mg2||[]).slice(), i=a.indexOf(k);
            if(i>=0) a.splice(i,1); else a.push(k);
            ex.mg2=a; save(); draw();
          };
        });
        $('[data-x="clear"]',el).onclick=function(){ ex.mg=""; ex.mg2=[]; save(); draw(); };
        $('[data-x="done"]',el).onclick=function(){ writeNow(); closeSheet(); if(after) after(); };
      });
  }
  draw();
}

/* One number does the whole job: the empty bar's weight, or blank for

function barRow(ex,attr){
  var bar=barOf(ex);
  return '<div class="field-row"><div class="fl">Barbell<div class="fh">'+

        ? "Plate maths is only shown for weighted lifts"
        : bar?"Showing plates per side over a "+fmt(bar)+" "+unit()+" bar"
             :"Bar weight — leave blank for dumbbells, machines and cables")+
    '</div></div>'+
    '<input class="txt small" inputmode="decimal" type="number" step="any" placeholder="—" data-'+attr+'="1" value="'+(bar||"")+'"></div>';

      '<button data-x="rm" class="dang">Remove from this session</button>'+
    '</div>'+
    '<button class="btn primary block" style="margin-top:6px" data-x="done">Done</button>',
    function(el){
      var nameEl=$('[data-x="name"]',el);
      $('[data-x="low"]',el).oninput=function(){ ex.reps=Math.max(1,num(this.value)); save(); };
      $('[data-x="top"]',el).oninput=function(){ ex.repTop=num(this.value)||0; save(); };
      $('[data-x="inc"]',el).oninput=function(){ ex.inc=num(this.value)||null; save(); };
      $$('[data-bw]',el).forEach(function(b){
        b.onclick=function(){
          ex.bw=num(b.dataset.bw);
          ex.sets.forEach(function(s){ if(s.done) s.load=effLoad(s.w,ex.bw); });
          save(); closeSheet(); viewToday(); refreshSummary(); exerciseMenu(ei);
        };
      });
      $('[data-bar]',el).oninput=function(){
        ex.bar=Math.max(0,num(this.value));
        save(); viewToday(); refreshSummary();
      };
      $('[data-x="mg"]',el).onclick=function(){
        musclesSheet(ex,function(){ exerciseMenu(ei); });
      };
      $$('[data-met]',el).forEach(function(b){
        b.onclick=function(){
          ex.metric=num(b.dataset.met); save(); closeSheet(); viewToday(); refreshSummary(); exerciseMenu(ei);
        };
      });
      $('[data-x="warmup"]',el).onclick=function(){
        ex.sets.unshift({w:ex.sets[0]?ex.sets[0].w:"",r:"5",warm:true,done:false});
        save(); closeSheet(); viewToday(); refreshSummary();
      };
      /* Reordering is structural, not the between-sets path, so a full
         viewToday() re-render is fine here. */
      function moveTo(to){
        var moved=S.active.exercises.splice(ei,1)[0];
        if(to===0) moved.link=false;      // nothing above to pair with
        S.active.exercises.splice(to,0,moved);
        save(); closeSheet(); viewToday(); refreshSummary();
        var card=$('.card.ex[data-ei="'+to+'"]');
        if(card&&card.scrollIntoView) card.scrollIntoView({block:"start"});
        toast(moved.name+(to===0?" moved to the top":" moved"));
      }
      var lk=$('[data-x="link"]',el);
      if(lk) lk.onclick=function(){
        ex.link=!ex.link; save(); closeSheet(); viewToday(); refreshSummary();
        toast(ex.link?"Supersetted — no rest until the next one is done":"Superset broken");
      };
      var mt=$('[data-x="mvtop"]',el), mu=$('[data-x="mvup"]',el), md=$('[data-x="mvdn"]',el);
      if(mt) mt.onclick=function(){ moveTo(0); };
      if(mu) mu.onclick=function(){ moveTo(ei-1); };
      if(md) md.onclick=function(){ moveTo(ei+1); };
      var keep=$('[data-x="keep"]',el);
      if(keep) keep.onclick=function(){
        var r=S.routines.find(function(x){ return x.id===S.active.routineId; });
        if(!r) return;
        var ne={id:uid(),name:ex.name,sets:working(ex.sets).length,reps:num(ex.reps)||8,
                repTop:ex.repTop||0,inc:ex.inc||null,bw:bwMode(ex),bar:barOf(ex),metric:metricOf(ex),link:!!ex.link,
                mg:ex.mg||"",mg2:(ex.mg2||[]).slice()};
        r.exercises.push(ne); ex.planId=ne.id; ex.supplemental=false;
        save(); closeSheet(); viewToday(); refreshSummary(); toast("Added to "+r.name);
      };
      $('[data-x="hist"]',el).onclick=function(){ closeSheet(); liftSheet(ex.name); };
      $('[data-x="rm"]',el).onclick=function(){
        var gone=S.active.exercises.splice(ei,1)[0];
        save(); closeSheet(); viewToday(); refreshSummary();
        toastUndo("Removed "+gone.name,function(){
          if(!S.active) return;                    // finished or discarded meanwhile
          S.active.exercises.splice(Math.min(ei,S.active.exercises.length),0,gone);
          save(); if(TAB==="today"){ viewToday(); refreshSummary(); }
          toast(gone.name+" is back");
        });
      };
      $('[data-x="done"]',el).onclick=function(){
        var newName=nameEl.value.trim();
        if(newName&&newName!==ex.name) renameExercise(ex.name,newName);
        closeSheet(); viewToday(); refreshSummary();
      };
    });
}

/* Renaming follows the exercise everywhere, so its history stays one line. */
function renameExercise(oldName,newName){
  var k=normName(oldName);
  S.routines.forEach(function(r){ r.exercises.forEach(function(e){ if(normName(e.name)===k) e.name=newName; }); });
  S.sessions.forEach(function(s){ s.exercises.forEach(function(e){ if(normName(e.name)===k) e.name=newName; }); });
  if(S.active) S.active.exercises.forEach(function(e){ if(normName(e.name)===k) e.name=newName; });
  save();
  toast("Renamed to "+newName);
}

/* ---- exercise picker ---- */
function pickExercise(target,onPick){
  var known=allExerciseNames();
  sheet('<h3>Add exercise</h3><div class="sub">Pick one you\'ve done, or type a new name.</div>'+
    '<input class="txt" id="exq" placeholder="Search or create…" autocomplete="off" enterkeyhint="done">'+
    '<div class="picklist" id="exlist"></div>',
    function(el){
      var q=$("#exq",el), list=$("#exlist",el);
      function draw(){
        var v=q.value.trim(), lv=v.toLowerCase();
        var items=known.filter(function(x){ return !lv||x.name.toLowerCase().indexOf(lv)>=0; }).slice(0,40);
        var out="";
        if(v&&!items.some(function(x){ return x.name.toLowerCase()===lv; }))
          out+='<button data-new="'+esc(v)+'"><b>Create “'+esc(v)+'”</b></button>';
        out+=items.map(function(x){
          var lp=lastPerf(x.name);
          return '<button data-name="'+esc(x.name)+'">'+esc(x.name)+
            '<span class="h">'+(lp?entryText(lp.sets[0],lp.bw)+"×"+num(lp.sets[0].r):"—")+'</span></button>';
        }).join("");
        list.innerHTML=out||'<div class="empty">Type a name to create it.</div>';
      }
      draw();
      q.addEventListener("input",draw);
      list.addEventListener("click",function(e){
        var b=e.target.closest("[data-name],[data-new]"); if(!b) return;
        var name=b.dataset.name||b.dataset.new;
        closeSheet();
        if(onPick){ onPick(name); return; }
        if(target==="plan"){ addToPlan(name); return; }
        var last=lastPerf(name), mgN=tagsOf({name:name});
        S.active.exercises.push(makeSessionEx({
          name:name,
          sets:last?last.sets.length:3,
          reps:S.settings.doubleDefault?S.settings.repLow:(last?num(last.sets[0].r):8),
          repTop:S.settings.doubleDefault?S.settings.repHigh:0,
          inc:null, bw:last?last.bw:0,
          bar:last&&last.bar!==undefined?barOf(last):guessBar(name),
          metric:last?metricOf(last):0,
          mg:mgN.mg, mg2:mgN.mg2
        },null));
        save(); viewToday(); refreshSummary();
        window.scrollTo(0,document.body.scrollHeight);
      });
      setTimeout(function(){ q.focus(); },80);
    });
}

/* ---- finish ---- */
function finishSheet(){
  var a=S.active;
  var vol=0,sets=0,warm=0,prs=[];
  a.exercises.forEach(function(e){
    var top=null, mode=bwMode(e);
    e.sets.forEach(function(s){
      if(!s.done) return;
      if(s.warm){ warm++; return; }
      sets++; vol+=effLoad(s.w,mode)*num(s.r);
      if(s.pr&&(!top||setScore(s,metricOf(e))>setScore(top,metricOf(e)))) top=s;
    });
    if(top) prs.push(e.name+" "+entryText(top,mode)+"×"+num(top.r));
  });
  var extras=a.exercises.filter(function(e){ return !e.planId; });
  var html='<h3>Finish '+esc(a.name)+'</h3>'+
    '<div class="sub">'+dur(Date.now()-a.ts)+' · '+plural(sets,"working set")+
      (warm?' + '+warm+' warm-up':"")+' · '+commas(vol)+' '+unit()+' of volume</div>';
  if(a.deload){
    html+='<div class="banner calm" style="margin-bottom:12px"><div class="bt">Deload session</div>'+
      '<div class="bd">This one is saved but kept out of your trend maths.</div></div>';
  }
  if(prs.length){
    html+='<div class="banner info" style="margin-bottom:12px"><div class="bt">'+plural(prs.length,"personal record")+'</div>'+
      '<div class="bd">'+esc(prs.join(" · "))+'</div></div>';
  }
  if(!sets){
    html+='<div class="banner warn" style="margin-bottom:12px"><div class="bt">No working sets logged</div>'+
      '<div class="bd">Saving now records an empty session.</div></div>';
  }
  if(extras.length&&a.routineId){
    html+='<div class="eyebrow" style="margin-bottom:6px">Keep the extras in '+esc(a.name)+'?</div>';
    extras.forEach(function(e,i){
      html+='<div class="field-row"><div class="fl">'+esc(e.name)+'</div>'+
        '<button class="switch" data-keep="'+i+'"></button></div>';
    });
    html+='<div style="height:12px"></div>';
  }
  html+='<div class="row" style="gap:8px">'+
    '<button class="btn ghost" style="flex:1" data-x="back">Keep going</button>'+
    '<button class="btn primary" style="flex:1.4" data-x="save">Save workout</button></div>';

  sheet(html,function(el){
    var keeps={};
    el.addEventListener("click",function(e){
      var sw=e.target.closest("[data-keep]");
      if(sw){ var i=sw.dataset.keep; keeps[i]=!keeps[i]; sw.classList.toggle("on",keeps[i]); return; }
      if(e.target.closest('[data-x="back"]')){ closeSheet(); return; }
      if(e.target.closest('[data-x="save"]')){
        var r=S.routines.find(function(x){ return x.id===a.routineId; });
        if(r) extras.forEach(function(ex,i){ if(keeps[i]){
          r.exercises.push({id:uid(),name:ex.name,sets:working(ex.sets).length,reps:num(ex.reps)||8,
                            repTop:ex.repTop||0,inc:ex.inc||null,bw:bwMode(ex)});
        }});
        commitSession();
      }
    });
  });
}
function commitSession(){
  var a=S.active;
  a.endTs=Date.now();
  a.bw=num(S.settings.bodyweight);
  a.deload=!!a.deload||inDeloadWeek();
  a.exercises.forEach(function(e){ e.sets=e.sets.filter(function(s){ return s.done; }); });
  a.exercises=a.exercises.filter(function(e){ return e.sets.length; });
  S.sessions.unshift(a);
  S.active=null; stopRest();
  writeNow();
  /* Still inside the tap on "Save workout", which is the whole trick: a
     download needs user activation, and finishing a workout is the one moment
     that reliably has it AND is exactly when the log is worth keeping. No
     extra tap, no remembering. */
  var auto=autoBackup();
  closeSheet(); go("progress");
  toast(auto?"Workout saved · backup written":"Workout saved");
}
/* Returns whether a file was actually written, so we don't claim one was. */
function autoBackup(){
  if(!S.settings.autoBackup) return false;
  try{
    downloadBackup(payload(),true);
    return true;
  }catch(e){ return false; }
}

/* ============================ PROGRESS ============================ */
function viewProgress(){
  var v=$("#view");
  var tw=weekBounds(0), lw=weekBounds(1);
  var a=volumeInRange(tw.start,tw.end), b=volumeInRange(lw.start,lw.end);
  var delta=b.v?((a.v-b.v)/b.v*100):0;
  var html='<div class="eyebrow">Trends</div><h1 class="view-title">Progress</h1>';

  if(!S.sessions.length){
    v.innerHTML=html+'<div class="card"><div class="empty">Nothing logged yet.<br>Finish a session and the numbers show up here.</div></div>';
    return;
  }

  if(inDeloadWeek()){
    html+='<div class="banner info" style="margin-bottom:12px"><div class="bt">Deload week running</div>'+
      '<div class="bd">Through '+esc(shortDate(S.settings.deloadUntil))+'. Sessions logged now are excluded from every trend below.</div>'+
      '<div class="acts"><button class="btn sm ghost" data-act="end-deload">End it now</button></div></div>';
  }
  var d=deloadCheck();
  if(d){
    html+='<div class="banner '+(d.level==="high"?"warn":"info")+'" style="margin-bottom:12px">'+
      '<div class="bt">'+(d.level==="high"?"Time to deload":"Keep an eye on this")+'</div>'+
      '<div class="bd">'+d.stalled.length+' of '+d.judged+' tracked lifts aren\'t climbing: '+
      esc(d.stalled.slice(0,4).map(function(x){return x.name;}).join(", "))+
      (d.level==="high"?'. A week at ~60% volume usually clears it.':'. Not urgent yet.')+'</div>'+
      (d.level==="high"?'<div class="acts"><button class="btn sm primary" data-act="start-deload">Start deload week</button>'+
        '<button class="btn sm ghost" data-act="snooze-deload">Not now</button></div>':"")+
    '</div>';
  }

  html+='<div class="statgrid" style="margin-bottom:12px">'+
    '<div class="stat"><div class="v">'+a.n+'</div><div class="l">Sessions wk</div></div>'+
    '<div class="stat"><div class="v">'+kfmt(a.v)+'</div><div class="l">Volume '+unit()+'</div></div>'+
    '<div class="stat"><div class="v" style="color:'+(delta>=0?"var(--good)":"var(--bad)")+'">'+
      (b.v?(delta>=0?"+":"")+Math.round(delta)+"%":"—")+'</div><div class="l">vs last wk</div></div>'+
  '</div>';

  html+=weeklySetsCard(tw,lw);

  var names=trackedLifts();
  allExerciseNames().forEach(function(x){ if(names.indexOf(x.name)<0) names.push(x.name); });
  var withData=names.filter(function(n){ return exSessions(n).length>0; });

  html+='<div class="card" style="padding:0;margin-bottom:12px">';
  if(!withData.length) html+='<div class="empty">No lift history yet.</div>';
  else withData.forEach(function(n,i){
    var h=exSessions(n), t=trend(n);
    var top=h[0].sets.reduce(function(x,y){ return setScore(y,h[0].metric)>setScore(x,h[0].metric)?y:x; });
    html+='<button class="plift" data-lift="'+esc(n)+'">'+
      '<div class="pt"><div class="pn">'+esc(n)+'</div>'+
      '<div class="ps">'+entryText(top,h[0].bw)+' '+metricJoin(h[0].metric)+' '+num(top.r)+metricSuffix(h[0].metric)+' · '+relDate(h[0].ts)+'</div></div>'+
      '<canvas data-spark="'+i+'"></canvas>'+
      '<span class="chip '+(t.state==="up"?"good":t.state==="down"?"bad":"")+' mono" style="font-size:11px">'+
        (t.state==="new"?(t.n+"/4"):(t.pct>=0?"+":"")+t.pct.toFixed(1)+"%")+'</span>'+
    '</button>';
  });
  html+='</div>';

  html+=prCard();
  html+=calendarCard();

  html+='<div class="eyebrow" style="margin-bottom:7px">History</div>'+
    '<div class="tiny muted" style="margin-bottom:7px">Tap any session to fix or add sets.</div>'+
    '<div class="card" style="padding:0">';
  S.sessions.slice(0,25).forEach(function(s){
    var vol=0,sets=0;
    s.exercises.forEach(function(e){ vol+=exVolume(e); sets+=working(e.sets).length; });
    html+='<button class="sess" data-sess="'+s.id+'">'+
      '<span class="sd">'+esc(shortDate(s.ts))+'</span>'+
      '<span class="sn">'+esc(s.name)+(s.deload?' <span class="chip tag">DELOAD</span>':"")+'</span>'+
      '<span class="sv">'+plural(sets,"set")+' · '+kfmt(vol)+'</span></button>';
  });
  html+='</div>';

  v.innerHTML=html;
  withData.forEach(function(n,i){
    var c=v.querySelector('canvas[data-spark="'+i+'"]');
    if(c) spark(c,exSessions(n).map(sessionTopScore).reverse().slice(-12));
  });
}
/* The hypertrophy number. Solid bar is this week, ghost bar behind it is last
   week, so direction reads at a glance without a second chart. */
function weeklySetsCard(tw,lw){
  var now=setsByMuscle(tw.start,tw.end), prev=setsByMuscle(lw.start,lw.end);
  var shown=MUSCLES.filter(function(m){ return now.by[m.k]>0||prev.by[m.k]>0; });
  var zero=MUSCLES.filter(function(m){ return !(now.by[m.k]>0||prev.by[m.k]>0); });

  var html='<div class="row" style="margin-bottom:7px"><div class="eyebrow">Weekly sets</div>'+
    '<span class="tiny muted" style="margin-left:auto">this week vs last</span></div>';

  if(!shown.length){
    return html+'<div class="card" style="margin-bottom:12px"><div class="empty">'+
      (now.untagged||prev.untagged
        ? 'Nothing is tagged yet.<br>Open an exercise in Plan and set its muscles.'
        : 'No sets logged in the last two weeks.')+'</div></div>';
  }

  var max=0;
  shown.forEach(function(m){ max=Math.max(max,now.by[m.k],prev.by[m.k]); });
  var scale=Math.max(max,12);
  shown.sort(function(a,b){ return now.by[b.k]-now.by[a.k]; });

  html+='<div class="card" style="padding:9px 0;margin-bottom:12px">';
  shown.forEach(function(m){
    var a=now.by[m.k], b=prev.by[m.k];
    html+='<div class="mrow'+(a?"":" zero")+'">'+
      '<div class="mn">'+esc(m.n)+'</div>'+
      '<div class="track">'+
        '<div class="now" style="width:'+(a/scale*100).toFixed(1)+'%"></div>'+
        (scale>10?'<div class="tick" style="left:'+(10/scale*100).toFixed(1)+'%"></div>':"")+
        (scale>20?'<div class="tick" style="left:'+(20/scale*100).toFixed(1)+'%"></div>':"")+
        (b>0?'<div class="prev" style="left:'+(b/scale*100).toFixed(1)+'%" title="last week"></div>':"")+
      '</div>'+
      '<div class="mv">'+fmt(a)+'</div>'+
    '</div>';
  });
  html+='<div class="tiny muted" style="padding:6px var(--pad) 2px">'+
    'The dark line is last week. '+
    (scale>10?'Faint marks are 10 and 20 sets — the usual weekly range for growth. ':"")+
    'A set counts 1 for the main muscle, ½ for a helper.</div>';
  if(zero.length)
    html+='<div class="tiny muted" style="padding:0 var(--pad) 4px">Nothing for '+
      esc(zero.map(function(m){ return m.n.toLowerCase(); }).join(", "))+'.</div>';
  if(now.untagged)
    html+='<div class="tiny" style="padding:2px var(--pad) 4px;color:var(--bad)">'+
      plural(now.untagged,"set")+' this week aren\'t counted — those exercises have no muscles set.</div>';
  html+='</div>';
  return html;
}

var calOffset=0;
function calendarCard(){

      '<div class="eyebrow">Consistency</div>'+

    '<div class="card" style="margin-bottom:12px">'+

        '<div class="tiny muted" style="margin-left:auto">'+
          (g.sessions?plural(g.sessions,"session")+' · '+plural(g.trained,"day"):"nothing logged")+'</div></div>'+
      '<div class="cal">'+
      ["M","T","W","T","F","S","S"].map(function(d){ return '<div class="dow">'+d+'</div>'; }).join("");
  g.rows.forEach(function(row){
    row.forEach(function(c){
      if(!c){ html+='<div class="cell pad"></div>'; return; }

        (hit?' data-calday="'+c.sessions[0].id+'"':"")+'>'+c.day+

function kfmt(v){
  if(v>=1e6) return (v/1e6).toFixed(1)+"M";
  if(v>=1e4) return Math.round(v/1e3)+"k";
  if(v>=1e3) return (v/1e3).toFixed(1)+"k";
  return String(Math.round(v));
}

function liftSheet(name){
  var h=exSessions(name), t=trend(name), best=bestScore(name), met=h.length?h[0].metric:0;
  var html='<h3>'+esc(name)+'</h3>'+
    '<div class="sub">'+plural(h.length,"session")+(best?' · '+scoreLabel(met)+' '+Math.round(best)+(met?"":" "+unit()):"")+'</div>';
  if(h.length>=2){
    html+='<div class="card" style="margin-bottom:12px">'+
      '<div class="row"><div class="eyebrow">'+(met===1?"Best hold":met===2?"Best distance":"Estimated 1RM")+'</div>'+
      '<span class="chip '+(t.state==="up"?"good":t.state==="down"?"bad":"")+' mono" style="margin-left:auto;font-size:11px">'+
        (t.state==="new"?"needs "+(4-t.n)+" more":(t.pct>=0?"+":"")+t.pct.toFixed(1)+"% recent")+'</span></div>'+
      '<canvas id="bigchart" style="width:100%;height:130px;display:block;margin-top:8px"></canvas></div>';
  }
  if(t.state==="down"){
    html+='<div class="banner warn" style="margin-bottom:12px"><div class="bt">Trending down</div>'+
      '<div class="bd">Three sessions below the three before. The app has already dropped your next prescription 10% — take it, then build back.</div></div>';
  } else if(t.state==="flat"){
    html+='<div class="banner info" style="margin-bottom:12px"><div class="bt">Holding flat</div>'+
      '<div class="bd">Set a rep range on this lift so it climbs by reps before it climbs by weight.</div></div>';

    '<th>Date</th><th>Sets</th><th>Top</th><th>'+(met?"Score":"Est 1RM")+'</th><th>Vol</th></tr></thead><tbody>';
  h.slice(0,20).forEach(function(s){
    var top=s.sets.reduce(function(a,b){ return setScore(b,s.metric)>setScore(a,s.metric)?b:a; });
    html+='<tr'+(s.deload?' class="dl"':"")+'><td>'+esc(shortDate(s.ts))+(s.deload?" ·":"")+'</td><td>'+s.sets.length+'</td>'+
      '<td>'+entryText(top,s.bw)+metricJoin(s.metric)+num(top.r)+metricSuffix(s.metric)+
        (num(top.rpe)?'<span class="muted"> @'+fmt(top.rpe)+'</span>':"")+'</td>'+
      '<td>'+Math.round(sessionTopScore(s))+'</td>'+
      '<td>'+(s.metric?"—":kfmt(sessionVolume(s.sets,s.metric)))+'</td></tr>';
  });
  html+='</tbody></table>'+
    (h.some(function(x){return x.deload;})?'<div class="tiny muted" style="margin-top:6px">· deload session, excluded from trends</div>':"")+
    '</div>';
  sheet(html,function(el){
    var c=$("#bigchart",el);
    if(c) spark(c,h.map(sessionTopScore).reverse().slice(-20),{grid:true,pad:8,lw:2.2,dot:3.4});
  });
}

/* ============================ EDIT A PAST SESSION ============================
   Edits run on a clone; nothing lands until Save. PRs are recomputed across
   the whole history afterwards so a corrected typo can't leave a ghost record.
   ========================================================================== */
var draft=null;

function sessionSheet(id){
  var s=S.sessions.find(function(x){ return x.id===id; });
  if(!s) return;
  var vol=0; s.exercises.forEach(function(e){ vol+=exVolume(e); });
  var html='<h3>'+esc(s.name)+'</h3><div class="sub">'+
    esc(new Date(s.ts).toLocaleDateString(undefined,{weekday:"long",month:"long",day:"numeric"}))+
    (s.endTs?' · '+dur(s.endTs-s.ts):"")+' · '+commas(vol)+' '+unit()+
    (s.deload?' · deload':"")+'</div>';
  s.exercises.forEach(function(e){
    var mode=bwMode(e), smet=metricOf(e);
    html+='<div class="card" style="margin-bottom:8px"><div class="ex-name" style="font-size:14px">'+esc(e.name)+
      (e.supplemental?' <span class="chip tag">EXTRA</span>':"")+'</div>'+
      '<div class="num tiny" style="margin-top:4px;color:var(--ink-2)">'+
      e.sets.map(function(x){
        return (x.warm?"w ":"")+entryText(x,mode)+metricJoin(smet)+num(x.r)+metricSuffix(smet)+(x.pr?" ★":"");
      }).join("   ")+'</div></div>';
  });
  if(s.note) html+='<div class="card" style="margin-bottom:12px"><div class="eyebrow">Note</div><div style="margin-top:4px">'+esc(s.note)+'</div></div>';
  html+='<div class="row" style="gap:8px;margin-top:8px">'+
    '<button class="btn ghost" style="flex:1" data-x="close">Close</button>'+
    '<button class="btn primary" style="flex:1" data-x="edit">Edit</button></div>'+
    '<button class="btn danger block" style="margin-top:8px" data-x="del">Delete session</button>';
  sheet(html,function(el){
    $('[data-x="close"]',el).onclick=closeSheet;
    $('[data-x="edit"]',el).onclick=function(){ editSession(id); };
    $('[data-x="del"]',el).onclick=function(){
      confirmSheet("Delete this session?","It's removed from your history and stats.","Delete",function(){
        var i=S.sessions.findIndex(function(x){ return x.id===id; });
        if(i<0) return;
        var gone=S.sessions[i];
        S.sessions.splice(i,1);
        /* PRs are derived from the whole history, so both directions have to
           rebuild them or a deleted record leaves a ghost behind. */
        recomputePRs(); writeNow(); render();
        toastUndo("Session deleted",function(){
          S.sessions.splice(Math.min(i,S.sessions.length),0,gone);
          recomputePRs(); writeNow(); render(); toast("Session restored");
        });
      },true);
    };
  });
}

function editSession(id){
  var orig=S.sessions.find(function(x){ return x.id===id; });
  if(!orig) return;
  draft=JSON.parse(JSON.stringify(orig));
  drawEditor();
}

function drawEditor(){
  var d=draft;
  var html='<h3>Edit session</h3><div class="sub">Fix a typo, add the set you forgot, drop one you didn\'t do.</div>'+
    '<div class="field-row"><div class="fl">Date</div>'+
      '<input class="txt" style="max-width:190px" type="date" data-x="date" value="'+esc(localDay(d.ts))+'"></div>'+
    '<div class="field-row"><div class="fl">Name</div>'+
      '<input class="txt" style="max-width:190px" data-x="name" value="'+esc(d.name)+'"></div>'+
    '<div class="field-row"><div class="fl">Deload session<div class="fh">Kept out of trend maths</div></div>'+
      '<button class="switch'+(d.deload?" on":"")+'" data-x="deload"></button></div>';

  d.exercises.forEach(function(e,ei){
    var mode=bwMode(e), emet=metricOf(e);
    html+='<div class="card" style="margin:10px 0 0;padding:10px 12px">'+
      '<div class="row"><div class="ex-name" style="font-size:14px;flex:1">'+esc(e.name)+'</div>'+
        '<span class="tiny muted">'+esc(loadLabel(mode))+'</span>'+
        '<button class="iconbtn" data-rmex="'+ei+'" aria-label="Remove exercise">✕</button></div>';
    var wi=0;
    e.sets.forEach(function(s,si){
      if(!s.warm) wi++;
      html+='<div class="erow'+(s.warm?" warm":"")+'">'+
        '<button class="ei" data-warm="'+ei+'.'+si+'" title="Toggle warm-up">'+(s.warm?"W":wi)+'</button>'+
        '<input inputmode="decimal" type="number" step="any" data-f="w" data-k="'+ei+'.'+si+'" value="'+esc(s.w)+'">'+
        '<span class="times">'+metricJoin(emet)+'</span>'+
        '<input inputmode="numeric" type="number" data-f="r" data-k="'+ei+'.'+si+'" value="'+esc(s.r)+'">'+
        '<button class="rm" data-rmset="'+ei+'.'+si+'" aria-label="Delete set">✕</button>'+
      '</div>';
    });
    html+='<div class="row" style="gap:8px;margin-top:8px">'+
      '<button class="btn sm ghost" data-addset="'+ei+'">+ Set</button>'+
      '<button class="btn sm ghost" data-addwarm="'+ei+'">+ Warm-up</button>'+
    '</div></div>';
  });

  html+='<button class="btn ghost block" style="margin-top:10px" data-x="addex">+ Add exercise</button>'+
    '<div style="margin-top:10px"><div class="eyebrow" style="margin-bottom:6px">Note</div>'+
    '<textarea class="txt" data-x="note">'+esc(d.note||"")+'</textarea></div>'+
    '<div class="row" style="gap:8px;margin-top:12px">'+
      '<button class="btn ghost" style="flex:1" data-x="cancel">Cancel</button>'+
      '<button class="btn primary" style="flex:1.4" data-x="save">Save changes</button></div>';

  sheet(html,function(el){
    var d=draft;
    $('[data-x="date"]',el).onchange=function(){
      var parts=this.value.split("-");
      if(parts.length===3){
        var old=new Date(d.ts);
        d.ts=new Date(+parts[0],+parts[1]-1,+parts[2],old.getHours(),old.getMinutes()).getTime();
      }
    };
    $('[data-x="name"]',el).oninput=function(){ d.name=this.value; };
    $('[data-x="note"]',el).oninput=function(){ d.note=this.value; };
    $('[data-x="deload"]',el).onclick=function(){ d.deload=!d.deload; this.classList.toggle("on",d.deload); };

    el.addEventListener("input",function(e){
      var i=e.target;
      if(!i.matches('input[data-k]')) return;
      var p=i.dataset.k.split("."), s=d.exercises[+p[0]].sets[+p[1]];
      s[i.dataset.f]=i.value;
    });
    el.addEventListener("click",function(e){
      var b=e.target.closest("[data-warm],[data-rmset],[data-addset],[data-addwarm],[data-rmex]");
      if(!b) return;
      if(b.dataset.warm!==undefined){
        var p=b.dataset.warm.split("."), s=d.exercises[+p[0]].sets[+p[1]];
        s.warm=!s.warm; drawEditor(); return;
      }
      if(b.dataset.rmset!==undefined){
        var q=b.dataset.rmset.split(".");
        d.exercises[+q[0]].sets.splice(+q[1],1);
        if(!d.exercises[+q[0]].sets.length) d.exercises.splice(+q[0],1);
        drawEditor(); return;
      }
      if(b.dataset.addset!==undefined){
        var e1=d.exercises[+b.dataset.addset];
        var w1=working(e1.sets), t1=w1[w1.length-1]||e1.sets[e1.sets.length-1]||{w:"",r:"8"};
        e1.sets.push({w:t1.w,r:t1.r,done:true});
        drawEditor(); return;
      }
      if(b.dataset.addwarm!==undefined){
        var e2=d.exercises[+b.dataset.addwarm];
        e2.sets.unshift({w:e2.sets[0]?e2.sets[0].w:"",r:"5",warm:true,done:true});
        drawEditor(); return;
      }
      if(b.dataset.rmex!==undefined){ d.exercises.splice(+b.dataset.rmex,1); drawEditor(); }
    });
    $('[data-x="addex"]',el).onclick=function(){
      pickExercise(null,function(name){
        draft.exercises.push({id:uid(),planId:null,name:name,targetReps:8,reps:8,repTop:0,
                              inc:null,bw:0,supplemental:true,note:"",
                              sets:[{w:"",r:"8",done:true}]});
        drawEditor();
      });
    };
    $('[data-x="cancel"]',el).onclick=function(){ draft=null; closeSheet(); };
    $('[data-x="save"]',el).onclick=commitEdit;
  });
}

function commitEdit(){
  var d=draft;
  if(!d) return;
  /* Drop empty sets and empty exercises, resolve loads, then re-sort. */
  d.exercises.forEach(function(e){
    var mode=bwMode(e);
    e.sets=e.sets.filter(function(s){ return num(s.r)>0; });
    e.sets.forEach(function(s){
      s.done=true;
      s.load=effLoad(s.w,mode,d.bw!==undefined?d.bw:S.settings.bodyweight);
    });
  });
  d.exercises=d.exercises.filter(function(e){ return e.sets.length; });

  var i=S.sessions.findIndex(function(x){ return x.id===d.id; });
  if(i<0){ draft=null; closeSheet(); return; }
  S.sessions[i]=d;
  S.sessions.sort(function(a,b){ return b.ts-a.ts; });
  recomputePRs();
  writeNow();
  draft=null;
  closeSheet(); render();
  toast("Session updated");
}

$("#view").addEventListener("click",function(e){
  if(TAB==="progress"){
    var cal=e.target.closest("[data-cal]");
    if(cal){
      /* offset counts backwards, and there is no future to page into */
      calOffset=Math.max(0,calOffset-(+cal.dataset.cal));
      viewProgress(); return;
    }
    var cd=e.target.closest("[data-calday]");
    if(cd){ sessionSheet(cd.dataset.calday); return; }
    if(e.target.closest('[data-act="pr-all"]')){ prSheet(); return; }
    var lb=e.target.closest("[data-lift]");
    if(lb){ liftSheet(lb.dataset.lift); return; }
    var sb=e.target.closest("[data-sess]");
    if(sb){ sessionSheet(sb.dataset.sess); return; }
  }
  if(TAB!=="plan") return;

  var t=e.target;
  var dm=t.closest('[data-act="day-menu"]');
  if(dm){ dayMenu(+dm.dataset.ri); return; }
  if(t.closest('[data-act="tpl"]')){ templateSheet(); return; }
  if(t.closest('[data-act="day-add"]')){
    var k=String.fromCharCode(65+S.routines.length);
    S.routines.push({id:uid(),key:k,name:"Day "+k,exercises:[]});
    save(); viewPlan(); return;
  }
  var pa=t.closest('[data-act="pex-add"]');
  if(pa){ editingRoutine=+pa.dataset.ri; pickExercise("plan"); return; }
  var pu=t.closest('[data-act="pex-up"]');
  if(pu){
    var r=S.routines[+pu.dataset.ri], i=+pu.dataset.ei;
    if(i>0){
      var tmp=r.exercises[i-1]; r.exercises[i-1]=r.exercises[i]; r.exercises[i]=tmp;
      if(i-1===0) r.exercises[0].link=false;   // nothing above to pair with
      save(); viewPlan();
    }
    return;
  }
  var pe=t.closest('[data-act="pex-edit"]');
  if(pe){ planExMenu(+pe.dataset.ri,+pe.dataset.ei); return; }

  /* Notifications need a grant, so this switch can't be a plain toggle: it
     only goes on if the browser actually says yes. */
  if(t.closest('[data-act="toggle-notify"]')){
    if(S.settings.notify){ S.settings.notify=false; writeNow(); viewPlan(); return; }
    askNotify(function(ok,why){
      S.settings.notify=ok; writeNow(); viewPlan();
      toast(ok?"Rest alerts will show on your lock screen":(why||"Notifications weren't allowed."));
    });
    return;
  }
  if(t.closest('[data-act="bgtest"]')){ bgTestSheet(); return; }
  var pAdd=t.closest('[data-act="plate-add"]');
  if(pAdd){ S.settings.plates.push({w:0,n:1}); save(); viewPlan(); return; }
  var pRm=t.closest('[data-act="plate-rm"]');
  if(pRm){ S.settings.plates.splice(+pRm.dataset.i,1); save(); viewPlan(); return; }
  if(t.closest('[data-act="plate-reset"]')){
    S.settings.plates=defaultPlates(unit());
    S.settings.bar=defaultBar(unit());
    save(); viewPlan(); toast("Back to the standard "+unit()+" set"); return;
  }

  var sw=t.closest('[data-set]');
  if(sw&&sw.classList.contains("switch")){
    var k2=sw.dataset.set; S.settings[k2]=!S.settings[k2];
    sw.classList.toggle("on",S.settings[k2]); save();
    if(k2==="sound"&&S.settings[k2]) playSrc(audioURLs().alarm,false);   // proves it works
    if(k2==="sound"&&!S.settings[k2]&&!S.settings.notify) audioStop();
    return;
  }
  var pw=t.closest("[data-pw],[data-pn]");
  if(pw) return;                                  // let the input handler have it
  if(t.closest('[data-act="export"]')){ doExport(); return; }
  if(t.closest('[data-act="import"]')){ doImport(); return; }
  if(t.closest('[data-act="wipe"]')){
    confirmSheet("Erase everything?","Every session, day and setting is deleted. Back up first if you want a copy.","Erase",function(){
      S=defaultState(); writeNow(); go("today"); toast("Wiped clean");
    },true);
  }
});
$("#view").addEventListener("change",function(e){
  var el=e.target.closest("[data-set]");
  if(!el||el.classList.contains("switch")) return;
  var k=el.dataset.set;
  S.settings[k]=(k==="unit")?el.value:num(el.value);
  if(k==="rest"&&S.settings.rest<5) S.settings.rest=5;
  if(k==="repLow") S.settings.repLow=Math.max(1,S.settings.repLow);
  if(k==="repHigh") S.settings.repHigh=Math.max(S.settings.repLow,S.settings.repHigh);
  if(k==="bar") S.settings.bar=Math.max(0,S.settings.bar);
  save();
});
/* Plate rows update on input rather than change, so editing the inventory
   never re-renders the list out from under the field you're typing in. */
$("#view").addEventListener("input",function(e){
  if(TAB!=="plan") return;
  var el=e.target, p;
  if(el.dataset.pw!==undefined){
    p=S.settings.plates[+el.dataset.pw];
    if(p){ p.w=Math.max(0,num(el.value)); save(); }
  } else if(el.dataset.pn!==undefined){
    p=S.settings.plates[+el.dataset.pn];
    if(p){ p.n=Math.max(0,Math.round(num(el.value))); save(); }
  }
});

function addToPlan(name){
  var r=S.routines[editingRoutine];
  if(!r) return;
  var last=lastPerf(name), mgN=tagsOf({name:name});
  r.exercises.push({
    id:uid(), name:name,
    sets:last?last.sets.length:3,
    reps:S.settings.doubleDefault?S.settings.repLow:(last?num(last.sets[0].r):8),
    repTop:S.settings.doubleDefault?S.settings.repHigh:0,
    inc:null, bw:last?last.bw:0,
    bar:last&&last.bar!==undefined?barOf(last):guessBar(name),
    metric:last?metricOf(last):0,
    mg:mgN.mg, mg2:mgN.mg2
  });
  save(); viewPlan();
}

/* ---- data in / out ---- */
function payload(){ return JSON.stringify(S,null,2); }
function backupName(){ return "ironlog-"+today()+".json"; }
function markBackedUp(){ S.settings.lastBackup=Date.now(); writeNow(); }

/* Android's share sheet refuses some file types outright, and which ones is not
   something to guess at. Offer the tidy name first, fall back to .txt — which
   every share target accepts — and let canShare() pick. The contents are the
   same JSON either way, and the importer takes both. */
function shareableFile(data){
  var opts=shareVariants(data);
  /* A mode proven to work on this device wins over the default order. */
  for(var i=0;i<opts.length;i++){
    if(opts[i].k===S.settings.shareMode&&opts[i].file) return opts[i].file;
  }
  for(i=0;i<opts.length;i++){
    if(opts[i].file&&opts[i].can) return opts[i].file;
  }
  return null;
}
var lastShareErr="";

/* ---- why sharing fails, answered on the device instead of guessed ----
   navigator.share() rejects with NotAllowedError in two unrelated cases: the
   call had no transient user activation, or Chrome refused the file's type.
   No permission prompt is involved in either, which is why "Permission denied"
   is such a misleading string. The fixes are opposite, so the app tries the
   variants one tap at a time and remembers which one worked. */
function shareVariants(data){
  function f(name,type){ try{ return new File([data],name,{type:type}); }catch(e){ return null; } }
  var base=backupName();
  var list=[
    {k:"txt",   label:"File as .txt",        file:f(base.replace(/\.json$/,".txt"),"text/plain")},
    {k:"json",  label:"File as .json",       file:f(base,"application/json")},
    {k:"titled",label:"File plus a title",   file:f(base,"application/json"), title:true},
    {k:"text",  label:"Plain text, no file", file:null, text:true}
  ];
  list.forEach(function(v){
    try{
      v.can = v.text ? !!navigator.share
            : !!(v.file&&navigator.canShare&&navigator.canShare({files:[v.file]}));
    }catch(e){ v.can=false; }
  });
  return list;
}
function sharePayload(v,data){
  if(v.text) return {title:"Iron Log backup",text:data.slice(0,1500)};
  return v.title ? {files:[v.file],title:"Iron Log backup"} : {files:[v.file]};
}
var shareResults={};
function shareTestSheet(){
  var data=payload();
  var vs=shareVariants(data);
  function draw(){
    var anyOk=Object.keys(shareResults).some(function(k){ return shareResults[k]==="worked"; });
    sheet('<h3>Why sharing fails</h3>'+
      '<div class="sub">Tap each one. The share sheet should open — back out of it and the result lands here. '+
      'If <b>every</b> line fails the same way, the problem is this browser blocking sharing outright, not the file type.</div>'+
      '<div class="card" style="padding:0;margin-bottom:12px">'+
        vs.map(function(v){
          var r=shareResults[v.k];
          return '<div class="field-row" style="padding:10px 12px;margin:0">'+
            '<div class="fl">'+esc(v.label)+
              '<div class="fh">'+(v.can?"allowed by canShare()":"canShare() says no")+'</div></div>'+
            (r?'<div class="num tiny" style="color:'+(r==="worked"?"var(--good)":"var(--bad)")+'">'+esc(r)+'</div>'
              :'<button class="btn sm ghost" data-try="'+v.k+'">Try</button>')+
          '</div>';
        }).join("")+
      '</div>'+
      (anyOk?'<div class="banner calm" style="margin-bottom:12px"><div class="bt">Found one that works</div>'+
        '<div class="bd">"Send a copy" will use it from now on.</div></div>':"")+
      '<button class="btn ghost block" data-x="close">Close</button>',
      function(el){
        $$("[data-try]",el).forEach(function(btn){
          btn.onclick=function(){
            var v=vs.filter(function(x){ return x.k===btn.dataset.try; })[0];
            var p;
            try{ p=navigator.share(sharePayload(v,data)); }
            catch(err){ shareResults[v.k]=(err&&err.name)||"threw"; draw(); return; }
            if(!p||!p.then){ shareResults[v.k]="no promise"; draw(); return; }
            p.then(function(){
              shareResults[v.k]="worked";
              if(!v.text){ S.settings.shareMode=v.k; writeNow(); lastShareErr=""; }
              draw();
            }).catch(function(err){
              /* Backing out of a sheet that opened still proves it opened. */
              shareResults[v.k]=(err&&err.name==="AbortError")?"worked":((err&&err.name)||"failed");
              if(shareResults[v.k]==="worked"&&!v.text){ S.settings.shareMode=v.k; writeNow(); lastShareErr=""; }
              draw();
            });
          };
        });
        $('[data-x="close"]',el).onclick=function(){ closeSheet(); render(); };
      });
  }
  draw();
}

/* One tap into whatever the phone can share to — Drive, Files, email, iCloud. */
function backupSheet(){
  var data=payload();
  var file=shareableFile(data);

  sheet('<h3>Back up your log</h3>'+
    '<div class="sub">'+plural(S.sessions.length,"session")+' · '+Math.round(data.length/1024)+' KB. '+
      'Send yourself a copy anywhere that syncs — Drive, Files, email. Importing it later restores everything exactly.</div>'+
    (lastShareErr?'<div class="banner warn" style="margin-bottom:10px"><div class="bt">Sharing failed last time</div>'+
      '<div class="bd">'+esc(lastShareErr)+' — "Save file" below always works. That error does not mean you '+
      'refused a prompt; there isn\'t one. It means the browser blocked the call.</div>'+
      '</div>':"")+
    (file&&!lastShareErr?'<button class="btn primary big block" data-x="share" style="margin-bottom:8px">Send a copy…</button>':
      file?'<button class="btn block" data-x="share" style="margin-bottom:8px">Try sharing again</button>':
      '<div class="tiny muted" style="margin-bottom:8px">This browser won\'t share files, so save one instead.</div>')+
    '<button class="btn '+(file&&!lastShareErr?"":"primary big ")+'block" data-x="dl">Save file to this device</button>'+
    '<button class="btn ghost block" style="margin-top:8px" data-x="copy">Copy as text</button>'+
    (file?'<button class="tiny muted block" style="width:100%;padding:10px 0" data-x="why">Sharing not working? Test it ›</button>':"")+
    (S.settings.lastBackup?'<div class="tiny muted" style="text-align:center;margin-top:12px">Last copy '+relDate(S.settings.lastBackup)+'</div>':""),
    function(el){
      var sh=$('[data-x="share"]',el);
      if(sh) sh.onclick=function(){
        /* Nothing async before share() — Chrome needs the tap's user
           activation still live when it is called. */
        var p, settled=false;
        /* No title unless a titled variant is what proved to work — a bare
           files payload is the most widely accepted shape. */
        var body=S.settings.shareMode==="titled"
          ? {files:[file],title:"Iron Log backup"} : {files:[file]};
        try{ p=navigator.share(body); }
        catch(err){ shareFailed(err,data); return; }
        if(!p||!p.then){ shareFailed(new Error("share() returned nothing"),data); return; }
        /* A share() that neither resolves nor rejects looks exactly like a dead
           button. If the sheet had opened it would have taken focus, so still
           being focused after three seconds means it never appeared. */
        var watchdog=setTimeout(function(){
          if(settled||document.hidden||!document.hasFocus()) return;
          settled=true;
          shareFailed(new Error("the share sheet never opened"),data);
        },3000);
        p.then(function(){
          if(settled) return;
          settled=true; clearTimeout(watchdog); lastShareErr="";
          markBackedUp(); closeSheet(); render(); toast("Copy sent");
        }).catch(function(err){
          if(settled) return;
          settled=true; clearTimeout(watchdog);
          shareFailed(err,data);
        });
      };
      var why=$('[data-x="why"]',el);
      if(why) why.onclick=function(){ shareTestSheet(); };
      $('[data-x="dl"]',el).onclick=function(){ downloadBackup(data); closeSheet(); render(); };
      $('[data-x="copy"]',el).onclick=function(){
        if(navigator.clipboard){
          navigator.clipboard.writeText(data).then(function(){ markBackedUp(); toast("Copied"); closeSheet(); render(); })
            .catch(function(){ doExport(); });
        } else doExport();
      };
    });
}
/* The old version swallowed every rejection as "user backed out", which made a
   genuinely broken share indistinguishable from a cancelled one — the reported
   symptom was a button that did nothing at all. Cancelling is silent; anything
   else says so and still leaves you holding a file. */
function shareFailed(err,data){
  var name=(err&&err.name)||"Error";
  if(name==="AbortError"){ return; }            // you closed the share sheet
  lastShareErr=name+(err&&err.message?": "+err.message:"");
  downloadBackup(data,true);        // one message, not two fighting
  closeSheet(); render();
  toast("Share didn't work — saved to your files instead");
}
function downloadBackup(data,quiet){
  try{
    var blob=new Blob([data],{type:"application/json"});
    var url=URL.createObjectURL(blob);
    var a=document.createElement("a");
    a.href=url; a.download=backupName();
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){ URL.revokeObjectURL(url); },2000);
    markBackedUp();
    if(!quiet) toast("Saved to your downloads");
  }catch(e){ toast("Couldn't save the file — try Copy as text"); }
}
function doExport(){
  var data=payload();
  downloadBackup(data);
  sheet('<h3>Export</h3><div class="sub">Saved as '+esc(backupName())+'. You can also copy the raw log and paste it somewhere safe.</div>'+
      '<textarea class="txt" style="min-height:120px;font-family:var(--mono);font-size:12px" readonly>'+esc(data)+'</textarea>'+
      '<div class="row" style="gap:8px;margin-top:10px">'+
      '<button class="btn ghost" style="flex:1" data-x="close">Close</button>'+
      '<button class="btn primary" style="flex:1" data-x="copy">Copy</button></div>',
    function(el){
      $('[data-x="close"]',el).onclick=function(){ closeSheet(); render(); };
      $('[data-x="copy"]',el).onclick=function(){
        var ta=$("textarea",el);
        ta.select(); ta.setSelectionRange(0,999999);
        if(navigator.clipboard) navigator.clipboard.writeText(data).then(function(){ toast("Copied"); });
        else { try{ document.execCommand("copy"); toast("Copied"); }catch(e){ toast("Select the text and copy"); } }
      };
    });
}
function doImport(){
  sheet('<h3>Import</h3><div class="sub">Replaces everything currently in the app. Pick a file you backed up, or paste the JSON.</div>'+
    '<input type="file" accept="application/json,.json,text/plain,.txt" data-x="file" style="margin-bottom:12px">'+
    '<textarea class="txt" style="min-height:110px;font-family:var(--mono);font-size:12px" placeholder="…or paste here" data-x="paste"></textarea>'+
    '<div class="row" style="gap:8px;margin-top:10px">'+
    '<button class="btn ghost" style="flex:1" data-x="close">Cancel</button>'+
    '<button class="btn primary" style="flex:1" data-x="go">Import</button></div>',
    function(el){
      var pending=null;
      $('[data-x="file"]',el).onchange=function(){
        var f=this.files&&this.files[0]; if(!f) return;
        var fr=new FileReader();
        fr.onload=function(){ pending=String(fr.result); toast("File ready — tap Import"); };
        fr.readAsText(f);
      };
      $('[data-x="close"]',el).onclick=closeSheet;
      $('[data-x="go"]',el).onclick=function(){
        var raw=pending||$('[data-x="paste"]',el).value;
        if(!raw){ toast("Nothing to import"); return; }
        var parsed;
        try{ parsed=JSON.parse(raw); }catch(e){ toast("That isn't valid Iron Log JSON"); return; }
        if(!parsed||!parsed.routines||!parsed.sessions){ toast("That file is missing routines or sessions"); return; }
        S=parsed;
        S.settings=Object.assign(defaultState().settings,S.settings||{});
        recomputePRs();
        writeNow(); closeSheet(); go("today"); toast("Log imported");
      };
    });
}

/* ============================ render ============================ */
function render(){
  renderTabs(); renderHeader();
  if(TAB==="today"){ viewToday(); refreshSummary(); }
  else if(TAB==="progress") viewProgress();
  else viewPlan();
}

if(window.matchMedia){
  var mq=window.matchMedia("(prefers-color-scheme: dark)");
  if(mq.addEventListener) mq.addEventListener("change",render);
}
new MutationObserver(function(muts){
  for(var i=0;i<muts.length;i++) if(muts[i].attributeName==="data-theme"){ render(); return; }
}).observe(document.documentElement,{attributes:true});

if(S.active) TAB="today";
render();

/* Offline support, only when self-hosted (the manifest is the tell). */
if("serviceWorker" in navigator && $('link[rel="manifest"]') &&
   (location.protocol==="https:"||location.hostname==="localhost"||location.hostname==="127.0.0.1")){
  window.addEventListener("load",function(){
    navigator.serviceWorker.register("sw.js").catch(function(){});
  });
}

})();
</script>
